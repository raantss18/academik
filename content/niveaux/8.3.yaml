  - id: c7
    type: code
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. **Écris `ecart_type(valeurs)`** sans utiliser le module `statistics` : la racine carrée de la moyenne des carrés des écarts à la moyenne (écart-type de la population).'
    en: 'Challenge. **Write `ecart_type(valeurs)`** without using the `statistics` module: the square root of the mean of the squared gaps to the mean (population standard deviation).'
    depart: |
      import math

      # écris ta fonction ecart_type ici
    tests: |
      assert abs(ecart_type([2, 4, 4, 4, 5, 5, 7, 9]) - 2) < 1e-9
      assert ecart_type([5, 5, 5]) == 0
      assert abs(ecart_type([1, 3]) - 1) < 1e-9
    solutionCode: |
      import math

      def ecart_type(valeurs):
          m = sum(valeurs) / len(valeurs)
          variance = sum((v - m) ** 2 for v in valeurs) / len(valeurs)
          return math.sqrt(variance)
    indice: { fr: 'Trois étapes : la moyenne `m`, la moyenne des `(v - m) ** 2`, puis `math.sqrt`.', en: 'Three steps: the mean `m`, the mean of the `(v - m) ** 2`, then `math.sqrt`.' }
    explication: { fr: 'On retrouve la définition du niveau 6.4 : variance puis racine carrée.', en: 'We find the definition from level 6.4: variance then square root.' }
  - id: c8
    type: retenir
    fr: 'Résumer = un centre (moyenne, médiane) et une dispersion (étendue, écart-type, quartiles). La médiane résiste aux valeurs extrêmes ; pour comparer des groupes : regrouper dans un dictionnaire, puis résumer chaque liste.'
    en: 'Summarising = a centre (mean, median) and a spread (range, standard deviation, quartiles). The median resists extreme values; to compare groups: group in a dictionary, then summarise each list.'
