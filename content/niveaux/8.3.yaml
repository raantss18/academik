    fr: 'Un groupe contient `[10]`, l’autre `[20, 20, 20]`. Quelle est la moyenne **de toutes les valeurs ensemble** ?'
    en: 'One group contains `[10]`, the other `[20, 20, 20]`. What is the mean of **all values together**?'
    reponses: ['17.5', '17,5']
    verif: 'print((10 + 20 + 20 + 20) / 4)'
    indice: { fr: 'Additionne les quatre valeurs et divise par 4, pas par 2.', en: 'Add the four values and divide by 4, not by 2.' }
