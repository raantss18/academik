# Niveau 18.3 — Performance 3 : mémoïsation, sommes préfixes, structures de données. Original academik ; notions vérifiées dans la documentation Python (functools) et Bentley, Programming Pearls (lien).
id: '18.3'
module: 18
duree_min: 21
titre:
  fr: Éviter le travail inutile
  en: Avoiding useless work
ia:
  fr: Kintana ne refait jamais un calcul qu’elle connaît déjà.
  en: Kintana never redoes a computation she already knows.
