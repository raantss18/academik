  type: plus
  fr: Pour approfondir, consulte [l’article original sur le RAG](https://arxiv.org/abs/2005.11401) ; cet article demande une connexion.
  en: For further study, see [the original RAG paper](https://arxiv.org/abs/2005.11401); this paper needs a connection.
