# Niveau 14.5 — RAG 5 : citer, vérifier, s’abstenir. Original academik ; notions vérifiées dans Lewis et al. 2020 (arXiv 2005.11401) et la liste OWASP Top 10 pour les applications LLM (lien).
id: '14.5'
module: 14
duree_min: 16
titre:
  fr: Citer et s’abstenir
  en: Citing and abstaining
ia:
  fr: Kintana cite ses sources, vérifie ses citations et dit « je ne sais pas » quand elle ne trouve rien.
  en: Kintana cites her sources, checks her citations and says “I don’t know” when she finds nothing.
objectifs:
  - { fr: 'citer ses sources par numéro', en: 'cite sources by number' }
  - { fr: 'vérifier chaque citation', en: 'check every citation' }
  - { fr: 's''abstenir sous un seuil', en: 'abstain below a threshold' }
sources:
- titre: Lewis et al. — Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
  url: https://arxiv.org/abs/2005.11401
  licence: Article en accès libre ; idée citée
- titre: 'OWASP — Top 10 for LLM Applications (LLM09 : surconfiance)'
  url: https://genai.owasp.org/llm-top-10/
  licence: Lien seulement ; texte non repris
cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: Un étudiant demande quelque chose qui n’est dans aucun de tes cours. Le moteur de recherche renvoie quand même trois passages, très peu pertinents. Que doit faire un bon assistant ?
  en: A student asks something that is in none of your courses. The search engine still returns three passages, barely relevant. What should a good assistant do?
  choix:
  - fr: 'S’abstenir : dire qu’il ne trouve pas la réponse dans les cours'
    en: 'Abstain: say it cannot find the answer in the courses'
    juste: true
  - fr: Répondre quand même avec une réponse plausible
    en: Answer anyway with a plausible answer
  - fr: Citer les trois passages comme s’ils répondaient
    en: Cite the three passages as if they answered
  indice:
    fr: Une recherche renvoie toujours quelque chose, même quand rien ne convient. Peut-on s’y fier à l’aveugle ?
    en: A search always returns something, even when nothing fits. Can it be trusted blindly?
  explication:
    fr: Une **abstention** honnête vaut mieux qu’une réponse inventée. L’assistant doit savoir quand ses sources ne suffisent pas.
    en: An honest **abstention** beats an invented answer. The assistant must know when its sources are not enough.
- id: c2
  type: idee
  fr: Pour réduire les inventions, on **ancre** la réponse. Le prompt contient les passages numérotés et la consigne de ne répondre qu’à partir d’eux, en les citant. On peut alors **vérifier** chaque citation.
  en: 'To reduce inventions, we **ground** the answer: the prompt contains the numbered passages, and the instruction to answer only from them while citing them. We can then **check** each citation.'
  exemple:
    fr: '« Le cache KV grandit avec le contexte [2]. » : on peut ouvrir le passage numéro 2 pour contrôler l’affirmation.'
    en: '“The KV cache grows with the context [2].”: we can open passage number 2 to check the claim.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Une réponse ancrée
        en: A grounded answer
      noeuds:
      - fr: passages numérotés
        en: numbered passages
      - fr: 'consigne : cite'
        en: 'instruction: cite'
      - fr: réponse avec [n]
        en: answer with [n]
      - fr: vérification des [n]
        en: check of the [n]
        ton: ok
    legende:
      fr: Une citation inexistante révèle une invention.
      en: A nonexistent citation reveals an invention.
- id: c3
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `construire_prompt(question, passages)`** : des lignes jointes par `"\n"`. D’abord la consigne `"Réponds uniquement avec les sources. Cite-les comme [1], [2]."` et une ligne vide. Puis `"[k] passage"` pour chaque passage (`k` à partir de 1), une ligne vide, et `"Question : " + question`.'
  en: 'Your turn. **Write `construire_prompt(question, passages)`**: a string of lines joined by `"\n"`: the instruction `"Réponds uniquement avec les sources. Cite-les comme [1], [2]."`, an empty line, a line `"[k] passage"` for each passage (`k` starting at 1), an empty line, then `"Question : " + question`.'
  depart: |
    # écris ta fonction construire_prompt ici
  tests: |-
    p = construire_prompt("Q ?", ["A", "B"])
    lignes = p.split("\n")
    assert lignes[0].startswith("Réponds uniquement") and lignes[1] == ""
    assert lignes[2] == "[1] A" and lignes[3] == "[2] B"
    assert lignes[-1] == "Question : Q ?" and lignes[-2] == ""
    assert len(construire_prompt("Q", []).split("\n")) == 4
  solutionCode: |
    def construire_prompt(question, passages):
        lignes = ["Réponds uniquement avec les sources. Cite-les comme [1], [2].", ""]
        for k, p in enumerate(passages, start=1):
            lignes.append("[" + str(k) + "] " + p)
        lignes.append("")
        lignes.append("Question : " + question)
        return "\n".join(lignes)
  indice:
    fr: Prépare une liste `lignes` avec la consigne et une ligne vide, ajoute chaque passage numéroté, une ligne vide, la question, puis `"\n".join(lignes)`.
    en: Prepare a `lignes` list with the instruction and an empty line, append each numbered passage, an empty line, the question, then `"\n".join(lignes)`.
  explication:
    fr: La numérotation `[1]`, `[2]` donne au modèle une manière simple et vérifiable de désigner ses sources.
    en: The numbering `[1]`, `[2]` gives the model a simple and checkable way to designate its sources.
- id: c4
  type: idee
  fr: Après la réponse, on **vérifie** les citations par programme. On extrait les numéros entre crochets, puis on contrôle qu’ils existent bien parmi les passages fournis, et qu’il y en a au moins un. Une réponse sans citation, ou avec `[7]` quand il n’y a que 3 passages, est rejetée.
  en: After the answer, we **check** the citations by program. We extract the numbers in square brackets, then verify they exist among the supplied passages, and that there is at least one. An answer without citation, or with `[7]` when there are only 3 passages, is rejected.
  exemple:
    fr: 'Réponse : « Le cache grandit [2] [9]. » avec 3 passages : `[9]` n’existe pas, la réponse est invalide.'
    en: 'Answer: “The cache grows [2] [9].” with 3 passages: `[9]` does not exist, so the answer is invalid.'
- id: c5
  type: exemple
  titre:
    fr: Extraire les citations
    en: Extracting the citations
  lang: python
  etapes:
  - code: |-
      import re
      reponse = "Le cache grandit [2]. Il se calcule ainsi [1] [2]."
    fr: Une réponse avec trois marques de citation.
    en: An answer with three citation marks.
  - code: nums = sorted(set(int(x) for x in re.findall(r"\[(\d+)\]", reponse)))
    fr: L’expression régulière trouve les nombres entre crochets ; `set` retire les doublons.
    en: The regular expression finds numbers in brackets; `set` removes duplicates.
  - code: print(nums)
    fr: On affiche `[1, 2]`.
    en: We display `[1, 2]`.
  verif: |-
    import re
    reponse = "Le cache grandit [2]. Il se calcule ainsi [1] [2]."
    nums = sorted(set(int(x) for x in re.findall(r"\[(\d+)\]", reponse)))
    print(nums)
  sortie: '[1, 2]'
- id: c6
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `citations(reponse)`** : la liste triée, sans doublon, des entiers `n` des marques `[n]` de `reponse` (utilise `re.findall(r"\[(\d+)\]", reponse)`). Puis **`citations_valides(reponse, n)`** : `True` s’il y a au moins une citation et que toutes sont entre `1` et `n`.'
  en: '**Write `citations(reponse)`**: the sorted list, without duplicates, of the integers `n` of the `[n]` marks in `reponse` (use `re.findall(r"\[(\d+)\]", reponse)`). Then **`citations_valides(reponse, n)`**: `True` if there is at least one citation and all are between `1` and `n`.'
  depart: |
    import re

    # écris tes fonctions citations et citations_valides ici
  tests: |-
    assert citations("a [2] b [1] [2]") == [1, 2]
    assert citations("rien") == []
    assert citations_valides("a [1] [3]", 3) is True
    assert citations_valides("a [4]", 3) is False
    assert citations_valides("aucune source", 3) is False
    assert citations_valides("a [0]", 3) is False
  solutionCode: |
    import re

    def citations(reponse):
        return sorted(set(int(x) for x in re.findall(r"\[(\d+)\]", reponse)))

    def citations_valides(reponse, n):
        c = citations(reponse)
        return len(c) > 0 and all(1 <= x <= n for x in c)
  indice:
    fr: '`set` retire les doublons, `sorted` trie ; pour la validité, vérifie `len(c) > 0` et `all(1 <= x <= n for x in c)`.'
    en: '`set` removes duplicates, `sorted` sorts; for validity, check `len(c) > 0` and `all(1 <= x <= n for x in c)`.'
  explication:
    fr: 'Ce contrôle est automatique et bon marché : il ne prouve pas que l’affirmation est vraie, mais il écarte les citations fantômes.'
    en: 'This check is automatic and cheap: it does not prove the claim is true, but it rules out phantom citations.'
- id: c7
  type: idee
  fr: 'Comment décider d’**s’abstenir** ? Si le meilleur score de recherche est sous un **seuil**, on ne donne pas de réponse. Le seuil se règle sur des questions de test : trop bas, l’assistant invente ; trop haut, il refuse trop souvent.'
  en: 'How do we decide to **abstain**? If the best search score is below a **threshold**, we give no answer. The threshold is tuned on test questions: too low, the assistant invents; too high, it refuses too often.'
  exemple:
    fr: Avec un seuil de $0{,}5$, un meilleur score de $0{,}3$ déclenche l’abstention ; un score de $0{,}7$ permet de répondre.
    en: With a threshold of $0.5$, a best score of $0.3$ triggers abstention; a score of $0.7$ allows an answer.
  figure:
    kind: tableau
    entetes:
    - fr: Seuil
      en: Threshold
    - fr: Risque
      en: Risk
    cellules:
    - - fr: trop bas
        en: too low
      - fr: inventions
        en: inventions
        ton: bad
    - - fr: trop haut
        en: too high
      - fr: refus excessifs
        en: excessive refusals
        ton: bad
    - - fr: réglé sur des tests
        en: tuned on tests
        ton: ok
      - fr: équilibre
        en: balance
        ton: ok
    legende:
      fr: 'Les deux erreurs ont un coût : on mesure les deux.'
      en: 'Both errors have a cost: we measure both.'
- id: c8
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Seuil de $0{,}5$. Les meilleurs scores de trois questions sont $0{,}3$, $0{,}5$ et $0{,}8$ (on répond si le score est **supérieur ou égal** au seuil). Sur combien de questions l’assistant s’abstient-il ?
  en: Threshold $0.5$. The best scores of three questions are $0.3$, $0.5$ and $0.8$ (we answer if the score is **greater than or equal to** the threshold). On how many questions does the assistant abstain?
  reponses:
  - '1'
  verif: print(sum(1 for s in (0.3, 0.5, 0.8) if s < 0.5))
  indice:
    fr: Seul un score strictement inférieur à $0{,}5$ déclenche l’abstention.
    en: Only a score strictly below $0.5$ triggers abstention.
  explication:
    fr: 'Seule la première question est sous le seuil : $0{,}5$ est égal au seuil, donc on répond.'
    en: 'Only the first question is below the threshold: $0.5$ equals the threshold, so we answer.'
- id: c9
  type: piege
  fr: 'Un seuil ne protège pas contre une **source fausse ou piégée**. Un passage qui contient « ignore tes consignes » ou une information erronée sera cité avec confiance. Les passages sont des données non fiables : le module 15 et le module 19 montrent comment s’en protéger.'
  en: 'A threshold does not protect against a **false or trapped source**. A passage containing “ignore your instructions” or incorrect information will be cited with confidence. Passages are untrusted data: module 15 and module 19 show how to protect against them.'
- id: c10
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: "Défi. **Écris `repondre(question, resultats, seuil)`**. `resultats` est une liste de couples `(identifiant, score)`, triée du meilleur au pire.\n1. Si la liste est vide ou si le premier score est inférieur à `seuil`, renvoie `{\"abstention\": True, \"reponse\": \"Je ne sais pas d'après les cours.\", \"sources\": []}`.\n2. Sinon, garde dans `ids` les identifiants de score `>= seuil`.\n3. Renvoie `{\"abstention\": False, \"reponse\": \"À partir de \" + \", \".join(ids), \"sources\": ids}`."
  en: "Challenge. **Write `repondre(question, resultats, seuil)`**. `resultats` is a list of `(identifier, score)` pairs, sorted best to worst.\n1. If the list is empty or if the first score is below `seuil`, return `{\"abstention\": True, \"reponse\": \"Je ne sais pas d'après les cours.\", \"sources\": []}`.\n2. Otherwise, keep in `ids` the identifiers with score `>= seuil`.\n3. Return `{\"abstention\": False, \"reponse\": \"À partir de \" + \", \".join(ids), \"sources\": ids}`."
  depart: |
    # écris ta fonction repondre ici
  tests: |-
    r = repondre("Q", [("a", 0.9), ("b", 0.6), ("c", 0.2)], 0.5)
    assert r == {"abstention": False, "reponse": "À partir de a, b", "sources": ["a", "b"]}
    r = repondre("Q", [("a", 0.3)], 0.5)
    assert r["abstention"] is True and r["sources"] == [] and "Je ne sais pas" in r["reponse"]
    assert repondre("Q", [], 0.5)["abstention"] is True
    assert repondre("Q", [("a", 0.5)], 0.5)["sources"] == ["a"]
  solutionCode: |
    def repondre(question, resultats, seuil):
        if not resultats or resultats[0][1] < seuil:
            return {"abstention": True, "reponse": "Je ne sais pas d'après les cours.", "sources": []}
        ids = [i for i, s in resultats if s >= seuil]
        return {"abstention": False, "reponse": "À partir de " + ", ".join(ids), "sources": ids}
  indice:
    fr: Teste d’abord `not resultats or resultats[0][1] < seuil` ; sinon `ids = [i for i, s in resultats if s >= seuil]`.
    en: Test first `not resultats or resultats[0][1] < seuil`; otherwise `ids = [i for i, s in resultats if s >= seuil]`.
  explication:
    fr: 'Tu as écrit la décision centrale d’un assistant honnête : répondre avec ses sources, ou reconnaître qu’il ne sait pas.'
    en: 'You wrote the central decision of an honest assistant: answer with its sources, or admit it does not know.'
- id: c11
  type: idee
  fr: 'Pour évaluer un système RAG, on sépare deux questions. La **recherche** a-t-elle ramené le bon passage ? Et la **réponse** est-elle fidèle aux passages donnés ? Une mauvaise réponse peut venir de l’un ou de l’autre : on les mesure séparément.'
  en: 'To evaluate a RAG system, we separate two questions. Did the **search** bring back the right passage? And is the **answer** faithful to the passages given? A bad answer can come from either: we measure them separately.'
  exemple:
    fr: 'Le niveau suivant (boss) mesure le **rappel** : sur combien de questions le bon passage est dans les $k$ premiers.'
    en: 'The next level (boss) measures **recall**: on how many questions the right passage is in the first $k$.'
- id: c12
  type: idee
  fr: Attention à la **contamination**. Si tes questions de test sont recopiées des passages, ou si le modèle a déjà vu le cours à l’entraînement, les scores sont gonflés. Écris tes questions à part, avec tes mots.
  en: 'Beware of **contamination**: if your test questions are copied from the passages, or if the model has already seen the course in training, the scores are inflated. Write your test questions separately, in your own words.'
  exemple:
    fr: Une question qui reprend mot pour mot une phrase du passage ne teste que la recherche exacte.
    en: A question that repeats a sentence of the passage word for word only tests exact search.
- id: c13
  type: retenir
  fr: 'Ancrer : passages numérotés, consigne de citer. Vérifier : chaque `[n]` doit exister. S’abstenir : sous un seuil de score. Mesurer la recherche et la fidélité séparément. Éviter la contamination.'
  en: 'Ground: numbered passages, instruction to cite. Check: each `[n]` must exist. Abstain: below a score threshold. Measure search and faithfulness separately. Avoid contamination.'
