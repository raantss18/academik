# Niveau 12.boss — Ton mini-GPT (mission : la boucle de génération complète). Original academik ; notions vérifiées dans Vaswani et al. 2017 (arXiv 1706.03762) et la série « Zero to Hero » d’A. Karpathy (citée, code non repris).
