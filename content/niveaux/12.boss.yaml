    poids: 1
  fr: 'À toi. **Écris `probas_suivant(ids, T)`** : prends `cles = [E[i] for i in ids]`, calcule `h = attention(E[ids[-1]], cles, cles)`, les scores `sum(a * b for a, b in zip(h, w))` pour chaque `w` de `W`, puis renvoie `softmax` de ces scores divisés par `T`.'
