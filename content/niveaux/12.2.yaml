# Niveau 12.2 — Transformers 2 : softmax et plongements. Original academik ; notions vérifiées dans Vaswani et al. 2017 (arXiv 1706.03762) et la série « Zero to Hero » d’A. Karpathy (citée).
id: '12.2'
module: 12
duree_min: 16
titre:
  fr: Softmax et plongements
  en: Softmax and embeddings
ia:
  fr: Kintana transforme des scores en probabilités et des mots en vecteurs qu’elle sait comparer.
  en: Kintana turns scores into probabilities and words into vectors she can compare.
objectifs:
  - { fr: 'calculer un softmax stable', en: 'compute a stable softmax' }
  - { fr: 'comprendre un plongement', en: 'understand an embedding' }
  - { fr: 'comparer deux plongements par le cosinus', en: 'compare two embeddings with the cosine' }
sources:
