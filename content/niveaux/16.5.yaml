- id: c6
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `brownien(T, n, u)`** : `dt = T / n`, `W = [0.0]`, puis `n` fois ajoute `W[-1] + math.sqrt(dt) * gauss(u)`. Renvoie `W` (`n + 1` valeurs). `gauss` est fournie.'
  en: '**Write `brownien(T, n, u)`**: `dt = T / n`, `W = [0.0]`, then `n` times append `W[-1] + math.sqrt(dt) * gauss(u)`. Return `W` (`n + 1` values). `gauss` is provided.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    # écris ta fonction brownien ici
  tests: |-
    W = brownien(1.0, 100, generateur(3))
    assert len(W) == 101 and W[0] == 0.0
    fin = [brownien(1.0, 50, generateur(g))[-1] for g in range(1, 301)]
    m = sum(fin) / len(fin)
    v = sum((x - m) ** 2 for x in fin) / len(fin)
    assert abs(m) < 0.25 and 0.7 < v < 1.4
    assert brownien(2.0, 10, generateur(9)) == brownien(2.0, 10, generateur(9))
  solutionCode: |
    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def brownien(T, n, u):
        dt = T / n
        W = [0.0]
        for _ in range(n):
            W.append(W[-1] + math.sqrt(dt) * gauss(u))
        return W
  indice:
    fr: Même structure que la marche du niveau 16.2, mais le pas est `math.sqrt(dt) * gauss(u)`.
    en: Same structure as the walk of level 16.2, but the step is `math.sqrt(dt) * gauss(u)`.
  explication:
    fr: 'La variance de `W[-1]` vaut `T`, quel que soit `n` : le raffinement du pas ne change pas la dispersion.'
    en: 'The variance of `W[-1]` is `T`, whatever `n`: refining the step does not change the dispersion.'
- id: c7
  type: idee
  fr: 'Un prix ne se modélise pas par un brownien seul, qui peut devenir négatif. On utilise le **mouvement brownien géométrique** : $dS=\mu S\,dt+\sigma S\,dW$. La variation relative suit une tendance $\mu$ et un bruit d’intensité $\sigma$ (la **volatilité**). Le prix reste positif.'
  en: 'A price is not modelled by a plain Brownian motion, which can become negative. We use **geometric Brownian motion**: $dS=\mu S\,dt+\sigma S\,dW$. The relative change follows a trend $\mu$ and noise of intensity $\sigma$ (the **volatility**). The price stays positive.'
  exemple:
    fr: Avec $\mu=5\,\%$ par an et $\sigma=20\,\%$, un prix de 100 monte en moyenne de 5 € par an, avec une dispersion de 20 € environ.
    en: With $\mu=5\%$ per year and $\sigma=20\%$, a price of 100 rises on average by €5 per year, with a dispersion of about €20.
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Une EDS de prix
        en: A price SDE
      noeuds:
      - fr: tendance $\mu S\,dt$
        en: trend $\mu S\,dt$
      - fr: + bruit $\sigma S\,dW$
        en: + noise $\sigma S\,dW$
      - fr: nouveau prix
        en: new price
        ton: ok
    legende:
      fr: 'Euler-Maruyama : le pas d’Euler plus un choc brownien.'
      en: 'Euler-Maruyama: the Euler step plus a Brownian shock.'
- id: c8
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `prix_final(S0, mu, sigma, T, n, u)`** : méthode d’**Euler-Maruyama**. Avec `dt = T / n` et `S = S0`, répète `n` fois `S = S + mu * S * dt + sigma * S * math.sqrt(dt) * gauss(u)`. Renvoie `S`. `gauss` est fournie.'
  en: '**Write `prix_final(S0, mu, sigma, T, n, u)`**: the **Euler-Maruyama** method. With `dt = T / n` and `S = S0`, repeat `n` times `S = S + mu * S * dt + sigma * S * math.sqrt(dt) * gauss(u)`. Return `S`. `gauss` is provided.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    # écris ta fonction prix_final ici
  tests: |-
    assert prix_final(100.0, 0.05, 0.0, 1.0, 100, generateur(1)) > 104.9
    assert abs(prix_final(100.0, 0.05, 0.0, 1.0, 1000, generateur(1)) - 100 * math.exp(0.05)) < 0.3
    assert prix_final(100.0, 0.0, 0.2, 1.0, 50, generateur(2)) == prix_final(100.0, 0.0, 0.2, 1.0, 50, generateur(2))
    assert prix_final(100.0, 0.0, 0.2, 0.0, 1, generateur(2)) == 100.0
  solutionCode: |
    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def prix_final(S0, mu, sigma, T, n, u):
        dt = T / n
        S = S0
        for _ in range(n):
            S = S + mu * S * dt + sigma * S * math.sqrt(dt) * gauss(u)
        return S
  indice:
    fr: 'Une boucle de `n` tours qui met `S` à jour : tendance déterministe plus choc `sigma * S * math.sqrt(dt) * gauss(u)`.'
    en: 'A loop of `n` turns updating `S`: deterministic trend plus shock `sigma * S * math.sqrt(dt) * gauss(u)`.'
  explication:
    fr: 'Avec `sigma = 0`, il n’y a plus de hasard : on retrouve exactement la méthode d’Euler du niveau 16.1.'
    en: 'With `sigma = 0`, there is no more randomness: we recover exactly Euler’s method from level 16.1.'
- id: c9
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Pour un brownien, la variance de $W_4$ est égale à la durée $4$. Quel est l’écart type de $W_4$ ?
  en: For a Brownian motion, the variance of $W_4$ equals the duration $4$. What is the standard deviation of $W_4$?
  reponses:
  - '2'
  - '2.0'
  verif: print(4 ** 0.5)
  indice:
    fr: Écart type = racine carrée de la variance.
    en: Standard deviation = square root of the variance.
  explication:
