cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: On découpe une année en $n$ intervalles, et le prix reçoit un choc aléatoire à chacun. Comment la taille du choc doit-elle évoluer quand $n$ augmente, pour que la dispersion annuelle reste raisonnable ?
  en: If a year is cut into $n$ intervals and at each the price receives a random shock, how should the size of the shock change as $n$ increases, for the annual dispersion to remain reasonable?
  choix:
  - fr: Elle doit diminuer comme $\sqrt{1/n}$
    en: It must decrease like $\sqrt{1/n}$
    juste: true
  - fr: Elle doit rester constante
    en: It must stay constant
  - fr: Elle doit augmenter avec $n$
    en: It must increase with $n$
  indice:
    fr: Les variances s’additionnent (niveau 16.2). Si la variance totale doit rester fixe, que vaut la variance de chaque choc ?
    en: Variances add (level 16.2). If the total variance must stay fixed, what is each shock’s variance?
  explication:
    fr: 'Variance totale fixe $\sigma^2T$ répartie en $n$ chocs : chacun a une variance $\sigma^2T/n$, donc un écart type $\sigma\sqrt{T/n}$. C’est la base du **mouvement brownien**.'
    en: 'Fixed total variance $\sigma^2T$ split into $n$ shocks: each has variance $\sigma^2T/n$, hence a standard deviation $\sigma\sqrt{T/n}$. This is the basis of **Brownian motion**.'
- id: c2
  type: idee
  fr: Le **mouvement brownien** $W_t$ est le modèle continu du hasard. Il part de $W_0=0$ et ses accroissements sont indépendants. L’accroissement $W_{t+s}-W_t$ suit une loi normale de moyenne $0$ et de variance $s$.
  en: '**Brownian motion** $W_t$ is the continuous model of chance. It starts from $W_0=0$; its increments are independent; and $W_{t+s}-W_t$ follows a normal law with expectation $0$ and variance $s$. Its paths are continuous but very irregular.'
  exemple:
    fr: Sur un intervalle de durée $0{,}01$, un accroissement a un écart type de $\sqrt{0{,}01}=0{,}1$.
    en: Over an interval of length $0.01$, an increment has a standard deviation of $\sqrt{0.01}=0.1$.
  figure:
    kind: tableau
    entetes:
    - fr: Durée $s$
      en: Duration $s$
    - fr: Écart type $\sqrt s$
      en: Standard deviation $\sqrt s$
    cellules:
    - - 0,01
      - 0,1
    - - '1'
      - '1'
    - - fr: '100'
        en: '100'
        ton: ok
      - fr: '10'
        en: '10'
        ton: ok
    legende:
      fr: L’écart type croît comme la racine de la durée.
      en: The standard deviation grows like the square root of the duration.
- id: c3
  type: idee
  fr: 'Pour simuler, il faut des tirages **normaux**. La méthode de **Box-Muller** transforme deux nombres uniformes $u_1,u_2$ en un tirage normal : $\sqrt{-2\ln u_1}\cos(2\pi u_2)$. On l’utilise ici avec le générateur du niveau 16.2.'
  en: 'To simulate, we need **normal** draws. The **Box-Muller** method turns two uniform numbers $u_1,u_2$ into a normal draw: $\sqrt{-2\ln u_1}\cos(2\pi u_2)$. We use it here with the generator of level 16.2.'
  exemple:
    fr: 'Pour $u_1=e^{-1/2}\approx0{,}607$ et $u_2=0$ : $\sqrt{-2\ln u_1}=1$ et $\cos0=1$, d’où le tirage $1$.'
    en: 'For $u_1=e^{-1/2}\approx0.607$ and $u_2=0$: $\sqrt{-2\ln u_1}=1$ and $\cos0=1$, hence the draw $1$.'
- id: c3b
  type: idee
  fr: 'Le brownien a une propriété étonnante : ses trajectoires sont continues mais **nulle part dérivables**. Plus on zoome, plus elles restent irrégulières. C’est pour cela qu’on ne peut pas écrire $dW/dt$, et qu’on écrit $dW$ avec des règles à part.'
  en: 'Brownian motion has an astonishing property: its paths are continuous but **nowhere differentiable**. The more we zoom, the more irregular they remain. This is why we cannot write $dW/dt$, and we write $dW$ with separate rules.'
  exemple:
    fr: Sur une durée $dt$, le brownien bouge de l’ordre de $\sqrt{dt}$, bien plus que $dt$ quand $dt$ est petit.
    en: Over a duration $dt$, Brownian motion moves by about $\sqrt{dt}$, much more than $dt$ when $dt$ is small.
- id: c4
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `gauss(u)`** : appelle `u()` deux fois (`u1` puis `u2`) et renvoie `math.sqrt(-2 * math.log(u1)) * math.cos(2 * math.pi * u2)`.'
  en: 'Your turn. **Write `gauss(u)`**: call `u()` twice (`u1` then `u2`) and return `math.sqrt(-2 * math.log(u1)) * math.cos(2 * math.pi * u2)`.'
  depart: |
    import math

    # écris ta fonction gauss ici
  tests: |-
    vals = iter([math.exp(-0.5), 0.0])
    assert abs(gauss(lambda: next(vals)) - 1.0) < 1e-12
    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u
    u = generateur(5)
    xs = [gauss(u) for _ in range(4000)]
    m = sum(xs) / len(xs)
    v = sum((x - m) ** 2 for x in xs) / len(xs)
    assert abs(m) < 0.06 and 0.9 < v < 1.1
  solutionCode: |
    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())
  indice:
    fr: 'Écris `u1 = u()` puis `u2 = u()` : deux appels, dans cet ordre, puis la formule.'
    en: 'Write `u1 = u()` then `u2 = u()`: two calls, in this order, then the formula.'
  explication:
    fr: 'Le résultat suit (à très peu près) une loi normale centrée réduite : moyenne $0$, variance $1$.'
    en: 'The result follows (very nearly) a standard normal law: mean $0$, variance $1$.'
