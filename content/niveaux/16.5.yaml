    en: $\sqrt4=2$.
- id: c10
  type: idee
  fr: 'Le **calcul d’Itô** corrige le calcul ordinaire, car $(dW)^2=dt$ n’est pas négligeable. Résultat : la solution exacte du mouvement brownien géométrique est $S_T=S_0\exp\!\big((\mu-\tfrac12\sigma^2)T+\sigma W_T\big)$. Le terme $-\tfrac12\sigma^2$ est la **correction d’Itô**.'
  en: '**Itô calculus** corrects ordinary calculus, because $(dW)^2=dt$ is not negligible. Result: the exact solution of geometric Brownian motion is $S_T=S_0\exp\!\big((\mu-\tfrac12\sigma^2)T+\sigma W_T\big)$. The term $-\tfrac12\sigma^2$ is the **Itô correction**.'
  exemple:
    fr: 'Malgré cette correction, l’espérance reste $E[S_T]=S_0e^{\mu T}$ : la volatilité n’abaisse pas la moyenne, mais la médiane.'
    en: 'Despite this correction, the expectation stays $E[S_T]=S_0e^{\mu T}$: volatility does not lower the mean, but the median.'
- id: c11
  type: piege
  fr: 'Le rendement moyen « typique » n’est pas $\mu$ : c’est $\mu-\tfrac12\sigma^2$. Avec une forte volatilité, la moyenne arithmétique des prix monte alors que la trajectoire **typique** peut baisser. Un investisseur voit la trajectoire, pas la moyenne sur des univers parallèles.'
  en: 'The “typical” average return is not $\mu$: it is $\mu-\tfrac12\sigma^2$. With high volatility, the arithmetic mean of prices rises while the **typical** path may fall. An investor sees the path, not the average over parallel universes.'
- id: c12
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `moyenne_terminale(S0, mu, sigma, T, n, essais, graine)`** : crée `u = generateur(graine)`, simule `essais` prix finaux avec `prix_final`, et renvoie leur moyenne. Elle doit être proche de $S_0e^{\mu T}$. `prix_final` est fournie.'
  en: 'Challenge. **Write `moyenne_terminale(S0, mu, sigma, T, n, essais, graine)`**: create `u = generateur(graine)`, simulate `essais` final prices with `prix_final`, and return their mean. It should be close to $S_0e^{\mu T}$. `prix_final` is provided.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def prix_final(S0, mu, sigma, T, n, u):
