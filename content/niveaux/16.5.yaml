    # écris ta fonction moyenne_terminale ici
  tests: |-
    m = moyenne_terminale(100.0, 0.05, 0.2, 1.0, 50, 4000, 1)
    assert abs(m - 100 * math.exp(0.05)) < 1.6
    m0 = moyenne_terminale(100.0, 0.0, 0.2, 1.0, 50, 4000, 2)
    assert abs(m0 - 100) < 1.6
