  solutionCode: |
    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    import math

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def prix_final(S0, mu, sigma, T, n, u):
        dt = T / n
        S = S0
        for _ in range(n):
            S = S + mu * S * dt + sigma * S * math.sqrt(dt) * gauss(u)
        return S

    def moyenne_terminale(S0, mu, sigma, T, n, essais, graine):
        u = generateur(graine)
        return sum(prix_final(S0, mu, sigma, T, n, u) for _ in range(essais)) / essais
  indice:
    fr: Un seul générateur `u` pour tous les essais, puis `sum(prix_final(...) for _ in range(essais)) / essais`.
    en: A single generator `u` for all trials, then `sum(prix_final(...) for _ in range(essais)) / essais`.
  explication:
    fr: 'Tu estimes une espérance par moyenne de simulations : c’est la méthode de Monte-Carlo, utilisée dans le boss.'
    en: 'You estimate an expectation by averaging simulations: this is the Monte Carlo method, used in the boss.'
- id: c13
  type: retenir
  fr: 'Brownien : accroissements indépendants normaux, variance égale à la durée. Box-Muller pour simuler. Prix : $dS=\mu S\,dt+\sigma S\,dW$, Euler-Maruyama. Itô : correction $-\tfrac12\sigma^2$. $E[S_T]=S_0e^{\mu T}$.'
  en: 'Brownian: independent normal increments, variance equal to the duration. Box-Muller to simulate. Price: $dS=\mu S\,dt+\sigma S\,dW$, Euler-Maruyama. Itô: correction $-\tfrac12\sigma^2$. $E[S_T]=S_0e^{\mu T}$.'
