  type: idee
  fr: 'Une défense se juge sur trois critères : le **taux de blocage** des vraies attaques, le **taux de faux positifs** et le **coût** pour l’utilisateur. Une sécurité insupportable est contournée.'
  en: 'A defence is judged on three criteria: the **blocking rate** of real attacks, the **false positive rate** and the **cost** to the user. Unbearable security gets bypassed.'
