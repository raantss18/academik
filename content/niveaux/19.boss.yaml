- id: c12
  type: idee
  fr: 'Tu as parcouru la sécurité des applications LLM : réseaux, cryptographie, programmation sûre, risques OWASP, injection de prompt et défense en profondeur. Une règle les résume : **ne jamais faire confiance à ce qui vient du dehors, et limiter ce qu’un composant peut faire s’il est trompé**.'
  en: 'You have covered the security of LLM applications: networks, cryptography, safe programming, OWASP risks, prompt injection and defence in depth. One rule sums them up: **never trust what comes from outside, and limit what a component can do if it is tricked**.'
  exemple:
    fr: Le module 20 ajoute l’évaluation, la surveillance et le déploiement pour finir la chaîne de production.
    en: Module 20 adds evaluation, monitoring and deployment to finish the production chain.
- id: c13
  type: retenir
  fr: 'Évaluer la défense : suite d’attaques fixe, bloquées et passantes, faux positifs et faux négatifs. Rapport honnête avec la portée. Chaque faille devient un test. Pas de confiance au dehors, privilèges minimaux.'
  en: 'Evaluating the defence: fixed attack suite, blocked and passing, false positives and false negatives. Honest report with the scope. Each flaw becomes a test. No trust outside, minimal privileges.'
