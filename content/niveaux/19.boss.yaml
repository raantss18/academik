- id: c6
  type: idee
  fr: '**Faux positifs et faux négatifs.** Un **faux négatif** est une attaque qui passe. Un **faux positif** est une action légitime bloquée à tort. Une défense qui bloque tout n’a aucun faux négatif mais est inutilisable. On mesure les deux, comme au module 9.'
  en: '**False positives and false negatives.** A **false negative** is an attack that gets through. A **false positive** is a legitimate action wrongly blocked. A defence that blocks everything has no false negatives but is unusable. We measure both, as in module 9.'
  exemple:
    fr: 'Ici : 1 faux négatif (le lien piégé) et 0 faux positif (la lecture légitime passe).'
    en: 'Here: 1 false negative (the trapped link) and 0 false positives (the legitimate read passes).'
