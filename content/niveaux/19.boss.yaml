  type: plus
  fr: Pour aller plus loin, consulte [le Top 10 OWASP pour les applications LLM](https://genai.owasp.org/llm-top-10/) ; cette page demande une connexion.
  en: To go further, see [the OWASP Top 10 for LLM applications](https://genai.owasp.org/llm-top-10/); this page needs a connection.
