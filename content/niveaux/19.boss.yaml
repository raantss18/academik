# Niveau 19.boss — Défends ton agent (mission : évaluer une défense en couches et rendre un rapport honnête). Original academik ; notions des niveaux 19.1 à 19.5, vérifiées dans le Top 10 OWASP LLM 2025 (lien) et la spécification MCP (citée). Approche défensive, attaques simulées.
id: 19.boss
module: 19
duree_min: 17
titre:
  fr: Défends ton agent
  en: Defend your agent
ia:
  fr: Kintana résiste à une série d’attaques et rend un rapport qui dit ce qui passe encore.
  en: Kintana withstands a series of attacks and returns a report saying what still gets through.
objectifs:
  - { fr: 'évaluer une défense sur une suite d''attaques', en: 'evaluate a defence on an attack suite' }
  - { fr: 'compter faux positifs et faux négatifs', en: 'count false positives and false negatives' }
  - { fr: 'transformer chaque faille en test', en: 'turn each flaw into a test' }
