  licence: Spécification en ligne ; idées citées
cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: 'Après avoir ajouté trois défenses à ton agent, tu le testes sur 6 attaques : 5 sont bloquées, une passe. Que mets-tu dans ton rapport de sécurité ?'
  en: 'After adding three defences to your agent, you test it on 6 attacks: 5 are blocked, one gets through. What do you put in your security report?'
  choix:
  - fr: Les 5 blocages et l’attaque qui passe, avec les limites du test
    en: The 5 blocks and the attack that gets through, with the test’s limits
    juste: true
  - fr: Seulement « 5 sur 6 », sans détail
    en: Only “5 out of 6”, without detail
  - fr: 'Rien : l’attaque qui passe est un détail'
    en: 'Nothing: the attack that gets through is a detail'
  indice:
    fr: Un rapport honnête dit ce qui n’est pas couvert, pour que le lecteur ne se croie pas protégé à tort.
    en: An honest report says what is not covered, so the reader does not wrongly feel protected.
  explication:
    fr: Un bon rapport nomme ce qui **passe encore**. Cacher la faille expose le lecteur à un faux sentiment de sécurité.
    en: A good report names what **still gets through**. Hiding the flaw exposes the reader to a false sense of security.
- id: c2
  type: idee
  fr: 'Mission : évaluer la défense de ton agent sur une suite de 6 attaques simulées. Chaque attaque est soit une **action d’outil** (contrôlée par `decision`), soit une **sortie** du modèle (contrôlée par `retirer_images` et `filtrer_sortie`). Une attaque est **bloquée** si les défenses la refusent ou modifient la sortie.'
  en: 'Mission: evaluate your agent’s defence on a suite of 6 simulated attacks. Each attack is either a **tool action** (checked by `decision`) or a model **output** (checked by `retirer_images` and `filtrer_sortie`). An attack is **blocked** if the defences refuse it or modify the output.'
  exemple:
    fr: 'Une action légitime fait aussi partie de la suite : elle ne doit pas être bloquée (pas de faux positif).'
    en: 'A legitimate action is also part of the suite: it must not be blocked (no false positive).'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Évaluer la défense
        en: Evaluating the defence
      noeuds:
      - fr: suite d’attaques
        en: attack suite
      - fr: défenses en couches
        en: layered defences
      - fr: bloquée ou non
        en: blocked or not
      - fr: rapport honnête
        en: honest report
        ton: ok
    legende:
      fr: 'Compter aussi les faux positifs : une défense qui bloque tout est inutilisable.'
      en: 'Count false positives too: a defence that blocks everything is unusable.'
