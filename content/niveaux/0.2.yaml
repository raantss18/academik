id: '0.2'
module: 0
duree_min: 12
titre: { fr: 'Démontrer', en: 'Proving' }
ia: { fr: 'Kintana justifie une règle et sait réfuter une généralisation abusive.', en: 'Kintana justifies a rule and can refute an unjustified generalisation.' }
objectifs:
  - { fr: 'écrire une preuve directe', en: 'write a direct proof' }
  - { fr: 'raisonner par contraposée', en: 'reason by contrapositive' }
  - { fr: 'raisonner par l''absurde', en: 'reason by contradiction' }
sources:
  - { titre: 'COMIMa — Exemples et contre-exemples, chapitre 0', url: 'https://www.comima.mg', licence: 'Textes Antsa : autorisation du 2026-11-01 ; tiers exclus' }
  - { titre: 'Oscar Levin — Proofs', url: 'https://discrete.openmathbooks.org/dmoi3/sec_logic-proofs.html', licence: 'CC BY-SA 4.0' }
cartes:
  - id: c1
    indice: { fr: 'Cherche un nombre impair qui n’est pas premier : il se décompose en deux facteurs.', en: 'Look for an odd number that is not prime: it splits into two factors.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana prétend que tout entier positif impair est premier. Quel nombre parmi ceux-ci le réfute ?'
    en: 'Kintana claims that every odd positive integer is prime. Which of these numbers refutes it?'
    choix:
      - { fr: '3', en: '3' }
      - { fr: '5', en: '5' }
      - { fr: '9', en: '9', juste: true }
    verif: 'print(next(n for n in [3,5,9] if n % 2 and any(n % d == 0 for d in range(2,n))))'
    sortie: '9'
    explication: { fr: '$9=3\times3$ est impair et composé : il satisfait l’hypothèse, pas la conclusion.', en: '$9=3\times3$ is odd and composite: it satisfies the hypothesis but not the conclusion.' }
  - id: c2
    type: idee
    fr: 'Un **contre-exemple** est un seul cas qui vérifie l’hypothèse mais pas la conclusion : il suffit pour **réfuter** une règle « pour tout ». Mille exemples qui marchent ne la **démontrent** pas.'
    en: 'A **counterexample** is a single case that meets the hypothesis but not the conclusion: it is enough to **refute** a “for all” rule. A thousand examples that work do not **prove** it.'
    exemple: { fr: 'Règle de Kintana : « tout impair est premier ». $3, 5, 7$ marchent, mais $9=3\times3$ est impair et composé : la règle est fausse.', en: 'Kintana’s rule: “every odd number is prime”. $3, 5, 7$ work, but $9=3\times3$ is odd and composite: the rule is false.' }
    figure:
      kind: nombres
      liste: [1, 3, 5, 7, 9, 11, 13, 15]
      groupes:
        - { valeurs: [3, 5, 7, 11, 13], ton: ok, label: { fr: 'premier : la règle tient', en: 'prime: the rule holds' } }
        - { valeurs: [9, 15], ton: bad, label: { fr: 'composé : contre-exemple', en: 'composite: counterexample' } }
        - { valeurs: [1], ton: neutre, label: { fr: 'ni premier ni composé (aussi un contre-exemple)', en: 'neither prime nor composite (also a counterexample)' } }
      legende: { fr: 'Les impairs de $1$ à $15$ : il suffit d’une seule case rouge pour réfuter la règle.', en: 'Odd numbers from $1$ to $15$: a single red box is enough to refute the rule.' }
  - id: d_counter
    type: exemple
    titre:
      fr: Réfuter avec un cas
      en: Refuting with one case
    etapes:
      - fr: "Règle proposée : tout multiple de trois est impair. Cherchons un multiple de trois pair."
        en: "Proposed rule: every multiple of three is odd. Look for an even multiple of three."
      - fr: $12=3\times4=2\times6$ remplit l’hypothèse mais contredit la conclusion.
        en: $12=3\times4=2\times6$ satisfies the hypothesis but contradicts the conclusion.
      - fr: La règle est fausse, même si trois et neuf la vérifient.
        en: The rule is false, even though three and nine satisfy it.
    verif: print(12%3,12%2)
    sortie: 0 0
  - id: d_p_counter
    type: piege
    fr: "Un cas hors de l’hypothèse ne réfute rien : quatre ne peut pas réfuter une règle sur les multiples de trois."
    en: "A case outside the hypothesis refutes nothing: four cannot refute a rule about multiples of three."
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour réfuter « tout multiple de trois est impair », que faut-il trouver ?'
    en: 'To refute “every multiple of three is odd”, what must you find?'
    choix:
      - { fr: 'Un seul multiple de trois qui est pair', en: 'A single multiple of three that is even', juste: true }
      - { fr: 'Beaucoup de multiples de trois impairs', en: 'Many odd multiples of three' }
      - { fr: 'Un nombre pair qui n’est pas multiple de trois', en: 'An even number that is not a multiple of three' }
    explication: { fr: 'Un seul contre-exemple suffit, et il doit vérifier l’hypothèse (multiple de trois) tout en contredisant la conclusion.', en: 'One counterexample is enough, and it must satisfy the hypothesis (multiple of three) while contradicting the conclusion.' }
    indice: { fr: 'Un contre-exemple vérifie l’hypothèse mais pas la conclusion.', en: 'A counterexample satisfies the hypothesis but not the conclusion.' }
  - id: c2a
    type: idee
    fr: 'Avant les méthodes, trois notations. Une **implication** relie une hypothèse $P$ à une conclusion $Q$. Le symbole $\neg$ veut dire « non » : il nie une phrase.'
    en: 'Before the methods, three notations. An **implication** links a hypothesis $P$ to a conclusion $Q$. The symbol $\neg$ means “not”: it negates a sentence.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Notation', en: 'Notation' }, { fr: 'Se lit', en: 'Read as' }, { fr: 'Exemple avec un entier $n$', en: 'Example with an integer $n$' }]
      cellules:
        - ['$P$, $Q$', { fr: 'deux phrases, vraies ou fausses', en: 'two sentences, true or false' }, { fr: '$P$ : « $n$ est pair », $Q$ : « $n^2$ est pair »', en: '$P$: “$n$ is even”, $Q$: “$n^2$ is even”' }]
        - ['$P\Rightarrow Q$', { fr: '« si $P$, alors $Q$ »', en: '“if $P$, then $Q$”' }, { fr: 'si $n$ est pair, alors $n^2$ est pair', en: 'if $n$ is even, then $n^2$ is even' }]
        - ['$\neg Q$', { fr: '« non $Q$ »', en: '“not $Q$”' }, { fr: '$n^2$ n’est pas pair, donc $n^2$ est impair', en: '$n^2$ is not even, so $n^2$ is odd' }]
      legende: { fr: 'Pour un entier, « non pair » et « impair » disent la même chose.', en: 'For an integer, “not even” and “odd” mean the same thing.' }
  - id: c2b
    type: idee
    fr: 'Pour **démontrer** $P\Rightarrow Q$ (« si $P$, alors $Q$ »), trois chemins sont valables. **Direct** : on part de $P$ et on arrive à $Q$. **Contraposée** : on prouve $\neg Q\Rightarrow\neg P$, qui dit la même chose. **Absurde** : on suppose $P$ et $\neg Q$, et on aboutit à une contradiction.'
    en: 'To **prove** $P\Rightarrow Q$ (“if $P$, then $Q$”), three paths are valid. **Direct**: start from $P$ and reach $Q$. **Contrapositive**: prove $\neg Q\Rightarrow\neg P$, which says the same thing. **Contradiction**: assume $P$ and $\neg Q$, then reach a contradiction.'
    figure:
      kind: schema
      lignes:
        - titre: { fr: 'Direct', en: 'Direct' }
          noeuds: [{ fr: 'on suppose $P$', en: 'assume $P$' }, { fr: 'raisonnement', en: 'reasoning' }, { fr: 'donc $Q$', en: 'so $Q$', ton: ok }]
        - titre: { fr: 'Contraposée', en: 'Contrapositive' }
          noeuds: [{ fr: 'on suppose $\neg Q$', en: 'assume $\neg Q$' }, { fr: 'raisonnement', en: 'reasoning' }, { fr: 'donc $\neg P$', en: 'so $\neg P$', ton: ok }]
        - titre: { fr: 'Par l’absurde', en: 'By contradiction' }
          noeuds: [{ fr: 'on suppose $P$ et $\neg Q$', en: 'assume $P$ and $\neg Q$' }, { fr: 'raisonnement', en: 'reasoning' }, { fr: 'contradiction !', en: 'contradiction!', ton: bad }]
      legende: { fr: 'Trois routes vers la même destination : $P\Rightarrow Q$ est démontré.', en: 'Three roads to the same destination: $P\Rightarrow Q$ is proved.' }
  - id: c3
    type: exemple
    titre: { fr: 'Preuve directe : additionner deux pairs', en: 'Direct proof: adding two even numbers' }
    etapes:
      - { fr: 'Soient $a=2u$ et $b=2v$, avec $u,v$ entiers : c’est la définition de deux nombres pairs.', en: 'Let $a=2u$ and $b=2v$, with integers $u,v$: this is the definition of two even numbers.' }
      - { fr: 'Alors $a+b=2u+2v=2(u+v)$.', en: 'Then $a+b=2u+2v=2(u+v)$.' }
      - { fr: '$u+v$ étant entier, la somme est paire, quels que soient ces deux nombres pairs.', en: 'Since $u+v$ is an integer, the sum is even, whichever two even numbers we chose.' }
  - id: d_p_direct
    type: piege
    fr: Calculer une somme particulière illustre la preuve. Seules les lettres représentant des entiers quelconques permettent ici de couvrir toutes les sommes.
    en: Calculating one particular sum illustrates the proof. Only letters representing arbitrary integers cover all sums here.
  - id: c4
    indice: { fr: 'Remplace $u$ et $v$ dans la formule $2(u+v)$, puis effectue la somme dans la parenthèse.', en: 'Replace $u$ and $v$ in the formula $2(u+v)$, then compute the sum in the parentheses.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans la preuve précédente, prends $u=4$ et $v=7$. Quel entier multiplie $2$ dans $a+b=2(u+v)$ ?'
    en: 'In the preceding proof, take $u=4$ and $v=7$. Which integer multiplies $2$ in $a+b=2(u+v)$?'
    reponses: ['11']
    verif: 'u,v=4,7; print(u+v)'
    explication: { fr: '$u+v=11$, donc la somme vaut $22$ ; ce calcul illustre la preuve générale.', en: '$u+v=11$, so the sum is $22$; this calculation illustrates the general proof.' }
  - id: c4b
    type: exemple
    titre: { fr: 'Contraposée : si $3n$ est impair, alors $n$ est impair', en: 'Contrapositive: if $3n$ is odd, then $n$ is odd' }
    etapes:
      - { fr: 'Prouver directement est maladroit : de « $3n$ impair », on ne sait pas écrire $n$. On prouve donc la contraposée : **si $n$ est pair, alors $3n$ est pair**.', en: 'A direct proof is awkward: from “$3n$ odd” we cannot write $n$. So we prove the contrapositive: **if $n$ is even, then $3n$ is even**.' }
      - { fr: 'Si $n$ est pair, $n=2k$ avec $k$ entier.', en: 'If $n$ is even, $n=2k$ with integer $k$.' }
      - { fr: 'Alors $3n=6k=2(3k)$ et $3k$ est entier : $3n$ est pair.', en: 'Then $3n=6k=2(3k)$ and $3k$ is an integer: $3n$ is even.' }
      - { fr: 'La contraposée est vraie, donc l’énoncé de départ aussi : les deux disent exactement la même chose.', en: 'The contrapositive is true, so the original statement is too: both say exactly the same thing.' }
  - id: d_contra
    type: exemple
    titre:
      fr: Voir le sens du passage
      en: Seeing the direction of the step
    etapes:
      - fr: Pour un entier pair, écrivons $n=2k$. Avec $k=6$, on obtient $n=12$.
        en: For an even integer, write $n=2k$. With $k=6$, we get $n=12$.
      - fr: $3n=36=2\times18$ reste pair. Le calcul illustre la contraposée, sans remplacer la preuve générale.
        en: $3n=36=2\times18$ remains even. The calculation illustrates the contrapositive without replacing the general proof.
    verif: print(3*(2*6))
    sortie: "36"
  - id: d_p_contra
    type: piege
    fr: Inverser les deux phrases ne suffit pas. La contraposée échange leur place et nie chacune ; la réciproque échange seulement leur place.
    en: Swapping the two statements is not enough. The contrapositive swaps and negates both; the converse only swaps them.
  - id: c5
    indice: { fr: 'Contraposée : on inverse hypothèse et conclusion, et on nie les deux.', en: 'Contrapositive: swap hypothesis and conclusion, and negate both.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Quelle est la contraposée de « si $n^2$ est pair, alors $n$ est pair », pour $n$ entier ?'
    en: 'What is the contrapositive of “if $n^2$ is even, then $n$ is even”, for integer $n$?'
    choix:
      - { fr: 'Si $n$ est pair, alors $n^2$ est pair.', en: 'If $n$ is even, then $n^2$ is even.' }
      - { fr: 'Si $n$ est impair, alors $n^2$ est impair.', en: 'If $n$ is odd, then $n^2$ is odd.', juste: true }
      - { fr: 'Si $n^2$ est impair, alors $n$ est impair.', en: 'If $n^2$ is odd, then $n$ is odd.' }
    explication: { fr: 'On échange hypothèse et conclusion en les niant toutes les deux ; la réciproque ne suffit pas.', en: 'Swap hypothesis and conclusion and negate both; the converse is not enough.' }
  - id: c6
    indice: { fr: 'Développe $(2k+1)^2$ puis cherche la forme « deux fois un entier plus un ».', en: 'Expand $(2k+1)^2$ then look for the form “twice an integer plus one”.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour finir cette contraposée, pose $n=2k+1$. Quelle écriture montre que $n^2$ est impair ?'
    en: 'To finish that contrapositive proof, set $n=2k+1$. Which expression shows that $n^2$ is odd?'
    choix:
      - { fr: '$2(2k^2+2k)+1$', en: '$2(2k^2+2k)+1$', juste: true }
      - { fr: '$2(k^2+k)$', en: '$2(k^2+k)$' }
      - { fr: '$4k^2+1$', en: '$4k^2+1$' }
    explication: { fr: 'Le développement donne $4k^2+4k+1$, soit deux fois un entier plus un.', en: 'Expanding gives $4k^2+4k+1$, which is twice an integer plus one.' }
  - id: c6b
    type: exemple
    titre: { fr: 'Par l’absurde : pas de plus petit rationnel strictement positif', en: 'By contradiction: no smallest positive rational' }
    etapes:
      - { fr: 'On suppose le contraire : il existe un plus petit rationnel $r>0$.', en: 'Assume the opposite: there is a smallest rational $r>0$.' }
      - { fr: 'Alors $\frac{r}{2}$ est aussi un rationnel, et $0<\frac{r}{2}<r$.', en: 'Then $\frac{r}{2}$ is also rational, and $0<\frac{r}{2}<r$.' }
      - { fr: 'On a trouvé un rationnel positif plus petit que « le plus petit » : **contradiction**.', en: 'We found a positive rational smaller than “the smallest”: **contradiction**.' }
      - { fr: 'L’hypothèse est donc fausse : aucun rationnel strictement positif n’est le plus petit.', en: 'So the assumption is false: no positive rational is the smallest.' }
  - id: d_absurde
    type: exemple
    titre:
      fr: Un candidat toujours battu
      en: A candidate that is always beaten
    etapes:
      - fr: Un rationnel est un quotient de deux entiers, avec un dénominateur non nul. Prenons le candidat positif $3/8$.
        en: A rational number is a quotient of two integers with a nonzero denominator. Take the positive candidate $3/8$.
      - fr: Sa moitié vaut $3/16$, encore positive et plus petite. Le même raisonnement marche pour tout candidat positif.
        en: Its half is $3/16$, still positive and smaller. The same reasoning works for every positive candidate.
    verif: |-
      from fractions import Fraction
      r=Fraction(3,8)
      assert 0<r/2<r
      print(r/2)
    sortie: 3/16
  - id: d_p_absurde
    type: piege
    fr: Une contradiction doit découler de l’hypothèse supposée. Un calcul faux ajouté au raisonnement ne constitue pas une preuve.
    en: A contradiction must follow from the assumed hypothesis. Adding an incorrect calculation does not make a proof.
  - id: c7
    indice: { fr: 'Si $M$ est le plus grand entier, regarde ce qui se passe quand on lui ajoute $1$.', en: 'If $M$ is the largest integer, look at what happens when you add $1$.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'On suppose qu’il existe un plus grand entier $M$. Quelle contradiction termine la preuve par l’absurde ?'
    en: 'Assume there is a greatest integer $M$. Which contradiction completes the proof?'
    choix:
      - { fr: '$M-1$ est plus petit que $M$.', en: '$M-1$ is smaller than $M$.' }
      - { fr: '$M$ est un entier.', en: '$M$ is an integer.' }
      - { fr: '$M+1$ est un entier plus grand que $M$.', en: '$M+1$ is an integer greater than $M$.', juste: true }
    explication: { fr: 'L’entier $M+1$ contredit la maximalité supposée de $M$ : il n’existe donc pas de plus grand entier.', en: 'The integer $M+1$ contradicts the assumed maximality of $M$, so there is no greatest integer.' }
  - id: c8
    indice: { fr: 'Teste les premiers entiers positifs un par un, en commençant par le plus petit.', en: 'Test the first positive integers one by one, starting with the smallest.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Quel est le plus petit entier positif qui réfute « $n^2>n$ pour tout entier positif $n$ » ?'
    en: 'What is the smallest positive integer refuting “$n^2>n$ for every positive integer $n$”?'
    reponses: ['1']
    verif: 'print(next(n for n in range(1,10) if not n*n > n))'
    explication: { fr: 'Pour $n=1$, le carré vaut $1$ : l’inégalité stricte échoue dès le premier entier positif.', en: 'For $n=1$, the square is $1$: the strict inequality fails at the first positive integer.' }
  - id: c9
    indice: { fr: 'Une preuve générale utilise une lettre, pas des exemples. Écris ce que veut dire « divisible par 6 ».', en: 'A general proof uses a letter, not examples. Write what “divisible by 6” means.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour prouver qu’un entier divisible par $6$ est pair, quelle démarche est directe et générale ?'
    en: 'To prove that an integer divisible by $6$ is even, which approach is direct and general?'
    choix:
      - { fr: 'Tester seulement $6$, $12$ et $18$.', en: 'Test only $6$, $12$ and $18$.' }
      - { fr: 'Écrire $n=6k=2(3k)$, avec $k$ entier.', en: 'Write $n=6k=2(3k)$, with integer $k$.', juste: true }
      - { fr: 'Supposer que tout entier pair est divisible par $6$.', en: 'Assume every even integer is divisible by $6$.' }
    explication: { fr: 'La définition de la divisibilité fournit $k$ ; $3k$ est entier, donc $n$ est pair.', en: 'The definition of divisibility supplies $k$; $3k$ is an integer, so $n$ is even.' }
  - id: c10
    indice: { fr: 'Teste les entiers pairs dans l’ordre : le premier qui n’est pas multiple de 6 convient.', en: 'Test the even integers in order: the first one that is not a multiple of 6 works.' }
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. La réciproque « tout entier positif pair est divisible par $6$ » est fausse. Donne son plus petit contre-exemple.'
    en: 'Challenge. The converse “every positive even integer is divisible by $6$” is false. Give its smallest counterexample.'
    reponses: ['2']
    verif: 'print(next(n for n in range(1,7) if n % 2 == 0 and n % 6 != 0))'
    explication: { fr: '$2$ est pair mais non divisible par $6$ ; une implication et sa réciproque sont différentes.', en: '$2$ is even but not divisible by $6$; an implication and its converse are different.' }
  - id: c11
    type: idee
    fr: 'Récap : Kintana doit distinguer une **preuve**, valable dans tout le domaine, d’un **calcul sur quelques exemples**. Choisis la méthode selon ce qui est le plus facile à écrire.'
    en: 'Recap: Kintana must distinguish a **proof**, valid throughout the domain, from **calculations on a few examples**. Choose the method by what is easiest to write.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Méthode', en: 'Method' }, { fr: 'On suppose', en: 'Assume' }, { fr: 'On montre', en: 'Show' }]
      cellules:
        - [{ fr: 'Directe', en: 'Direct' }, '$P$', '$Q$']
        - [{ fr: 'Contraposée', en: 'Contrapositive' }, '$\neg Q$', '$\neg P$']
        - [{ fr: 'Absurde', en: 'Contradiction' }, { fr: '$P$ et $\neg Q$', en: '$P$ and $\neg Q$' }, { fr: 'une contradiction', en: 'a contradiction' }]
        - [{ fr: 'Contre-exemple', en: 'Counterexample', ton: bad }, { fr: 'un cas précis', en: 'one specific case' }, { fr: 'la règle est **fausse**', en: 'the rule is **false**', ton: bad }]
      legende: { fr: 'Les trois premières lignes **démontrent** ; la dernière **réfute**.', en: 'The first three rows **prove**; the last one **refutes**.' }

  - id: d_lien
    type: idee
    fr: 'Tu sais démontrer une règle générale. Au niveau 0.3, tu verras la récurrence : elle la démontre pour une infinité de cas en deux temps.'
    en: 'You can prove a general rule. In level 0.3, you will see induction: it proves it for infinitely many cases in two steps.'
  - id: d_retenir
    type: retenir
    fr: Kintana justifie une règle et sait réfuter une généralisation abusive.
    en: Kintana justifies a rule and can refute an unjustified generalisation.
  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [Oscar Levin — Proofs](https://discrete.openmathbooks.org/dmoi3/sec_logic-proofs.html) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [Oscar Levin — Proofs](https://discrete.openmathbooks.org/dmoi3/sec_logic-proofs.html); this optional reading needs a connection.
