  - id: d_cout
    type: idee
    fr: 'Avec un tas, Dijkstra coûte $O((V+E)\log V)$ pour $V$ sommets et $E$ liens. Sans tas, chercher « le plus proche » à chaque tour coûterait bien davantage : le bon outil fait la différence.'
    en: 'With a heap, Dijkstra costs $O((V+E)\log V)$ for $V$ vertices and $E$ links. Without a heap, finding “the nearest” at every turn would cost much more: the right tool makes the difference.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Outil', en: 'Tool' }, { fr: 'Trouver le plus proche', en: 'Find the nearest' }]
      cellules:
        - [{ fr: 'parcourir toute la liste', en: 'scan the whole list' }, { fr: '$O(V)$ à chaque tour', en: '$O(V)$ per turn', ton: bad }]
        - [{ fr: 'tas (`heapq`)', en: 'heap (`heapq`)' }, { fr: '$O(\log V)$ à chaque tour', en: '$O(\log V)$ per turn', ton: ok }]
      legende: { fr: 'On retrouve les logarithmes du niveau 3.1 : une division par deux fait gagner des étapes.', en: 'We find the logarithms of level 3.1: halving saves steps.' }
  - id: c6
    type: code
    note: { kind: exercise, poids: 1 }
    fr: '**Écris `cout_chemin(g, chemin)`** : la somme des poids le long de la liste de sommets `chemin` (par exemple `["A", "C", "B"]`). Renvoie `None` si un lien n’existe pas.'
    en: '**Write `cout_chemin(g, chemin)`**: the sum of the weights along the list of vertices `chemin` (for example `["A", "C", "B"]`). Return `None` if a link does not exist.'
    depart: |
      # écris ta fonction cout_chemin ici
    tests: |
      g = {"A": {"B": 4, "C": 1}, "C": {"B": 2, "D": 7}, "B": {"D": 1}, "D": {}}
      assert cout_chemin(g, ["A", "C", "B"]) == 3
      assert cout_chemin(g, ["A", "C", "B", "D"]) == 4
      assert cout_chemin(g, ["A"]) == 0
      assert cout_chemin(g, ["A", "D"]) is None
    solutionCode: |
      def cout_chemin(g, chemin):
          total = 0
          for u, v in zip(chemin, chemin[1:]):
              if v not in g[u]:
                  return None
              total = total + g[u][v]
          return total
    indice: { fr: '`zip(chemin, chemin[1:])` donne chaque couple de sommets consécutifs. Teste l’existence du lien avant d’ajouter.', en: '`zip(chemin, chemin[1:])` gives each pair of consecutive vertices. Test the link exists before adding.' }
    explication: { fr: 'On vérifie un chemin avant de l’optimiser : un lien manquant rend le chemin invalide.', en: 'We check a path before optimising it: a missing link makes the path invalid.' }
  - id: d_lien
    type: idee
    fr: 'Le **BFS** du niveau 3.5 est un cas particulier de Dijkstra où **tous les poids valent 1**. Pour Kintana, un poids peut être un « coût de saut » entre deux documents : plus il est faible, plus ils sont proches.'
    en: 'The **BFS** from level 3.5 is a special case of Dijkstra where **all weights are 1**. For Kintana, a weight can be a “jump cost” between two documents: the lower it is, the closer they are.'
    exemple: { fr: 'Deux documents très liés ont un lien de poids 1 ; deux documents éloignés, un lien de poids 8. Dijkstra trouve la suite de documents la plus proche entre deux sujets.', en: 'Two closely related documents have a link of weight 1; two distant ones, weight 8. Dijkstra finds the closest chain of documents between two topics.' }
  - id: c7
    type: code
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. **Écris `plus_proche(g, depart, cible)`** : le **chemin** le moins coûteux (liste de sommets) de `depart` à `cible`, ou `None` si `cible` est inatteignable. Garde un dictionnaire `precedent` pour le reconstruire.'
    en: 'Challenge. **Write `plus_proche(g, depart, cible)`**: the cheapest **path** (list of vertices) from `depart` to `cible`, or `None` if `cible` is unreachable. Keep a `precedent` dictionary to rebuild it.'
    depart: |
      import heapq

      # écris ta fonction plus_proche ici
    tests: |
      g = {"A": {"B": 4, "C": 1}, "C": {"B": 2, "D": 7}, "B": {"D": 1}, "D": {}, "Z": {}}
      assert plus_proche(g, "A", "D") == ["A", "C", "B", "D"]
      assert plus_proche(g, "A", "A") == ["A"]
      assert plus_proche(g, "A", "Z") is None
      assert plus_proche(g, "C", "D") == ["C", "B", "D"]
    solutionCode: |
      import heapq

      def plus_proche(g, depart, cible):
          dist = {depart: 0}
          precedent = {}
          tas = [(0, depart)]
          while tas:
              d, u = heapq.heappop(tas)
              if d > dist[u]:
                  continue
              for v, w in g[u].items():
                  if d + w < dist.get(v, float("inf")):
                      dist[v] = d + w
                      precedent[v] = u
                      heapq.heappush(tas, (d + w, v))
          if cible not in dist:
              return None
          chemin = [cible]
          while chemin[-1] != depart:
              chemin.append(precedent[chemin[-1]])
          return chemin[::-1]
    indice: { fr: 'À chaque mise à jour de `dist[v]`, note aussi `precedent[v] = u`. Reconstruis en remontant de `cible` à `depart`, puis inverse la liste.', en: 'At each update of `dist[v]`, also record `precedent[v] = u`. Rebuild by walking back from `cible` to `depart`, then reverse the list.' }
    explication: { fr: 'On retrouve le chemin en remontant les « précédents » : c’est l’arbre des plus courts chemins.', en: 'We recover the path by walking back through the “predecessors”: this is the tree of shortest paths.' }
