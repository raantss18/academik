    type: plus
    fr: Pour approfondir, consulte [scikit-learn — Métriques de classification](https://scikit-learn.org/stable/modules/model_evaluation.html) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [scikit-learn — Classification metrics](https://scikit-learn.org/stable/modules/model_evaluation.html); this optional reading needs a connection.
