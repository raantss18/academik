# Niveau 2.1 — Python 1. Sources : cours maison M1-info-Ankatso (chap. 3), mis à jour avec la documentation Python 3.14
# (f-strings : https://docs.python.org/3/tutorial/inputoutput.html). Original academik.
id: "2.1"
module: 2
duree_min: 11
titre: { fr: "Kintana dit bonjour", en: "Kintana says hello" }
ia:
  fr: "Kintana sait maintenant afficher un message et le personnaliser avec un
    prénom."
  en: "Kintana can now display a message and personalise it with a first name."
sources:
  - titre: Python — Identifiants et mots réservés
    url: https://docs.python.org/3/reference/lexical_analysis.html#identifiers
    licence: PSF
  - titre: Python — Introduction, nombres et chaînes
    url: https://docs.python.org/3/tutorial/introduction.html
    licence: PSF
  - {
      titre: "Python Tutorial — Input and Output",
      url: "https://docs.python.org/3/tutorial/inputoutput.html",
      licence: "PSF"
    }
cartes:
  - id: c1
    indice: { fr: 'Python affiche avec une fonction. Le texte à afficher va entre guillemets.', en: 'Python displays with a function. The text to display goes in quotes.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: "Ton assistant Kintana doit afficher **Bonjour Rakoto** à l'écran. Quelle
      ligne de Python fait ça ?"
    en: "Your assistant Kintana must display **Hello Rakoto** on screen. Which line
      of Python does that?"
    choix:
      - {
          fr: '`print("Bonjour Rakoto")`',
          en: '`print("Hello Rakoto")`',
          juste: true
        }
      - { fr: '`echo Bonjour Rakoto`', en: '`echo Hello Rakoto`' }
      - { fr: '`say("Bonjour Rakoto")`', en: '`say("Hello Rakoto")`' }
      - { fr: '`Bonjour Rakoto`', en: '`Hello Rakoto`' }
    explication:
      fr: "`print(...)` affiche ce qu'on lui donne. Le texte se met entre guillemets.
        `echo` existe dans le terminal, pas en Python."
      en: "`print(...)` displays what you give it. Text goes between quotes. `echo`
        exists in the terminal, not in Python."

  - id: c2
    type: idee
    fr: 'Une **variable** est une étiquette collée sur une valeur. Les **guillemets** disent « ceci est du texte » ; sans guillemets, Python cherche une variable de ce nom.'
    en: 'A **variable** is a label stuck on a value. **Quotes** say “this is text”; without quotes, Python looks for a variable with that name.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Ligne', en: 'Line' }, { fr: 'Python comprend', en: 'Python understands' }, { fr: 'À l’écran', en: 'On screen' }]
      cellules:
        - ['`ville = "Tana"`', { fr: 'colle l’étiquette `ville` sur le texte `Tana`', en: 'sticks the label `ville` on the text `Tana`' }, { fr: '(rien)', en: '(nothing)' }]
        - ['`print(ville)`', { fr: 'la valeur de la variable `ville`', en: 'the value of the variable `ville`' }, { fr: '`Tana`', en: '`Tana`', ton: ok }]
        - ['`print("ville")`', { fr: 'le texte `ville` lui-même', en: 'the text `ville` itself' }, { fr: '`ville`', en: '`ville`', ton: bad }]
      legende: { fr: 'Deux guillemets changent tout : variable ou texte.', en: 'Two quotes change everything: variable or text.' }
  - id: c3
    type: exemple
    titre:
      {
        fr: "Exemple résolu : saluer quelqu'un",
        en: "Worked example: greet someone"
      }
    etapes:
      - {
          code: 'nom = "Rakoto"',
          fr: "On crée la variable `nom`.",
          en: "We create the variable `nom`."
        }
      - {
          code: 'print("Bonjour", nom)',
          fr: "`print` accepte plusieurs valeurs, séparées par un espace. Affiche :
            `Bonjour Rakoto`.",
          en: "`print` accepts several values, separated by a space. Shows: `Bonjour
            Rakoto`."
        }
      - {
          code: 'print(f"Bonjour {nom} !")',
          fr: "Une **f-string** (le `f` devant les guillemets) remplace `{nom}` par sa
            valeur. Affiche : `Bonjour Rakoto !`.",
          en: "An **f-string** (the `f` before the quotes) replaces `{nom}` with its
            value. Shows: `Bonjour Rakoto !`."
        }

  - id: c3b
    type: retenir
    fr: "`=` **range** une valeur dans une variable. Ce n'est pas le signe « égale »
      des maths : `x = x + 2` est une instruction, pas une équation."
    en: "`=` **stores** a value in a variable. It is not the “equals” sign of maths:
      `x = x + 2` is an instruction, not an equation."

  - id: d_assignment
    type: idee
    fr: Une affectation associe un nom à une valeur avec `=`. Python calcule d’abord la partie droite, puis associe le résultat au nom de gauche.
    en: An assignment associates a name with a value using `=`. Python first evaluates the right side, then associates the result with the name on the left.
  - id: d_update
    type: exemple
    titre:
      fr: Suivre une valeur qui change
      en: Tracking a changing value
    etapes:
      - fr: Au départ, `stock` désigne neuf.
        en: Initially, `stock` refers to nine.
        code: stock = 9
      - fr: Python calcule neuf plus quatre, puis associe treize à `stock`.
        en: Python computes nine plus four, then associates thirteen with `stock`.
        code: stock = stock + 4
      - fr: L’affichage donne `13`. Une affectation seule n’affiche rien.
        en: The output is `13`. An assignment alone displays nothing.
        code: print(stock)
    verif: |-
      stock=9
      stock=stock+4
      print(stock)
    sortie: "13"
    figure:
      kind: tableau
      entetes: [{fr: Étape, en: Step}, {fr: Valeur de stock, en: Value of stock}]
      cellules:
        - ['`stock = 9`', '9']
        - ['`stock = stock + 4`', '13']
        - ['`print(stock)`', '13']
      legende: {fr: L’affectation change la valeur ; l’affichage la conserve., en: Assignment changes the value; printing preserves it.}
  - id: d_p_update
    type: piege
    fr: Lire un nom avant de lui attribuer une valeur provoque une erreur. Python ne devine pas la valeur initiale.
    en: Reading a name before assigning it a value causes an error. Python does not guess the initial value.
  - id: c4
    indice: { fr: 'Sans guillemets, `age` est une variable : remplace-la par sa valeur, puis calcule.', en: 'Without quotes, `age` is a variable: replace it by its value, then compute.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: "Après `age = 15`, qu'affiche `print(age + 1)` ?"
    en: "After `age = 15`, what does `print(age + 1)` display?"
    verif: "age = 15\nprint(age + 1)"
    sortie: "16"
    choix:
      - { fr: "16", en: "16", juste: true }
      - { fr: "age + 1", en: "age + 1" }
      - { fr: "15", en: "15" }
      - { fr: "Une erreur", en: "An error" }
    explication:
      fr: "`age` vaut 15, donc `age + 1` vaut 16. Sans guillemets, `age` est une
        variable, pas du texte."
      en: "`age` is 15, so `age + 1` is 16. Without quotes, `age` is a variable, not
        text."

  - id: c5
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: "Qu'affiche ce programme ?

      ```python

      x = 3

      x = x + 2

      print(x)

      ```"
    en: "What does this program display?

      ```python

      x = 3

      x = x + 2

      print(x)

      ```"
    verif: "x = 3\nx = x + 2\nprint(x)"
    reponses: [ "5" ]
    indice:
      fr: "Lis ligne par ligne : à droite du `=`, on calcule avec l'ancienne valeur de
        `x`."
      en: "Read line by line: right of the `=`, we compute with the old value of `x`."
    explication:
      fr: "`x` vaut 3, puis `x + 2` vaut 5 et devient la nouvelle valeur de `x`. `=`
        signifie « range dans », pas « égale »."
      en: "`x` is 3, then `x + 2` is 5 and becomes the new value of `x`. `=` means
        “store in”, not “equals”."

  - id: c5b
    type: piege
    fr: "Les guillemets font toute la différence : `print(nom)` affiche **la
      valeur** de la variable, `print(\"nom\")` affiche **le mot** nom."
    en: "Quotes make all the difference: `print(nom)` displays the variable's
      **value**, `print(\"nom\")` displays the **word** nom."

  - id: d_fstring
    type: idee
    fr: Une chaîne est une valeur textuelle. Dans une chaîne précédée de `f`, les accolades délimitent une expression à calculer et à insérer.
    en: A string is a text value. In a string prefixed with `f`, braces surround an expression to evaluate and insert.
  - id: d_format
    type: exemple
    titre:
      fr: Composer un état de Kintana
      en: Composing a Kintana status
    etapes:
      - fr: "Stockons le nombre de documents : six."
        en: "Store the document count: six."
        code: documents = 6
      - fr: Les accolades insèrent le résultat de six plus deux. Le texte affiche `8 documents`.
        en: The braces insert the result of six plus two. The text displays `8 documents`.
        code: print(f"{documents + 2} documents")
    verif: |-
      documents=6
      print(f"{documents + 2} documents")
    sortie: 8 documents
  - id: d_p_format
    type: piege
    fr: Sans le préfixe `f`, les accolades restent du texte. `"{documents}"` ne remplace pas le nom par sa valeur.
    en: Without the `f` prefix, braces remain text. `"{documents}"` does not replace the name with its value.
  - id: c6
    indice: { fr: 'Qu’est-ce qui doit exister avant de pouvoir être utilisé ? Commence par cette ligne.', en: 'What must exist before it can be used? Start with that line.' }
    type: parsons
    note: { kind: exercise, poids: 1 }
    fr: "Remets ces lignes dans l'ordre pour afficher `Bonjour Soa`."
    en: "Put these lines in order to display `Bonjour Soa`."
    lignes: [ 'nom = "Soa"', 'message = f"Bonjour {nom}"', 'print(message)' ]
    verif: "nom = \"Soa\"

      message = f\"Bonjour {nom}\"

      print(message)"
    sortie: "Bonjour Soa"
    explication:
      fr: "Une variable doit exister avant d'être utilisée : `nom`, puis `message` qui
        s'en sert, puis l'affichage."
      en: "A variable must exist before it is used: `nom`, then `message` which uses
        it, then the display."

  - id: d_names
    type: idee
    fr: Pour un nom simple, utilise des lettres, des chiffres et le soulignement `_`. Ne commence pas par un chiffre ; évite les mots réservés.
    en: For a simple name, use letters, digits and underscore `_`. Do not start with a digit; avoid reserved words.
  - id: d_names_example
    type: exemple
    titre:
      fr: Nommer un compteur
      en: Naming a counter
    etapes:
      - fr: "`total_2` est un nom valide : la première lettre n’est pas un chiffre."
        en: "`total_2` is a valid name: the first character is not a digit."
        code: total_2 = 8
      - fr: "`print(total_2)` affiche huit. `2total` ne serait pas un nom valide ; `total-2` serait une soustraction."
        en: "`print(total_2)` displays eight. `2total` would not be a valid name; `total-2` would be subtraction."
        code: print(total_2)
    verif: |-
      total_2=8
      print(total_2)
    sortie: "8"
  - id: c7
    indice: { fr: 'Un nom ne commence pas par un chiffre et n’a ni tiret ni espace. Teste chaque proposition.', en: 'A name does not start with a digit and has no dash or space. Test each option.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: "Lequel de ces noms est un nom de variable **valide** ?"
    en: "Which of these is a **valid** variable name?"
    choix:
      - { fr: "`nom_1`", en: "`name_1`", juste: true }
      - { fr: "`1nom`", en: "`1name`" }
      - { fr: "`mon-nom`", en: "`my-name`" }
      - { fr: "`class`", en: "`class`" }
    explication:
      fr: "Un nom ne commence pas par un chiffre, ne contient ni tiret ni espace, et
        ne peut pas être un mot réservé comme `class`."
      en: "A name cannot start with a digit, contain a hyphen or a space, or be a
        reserved word like `class`."

  - id: c8
    indice: { fr: 'Dans une f-string, Python calcule ce qui est entre accolades. Écris ensuite le texte entier.', en: 'In an f-string, Python computes what is between braces. Then write the whole text.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: "Qu'affiche `print(f\"{2 + 3} ans\")` ? (écris exactement ce qui s'affiche)"
    en: "What does `print(f\"{2 + 3} ans\")` display? (write exactly what is
      displayed)"
    verif: "print(f\"{2 + 3} ans\")"
    reponses: [ "5 ans" ]
    explication:
      fr: "Dans une f-string, ce qui est entre accolades est **calculé** : `2 + 3`
        donne 5."
      en: "In an f-string, what is between braces is **computed**: `2 + 3` gives 5."

  - id: c9
    indice: { fr: 'Quel signe demande à Python de mettre la valeur d’une variable dans un texte ?', en: 'Which sign asks Python to put a variable’s value into a text?' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: "Complète : `prenom = \"Hery\"` puis `print(f\"Salut ___\")` pour afficher
      `Salut Hery`."
    en: "Complete: `prenom = \"Hery\"` then `print(f\"Salut ___\")` to display
      `Salut Hery`."
    verif: "prenom = \"Hery\"

      print(f\"Salut {prenom}\")"
    sortie: "Salut Hery"
    choix:
      - { fr: "`{prenom}`", en: "`{prenom}`", juste: true }
      - { fr: "`prenom`", en: "`prenom`" }
      - { fr: "`\"prenom\"`", en: "`\"prenom\"`" }
      - { fr: "`(prenom)`", en: "`(prenom)`" }
    explication:
      fr: "Les accolades `{}` demandent à Python de mettre la **valeur** de la
        variable. Sans elles, on écrirait le mot `prenom`."
      en: "Braces `{}` ask Python to insert the variable's **value**. Without them, we
        would write the word `prenom`."

  - id: c10
    indice: { fr: 'Les guillemets rendent le texte littéral. Que contiennent-ils exactement ?', en: 'Quotes make the text literal. What exactly do they contain?' }
    type: saisie
    note: { kind: quiz, poids: 1 }
    fr: "Récap. Avec `nom = \"Soa\"`, qu'affiche `print(\"nom\")` ?"
    en: "Recap. With `nom = \"Soa\"`, what does `print(\"nom\")` display?"
    verif: "nom = \"Soa\"\nprint(\"nom\")"
    reponses: [ "nom" ]
    explication:
      fr: "Entre guillemets, c'est du texte : Python affiche les lettres `nom`.
        `print(nom)` afficherait `Soa`."
      en: "Between quotes it is text: Python displays the letters `nom`. `print(nom)`
        would display `Soa`."

  - id: d_types
    type: idee
    fr: "Le type d’une valeur indique sa nature. `+` additionne des nombres, mais concatène des chaînes : il colle leurs caractères."
    en: "A value’s type indicates its kind. `+` adds numbers but concatenates strings: it joins their characters."
  - id: d_join
    type: exemple
    titre:
      fr: Deux sens pour le même signe
      en: Two meanings for the same sign
    etapes:
      - fr: Avec des nombres, huit plus quatre donne douze.
        en: With numbers, eight plus four gives twelve.
        code: print(8 + 4)
      - fr: "Avec des chaînes, les caractères se suivent : le résultat est `84`."
        en: "With strings, the characters follow each other: the result is `84`."
        code: print("8" + "4")
    verif: |-
      print(8+4)
      print("8"+"4")
    sortie: |-
      12
      84
  - id: d_p_types
    type: piege
    fr: Un chiffre entre guillemets fait partie d’une chaîne. Python ne le transforme pas automatiquement en nombre pour une addition.
    en: A digit inside quotes belongs to a string. Python does not automatically turn it into a number for addition.
  - id: c11
    indice: { fr: 'Les guillemets autour de `2` et de `3` en font du texte. Que fait `+` sur du texte ?', en: 'The quotes around `2` and `3` make them text. What does `+` do on text?' }
    type: qcm
    note: { kind: quiz, poids: 1 }
    defi: true
    fr: "Défi. Qu'affiche ce programme ?

      ```python

      a = \"2\"

      b = \"3\"

      print(a + b)

      ```"
    en: "Challenge. What does this program display?

      ```python

      a = \"2\"

      b = \"3\"

      print(a + b)

      ```"
    verif: "a = \"2\"\nb = \"3\"\nprint(a + b)"
    sortie: "23"
    choix:
      - { fr: "23", en: "23", juste: true }
      - { fr: "5", en: "5" }
      - { fr: "\"2\" + \"3\"", en: "\"2\" + \"3\"" }
      - { fr: "Une erreur", en: "An error" }
    explication:
      fr: "Entre guillemets, `\"2\"` est du **texte**. Pour du texte, `+` colle les
        morceaux : `\"2\" + \"3\"` donne `23`."
      en: "In quotes, `\"2\"` is **text**. For text, `+` glues the pieces together:
        `\"2\" + \"3\"` gives `23`."

  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [Python — Identifiants et mots réservés](https://docs.python.org/3/reference/lexical_analysis.html#identifiers) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [Python — Identifiants et mots réservés](https://docs.python.org/3/reference/lexical_analysis.html#identifiers); this optional reading needs a connection.
