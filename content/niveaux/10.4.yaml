    type: plus
    fr: 'Pour approfondir, consulte [Forecasting: Principles and Practice — Modèles autorégressifs](https://otexts.com/fpp3/AR.html) ; cette lecture complémentaire demande une connexion.'
    en: 'For further study, see [Forecasting: Principles and Practice — Autoregressive models](https://otexts.com/fpp3/AR.html); this optional reading needs a connection.'
