# Niveau 19.2 — Sécurité 2 : hachage, HMAC, mots de passe, échange de clés. Original academik ; notions vérifiées dans NIST FIPS 203, Menezes et al. (HAC, cité) et la documentation Python (hashlib, hmac, secrets). Approche défensive.
