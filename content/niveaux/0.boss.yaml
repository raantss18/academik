id: '0.boss'
module: 0
duree_min: 15
titre: { fr: 'Le message secret', en: 'The secret message' }
ia: { fr: 'Kintana sait chiffrer et déchiffrer un message (César, affine).', en: 'Kintana can encrypt and decrypt a message (Caesar and affine ciphers).' }
objectifs:
  - { fr: 'chiffrer un message par César ou affine', en: 'encrypt a message with Caesar or affine' }
  - { fr: 'déchiffrer avec l''inverse modulaire', en: 'decrypt with the modular inverse' }
  - { fr: 'repérer des étiquettes trop courtes', en: 'spot labels that are too short' }
sources:
  - titre: MIT — Pigeonhole Principle (2024)
    url: https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/mit18_200_s24_lec01_pdf/
    licence: CC BY-NC-SA 4.0 ; référence seulement
  - titre: Oscar Levin — Mathematical Statements
    url: https://discrete.openmathbooks.org/dmoi3/sec_intro-statements.html
    licence: CC BY-SA 4.0
  - titre: Oscar Levin — Induction
    url: https://discrete.openmathbooks.org/dmoi3/sec_seq-induction.html
    licence: CC BY-SA 4.0
  - { titre: 'COMIMa — Chapitres 0, 1, 3 et 5 : contre-exemples, récurrence, tiroirs et congruences', url: 'https://www.comima.mg', licence: 'Textes Antsa : autorisation du 2026-11-01 ; tiers exclus' }
  - { titre: 'Szabolcs Tengely — Classical ciphers, Université de Debrecen', url: 'https://shrek.unideb.hu/~tengely/crypto/section-2.html', licence: 'Licence non vérifiée : référence en lien seulement, aucun extrait repris' }
cartes:
  - id: c1
    indice: { fr: 'Le contraire de « chaque » est « au moins une… ne pas ». Lis chaque réponse avec cette règle.', en: 'The opposite of “each” is “at least one… not”. Read each answer with this rule.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana teste ses clés de chiffrement. Quelle est la négation de « chaque clé testée permet de retrouver le message » ?'
    en: 'Kintana tests its encryption keys. What is the negation of “every tested key allows the message to be recovered”?'
    choix:
      - { fr: 'Aucune clé testée ne permet de le retrouver.', en: 'No tested key allows recovery.' }
      - { fr: 'Au moins une clé testée ne permet pas de le retrouver.', en: 'At least one tested key does not allow recovery.', juste: true }
      - { fr: 'Au moins une clé testée permet de le retrouver.', en: 'At least one tested key allows recovery.' }
    explication: { fr: 'Un seul échec réfute « chaque » ; les autres clés peuvent fonctionner.', en: 'A single failure refutes “every”; the other keys may work.' }
  - id: c2
    type: idee
    fr: 'Pour calculer sur des lettres, on les numérote : $A=0$, $B=1$, …, $Z=25$. Ici on utilise seulement A à Z, sans accents ni espaces, et on compte **modulo $26$**.'
    en: 'To compute with letters, we number them: $A=0$, $B=1$, …, $Z=25$. Here we use only A to Z, without accents or spaces, and we count **modulo $26$**.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Lettres', en: 'Letters' }, { fr: 'Positions', en: 'Positions' }]
      cellules:
        - ['A B C D E F G', '0 1 2 3 4 5 6']
        - ['H I J K L M', '7 8 9 10 11 12']
        - ['N O P Q R S T', '13 14 15 16 17 18 19']
        - ['U V W X Y Z', '20 21 22 23 24 25']
      legende: { fr: 'Après Z, on revient à A : $25+1\equiv0\pmod{26}$.', en: 'After Z we go back to A: $25+1\equiv0\pmod{26}$.' }
  - id: d_caesar
    type: idee
    fr: Un décalage avance chaque lettre du même nombre de positions. Pour revenir au départ, on recule de ce nombre, en bouclant sur l’alphabet.
    en: A shift moves every letter forward by the same number of positions. To return, move back by that number, wrapping around the alphabet.
  - id: d_shift
    type: exemple
    titre:
      fr: Passer la fin de l’alphabet
      en: Passing the end of the alphabet
    etapes:
      - fr: Avec un décalage de six, X part de la position $23$.
        en: With a shift of six, X starts at position $23$.
      - fr: "$23+6=29$ laisse le reste $3$ modulo $26$ : X devient D."
        en: "$23+6=29$ leaves remainder $3$ modulo $26$: X becomes D."
      - fr: "Pour revenir, $3-6=-3$ laisse le reste $23$ : D redevient X."
        en: "To return, $3-6=-3$ leaves remainder $23$: D becomes X."
    verif: print((23+6)%26,(3-6)%26)
    sortie: 3 23
  - id: d_p_shift
    type: piege
    fr: La position de A est zéro, pas un. Décaler un numéro de position erroné donne une autre lettre.
    en: The position of A is zero, not one. Shifting an incorrect position gives a different letter.
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Avec A = 0, B = 1, C = 2, quelle est la position de la lettre D ?'
    en: 'With A = 0, B = 1, C = 2, what is the position of the letter D?'
    choix:
      - { fr: '3', en: '3', juste: true }
      - { fr: '4', en: '4' }
      - { fr: '2', en: '2' }
    explication: { fr: 'On compte à partir de zéro : A=0, B=1, C=2, D=3.', en: 'We count from zero: A=0, B=1, C=2, D=3.' }
    indice: { fr: 'La position de A est zéro, pas un.', en: 'The position of A is zero, not one.' }
  - id: c2a
    type: idee
    fr: '**César** ajoute une clé $k$ à chaque position ; on déchiffre en soustrayant $k$. **Affine** calcule $y\equiv ax+b$ ; on déchiffre avec $x\equiv a^{-1}(y-b)$, possible seulement si $a$ et $26$ n’ont pas de diviseur commun autre que $1$.'
    en: '**Caesar** adds a key $k$ to each position; we decrypt by subtracting $k$. **Affine** computes $y\equiv ax+b$; we decrypt with $x\equiv a^{-1}(y-b)$, possible only if $a$ and $26$ have no common divisor other than $1$.'
    figure:
      kind: schema
      lignes:
        - titre: { fr: 'César, $k=3$', en: 'Caesar, $k=3$' }
          noeuds: ['B = $1$', '$1+3=4$', { fr: 'E', en: 'E', ton: ok }]
        - titre: { fr: 'Affine, $a=3$, $b=1$', en: 'Affine, $a=3$, $b=1$' }
          noeuds: ['B = $1$', '$3\times1+1=4$', { fr: 'E', en: 'E', ton: ok }]
        - titre: { fr: 'Déchiffrer l’affine ($3^{-1}=9$, car $27\equiv1$)', en: 'Decrypt the affine ($3^{-1}=9$, since $27\equiv1$)' }
          noeuds: ['E = $4$', '$9(4-1)=27\equiv1$', { fr: 'B', en: 'B', ton: ok }]
      legende: { fr: 'Ces chiffrements historiques servent à apprendre : ils ne protègent pas de vrais secrets.', en: 'These historical ciphers are for learning: they do not protect real secrets.' }
  - id: c3
    type: exemple
    titre: { fr: 'Essai sur une lettre', en: 'A one-letter trial' }
    etapes:
      - { fr: 'Pour C, on part de $x=2$ ; César avec $k=4$ donne $y=6$, donc G.', en: 'For C, start with $x=2$; Caesar with $k=4$ gives $y=6$, hence G.' }
      - { fr: 'Avec la clé affine $a=5,b=7$, C donne $y=17$, donc R.', en: 'With affine key $a=5,b=7$, C gives $y=17$, hence R.' }
      - { fr: 'L’inverse de $5$ est $21$ : depuis R, $21(17-7)=210\equiv2\pmod{26}$ redonne C.', en: 'The inverse of $5$ is $21$: from R, $21(17-7)=210\equiv2\pmod{26}$ recovers C.' }
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour déchiffrer un message chiffré par César avec la clé 3, que fait-on ?'
    en: 'To decrypt a message encrypted by Caesar with key 3, what do we do?'
    choix:
      - { fr: 'On recule chaque lettre de 3 positions', en: 'We move each letter back by 3 positions', juste: true }
      - { fr: 'On avance chaque lettre de 3 positions', en: 'We move each letter forward by 3 positions' }
      - { fr: 'On ne change rien', en: 'We change nothing' }
    explication: { fr: 'Déchiffrer défait le chiffrement : on soustrait la clé, en bouclant sur l’alphabet.', en: 'Decrypting undoes the encryption: we subtract the key, wrapping around the alphabet.' }
    indice: { fr: 'Déchiffrer fait l’opération inverse de chiffrer.', en: 'Decrypting does the inverse of encrypting.' }
  - id: d_affine_words
    type: idee
    fr: Le chiffrement affine multiplie la position, puis ajoute un décalage. Le déchiffrement soustrait ce décalage, puis multiplie par l’inverse modulaire.
    en: Affine encryption multiplies the position, then adds a shift. Decryption subtracts that shift, then multiplies by the modular inverse.
  - id: d_affine_steps
    type: exemple
    titre:
      fr: Faire puis défaire
      en: Doing and undoing
    etapes:
      - fr: "Prenons une autre clé : multiplier par sept, puis ajouter deux. La lettre F a la position cinq."
        en: "Take another key: multiply by seven, then add two. Letter F has position five."
      - fr: $7\times5+2=37$ laisse $11$, donc F devient L.
        en: $7\times5+2=37$ leaves $11$, so F becomes L.
      - fr: "$7\\times15=105$ laisse un : quinze inverse sept. Pour L, $15(11-2)=135$ laisse cinq, donc F."
        en: "$7\\times15=105$ leaves one: fifteen inverts seven. For L, $15(11-2)=135$ leaves five, hence F."
    verif: print((7*5+2)%26,(7*15)%26,(15*(11-2))%26)
    sortie: 11 1 5
  - id: d_p_affine
    type: piege
    fr: Multiplier avant de retirer le décalage change le calcul. Il faut défaire la dernière opération en premier.
    en: Multiplying before removing the shift changes the calculation. Undo the last operation first.
  - id: c4
    indice: { fr: 'Cherche deux positions dont les doubles sont égaux modulo 26.', en: 'Look for two positions whose doubles are equal modulo 26.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Kintana affirme que $x\mapsto2x$ modulo $26$ permet toujours de retrouver une lettre. Quelle paire de positions différentes réfute cette affirmation en donnant la même sortie ?'
    en: 'Kintana claims that $x\mapsto2x$ modulo $26$ always allows a letter to be recovered. Which pair of different positions refutes this claim by giving the same output?'
    choix:
      - { fr: '$0$ et $1$', en: '$0$ and $1$' }
      - { fr: '$1$ et $2$', en: '$1$ and $2$' }
      - { fr: '$0$ et $13$', en: '$0$ and $13$', juste: true }
    verif: "pairs=[(0,1),(1,2),(0,13)]\nprint(next(f'{x},{y}' for x,y in pairs if (2*x)%26==(2*y)%26))"
    sortie: '0,13'
    explication: { fr: '$2\times0\equiv2\times13\equiv0\pmod{26}$ : une même sortie correspond à A et N ; c’est un contre-exemple à l’unicité du déchiffrement.', en: '$2\times0\equiv2\times13\equiv0\pmod{26}$: the same output corresponds to A and N; this is a counterexample to unique decryption.' }
  - id: d_collision
    type: exemple
    titre:
      fr: Deux entrées, une sortie
      en: Two inputs, one output
    etapes:
      - fr: Avec la règle « multiplier par treize modulo vingt-six », B a pour entrée un, et D a pour entrée trois.
        en: With the rule “multiply by thirteen modulo twenty-six”, B has input one and D has input three.
      - fr: "$13\\times1=13$ et $13\\times3=39$ ont le même reste : treize. La sortie N ne distingue plus B et D."
        en: "$13\\times1=13$ and $13\\times3=39$ have the same remainder: thirteen. Output N no longer distinguishes B from D."
    verif: print(13%26,39%26)
    sortie: 13 13
  - id: d_p_collision
    type: piege
    fr: Retrouver une lettre pour un exemple ne garantit pas que la clé fonctionne pour tout l’alphabet. Un seul doublon suffit à réfuter cette garantie.
    en: Recovering one example letter does not guarantee that the key works for the entire alphabet. One collision refutes that guarantee.
  - id: c5
    indice: { fr: 'Une récurrence garde les $n$ lettres déjà bonnes et traite **une** lettre de plus avec la règle de déchiffrement.', en: 'An induction keeps the $n$ letters already right and handles **one** more letter with the decryption rule.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour César, $P(n)$ signifie « chiffrer puis déchiffrer les $n$ premières lettres les restitue ». $P(0)$ est vrai pour le message vide : quel passage justifie la récurrence ?'
    en: 'For Caesar, $P(n)$ means “encrypting then decrypting the first $n$ letters recovers them”. $P(0)$ holds for the empty message: which step justifies induction?'
    choix:
      - { fr: 'Supposer que le message entier est déjà restitué.', en: 'Assume that the entire message is already recovered.' }
      - { fr: 'Conserver les $n$ lettres restituées et utiliser $(x+k)-k\equiv x$ pour la suivante.', en: 'Keep the $n$ recovered letters and use $(x+k)-k\equiv x$ for the next one.', juste: true }
      - { fr: 'Vérifier seulement un message de deux lettres.', en: 'Check only one two-letter message.' }
    explication: { fr: 'Chaque lettre est traitée indépendamment ; l’hypothèse conserve le préfixe et l’identité restitue la lettre suivante, pour tout $n\geq0$.', en: 'Each letter is processed independently; the hypothesis preserves the prefix and the identity recovers the next letter, for every $n\geq0$.' }
  - id: d_prefix
    type: idee
    fr: Un préfixe est le début d’un message. La récurrence conserve les lettres déjà retrouvées et justifie la restitution de la suivante.
    en: A prefix is the beginning of a message. Induction preserves the letters already recovered and justifies recovering the next.
  - id: d_prefix_example
    type: exemple
    titre:
      fr: Allonger un préfixe
      en: Extending a prefix
    etapes:
      - fr: Avec un décalage de six, HI devient NO. H est la position sept ; I est la position huit.
        en: With a shift of six, HI becomes NO. H is position seven; I is position eight.
      - fr: Retirer six à N retrouve H. Retirer six à O retrouve I sans changer H.
        en: Subtracting six from N recovers H. Subtracting six from O recovers I without changing H.
      - fr: Ce calcul illustre le passage. La preuve générale repose sur ajouter puis soustraire la même clé pour chaque lettre.
        en: This calculation illustrates the step. The general proof relies on adding and subtracting the same key for each letter.
    verif: print((7+6)%26,(8+6)%26,(13-6)%26,(14-6)%26)
    sortie: 13 14 7 8
  - id: d_p_prefix
    type: piege
    fr: Vérifier HI ne démontre pas le résultat pour tous les messages. Il faut justifier le passage pour une lettre quelconque.
    en: Checking HI does not prove the result for all messages. Justify the step for an arbitrary letter.
  - id: c6
    indice: { fr: 'Combien d’étiquettes existent ? Il faut un message de plus que ce nombre.', en: 'How many labels exist? You need one message more than that number.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Kintana attribue une seule lettre A–Z comme étiquette à chaque message. Quel nombre minimal de messages garantit que deux partagent une étiquette ?'
    en: 'Kintana assigns a single A–Z letter as a label to each message. What minimum number of messages guarantees that two share a label?'
    reponses: ['27']
    verif: "alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'\nprint(len(alphabet)+1)"
    explication: { fr: '$26$ étiquettes peuvent distinguer $26$ messages ; avec $27$, les tiroirs imposent une collision.', en: '$26$ labels can distinguish $26$ messages; with $27$, the pigeonhole principle forces a collision.' }
  - id: d_labels
    type: exemple
    titre:
      fr: Des étiquettes trop courtes
      en: Labels that are too short
    etapes:
      - fr: Pour un essai réduit, utilisons seulement les étiquettes A, B et C.
        en: For a reduced trial, use only labels A, B and C.
      - fr: Trois messages peuvent recevoir des étiquettes différentes. Un quatrième doit réutiliser une des trois étiquettes.
        en: Three messages can receive different labels. A fourth must reuse one of the three labels.
    verif: print(len("ABC")+1)
    sortie: "4"
  - id: d_p_labels
    type: piege
    fr: Le doublon est garanti sans connaître les messages. Le principe ne dit pas quelle étiquette sera répétée.
    en: A collision is guaranteed without knowing the messages. The principle does not say which label will repeat.
  - id: c7
    indice: { fr: 'Multiplie $5$ par $21$, puis cherche le reste dans la division par $26$.', en: 'Multiply $5$ by $21$, then find the remainder when divided by $26$.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Avant d’utiliser la clé affine $a=5,b=7$, Kintana vérifie son inverse $21$. Quel reste obtient-il pour $5\times21$ modulo $26$ ?'
    en: 'Before using affine key $a=5,b=7$, Kintana checks its inverse $21$. What remainder does it obtain for $5\times21$ modulo $26$?'
    reponses: ['1']
    verif: 'print((5*21)%26)'
    explication: { fr: '$105=4\times26+1$ : le reste $1$ confirme l’inverse multiplicatif.', en: '$105=4\times26+1$: remainder $1$ confirms the multiplicative inverse.' }
  - id: c8
    indice: { fr: 'Numérote S, O, A, ajoute 4 à chaque position (modulo 26), puis reviens aux lettres.', en: 'Number S, O, A, add 4 to each position (modulo 26), then go back to letters.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Chiffre le message SOA avec César et $k=4$. Utilise A–Z et écris les trois lettres chiffrées sans espace.'
    en: 'Encrypt SOA using Caesar with $k=4$. Use A–Z and enter the three encrypted letters without spaces.'
    reponses: ['WSE']
    verif: "alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'\nprint(''.join(alphabet[(alphabet.index(c)+4)%26] for c in 'SOA'))"
    explication: { fr: 'Les positions $18,14,0$ deviennent $22,18,4$, donc WSE.', en: 'Positions $18,14,0$ become $22,18,4$, giving WSE.' }
  - id: c9
    indice: { fr: 'Numérote Q, M, E, retire 4 à chaque position (modulo 26), puis reviens aux lettres.', en: 'Number Q, M, E, subtract 4 from each position (modulo 26), then go back to letters.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Déchiffre le message QME avec César et $k=4$ : soustrais la clé. Écris les trois lettres sans espace.'
    en: 'Decrypt QME using Caesar with $k=4$: subtract the key. Enter the three letters without spaces.'
    reponses: ['MIA']
    verif: "alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'\nprint(''.join(alphabet[(alphabet.index(c)-4)%26] for c in 'QME'))"
    explication: { fr: 'Les positions $16,12,4$ redeviennent $12,8,0$, soit MIA.', en: 'Positions $16,12,4$ return to $12,8,0$, giving MIA.' }
  - id: c10
    indice: { fr: 'Pour chaque lettre : calcule $5x+7$, puis son reste modulo 26, puis reviens à la lettre.', en: 'For each letter: compute $5x+7$, then its remainder modulo 26, then go back to the letter.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Passe au chiffrement affine $y\equiv5x+7\pmod{26}$ : chiffre SOA. Écris trois lettres A–Z sans espace.'
    en: 'Switch to affine encryption $y\equiv5x+7\pmod{26}$: encrypt SOA. Enter three A–Z letters without spaces.'
    reponses: ['TZH']
    verif: "alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'\nprint(''.join(alphabet[(5*alphabet.index(c)+7)%26] for c in 'SOA'))"
    explication: { fr: 'Les positions $18,14,0$ donnent $97,77,7$, de restes $19,25,7$ : TZH.', en: 'Positions $18,14,0$ give $97,77,7$, with remainders $19,25,7$: TZH.' }
  - id: c11
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi final. Kintana reçoit VPH, chiffré avec $y\equiv5x+7\pmod{26}$. Retrouve le message avec $x\equiv21(y-7)\pmod{26}$ ; écris trois lettres A–Z sans espace.'
    en: 'Final challenge. Kintana receives VPH, encrypted with $y\equiv5x+7\pmod{26}$. Recover the message using $x\equiv21(y-7)\pmod{26}$; enter three A–Z letters without spaces.'
    reponses: ['IMA']
    verif: "alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZ'\nprint(''.join(alphabet[(21*(alphabet.index(c)-7))%26] for c in 'VPH'))"
    indice: { fr: 'Convertis chaque lettre en position, soustrais $7$, multiplie par $21$, puis réduis modulo $26$.', en: 'Convert each letter to its position, subtract $7$, multiply by $21$, then reduce modulo $26$.' }
    explication: { fr: 'Les positions $21,15,7$ donnent $294,168,0$, de restes $8,12,0$ : IMA.', en: 'Positions $21,15,7$ give $294,168,0$, with remainders $8,12,0$: IMA.' }
  - id: c12
    type: idee
    fr: 'Récap : tout le module a servi. Kintana sait chiffrer et déchiffrer par César et par affine ; mais retrouver un message ne prouve pas qu’un chiffrement résiste à un adversaire.'
    en: 'Recap: the whole module was used. Kintana can encrypt and decrypt with Caesar and affine; but recovering a message does not prove that a cipher resists an adversary.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Outil du module', en: 'Module tool' }, { fr: 'À quoi il a servi', en: 'What it was used for' }]
      cellules:
        - [{ fr: 'Contre-exemple (0.1, 0.2)', en: 'Counterexample (0.1, 0.2)' }, { fr: 'invalider une clé : $0$ et $13$ donnent la même sortie pour $2x$', en: 'rule out a key: $0$ and $13$ give the same output for $2x$' }]
        - [{ fr: 'Récurrence (0.3)', en: 'Induction (0.3)' }, { fr: 'déchiffrer lettre après lettre restitue tout le message', en: 'decrypting letter by letter recovers the whole message' }]
        - [{ fr: 'Tiroirs (0.4)', en: 'Pigeonhole (0.4)' }, { fr: '$27$ messages pour $26$ étiquettes : une collision', en: '$27$ messages for $26$ labels: a collision' }]
        - [{ fr: 'Congruences (0.5)', en: 'Congruences (0.5)' }, { fr: 'calculer modulo $26$ et inverser la clé', en: 'compute modulo $26$ and invert the key' }]
      legende: { fr: 'Le prochain quartier de Kintana : le terminal.', en: 'Kintana’s next district: the terminal.' }

  - id: d_lien
    type: idee
    fr: 'Tu as chiffré à la main. Le terminal (niveau 1.1) puis Python (niveau 2.1) feront ce travail à ta place, et tu reverras la cryptographie moderne plus tard.'
    en: 'You encrypted by hand. The terminal (level 1.1) then Python (level 2.1) will do this work for you, and you will see modern cryptography later.'
  - id: d_retenir
    type: retenir
    fr: Kintana sait chiffrer et déchiffrer un message (César, affine).
    en: Kintana can encrypt and decrypt a message (Caesar and affine ciphers).
  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [MIT — Pigeonhole Principle (2024)](https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/mit18_200_s24_lec01_pdf/) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [MIT — Pigeonhole Principle (2024)](https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/mit18_200_s24_lec01_pdf/); this optional reading needs a connection.
