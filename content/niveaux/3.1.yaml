id: '3.1'
module: 3
duree_min: 12
titre: { fr: 'Complexité', en: 'Complexity' }
ia: { fr: 'Kintana estime comment le coût de recherche grandit avec ses documents.', en: 'Kintana estimates how search cost grows with its documents.' }
objectifs:
  - { fr: 'compter les opérations d''un algorithme', en: 'count the operations of an algorithm' }
  - { fr: 'comparer des croissances comme n et n²', en: 'compare growth rates like n and n²' }
  - { fr: 'anticiper le coût d''une recherche', en: 'anticipate the cost of a search' }
sources:
  - { titre: 'Pat Morin — Open Data Structures, Mathematical Background', url: 'https://opendatastructures.org/ods-python/1_3_Mathematical_Background.html', licence: 'CC BY 2.5 CA ; explications et exercices originaux' }
cartes:
  - id: c1
    indice: { fr: 'Chaque document est comparé à tous les documents : combien de comparaisons pour un seul ?', en: 'Each document is compared with all documents: how many comparisons for just one?' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Un programme compare chacun des $10$ documents à chacun des $10$ documents, y compris lui-même. Combien de comparaisons fait-il ?'
    en: 'A program compares each of $10$ documents with each of the $10$ documents, including itself. How many comparisons does it make?'
    choix:
      - { fr: '20', en: '20' }
      - { fr: '100', en: '100', juste: true }
      - { fr: '10', en: '10' }
    verif: 'print(sum(1 for i in range(10) for j in range(10)))'
    sortie: '100'
    explication: { fr: 'Pour chaque document, tu fais dix comparaisons : $10\times10=100$.', en: 'For each document, you make ten comparisons: $10\times10=100$.' }
  - id: c2
    type: idee
    fr: La **complexité** compte combien d’opérations fait un programme quand la taille $n$ des données
      grandit. Chaque opération choisie (lire, comparer…) coûte une unité.
    en: "**Complexity** counts how many operations a program does as the size $n$ of the data grows.
      Each chosen operation (read, compare…) costs one unit."
  - id: c2b
    type: exemple
    titre:
      fr: Un parcours, puis deux parcours
      en: One scan, then two scans
    etapes:
      - fr: Pour six documents, une boucle qui lit chaque document fait six lectures.
        en: For six documents, a loop reading every document makes six reads.
      - fr: "Une seconde boucle identique ajoute six lectures : le total vaut douze."
        en: "An identical second loop adds six reads: the total is twelve."
      - fr: "Le coût est linéaire : doubler le nombre de documents double les lectures."
        en: "The cost is linear: doubling the number of documents doubles the reads."
    verif: print(sum(1 for _ in range(6)) + sum(1 for _ in range(6)))
    sortie: "12"
    figure:
      kind: tableau
      entetes:
        - fr: Documents
          en: Documents
        - fr: Une boucle
          en: One loop
        - fr: Deux boucles
          en: Two loops
      cellules:
        - - "6"
          - "6"
          - "12"
        - - "12"
          - "12"
          - "24"
      legende:
        fr: Des parcours successifs additionnent leurs coûts.
        en: Consecutive scans add their costs.
  - id: c2c
    type: idee
    fr: Une borne de croissance majore le coût pour les grandes entrées. Le **grand O** exprime cette
      borne, sans donner un nombre exact d’opérations.
    en: A growth bound limits cost for large inputs. **Big O** expresses this bound without giving an
      exact operation count.
  - id: c2d
    type: piege
    fr: "Douze lectures ne signifient pas douze secondes : le modèle compte les lectures, pas le temps
      réel."
    en: "Twelve reads do not mean twelve seconds: the model counts reads, not elapsed time."
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Un programme parcourt une fois une liste de $n$ éléments. Quel est son coût ?'
    en: 'A program goes through a list of $n$ elements once. What is its cost?'
    choix:
      - { fr: '$O(n)$', en: '$O(n)$', juste: true }
      - { fr: '$O(\log n)$', en: '$O(\log n)$' }
      - { fr: '$O(n^2)$', en: '$O(n^2)$' }
    explication: { fr: 'Un seul parcours fait un nombre d’opérations proportionnel à $n$ : coût linéaire.', en: 'A single pass does a number of operations proportional to $n$: linear cost.' }
    indice: { fr: 'Compte combien de fois chaque élément est regardé.', en: 'Count how many times each element is looked at.' }
  - id: c2a
    type: idee
    fr: "Notons $T(n)$ le coût pour $n$ données et $f(n)$ une croissance de référence. $T(n)=O(f(n))$
      signifie : au-delà d’un seuil $n_0$, $T(n)\\leq C f(n)$, avec une constante positive $C$."
    en: "Let $T(n)$ be the cost for $n$ items and $f(n)$ a reference growth. $T(n)=O(f(n))$ means:
      beyond a threshold $n_0$, $T(n)\\leq C f(n)$ for a positive constant $C$."
    exemple:
      fr: "$T(n)=2n+10$. Pour $n\\geq10$, $2n+10\\leq3n$ : avec $C=3$ et $n_0=10$, $T(n)=O(n)$."
      en: "$T(n)=2n+10$. For $n\\geq10$, $2n+10\\leq3n$: with $C=3$ and $n_0=10$, $T(n)=O(n)$."
  - id: c2e
    type: exemple
    titre:
      fr: Construire une borne linéaire
      en: Building a linear bound
    etapes:
      - fr: "Prenons le coût $T(n)=4n+12$ : quatre opérations par document et douze opérations fixes."
        en: "Take cost $T(n)=4n+12$: four operations per document and twelve fixed operations."
      - fr: Dès que $n\geq6$, les douze opérations fixes ne dépassent pas $2n$.
        en: Once $n\geq6$, the twelve fixed operations do not exceed $2n$.
      - fr: "Ainsi $T(n)\\leq6n$ : une constante $C=6$ et un seuil $n_0=6$ suffisent."
        en: "Thus $T(n)\\leq6n$: constant $C=6$ and threshold $n_0=6$ suffice."
    verif: |-
      assert all(4*n+12 <= 6*n for n in range(6,1001))
      print(4*6+12)
    sortie: "36"
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Combien de fois peut-on diviser 16 par deux avant d’atteindre 1 ?'
    en: 'How many times can you divide 16 by two before reaching 1?'
    choix:
      - { fr: '4', en: '4', juste: true }
      - { fr: '8', en: '8' }
      - { fr: '16', en: '16' }
    explication: { fr: '$16\to8\to4\to2\to1$ : quatre divisions, car $\log_2 16=4$.', en: '$16\to8\to4\to2\to1$: four divisions, since $\log_2 16=4$.' }
    indice: { fr: 'Divise de tête : 16, puis 8, puis…', en: 'Divide in your head: 16, then 8, then…' }
  - id: c2f
    type: idee
    fr: Le **logarithme en base deux**, noté $\log_2 n$, est l’exposant donnant $n$ comme puissance de
      deux. Pour une puissance de deux, il compte les divisions par deux jusqu’à un.
    en: The **base-two logarithm**, written $\log_2 n$, is the exponent giving $n$ as a power of two.
      For a power of two, it counts halvings down to one.
    exemple:
      fr: "$2^4=16$ : quatre divisions font passer $16$ à $1$."
      en: "$2^4=16$: four halvings take $16$ to $1$."
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Compter les divisions', en: 'Counting halvings' }
    etapes:
      - { code: 'n, tours = 8, 0', fr: 'Pars de huit candidats.', en: 'Start with eight candidates.' }
      - code: "while n > 1:\n    n //= 2\n    tours += 1"
        fr: 'Les tailles passent par $8,4,2,1$ : trois divisions.'
        en: 'Sizes go through $8,4,2,1$: three halvings.'
      - { code: 'print(tours)', fr: 'Le résultat est $3=\log_2 8$, car $2^3=8$.', en: 'The result is $3=\log_2 8$, because $2^3=8$.' }
  - id: c4
    indice: { fr: 'Combien de fois chaque document est-il lu ? Une fois : multiplie par le nombre de documents.', en: 'How many times is each document read? Once: multiply by the number of documents.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Un parcours lit chaque document une fois ; pour $37$ documents, combien de lectures ?'
    en: 'A scan reads each document once; for $37$ documents, how many reads?'
    reponses: ['37']
    verif: 'print(sum(1 for _ in range(37)))'
    explication: { fr: 'Une lecture par document donne $T(n)=n$.', en: 'One read per document gives $T(n)=n$.' }
  - id: c5
    indice: { fr: 'Divise 64 par deux, puis le résultat par deux, et compte les divisions jusqu’à 1.', en: 'Divide 64 by two, then the result by two, and count the divisions down to 1.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Combien de divisions exactes par deux font passer $64$ à $1$ ?'
    en: 'How many exact halvings take $64$ down to $1$?'
    reponses: ['6']
    verif: "n, k = 64, 0\nwhile n > 1:\n    n //= 2\n    k += 1\nprint(k)"
    explication: { fr: '$64,32,16,8,4,2,1$ : six transitions, donc $\log_2 64=6$.', en: '$64,32,16,8,4,2,1$: six transitions, so $\log_2 64=6$.' }
  - id: c5a
    type: idee
    fr: Deux boucles **imbriquées** exécutent la boucle intérieure pour chaque tour extérieur. Avec $n$
      tours chacune, le coût est quadratique, c’est-à-dire proportionnel à $n^2$.
    en: Two **nested** loops run the inner loop for every outer iteration. With $n$ iterations each, the
      cost is quadratic, meaning proportional to $n^2$.
  - id: c5b
    type: exemple
    titre:
      fr: Compter des paires
      en: Counting pairs
    etapes:
      - fr: Avec trois documents, chaque document est comparé aux trois documents, lui-même inclus.
        en: With three documents, each is compared with all three documents, including itself.
      - fr: Cela donne $3\times3=9$ comparaisons ; avec six documents, $6\times6=36$.
        en: This gives $3\times3=9$ comparisons; with six documents, $6\times6=36$.
      - fr: Doubler la taille multiplie ici le coût par quatre.
        en: Doubling the size multiplies this cost by four.
    verif: print(sum(1 for i in range(6) for j in range(6)))
    sortie: "36"
    figure:
      kind: tableau
      entetes:
        - $n$
        - $n^2$
      cellules:
        - - "3"
          - "9"
        - - "6"
          - "36"
      legende:
        fr: Chaque paire ordonnée compte, y compris un document avec lui-même.
        en: Every ordered pair counts, including a document with itself.
  - id: c5c
    type: piege
    fr: Deux parcours successifs de six documents font douze lectures ; deux boucles imbriquées de six
      tours font trente-six opérations.
    en: Two consecutive scans of six documents make twelve reads; two nested loops of six iterations
      make thirty-six operations.
  - id: c6
    indice: { fr: 'Remplace $n$ par $20$ puis par $40$ dans $n^2$ et compare les deux coûts.', en: 'Replace $n$ with $20$ then with $40$ in $n^2$ and compare the two costs.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Si le coût exact est $n^2$, par quel facteur est-il multiplié quand $n$ passe de $20$ à $40$ ?'
    en: 'If the exact cost is $n^2$, by what factor does it grow when $n$ goes from $20$ to $40$?'
    reponses: ['4']
    verif: 'print(40**2 // 20**2)'
    explication: { fr: 'Doubler chaque dimension multiplie le coût par $2^2=4$.', en: 'Doubling each dimension multiplies the cost by $2^2=4$.' }
  - id: c7
    indice: { fr: 'Cherche une constante $C$ et un seuil $n_0$ qui majorent le coût, comme dans la définition du grand O.', en: 'Look for a constant $C$ and a threshold $n_0$ that bound the cost, as in the big-O definition.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour $n\geq1$, $3n+2\leq5n$. Quelle conclusion cette inégalité justifie-t-elle ?'
    en: 'For $n\geq1$, $3n+2\leq5n$. Which conclusion does this inequality justify?'
    choix:
      - { fr: 'Le programme dure exactement cinq secondes.', en: 'The program takes exactly five seconds.' }
      - { fr: '$3n+2=O(n)$', en: '$3n+2=O(n)$', juste: true }
      - { fr: 'Le coût est indépendant de $n$.', en: 'The cost is independent of $n$.' }
    explication: { fr: 'Prends $C=5$ et $n_0=1$ dans la définition : la borne est linéaire.', en: 'Take $C=5$ and $n_0=1$ in the definition: the bound is linear.' }
  - id: c8
    type: piege
    fr: '$O(n)$ est une borne de croissance, pas une durée : les constantes et la machine comptent pour les petites entrées.'
    en: '$O(n)$ is a growth bound, not a duration: constants and hardware matter for small inputs.'
  - id: c9
    indice: { fr: 'Deux boucles l’une après l’autre : les coûts s’additionnent ou se multiplient ?', en: 'Two loops one after the other: do the costs add or multiply?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Deux boucles successives lisent respectivement $12$ puis $12$ éléments. Combien de lectures au total ?'
    en: 'Two consecutive loops read $12$ and then $12$ items. How many reads in total?'
    reponses: ['24']
    verif: 'print(sum(1 for _ in range(12)) + sum(1 for _ in range(12)))'
    explication: { fr: 'Des boucles successives additionnent leurs coûts : $12+12$, pas $12^2$.', en: 'Consecutive loops add their costs: $12+12$, not $12^2$.' }
  - id: c9a
    type: idee
    fr: Un coût $n\log_2 n$ combine un parcours de $n$ éléments et un nombre logarithmique d’étapes. On
      multiplie ces facteurs avant de comparer les méthodes.
    en: A cost of $n\log_2 n$ combines a scan of $n$ items with a logarithmic number of steps. Multiply
      these factors before comparing methods.
  - id: c9b
    type: exemple
    titre:
      fr: Comparer deux modèles
      en: Comparing two models
    etapes:
      - fr: Pour seize documents, quatre étapes suffisent dans le modèle de divisions exactes.
        en: For sixteen documents, four steps suffice in the exact-halving model.
      - fr: Le coût $n\log_2 n$ vaut $16\times4=64$ ; le coût quadratique vaut $256$.
        en: Cost $n\log_2 n$ is $16\times4=64$; quadratic cost is $256$.
      - fr: La différence vaut $192$ opérations, uniquement pour ces coûts exacts supposés.
        en: The difference is $192$ operations, only for these assumed exact costs.
    verif: print(16**2 - 16*4)
    sortie: "192"
  - id: c9c
    type: piege
    fr: "Une borne $O(n\\log n)$ ne donne pas un coût exact : on ne soustrait pas deux grands O comme
      des compteurs."
    en: "An $O(n\\log n)$ bound is not an exact cost: do not subtract two big O bounds like counters."
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Pour $32$ documents, A fait exactement $n^2$ opérations et B exactement $n\log_2 n$. Combien B économise-t-il par rapport à A ?'
    en: 'Challenge. For $32$ documents, A performs exactly $n^2$ operations and B exactly $n\log_2 n$. How many operations does B save compared with A?'
    reponses: ['864']
    verif: "n, k, m = 32, 0, 32\nwhile m > 1:\n    m //= 2\n    k += 1\nprint(n*n - n*k)"
    indice: { fr: 'Calcule séparément les deux coûts avant de soustraire.', en: 'Compute both costs separately before subtracting.' }
    explication: { fr: 'A coûte $1024$, B coûte $32\times5=160$ : économie de $864$ opérations dans ce modèle.', en: 'A costs $1024$, B costs $32\times5=160$: a saving of $864$ operations in this model.' }
  - id: c11
    type: retenir
    fr: 'Compte les opérations, précise ton modèle et compare les croissances : Kintana peut anticiper le coût de ses recherches.'
    en: 'Count operations, state your model, and compare growth rates: Kintana can anticipate its search costs.'
