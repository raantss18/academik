id: '3.4'
module: 3
duree_min: 13
titre: { fr: 'Hachage', en: 'Hashing' }
ia: { fr: 'Kintana associe chaque mot aux identifiants de ses documents.', en: 'Kintana maps each word to its document IDs.' }
sources:
  - titre: Pat Morin — Open Data Structures, Hash Tables
    url: https://opendatastructures.org/ods-python/5_Hash_Tables.html
    licence: CC BY 2.5 CA ; exercices originaux
  - titre: Python — Data model, object.__hash__
    url: https://docs.python.org/3/reference/datamodel.html#object.__hash__
    licence: PSF-2.0 ; exemples de la documentation également sous 0BSD
  - titre: Python — Data structures, sets and dictionaries
    url: https://docs.python.org/3/tutorial/datastructures.html
    licence: PSF-2.0 ; exemples également sous 0BSD ; exemples pédagogiques originaux
cartes:
  - id: c1
    indice: { fr: 'Calcule $7\bmod5$ et $12\bmod5$ et compare les deux restes.', en: 'Compute $7\bmod5$ and $12\bmod5$ and compare the two remainders.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Une table jouet utilise $h(k)=k\bmod5$. Que se passe-t-il pour les clés $7$ et $12$ ?'
    en: 'A toy table uses $h(k)=k\bmod5$. What happens for keys $7$ and $12$?'
    choix:
      - { fr: 'Elles désignent forcément le même document.', en: 'They must refer to the same document.' }
      - { fr: 'Elles arrivent toutes deux dans le seau 2.', en: 'They both land in bucket 2.', juste: true }
      - { fr: 'Elles arrivent dans des seaux différents.', en: 'They land in different buckets.' }
    verif: 'print((7 % 5, 12 % 5))'
    sortie: '(2, 2)'
    explication: { fr: 'Les restes sont égaux : c’est une collision, pas une égalité de clés.', en: 'The remainders match: this is a collision, not equality of keys.' }
  - id: c1a
    type: idee
    fr: "Une **clé** sert à retrouver une valeur : un mot peut être la clé, ses documents la valeur. Un
      **seau** est un emplacement de rangement dans notre table jouet."
    en: "A **key** retrieves a value: a word can be the key and its documents the value. A **bucket** is
      a storage location in our toy table."
  - id: c1b
    type: idee
    fr: Le **modulo** est le reste d’une division entière. Ici, $h(k)=k\bmod m$ se lit « le seau de la
      clé $k$ est son reste modulo $m$ ».
    en: "**Modulo** is the remainder of integer division. Here, $h(k)=k\\bmod m$ means “the bucket for
      key $k$ is its remainder modulo $m$”."
  - id: c1c
    type: exemple
    titre:
      fr: Transformer une clé en numéro de seau
      en: Turning a key into a bucket number
    etapes:
      - fr: Utilisons six seaux, numérotés de zéro à cinq, et la clé vingt.
        en: Use six buckets, numbered zero through five, and key twenty.
      - fr: "La division donne $20=3\\times6+2$ : le reste vaut deux, donc on choisit le seau deux."
        en: "Division gives $20=3\\times6+2$: the remainder is two, so choose bucket two."
      - fr: La clé vingt-six donne aussi deux ; ce numéro ne suffit donc pas à identifier la clé.
        en: Key twenty-six also gives two; this number therefore does not uniquely identify the key.
    verif: print([k%6 for k in (20,26)])
    sortie: "[2, 2]"
    figure:
      kind: tableau
      entetes:
        - fr: Clé
          en: Key
        - fr: Division
          en: Division
        - fr: Seau
          en: Bucket
      cellules:
        - - "20"
          - $3\times6+2$
          - "2"
        - - "26"
          - $4\times6+2$
          - "2"
      legende:
        fr: Le reste choisit le seau ; la clé complète distingue les entrées.
        en: The remainder chooses the bucket; the full key distinguishes entries.
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'À partir de quoi un dictionnaire Python retrouve-t-il une valeur ?'
    en: 'What does a Python dictionary use to find a value?'
    choix:
      - { fr: 'De sa clé', en: 'Its key', juste: true }
      - { fr: 'De sa position dans une liste', en: 'Its position in a list' }
      - { fr: 'De sa taille', en: 'Its size' }
    explication: { fr: 'Le dictionnaire associe une clé à une valeur ; le hachage transforme la clé en emplacement.', en: 'The dictionary associates a key with a value; hashing turns the key into a location.' }
    indice: { fr: 'Un dictionnaire associe des clés à des valeurs.', en: 'A dictionary associates keys with values.' }
  - id: c2
    type: idee
    fr: 'Le **hachage** transforme une clé en un numéro de **seau** où la ranger. Deux clés différentes peuvent tomber dans le même seau : c’est une **collision**, on garde alors les deux.'
    en: '**Hashing** turns a key into the number of a **bucket** where it is stored. Two different keys can land in the same bucket: that is a **collision**, and both are kept.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Seau $h(k)=k\bmod5$', en: 'Bucket $h(k)=k\bmod5$' }, { fr: 'Clés rangées (on insère $3$, $8$, $10$, $13$)', en: 'Stored keys (insert $3$, $8$, $10$, $13$)' }]
      cellules:
        - ['$0$', '$10$']
        - ['$1$, $2$, $4$', { fr: 'vides', en: 'empty' }]
        - ['$3$', { fr: '$3$, $8$, $13$ : collisions', en: '$3$, $8$, $13$: collisions', ton: bad }]
      legende: { fr: 'Pour retrouver $13$, on va au seau $3$ puis on compare les clés une à une.', en: 'To find $13$, go to bucket $3$, then compare the keys one by one.' }
  - id: c2b
    type: piege
    fr: "Vingt et vingt-six ont le même seau dans ce modèle, mais restent deux clés distinctes :
      conserve leurs deux valeurs."
    en: "Twenty and twenty-six share a bucket in this model but remain distinct keys: keep both values."
  - id: c2a
    type: idee
    fr: Une recherche a un coût moyen constant, $O(1)$, si le hachage répartit bien les clés et si le
      nombre de clés par seau reste borné. Hacher et comparer doivent aussi coûter un temps constant.
    en: A lookup has constant expected cost, $O(1)$, if hashing distributes keys well and the number of
      keys per bucket stays bounded. Hashing and comparison must also take constant time.
    exemple:
      fr: "Avec $h(k)=k\\bmod5$, les clés $5, 10, 15, 20$ vont toutes au seau $0$ : chercher $20$ demande
        $4$ comparaisons."
      en: "With $h(k)=k\\bmod5$, keys $5, 10, 15, 20$ all go to bucket $0$: finding $20$ takes $4$
        comparisons."
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Deux clés dans un même seau', en: 'Two keys in one bucket' }
    etapes:
      - { code: 'table = [[] for _ in range(5)]', fr: 'Crée cinq seaux indépendants ; ceci est un modèle pédagogique, pas l’implémentation de `dict`.', en: 'Create five independent buckets; this is a teaching model, not the implementation of `dict`.' }
      - code: "for key, value in [(7, 'A'), (12, 'B')]:\n    table[key % 5].append((key, value))"
        fr: 'Le seau $2$ contient maintenant les deux paires.'
        en: 'Bucket $2$ now contains both pairs.'
      - { code: "print(next(value for key, value in table[12 % 5] if key == 12))", fr: 'La comparaison de clés retrouve B sans confondre $7$ et $12$.', en: 'Comparing keys retrieves B without confusing $7$ and $12$.' }
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Deux clés différentes reçoivent le même code de hachage. Comment appelle-t-on cela ?'
    en: 'Two different keys get the same hash code. What is this called?'
    choix:
      - { fr: 'Une collision', en: 'A collision', juste: true }
      - { fr: 'Une erreur de syntaxe', en: 'A syntax error' }
      - { fr: 'Un doublon de clé', en: 'A duplicate key' }
    explication: { fr: 'Une collision est inévitable en théorie (principe des tiroirs, niveau 0.4) : la table doit savoir la gérer.', en: 'A collision is unavoidable in theory (pigeonhole principle, level 0.4): the table must know how to handle it.' }
    indice: { fr: 'Rappelle-toi le principe des tiroirs du niveau 0.4.', en: 'Remember the pigeonhole principle of level 0.4.' }
  - id: c3a
    type: exemple
    titre:
      fr: Chercher une clé absente dans un seau occupé
      en: Looking for an absent key in an occupied bucket
    etapes:
      - fr: Le seau deux contient les paires `(20, A)` et `(26, B)` dans cet ordre.
        en: Bucket two contains pairs `(20, A)` and `(26, B)` in that order.
      - fr: La clé trente-deux vise aussi le seau deux ; compare-la à vingt, puis à vingt-six.
        en: Key thirty-two also targets bucket two; compare it with twenty, then twenty-six.
      - fr: "Les deux comparaisons échouent : la clé est absente, même si le seau existe."
        en: "Both comparisons fail: the key is absent even though the bucket exists."
    verif: |-
      bucket=[(20,"A"),(26,"B")]
      assert 32%6==2
      print(next((v for k,v in bucket if k==32),None))
    sortie: None
  - id: c4
    indice: { fr: 'Calcule le reste de la division de 24 par 7.', en: 'Compute the remainder of 24 divided by 7.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Avec $h(k)=k\bmod7$, quel est le seau de la clé $24$ ?'
    en: 'With $h(k)=k\bmod7$, which bucket receives key $24$?'
    reponses: ['3']
    verif: 'print(24 % 7)'
    explication: { fr: '$24=3\times7+3$ : le reste est $3$.', en: '$24=3\times7+3$: the remainder is $3$.' }
  - id: c5
    indice: { fr: 'Calcule le reste modulo 5 de chaque clé et compte celles qui valent 1.', en: 'Compute each key’s remainder modulo 5 and count those equal to 1.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Insère les clés `[1, 6, 11, 3]` dans des seaux avec $h(k)=k\bmod5$. Combien de clés contient le seau $1$ ?'
    en: 'Insert keys `[1, 6, 11, 3]` into buckets using $h(k)=k\bmod5$. How many keys does bucket $1$ contain?'
    reponses: ['3']
    verif: "table = [[] for _ in range(5)]\nfor k in [1, 6, 11, 3]: table[k % 5].append(k)\nprint(len(table[1]))"
    explication: { fr: '$1$, $6$ et $11$ ont le même reste ; la clé $3$ est dans un autre seau.', en: '$1$, $6$, and $11$ share a remainder; key $3$ is in another bucket.' }
  - id: c5a
    type: idee
    fr: Un **ensemble** conserve chaque valeur une seule fois. Pour un mot, stocker un ensemble
      d’identifiants compte les documents distincts, pas les répétitions du mot.
    en: A **set** keeps each value only once. For a word, storing a set of IDs counts distinct
      documents, not repeated occurrences of the word.
  - id: c5b
    type: exemple
    titre:
      fr: Associer un mot à ses documents
      en: Mapping a word to its documents
    etapes:
      - fr: "Les documents sont `8: bleu bleu` et `9: bleu vert`."
        en: "Documents are `8: bleu bleu` and `9: bleu vert`."
      - fr: "Pour bleu, ajoute huit, encore huit, puis neuf dans un ensemble : il contient seulement huit et
          neuf."
        en: "For bleu, add eight, eight again, then nine to a set: it contains only eight and nine."
      - fr: Le dictionnaire associe bleu à cet ensemble ; trois occurrences donnent deux documents
          distincts.
        en: The dictionary maps bleu to this set; three occurrences give two distinct documents.
    verif: |-
      docs={8:"bleu bleu",9:"bleu vert"}; index={}
      for doc,text in docs.items():
          for word in text.split(): index.setdefault(word,set()).add(doc)
      assert index["bleu"]=={8,9}
      print(len(index["bleu"]))
    sortie: "2"
    figure:
      kind: tableau
      entetes:
        - fr: Mot
          en: Word
        - fr: Documents
          en: Documents
      cellules:
        - - bleu
          - 8, 9
        - - vert
          - "9"
      legende:
        fr: Le dictionnaire garde le mot ; chaque ensemble déduplique ses identifiants.
        en: The dictionary keeps the word; each set deduplicates its IDs.
  - id: c5c
    type: piege
    fr: Ajouter huit deux fois dans un ensemble ne crée pas deux documents ; conserver une liste de
      chaque occurrence répondrait à une autre question.
    en: Adding eight twice to a set does not create two documents; keeping a list of every occurrence
      would answer a different question.
  - id: c6
    indice: { fr: 'Un ensemble ne garde pas deux fois le même élément. Ajouter 2 change-t-il quelque chose ?', en: 'A set does not keep the same element twice. Does adding 2 change anything?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Un dictionnaire contient `index = {''chat'': {2, 5}}`. Après `index[''chat''].add(2)`, combien d’identifiants contient cette entrée ?'
    en: 'A dictionary contains `index = {''chat'': {2, 5}}`. After `index[''chat''].add(2)`, how many IDs does this entry contain?'
    reponses: ['2']
    verif: "index = {'chat': {2, 5}}\nindex['chat'].add(2)\nprint(len(index['chat']))"
    explication: { fr: 'Un ensemble ne stocke chaque identifiant qu’une fois ; répéter un mot ne crée pas un nouveau document.', en: 'A set stores each ID only once; repeating a word does not create a new document.' }
  - id: c6a
    type: idee
    fr: Python peut changer le hachage d’une même chaîne entre deux processus. Un hachage interne
      facilite le rangement ; il ne remplace pas un identifiant durable.
    en: Python may change the hash of the same string between processes. An internal hash helps storage;
      it does not replace a persistent identifier.
    exemple:
      fr: On peut attribuer explicitement l’identifiant vingt au mot bleu, puis sauvegarder cette
        association.
      en: We can explicitly assign ID twenty to the word bleu, then save that mapping.
  - id: c7
    indice: { fr: 'Pense à ce qui peut changer d’une exécution à l’autre pour les chaînes, et aux collisions.', en: 'Think about what can change from one run to another for strings, and about collisions.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pourquoi ne faut-il pas enregistrer `hash(''chat'')` comme identifiant durable d’un mot entre plusieurs exécutions Python ?'
    en: 'Why should you avoid saving `hash(''chat'')` as a persistent word ID across Python runs?'
    choix:
      - { fr: 'Le hachage des chaînes peut varier entre les processus, et des collisions restent possibles.', en: 'String hashes may vary across processes, and collisions remain possible.', juste: true }
      - { fr: 'Un hachage contient toujours le texte complet.', en: 'A hash always contains the complete text.' }
      - { fr: 'Deux chaînes différentes ont toujours des hachages différents.', en: 'Different strings always have different hashes.' }
    explication: { fr: 'Garde le mot comme clé ou attribue un identifiant explicite ; le hachage interne n’est pas une identité persistante.', en: 'Keep the word as a key or assign an explicit ID; the internal hash is not a persistent identity.' }
  - id: c8
    type: piege
    fr: 'Une collision n’autorise pas à écraser une autre clé : compare les clés ; un hachage de table n’est pas non plus un chiffrement.'
    en: 'A collision does not permit overwriting another key: compare keys; a table hash is not encryption either.'
  - id: c8a
    type: idee
    fr: Le **pire cas** survient si toutes les clés visent le même seau. Une recherche séquentielle peut
      alors comparer toutes les clés, soit un coût $O(n)$ pour $n$ clés.
    en: The **worst case** occurs when all keys target one bucket. A sequential lookup may then compare
      every key, costing $O(n)$ for $n$ keys.
  - id: c8b
    type: exemple
    titre:
      fr: Un seau qui devient une liste
      en: A bucket that becomes a list
    etapes:
      - fr: Avec six seaux, les clés `[2, 8, 14]` vont toutes au seau deux.
        en: With six buckets, keys `[2, 8, 14]` all go to bucket two.
      - fr: "Chercher quatorze dans cet ordre demande trois comparaisons : avec deux, huit, puis quatorze."
        en: "Finding fourteen in this order takes three comparisons: against two, eight, then fourteen."
      - fr: Un seul calcul de seau ne garantit donc pas une seule comparaison de clés.
        en: One bucket calculation therefore does not guarantee just one key comparison.
    verif: |-
      bucket=[2,8,14]
      assert all(k%6==2 for k in bucket)
      print(next(i+1 for i,k in enumerate(bucket) if k==14))
    sortie: "3"
  - id: c8c
    type: piege
    fr: "Un nombre fixe de seaux ne suffit pas quand les données grandissent : les listes peuvent
      s’allonger même avec une répartition équilibrée."
    en: "A fixed number of buckets is not enough as data grows: lists may grow longer even with an even
      distribution."
  - id: c9
    indice: { fr: 'Une recherche séquentielle teste les clés dans l’ordre jusqu’à trouver la bonne. Où est 19 ?', en: 'A sequential search tests keys in order until it finds the right one. Where is 19?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Le seau contient les clés `[4, 9, 14, 19]` dans cet ordre. Une recherche séquentielle de $19$ compare combien de clés ?'
    en: 'A bucket contains keys `[4, 9, 14, 19]` in that order. How many keys does a sequential lookup for $19$ compare?'
    reponses: ['4']
    verif: "count = 0\nfor k in [4, 9, 14, 19]:\n    count += 1\n    if k == 19: break\nprint(count)"
    explication: { fr: 'Il faut atteindre la dernière clé ; concentrer les clés dans un seau rend la recherche linéaire.', en: 'The last key must be reached; concentrating keys in one bucket makes lookup linear.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Les documents sont `1: ''riz eau riz''`, `2: ''eau sel''`, `3: ''riz sel''`. Combien de documents distincts l’entrée du mot `riz` doit-elle contenir ?'
    en: 'Challenge. The documents are `1: ''riz eau riz''`, `2: ''eau sel''`, `3: ''riz sel''`. How many distinct documents should the entry for word `riz` contain?'
    reponses: ['2']
    verif: "docs = {1: 'riz eau riz', 2: 'eau sel', 3: 'riz sel'}\nindex = {}\nfor doc, text in docs.items():\n    for word in text.split():\n        index.setdefault(word, set()).add(doc)\nprint(len(index['riz']))"
    indice: { fr: 'Associe un ensemble d’identifiants à chaque mot.', en: 'Associate a set of IDs with each word.' }
    explication: { fr: 'L’entrée contient les identifiants $1$ et $3$ ; les deux occurrences de `riz` dans le document $1$ ne comptent qu’une fois.', en: 'The entry contains IDs $1$ and $3$; the two occurrences of `riz` in document $1$ count only once.' }
  - id: d_lien
    type: idee
    fr: 'Le hachage est la troisième façon de chercher vite, après le tri (niveau 3.2) et la dichotomie (niveau 3.3). Le boss 3.boss les réunira.'
    en: 'Hashing is the third way to search fast, after sorting (level 3.2) and binary search (level 3.3). Boss 3.boss will bring them together.'
  - id: c11
    type: retenir
    fr: 'Hacher oriente la recherche, comparer les clés la confirme : Kintana peut construire un index mot → documents sans perdre les collisions.'
    en: 'Hashing directs lookup, comparing keys confirms it: Kintana can build a word → documents index without losing colliding entries.'
