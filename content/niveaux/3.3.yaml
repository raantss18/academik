id: '3.3'
module: 3
duree_min: 11
titre: { fr: 'Dichotomie', en: 'Binary search' }
ia: { fr: 'Kintana retrouve un identifiant dans une liste triée sans tout parcourir.', en: 'Kintana finds an ID in a sorted list without scanning every item.' }
sources:
  - { titre: 'Python — bisect', url: 'https://docs.python.org/3/library/bisect.html', licence: 'PSF-2.0 ; exemples de la documentation également sous 0BSD' }
cartes:
  - id: c1
    indice: { fr: 'La liste est triée : si la cible est plus grande que le milieu, que penser des valeurs à gauche ?', en: 'The list is sorted: if the target is greater than the middle, what about the values on the left?' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Dans `[2, 5, 8, 11, 14]`, tu compares la cible $11$ à la valeur centrale $8$. Où peux-tu continuer ?'
    en: 'In `[2, 5, 8, 11, 14]`, you compare target $11$ with middle value $8$. Where can you continue?'
    choix:
      - { fr: 'À gauche du milieu.', en: 'To the left of the middle.' }
      - { fr: 'À droite du milieu.', en: 'To the right of the middle.', juste: true }
      - { fr: 'Il faut examiner les deux côtés.', en: 'Both sides must be examined.' }
    verif: "a = [2, 5, 8, 11, 14]\nassert a == sorted(a)\nprint(a.index(11) > len(a)//2)"
    sortie: 'True'
    explication: { fr: 'La liste est triée et $11>8$ : tous les éléments de gauche sont trop petits.', en: 'The list is sorted and $11>8$: all items on the left are too small.' }
  - id: c2
    type: idee
    fr: La **dichotomie** réduit une recherche en comparant la cible au milieu d’une liste triée.
      L’ordre permet d’éliminer une partie des valeurs sans les lire.
    en: "**Binary search** narrows a search by comparing the target with the middle of a sorted list.
      Ordering allows some values to be discarded unread."
  - id: c2b
    type: exemple
    titre:
      fr: Pourquoi faut-il trier ?
      en: Why must the list be sorted?
    etapes:
      - fr: Cherchons douze dans `[3, 6, 9, 12, 15]` ; la valeur centrale est neuf.
        en: Find twelve in `[3, 6, 9, 12, 15]`; the middle value is nine.
      - fr: "Tout ce qui précède neuf est inférieur à douze : on garde seulement la partie droite."
        en: "Everything before nine is less than twelve: keep only the right part."
      - fr: Il reste `[12, 15]`, au lieu des cinq candidats initiaux.
        en: Only `[12, 15]` remains, instead of the original five candidates.
    verif: |-
      a=[3,6,9,12,15]
      assert all(v<12 for v in a[:3])
      print(a[3:])
    sortie: "[12, 15]"
    figure:
      kind: tableau
      entetes:
        - fr: Écartés
          en: Discarded
        - fr: Candidats restants
          en: Remaining candidates
      cellules:
        - - 3, 6, 9
          - 12, 15
      legende:
        fr: L’ordre croissant justifie l’élimination.
        en: Ascending order justifies discarding items.
  - id: c2c
    type: piege
    fr: "Dans `[12, 3, 9, 6, 15]`, douze est à gauche de neuf : la même élimination perdrait la cible."
    en: "In `[12, 3, 9, 6, 15]`, twelve is left of nine: the same elimination would lose the target."
  - id: c2d
    type: idee
    fr: Les bornes sont des indices, pas des valeurs. La fenêtre $[lo,hi)$ commence à l’indice $lo$
      inclus et s’arrête avant l’indice $hi$.
    en: Bounds are indices, not values. Window $[lo,hi)$ starts at included index $lo$ and stops before
      index $hi$.
  - id: c2e
    type: exemple
    titre:
      fr: Lire une fenêtre
      en: Reading a window
    etapes:
      - fr: Dans `[3, 6, 9, 12, 15]`, la fenêtre $[1,4)$ contient les indices un, deux et trois.
        en: In `[3, 6, 9, 12, 15]`, window $[1,4)$ contains indices one, two, and three.
      - fr: Les valeurs candidates sont six, neuf et douze ; quinze est exclu.
        en: Candidate values are six, nine, and twelve; fifteen is excluded.
      - fr: Le milieu est `(1 + 4) // 2`, donc l’indice deux, dont la valeur est neuf.
        en: The midpoint is `(1 + 4) // 2`, so index two, whose value is nine.
    verif: |-
      a=[3,6,9,12,15]
      assert a[1:4]==[6,9,12]
      print(a[(1+4)//2])
    sortie: "9"
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Environ combien de comparaisons au plus pour chercher dans une liste triée de 1000 éléments par dichotomie ?'
    en: 'About how many comparisons at most to search a sorted list of 1000 elements by binary search?'
    choix:
      - { fr: '10', en: '10', juste: true }
      - { fr: '500', en: '500' }
      - { fr: '1000', en: '1000' }
    explication: { fr: 'Chaque comparaison divise la liste par deux : $\log_2 1000\approx10$.', en: 'Each comparison halves the list: $\log_2 1000\approx10$.' }
    indice: { fr: 'Combien de fois peut-on couper 1000 en deux jusqu’à 1 ?', en: 'How many times can you cut 1000 in half down to 1?' }
  - id: c2a
    type: idee
    fr: Pour chercher la première place possible de `x`, calcule `mid = (lo + hi) // 2`. Si `a[mid] <
      x`, avance `lo` à `mid + 1` ; sinon, recule `hi` à `mid`.
    en: To find the first possible position for `x`, compute `mid = (lo + hi) // 2`. If `a[mid] < x`,
      move `lo` to `mid + 1`; otherwise, move `hi` to `mid`.
    exemple:
      fr: Avec `[3, 6, 9, 12, 15]` et la cible douze, $[0,5)$ devient $[3,5)$.
      en: With `[3, 6, 9, 12, 15]` and target twelve, $[0,5)$ becomes $[3,5)$.
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Chercher la première place de 8', en: 'Finding the first position for 8' }
    etapes:
      - { code: 'a, x = [2, 5, 8, 8, 14], 8', fr: 'Deux occurrences : nous voulons la première.', en: 'There are two occurrences: we want the first.' }
      - { code: 'lo, hi = 0, len(a)', fr: 'La fenêtre contient initialement toute la liste.', en: 'Initially the window contains the entire list.' }
      - code: "while lo < hi:\n    mid = (lo + hi) // 2\n    if a[mid] < x:\n        lo = mid + 1\n    else:\n        hi = mid"
        fr: 'Les fenêtres deviennent $[0,2)$ puis $[2,2)$ ; aucune tranche de liste n’est copiée.'
        en: 'The windows become $[0,2)$ then $[2,2)$; no list slice is copied.'
      - { code: 'print(lo)', fr: 'La position obtenue est $2$, comme avec `bisect_left(a, x)`.', en: 'The resulting position is $2$, as with `bisect_left(a, x)`.' }
  - id: c4
    indice: { fr: 'Additionne `lo` et `hi`, puis fais une division entière par 2.', en: 'Add `lo` and `hi`, then do an integer division by 2.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Pour la fenêtre $[2,9)$, calcule `mid = (lo + hi) // 2`.'
    en: 'For window $[2,9)$, compute `mid = (lo + hi) // 2`.'
    reponses: ['5']
    verif: 'print((2 + 9) // 2)'
    explication: { fr: 'La division entière donne $11\mathbin{//}2=5$.', en: 'Integer division gives $11\mathbin{//}2=5$.' }
  - id: c4a
    type: idee
    fr: La **position d’insertion** est une place où ajouter la cible en gardant l’ordre. `bisect_left`
      choisit la place avant toutes les valeurs égales.
    en: An **insertion position** is a place where the target can be added while preserving order.
      `bisect_left` chooses the position before all equal values.
  - id: c4b
    type: exemple
    titre:
      fr: Une cible absente a aussi une position
      en: An absent target also has a position
    etapes:
      - fr: Dans `[2, 9, 9, 16]`, cherchons la position d’insertion de onze.
        en: In `[2, 9, 9, 16]`, find the insertion position of eleven.
      - fr: Les trois premières valeurs sont trop petites ; seize est la première valeur supérieure ou
          égale.
        en: The first three values are too small; sixteen is the first value greater than or equal to the
          target.
      - fr: La position vaut trois ; pour neuf, elle vaut un, avant les deux occurrences.
        en: The position is three; for nine, it is one, before both occurrences.
    verif: |-
      from bisect import bisect_left
      a=[2,9,9,16]
      print([bisect_left(a,x) for x in (11,9)])
    sortie: "[3, 1]"
    figure:
      kind: tableau
      entetes:
        - fr: Cible
          en: Target
        - fr: Position
          en: Position
        - fr: Présente ?
          en: Present?
      cellules:
        - - "11"
          - "3"
          - fr: non
            en: no
        - - "9"
          - "1"
          - fr: oui
            en: yes
      legende:
        fr: La position seule ne prouve pas la présence.
        en: Position alone does not prove membership.
  - id: c4c
    type: piege
    fr: "Une égalité ne termine pas la recherche de première occurrence : garde la borne droite au
      milieu pour explorer les égalités précédentes."
    en: "Equality does not end a search for the first occurrence: keep the upper bound at the midpoint
      to explore earlier equal values."
  - id: c5
    indice: { fr: 'Cherche la première place où 6 peut s’insérer en gardant la liste triée.', en: 'Look for the first place where 6 can be inserted while keeping the list sorted.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans `[1, 4, 7, 10]`, quelle position renvoie `bisect_left` pour $6$ ?'
    en: 'In `[1, 4, 7, 10]`, what position does `bisect_left` return for $6$?'
    reponses: ['2']
    verif: "from bisect import bisect_left\nprint(bisect_left([1, 4, 7, 10], 6))"
    explication: { fr: '$6$ s’insère avant $7$, à l’indice $2$, même si $6$ est absent.', en: '$6$ belongs before $7$, at index $2$, even though $6$ is absent.' }
  - id: c6
    indice: { fr: '`bisect_left` renvoie la place avant toutes les valeurs égales. Où commence le 3 ?', en: '`bisect_left` returns the place before all equal values. Where does the 3 start?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans `[3, 3, 3, 9]`, quelle position renvoie `bisect_left` pour $3$ ?'
    en: 'In `[3, 3, 3, 9]`, what position does `bisect_left` return for $3$?'
    reponses: ['0']
    verif: "from bisect import bisect_left\nprint(bisect_left([3, 3, 3, 9], 3))"
    explication: { fr: 'Une égalité déplace la borne droite : on obtient la première occurrence.', en: 'An equality moves the upper bound left: this finds the first occurrence.' }
  - id: c6a
    type: exemple
    titre:
      fr: Vérifier la présence sans sortir de la liste
      en: Checking membership safely
    etapes:
      - fr: Avec `[2, 9, 9, 16]`, chercher vingt donne la position quatre, après le dernier élément.
        en: With `[2, 9, 9, 16]`, searching for twenty gives position four, past the last item.
      - fr: Vérifie d’abord `i < len(a)` ; seulement ensuite, compare `a[i]` à la cible.
        en: First check `i < len(a)`; only then compare `a[i]` with the target.
      - fr: "Python évalue `and` de gauche à droite et s’arrête si le premier test est faux : aucune lecture
          hors limites."
        en: "Python evaluates `and` left to right and stops if the first test is false: no out-of-bounds
          read."
    verif: |-
      from bisect import bisect_left
      a=[2,9,9,16]; x=20
      i=bisect_left(a,x)
      assert i==4
      print(i<len(a) and a[i]==x)
    sortie: "False"
  - id: c7
    indice: { fr: 'Évite de lire `a[i]` hors de la liste : teste d’abord la limite, puis l’égalité.', en: 'Avoid reading `a[i]` outside the list: test the limit first, then equality.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Après `i = bisect_left(a, x)`, quelle condition teste la présence sans dépasser les limites, même si `a` est vide ?'
    en: 'After `i = bisect_left(a, x)`, which condition checks membership without an out-of-bounds access, even if `a` is empty?'
    choix:
      - { fr: '`a[i] == x`', en: '`a[i] == x`' }
      - { fr: '`i < len(a) and a[i] == x`', en: '`i < len(a) and a[i] == x`', juste: true }
      - { fr: '`i == len(a)`', en: '`i == len(a)`' }
    verif: "from bisect import bisect_left\nfor a in ([], [1], [1, 3, 3]):\n    for x in range(5):\n        i = bisect_left(a, x)\n        assert (i < len(a) and a[i] == x) == (x in a)\nprint('ok')"
    sortie: 'ok'
    explication: { fr: '`and` ne lit `a[i]` que si l’indice existe ; l’égalité confirme ensuite la présence.', en: '`and` reads `a[i]` only if the index exists; equality then confirms membership.' }
  - id: c8
    type: piege
    fr: 'Trouver une position coûte $O(\log n)$ comparaisons ; insérer dans une liste Python peut décaler $n$ éléments et coûte $O(n)$ au pire.'
    en: 'Finding a position costs $O(\log n)$ comparisons; insertion into a Python list may shift $n$ items and costs $O(n)$ in the worst case.'
  - id: c9
    indice: { fr: 'Si 9 est plus grand que tous les éléments, où doit-il s’insérer ?', en: 'If 9 is greater than all elements, where must it be inserted?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans `[2, 4, 6]`, quelle position d’insertion renvoie `bisect_left` pour $9$ ?'
    en: 'In `[2, 4, 6]`, what insertion position does `bisect_left` return for $9$?'
    reponses: ['3']
    verif: "from bisect import bisect_left\nprint(bisect_left([2, 4, 6], 9))"
    explication: { fr: 'La position est la longueur de la liste : on insérerait à la fin, sans pouvoir lire `a[3]` avant insertion.', en: 'The position equals the list length: insertion would be at the end, but `a[3]` cannot be read before insertion.' }
  - id: c9a
    type: exemple
    titre:
      fr: Suivre les comparaisons
      en: Tracing comparisons
    etapes:
      - fr: Cherchons onze dans `[2, 9, 9, 16]` avec la fenêtre initiale $[0,4)$.
        en: Find eleven in `[2, 9, 9, 16]` with initial window $[0,4)$.
      - fr: "L’indice deux contient neuf : la fenêtre devient $[3,4)$ ; l’indice trois contient seize : elle
          devient $[3,3)$."
        en: "Index two contains nine: the window becomes $[3,4)$; index three contains sixteen: it becomes
          $[3,3)$."
      - fr: "Les bornes sont égales : on s’arrête après deux comparaisons, avec la position trois."
        en: "The bounds are equal: stop after two comparisons, with position three."
    verif: |-
      a=[2,9,9,16]; lo,hi,count=0,4,0
      while lo<hi:
          mid=(lo+hi)//2; count+=1
          if a[mid]<11: lo=mid+1
          else: hi=mid
      assert lo==3
      print(count)
    sortie: "2"
  - id: c9b
    type: piege
    fr: La borne logarithmique décrit la croissance du nombre de comparaisons ; elle ne promet pas
      exactement le logarithme pour chaque cible.
    en: The logarithmic bound describes growth in comparison count; it does not promise exactly the
      logarithm for every target.
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Exécute mentalement la boucle de l’exemple avec `a = [1, 3, 5, 7, 9, 11, 13, 15]` et `x = 6`. Combien de fois évalue-t-elle `a[mid] < x` ?'
    en: 'Challenge. Trace the example loop with `a = [1, 3, 5, 7, 9, 11, 13, 15]` and `x = 6`. How many times does it evaluate `a[mid] < x`?'
    reponses: ['3']
    verif: "a, x = [1, 3, 5, 7, 9, 11, 13, 15], 6\nlo, hi, count = 0, len(a), 0\nwhile lo < hi:\n    mid = (lo+hi)//2\n    count += 1\n    if a[mid] < x: lo = mid+1\n    else: hi = mid\nassert lo == 3\nprint(count)"
    indice: { fr: 'Note chaque fenêtre et son milieu ; arrête quand les bornes se rejoignent.', en: 'Write down each window and midpoint; stop when the bounds meet.' }
    explication: { fr: 'Les indices testés sont $4$, $2$, $3$ ; la position finale est $3$, mais $6$ est absent.', en: 'The tested indices are $4$, $2$, $3$; the final position is $3$, but $6$ is absent.' }
  - id: d_lien
    type: idee
    fr: 'La dichotomie divise le problème par deux, comme le logarithme du niveau 3.1 le prédisait. Tu la combineras avec le tri dans le boss 3.boss.'
    en: 'Binary search halves the problem, as the logarithm of level 3.1 predicted. You will combine it with sorting in boss 3.boss.'
  - id: c11
    type: retenir
    fr: 'Liste triée, fenêtre qui rétrécit, puis test de présence : Kintana recherche avec $O(\log n)$ comparaisons au pire.'
    en: 'Sorted list, shrinking window, then a membership check: Kintana searches with $O(\log n)$ worst-case comparisons.'
