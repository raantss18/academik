# Niveau 18.boss — Rends-le rapide (mission : trois accélérations algorithmiques vérifiées par oracle). Original academik ; notions des niveaux 18.1 à 18.5, vérifiées dans la documentation Python (complexité) et Bentley (lien).
id: 18.boss
module: 18
duree_min: 17
titre:
  fr: Rends-le rapide
  en: Make it fast
ia:
  fr: Kintana accélère ses fonctions de mille fois sans changer leurs résultats.
  en: Kintana speeds up her functions a thousandfold without changing their results.
