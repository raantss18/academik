# Niveau 22.boss — Recherche, boss : spécifier, tester, prouver. Original academik ; notions des niveaux 22.1 à 22.6. Preuve compilée avec Lean 4.35 ; calculs exécutés.
id: 22.boss
module: 22
duree_min: 19
titre:
  fr: Prouve ton code
  en: Prove your code
ia:
  fr: 'Kintana livre une fonction spécifiée, testée et prouvée : elle sait ce qu’elle garantit, et ce qu’elle ne garantit pas.'
  en: 'Kintana delivers a function that is specified, tested and proved: she knows what she guarantees, and what she does not.'
sources:
- titre: Avigad, de Moura, Kong, Ullrich — Theorem Proving in Lean 4
  url: https://lean-lang.org/theorem_proving_in_lean4/
  licence: Apache-2.0 ; notions citées, exemples réécrits
- titre: Boyd, Vandenberghe — Convex Optimization (référence uniquement)
  url: https://web.stanford.edu/~boyd/cvxbook/
  licence: Copyright Cambridge University Press ; lien seulement
- titre: Shannon — A Mathematical Theory of Communication (1948)
  url: https://people.math.harvard.edu/~ctm/home/text/others/shannon/entropy/entropy.pdf
  licence: Article historique ; notion citée, aucun extrait repris
cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: 'Kintana a testé sa fonction sur dix mille listes tirées au hasard : tout passe. Sa propriété est-elle **prouvée** pour toutes les listes ?'
  en: 'Kintana tested her function on ten thousand randomly drawn lists: everything passes. Is her property **proved** for all lists?'
  choix:
  - fr: 'Non : dix mille cas ne couvrent pas une infinité de listes'
    en: 'No: ten thousand cases do not cover infinitely many lists'
    juste: true
  - fr: 'Oui : dix mille cas suffisent'
    en: 'Yes: ten thousand cases are enough'
  - fr: Oui, car le tirage est aléatoire
    en: Yes, because the draw is random
  indice:
    fr: Rappelle-toi $n^2+n+41$ au niveau 22.1.
    en: Remember $n^2+n+41$ in level 22.1.
  explication:
    fr: Un test couvre les cas essayés. Seule une preuve couvre tous les cas.
    en: A test covers the cases tried. Only a proof covers every case.
- id: c2
  type: idee
  fr: 'Ta mission : donner à Kintana une fonction **sûre**, en trois temps. D’abord une **spécification** précise. Ensuite des **tests** rapides pour trouver les bogues ; enfin une **preuve** Lean pour ce qui doit être certain.'
  en: 'Your mission: give Kintana a **safe** function, in three steps. First a precise **specification**. Then quick **tests** to find bugs; finally a Lean **proof** for what must be certain.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Du code sûr en trois temps
        en: Safe code in three steps
      noeuds:
      - fr: spécifier
        en: specify
      - fr: tester
        en: test
      - fr: prouver
        en: prove
      - fr: livrer
        en: ship
        ton: ok
    legende:
      fr: Les tests trouvent vite les bogues ; la preuve apporte la certitude.
      en: Tests find bugs quickly; the proof brings certainty.
- id: c3
  type: exemple
  titre:
    fr: Prouver que doubler garde la longueur
    en: Proving that doubling keeps the length
  lang: lean
  etapes:
  - code: 'def doubler : List Nat → List Nat'
    fr: 'La fonction de Kintana : elle double chaque nombre d’une liste.'
    en: 'Kintana’s function: it doubles every number in a list.'
  - code: '  | [] => []'
    fr: Une liste vide reste vide.
    en: An empty list stays empty.
  - code: '  | x :: xs => (2 * x) :: doubler xs'
    fr: On double `x`, puis on traite le reste.
    en: We double `x`, then handle the rest.
  - code: 'theorem longueur_doubler (xs : List Nat) :'
    fr: 'La spécification : doubler ne change pas la longueur.'
    en: 'The specification: doubling does not change the length.'
  - code: '    (doubler xs).length = xs.length := by'
    fr: Pour **toutes** les listes `xs`.
    en: For **all** lists `xs`.
  - code: '  induction xs with'
    fr: Récurrence sur la liste.
    en: Induction on the list.
  - code: '  | nil => rfl'
    fr: 'Cas vide : les deux côtés valent `0`.'
    en: 'Empty case: both sides are `0`.'
  - code: '  | cons x xs ih => simp [doubler, ih]'
    fr: 'Cas `x :: xs` : `simp` déplie `doubler` et utilise `ih`. Lean accepte.'
    en: 'Case `x :: xs`: `simp` unfolds `doubler` and uses `ih`. Lean accepts.'
- id: c4
  type: qcm
  note:
    kind: quiz
    poids: 1
  fr: Dans le cas `cons x xs ih` de cette preuve, pourquoi `simp` a-t-il besoin de `ih` ?
  en: In the `cons x xs ih` case of this proof, why does `simp` need `ih`?
  choix:
  - fr: Parce que la longueur de `doubler xs` est connue seulement grâce à `ih`
    en: Because the length of `doubler xs` is known only thanks to `ih`
    juste: true
  - fr: Parce que `ih` contient la valeur de `x`
    en: Because `ih` contains the value of `x`
  - fr: Parce que `simp` ne sait pas additionner
    en: Because `simp` cannot add
  indice:
    fr: '`ih` parle de la queue `xs`, et `doubler xs` apparaît dans le but.'
    en: '`ih` is about the tail `xs`, and `doubler xs` appears in the goal.'
  explication:
    fr: Le but contient `(doubler xs).length`. L’hypothèse `ih` dit qu’il vaut `xs.length`.
    en: The goal contains `(doubler xs).length`. The hypothesis `ih` says it equals `xs.length`.
- id: c5
  type: parsons
  note:
    kind: exercise
    poids: 1
  fr: 'Remets la preuve dans l’ordre. Les cas du `induction` suivent l’ordre de Lean : liste vide, puis `x :: xs`.'
  en: 'Put the proof in order. The `induction` cases follow Lean’s order: empty list, then `x :: xs`.'
  lang: lean
  lignes:
  - 'theorem longueur_doubler (xs : List Nat) :'
  - '    (doubler xs).length = xs.length := by'
  - '  induction xs'
  - '  next => rfl'
  - '  next x xs ih => simp [doubler, ih]'
  lean_pre: |
    def doubler : List Nat → List Nat
      | [] => []
      | x :: xs => (2 * x) :: doubler xs
  indice:
    fr: L’énoncé d’abord, puis `induction xs`, puis le cas vide, puis le cas `cons`.
    en: The statement first, then `induction xs`, then the empty case, then the `cons` case.
  explication:
    fr: Le cas vide se règle par `rfl` ; le cas `cons` a besoin de l’hypothèse `ih`.
    en: The empty case is settled by `rfl`; the `cons` case needs the hypothesis `ih`.
