- id: c7
  type: exemple
  titre:
    fr: Tester la même propriété
    en: Testing the same property
  lang: python
  etapes:
  - code: |-
      from itertools import product
      listes = [list(p) for n in range(5) for p in product([0, 1, 2], repeat=n)]
    fr: 'Toutes les listes de chiffres `0`, `1`, `2` de longueur au plus 4 : 121 listes.'
    en: 'Every list of digits `0`, `1`, `2` of length at most 4: 121 lists.'
  - code: 'doubler = lambda xs: [2 * x for x in xs]'
    fr: La version Python de la fonction de Kintana.
    en: The Python version of Kintana’s function.
  - code: print(len(listes), all(len(doubler(c)) == len(c) for c in listes))
    fr: '`121 True` : aucun contre-exemple parmi ces listes. Lean a prouvé le cas général.'
    en: '`121 True`: no counterexample among these lists. Lean proved the general case.'
  verif: |-
    from itertools import product
    listes = [list(p) for n in range(5) for p in product([0, 1, 2], repeat=n)]
    doubler = lambda xs: [2 * x for x in xs]
    print(len(listes), all(len(doubler(c)) == len(c) for c in listes))
  sortie: 121 True
- id: c8
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `doubler(xs)`** en Python : la liste de tous les `2 * x` pour `x` dans `xs`.'
  en: '**Write `doubler(xs)`** in Python: the list of every `2 * x` for `x` in `xs`.'
  depart: |
    # écris ta fonction doubler ici
  tests: |-
    assert doubler([]) == []
    assert doubler([3, 1, 2]) == [6, 2, 4]
    assert len(doubler([5] * 7)) == 7
  solutionCode: |
    def doubler(xs):
        return [2 * x for x in xs]
  indice:
    fr: 'Une compréhension de liste : `[2 * x for x in xs]`.'
    en: 'A list comprehension: `[2 * x for x in xs]`.'
  explication:
    fr: 'C’est la même fonction que celle de Lean : `#eval doubler [3, 1, 2]` affiche `[6, 2, 4]`.'
    en: 'It is the same function as the Lean one: `#eval doubler [3, 1, 2]` shows `[6, 2, 4]`.'
- id: c9
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `verifie_propriete(f, prop, l_max)`** : parcours `listes(l_max)` ; renvoie la première liste `c` pour laquelle `prop(c, f(c))` est faux, ou `None`. La fonction `listes` est fournie.'
  en: '**Write `verifie_propriete(f, prop, l_max)`**: loop over `listes(l_max)`; return the first list `c` for which `prop(c, f(c))` is false, or `None`. The function `listes` is provided.'
  depart: |
    from itertools import product

    def listes(l_max):
        return [list(p) for n in range(l_max + 1) for p in product([0, 1, 2], repeat=n)]

    # écris ta fonction verifie_propriete ici
  tests: |-
    assert verifie_propriete(lambda c: [2 * x for x in c], lambda c, r: len(r) == len(c), 4) is None
    assert verifie_propriete(lambda c: c[:-1], lambda c, r: len(r) == len(c), 3) == [0]
    assert verifie_propriete(lambda c: [x + 1 for x in c], lambda c, r: sum(r) == 2 * sum(c), 3) == [0]
  solutionCode: |
    from itertools import product

    def listes(l_max):
        return [list(p) for n in range(l_max + 1) for p in product([0, 1, 2], repeat=n)]

    def verifie_propriete(f, prop, l_max):
        for c in listes(l_max):
            if not prop(c, f(c)):
                return c
        return None
  indice:
    fr: Une boucle sur `listes(l_max)` ; `if not prop(c, f(c))` renvoie `c` ; `None` à la fin.
    en: A loop over `listes(l_max)`; `if not prop(c, f(c))` returns `c`; `None` at the end.
  explication:
    fr: 'Le test le plus petit qui échoue est un bon contre-exemple : court et lisible.'
    en: 'The smallest failing test is a good counterexample: short and readable.'
- id: c9b
  type: idee
  fr: 'Ce que Lean garantit : la preuve respecte les règles de la logique. Ce qu’il ne garantit pas : que l’énoncé soit **le bon**. Relire la spécification reste un travail humain. Pour une fonction critique, fais relire l’énoncé par quelqu’un d’autre.'
  en: 'What Lean guarantees: the proof follows the rules of logic. What it does not guarantee: that the statement is **the right one**. Rereading the specification remains human work. For a critical function, have someone else reread the statement.'
  exemple:
    fr: 'Prouver `longueur (doubler xs) = longueur xs` ne dit rien sur les valeurs : relis ce que l’énoncé affirme.'
    en: 'Proving `length (doubler xs) = length xs` says nothing about the values: reread what the statement claims.'
- id: c10
  type: idee
  fr: 'Quoi prouver, quoi tester ? Prouve ce qui doit être certain et ne change plus : un chiffrement, un contrôle d’accès, une formule de coût. Teste ce qui évolue vite. Et dans les deux cas, écris la spécification **complète**.'
  en: 'What to prove, what to test? Prove what must be certain and no longer changes: encryption, access control, a cost formula. Test what evolves quickly. And in both cases, write the **complete** specification.'
  exemple:
    fr: 'Pour `doubler`, la longueur ne suffit pas : on ajoute que chaque élément est doublé.'
    en: 'For `doubler`, length is not enough: we add that each element is doubled.'
- id: c11
  type: piege
  fr: 'Une propriété vraie n’est pas une fonction correcte. `lambda xs: [0 for _ in xs]` garde bien la longueur, mais ne double rien. Il faut une spécification qui dit aussi **quoi** est renvoyé.'
  en: 'A true property is not a correct function. `lambda xs: [0 for _ in xs]` does keep the length, but doubles nothing. You need a specification that also says **what** is returned.'
- id: c12
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: 'Un modèle de langage uniforme sur 32 mots : quelle est sa perplexité ?'
  en: 'A language model uniform over 32 words: what is its perplexity?'
  reponses:
  - '32'
  verif: |-
    import math
    print(int(round(2 ** math.log2(32))))
  indice:
    fr: Pour une loi uniforme, la perplexité est le nombre de mots.
    en: For a uniform distribution, perplexity is the number of words.
  explication:
    fr: '$2^{\log_2 32}=32$ : cinq bits d’entropie.'
    en: '$2^{\log_2 32}=32$: five bits of entropy.'
- id: c13
  type: qcm
  note:
    kind: quiz
    poids: 1
  fr: La Hessienne $\begin{pmatrix}1&2\\2&1\end{pmatrix}$ décrit-elle une fonction convexe ?
  en: Does the Hessian $\begin{pmatrix}1&2\\2&1\end{pmatrix}$ describe a convex function?
  choix:
  - fr: 'Non : $ac-b^2=1-4=-3<0$, c’est un col'
    en: 'No: $ac-b^2=1-4=-3<0$, it is a saddle'
    juste: true
  - fr: 'Oui : $a$ et $c$ sont positifs'
    en: 'Yes: $a$ and $c$ are positive'
  - fr: 'Oui : la matrice est symétrique'
    en: 'Yes: the matrix is symmetric'
  indice:
    fr: Calcule le déterminant $ac-b^2$.
    en: Compute the determinant $ac-b^2$.
  explication:
    fr: Il faut les trois conditions $a\ge0$, $c\ge0$ et $ac-b^2\ge0$ ; ici la dernière échoue.
    en: All three conditions $a\ge0$, $c\ge0$ and $ac-b^2\ge0$ are needed; here the last one fails.
- id: c14
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi final. **Écris `bilan(f, props, cas)`** : `props` est un dictionnaire `nom → prop(c, resultat)`. Renvoie un dictionnaire `nom → None` si la propriété tient sur tous les `cas`, sinon `nom → ` le premier `c` qui l’invalide.'
  en: 'Final challenge. **Write `bilan(f, props, cas)`**: `props` is a dictionary `name → prop(c, result)`. Return a dictionary `name → None` if the property holds on every `cas`, otherwise `name → ` the first `c` that breaks it.'
  depart: |
    # écris ta fonction bilan ici
  tests: |-
    est_trie = lambda c, r: all(r[i] <= r[i + 1] for i in range(len(r) - 1))
    perm = lambda c, r: sorted(c) == sorted(r)
    props = {"trié": est_trie, "permutation": perm}
    cas = [[3, 1, 2], [], [5, 5, 1]]
    assert bilan(sorted, props, cas) == {"trié": None, "permutation": None}
    assert bilan(lambda c: [], props, cas) == {"trié": None, "permutation": [3, 1, 2]}
    assert bilan(lambda c: c, props, cas) == {"trié": [3, 1, 2], "permutation": None}
  solutionCode: |
    def bilan(f, props, cas):
        resultat = {}
        for nom, prop in props.items():
            resultat[nom] = None
            for c in cas:
                if not prop(c, f(c)):
                    resultat[nom] = c
                    break
        return resultat
  indice:
    fr: Pour chaque propriété, parcours `cas` ; mets `c` dans le résultat et `break` au premier échec.
    en: For each property, loop over `cas`; put `c` in the result and `break` at the first failure.
  explication:
    fr: 'Le tri vide passe « trié » mais échoue « permutation » : c’est le piège de 22.3, détecté par un bilan complet.'
    en: 'The empty sort passes “sorted” but fails “permutation”: this is the 22.3 pitfall, caught by a complete report.'
- id: c15
  type: retenir
  fr: Spécifier, tester, prouver. Un test couvre des cas ; une preuve Lean couvre tous les cas. Une spécification incomplète laisse passer de fausses fonctions. Garde la preuve pour ce qui doit être certain.
  en: Specify, test, prove. A test covers some cases; a Lean proof covers every case. An incomplete specification lets false functions through. Keep proofs for what must be certain.
