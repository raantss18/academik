id: '3.2'
module: 3
duree_min: 13
titre: { fr: 'Trier', en: 'Sorting' }
ia:
  {
    fr: 'Kintana ordonne ses documents pour préparer la recherche.',
    en: 'Kintana orders its documents to prepare for searching.'
  }
sources:
  - {
      titre: 'Python — Sorting HOWTO',
      url: 'https://docs.python.org/3/howto/sorting.html',
      licence: 'PSF-2.0 ; exemples de la documentation également sous 0BSD'
    }
  - {
      titre: 'Pat Morin — Open Data Structures, Sorting Algorithms',
      url: 'https://opendatastructures.org/ods-python/11_Sorting_Algorithms.html',
      licence: 'CC BY 2.5 CA ; exercices originaux'
    }
cartes:
  - id: c1
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Tu tries les identifiants `[9, 2, 9, 4]` en ordre croissant. Quel résultat
      conserve tous les documents ?'
    en: 'You sort IDs `[9, 2, 9, 4]` in ascending order. Which result preserves all
      documents?'
    choix:
      - { fr: '`[2, 4, 9]`', en: '`[2, 4, 9]`' }
      - { fr: '`[2, 4, 9, 9]`', en: '`[2, 4, 9, 9]`', juste: true }
      - { fr: '`[9, 9, 4, 2]`', en: '`[9, 9, 4, 2]`' }
    verif: 'print(sorted([9, 2, 9, 4]))'
    sortie: '[2, 4, 9, 9]'
    explication:
      {
        fr: 'Trier change la position des éléments ; il ne supprime pas les doublons.',
        en: 'Sorting changes item positions; it does not remove duplicates.'
      }
  - id: c2
    type: idee
    fr: 'Un **tri** range des éléments selon une **clé** (un score, un nom…). Un tri est **stable** s’il garde l’ordre de départ des éléments de même clé.'
    en: 'A **sort** orders elements by a **key** (a score, a name…). A sort is **stable** if it keeps the original order of elements with equal keys.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Avant (nom, score)', en: 'Before (name, score)' }, { fr: 'Tri stable par score', en: 'Stable sort by score' }]
      cellules:
        - ['Lova $3$', { fr: 'Mamy $1$', en: 'Mamy $1$' }]
        - ['Mamy $1$', { fr: 'Lova $3$', en: 'Lova $3$', ton: ok }]
        - ['Nirina $3$', { fr: 'Nirina $3$', en: 'Nirina $3$', ton: ok }]
      legende: { fr: 'Lova et Nirina ont le même score : Lova était avant, elle reste avant.', en: 'Lova and Nirina have the same score: Lova was first, she stays first.' }
  - id: c2a
    type: idee
    fr: 'Deux méthodes classiques. L’**insertion** glisse chaque élément à sa place dans le début déjà trié. La **fusion** coupe en deux, trie chaque moitié, puis fusionne.'
    en: 'Two classic methods. **Insertion** slides each element into place in the already sorted start. **Merge sort** splits in two, sorts each half, then merges.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Méthode', en: 'Method' }, { fr: 'Pire cas', en: 'Worst case' }, { fr: 'Pour $n=1000$ (ordre de grandeur)', en: 'For $n=1000$ (order of magnitude)' }]
      cellules:
        - [{ fr: 'Insertion', en: 'Insertion' }, '$O(n^2)$', { fr: 'environ $10^6$ comparaisons', en: 'about $10^6$ comparisons', ton: bad }]
        - [{ fr: 'Fusion', en: 'Merge' }, '$O(n\log n)$', { fr: 'environ $10^4$ comparaisons', en: 'about $10^4$ comparisons', ton: ok }]
      legende: { fr: 'On suppose qu’une comparaison coûte toujours le même temps.', en: 'We assume a comparison always takes the same time.' }
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Insérer le troisième identifiant', en: 'Inserting the third ID' }
    etapes:
      - {
          code: 'a = [2, 7, 4]',
          fr: 'Le préfixe `[2, 7]` est trié ; garde le nouvel élément $4$.',
          en: 'The prefix `[2, 7]` is sorted; save the new item $4$.'
        }
      - {
          code: 'x = a[2]; a[2] = a[1]',
          fr: 'Décale $7$ vers la droite car il dépasse $4$.',
          en: 'Shift $7$ right because it exceeds $4$.'
        }
      - {
          code: 'a[1] = x; print(a)',
          fr: 'Insère après $2$ : `[2, 4, 7]`.',
          en: 'Insert after $2$: `[2, 4, 7]`.'
        }
  - id: c4
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Après le tri croissant de `[8, 3, 6, 1]`, quelle valeur est à l’indice $2$
      (indices à partir de zéro) ?'
    en: 'After sorting `[8, 3, 6, 1]` in ascending order, which value is at index
      $2$ (zero-based indexing)?'
    reponses: [ '6' ]
    verif: 'print(sorted([8, 3, 6, 1])[2])'
    explication:
      {
        fr: 'La liste devient `[1, 3, 6, 8]` ; l’indice $2$ désigne le troisième
          élément.',
        en: 'The list becomes `[1, 3, 6, 8]`; index $2$ refers to the third item.'
      }
  - id: c5
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Combien d’éléments dois-tu décaler pour insérer $3$ dans le préfixe trié
      `[1, 4, 6, 8]` ?'
    en: 'How many items must you shift to insert $3$ into the sorted prefix `[1, 4,
      6, 8]`?'
    reponses: [ '3' ]
    verif: "a = [1, 4, 6, 8]

      j, shifts = len(a)-1, 0

      while j >= 0 and a[j] > 3:

      \    shifts += 1

      \    j -= 1

      print(shifts)"
    explication:
      {
        fr: '$4$, $6$ et $8$ se décalent ; $1$ reste en place.',
        en: '$4$, $6$, and $8$ shift; $1$ stays in place.'
      }
  - id: c6
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Trie `[(''A'', 2), (''B'', 1), (''C'', 2)]` par score croissant avec un tri
      stable. Quel ordre des noms obtiens-tu ?'
    en: 'Sort `[(''A'', 2), (''B'', 1), (''C'', 2)]` by ascending score using a
      stable sort. What order of names do you get?'
    choix:
      - { fr: 'B C A', en: 'B C A' }
      - { fr: 'A B C', en: 'A B C' }
      - { fr: 'B A C', en: 'B A C', juste: true }
    verif: "items = [('A', 2), ('B', 1), ('C', 2)]

      print(' '.join(x[0] for x in sorted(items, key=lambda x: x[1])))"
    sortie: 'B A C'
    explication:
      {
        fr: 'B a le plus petit score ; A reste avant C car leurs scores sont égaux.',
        en: 'B has the smallest score; A remains before C because their scores are
          equal.'
      }
  - id: c7
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Fusionne `[1, 5, 9]` et `[2, 4, 8]` en ordre croissant. Quel est le
      quatrième élément ?'
    en: 'Merge `[1, 5, 9]` and `[2, 4, 8]` in ascending order. What is the fourth
      item?'
    reponses: [ '5' ]
    verif: "a, b = [1, 5, 9], [2, 4, 8]

      i = j = 0

      out = []

      while i < len(a) and j < len(b):

      \    if a[i] <= b[j]:

      \        out.append(a[i]); i += 1

      \    else:

      \        out.append(b[j]); j += 1

      out.extend(a[i:]); out.extend(b[j:])

      assert out == sorted(a+b)

      print(out[3])"
    explication:
      {
        fr: 'Prends chaque fois la plus petite tête : `[1, 2, 4, 5, 8, 9]`.',
        en: 'Take the smaller head each time: `[1, 2, 4, 5, 8, 9]`.'
      }
  - id: c8
    type: piege
    fr: '`a.sort()` modifie `a` et renvoie `None` ; `sorted(a)` renvoie une nouvelle
      liste triée, sans modifier `a`.'
    en: '`a.sort()` modifies `a` and returns `None`; `sorted(a)` returns a new
      sorted list without modifying `a`.'
  - id: c9
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Après `a = [5, 1, 3]; b = sorted(a)`, quelle valeur contient `a[0]` ?'
    en: 'After `a = [5, 1, 3]; b = sorted(a)`, what value does `a[0]` contain?'
    reponses: [ '5' ]
    verif: "a = [5, 1, 3]

      b = sorted(a)

      print(a[0])"
    explication:
      {
        fr: 'Seule la nouvelle liste `b` est triée ; `a` reste intacte.',
        en: 'Only the new list `b` is sorted; `a` remains unchanged.'
      }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Le tri par insertion de `[5, 4, 3, 2, 1]` décale chaque élément plus
      grand que la valeur à insérer. Combien de décalages effectue-t-il au total
      ?'
    en: 'Challenge. Insertion sort on `[5, 4, 3, 2, 1]` shifts each item larger than
      the value being inserted. How many shifts does it perform in total?'
    reponses: [ '10' ]
    verif: "a = [5, 4, 3, 2, 1]

      shifts = 0

      for i in range(1, len(a)):

      \    x, j = a[i], i-1

      \    while j >= 0 and a[j] > x:

      \        a[j+1] = a[j]; shifts += 1; j -= 1

      \    a[j+1] = x

      assert a == [1, 2, 3, 4, 5]

      print(shifts)"
    indice:
      {
        fr: 'Compte les décalages pour chacune des quatre insertions.',
        en: 'Count shifts for each of the four insertions.'
      }
    explication:
      {
        fr: '$1+2+3+4=10$ ; en général cette entrée inversée demande $n(n-1)/2$
          décalages.',
        en: '$1+2+3+4=10$; in general this reversed input requires $n(n-1)/2$ shifts.'
      }
  - id: c11
    type: retenir
    fr: 'Choisis la clé, conserve les doublons et distingue stabilité et vitesse :
      Kintana prépare ainsi des documents ordonnés.'
    en: 'Choose the key, keep duplicates, and distinguish stability from speed:
      Kintana can now prepare ordered documents.'
