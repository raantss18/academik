# Niveau 22.3 — Recherche 3 : prouver une propriété du code. Original academik ; notions vérifiées dans Theorem Proving in Lean 4 (Apache-2.0). Preuves compilées avec Lean 4.35 ; calculs exécutés.
id: '22.3'
module: 22
duree_min: 19
titre:
  fr: Prouver une propriété de son code
  en: Proving a property of your code
ia:
  fr: Kintana écrit la spécification d’une de ses fonctions et la prouve en Lean pour toutes les listes.
  en: Kintana writes the specification of one of her functions and proves it in Lean for every list.
