- id: c14
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `bilan_backtest(r, signaux, cout)`** : renvoie un dictionnaire avec `"brut"` (signaux non décalés, sans coût), `"honnete"` (signaux décalés par `retarder`, sans coût) et `"net"` (décalés, avec coût). `retarder` et `rendement_net` sont fournis.'
  en: 'Challenge. **Write `bilan_backtest(r, signaux, cout)`**: return a dictionary with `"brut"` (unshifted signals, no cost), `"honnete"` (signals shifted by `retarder`, no cost) and `"net"` (shifted, with cost). `retarder` and `rendement_net` are provided.'
  depart: |
    def retarder(signaux):
        return [0] + signaux[:-1]

    def rendement_net(r, pos, cout):
        total = 0.0
        prec = 0
        for x, p in zip(r, pos):
            total += p * x - cout * abs(p - prec)
            prec = p
        return total

    # écris ta fonction bilan_backtest ici
  tests: |-
    def rend(n, graine):
        s = graine
        out = []
        for _ in range(n):
            s = (1664525 * s + 1013904223) % 2 ** 32
            out.append((s / 2 ** 32 - 0.5) * 0.04)
        return out
    r = rend(250, 7)
    sig = [1 if x > 0 else 0 for x in r]
    b = bilan_backtest(r, sig, 0.001)
    assert abs(b["brut"] - 1.335) < 1e-3
    assert abs(b["honnete"] + 0.0205) < 1e-3
    assert abs(b["net"] + 0.1535) < 1e-3
    assert set(b) == {"brut", "honnete", "net"}
  solutionCode: |
    def retarder(signaux):
        return [0] + signaux[:-1]

    def rendement_net(r, pos, cout):
        total = 0.0
        prec = 0
        for x, p in zip(r, pos):
            total += p * x - cout * abs(p - prec)
            prec = p
        return total

    def bilan_backtest(r, signaux, cout):
        return {
            "brut": rendement_net(r, signaux, 0),
            "honnete": rendement_net(r, retarder(signaux), 0),
            "net": rendement_net(r, retarder(signaux), cout),
        }
  indice:
    fr: 'Trois appels à `rendement_net` : avec `signaux`, puis avec `retarder(signaux)` sans coût, puis avec coût.'
    en: 'Three calls to `rendement_net`: with `signaux`, then with `retarder(signaux)` without cost, then with cost.'
  explication:
    fr: 'Les trois chiffres racontent l’histoire : $+133\,\%$ brut, $-2\,\%$ honnête, $-15\,\%$ net.'
    en: 'The three numbers tell the story: $+133\%$ gross, $-2\%$ honest, $-15\%$ net.'
