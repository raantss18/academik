- id: c9
  type: exemple
  titre:
    fr: Le meilleur de cent coups de chance
    en: The best of a hundred strokes of luck
  lang: python
  etapes:
  - code: |-
      import math, statistics
      def sharpe(r):
          return statistics.mean(r) / statistics.stdev(r) * math.sqrt(252)
    fr: 'Le rapport de Sharpe annualisé : rendement moyen sur écart-type, fois $\sqrt{252}$ jours de bourse.'
    en: 'The annualised Sharpe ratio: mean return over standard deviation, times $\sqrt{252}$ trading days.'
  - code: sh = [sharpe(rend(250, g)) for g in range(1, 101)]
    fr: 'Cent « stratégies » : cent séries aléatoires, donc cent hasards sans effet réel.'
    en: 'A hundred “strategies”: a hundred random series, so a hundred chances with no real effect.'
  - code: print(round(max(sh), 2), round(sum(sh) / 100, 2))
    fr: La meilleure a un Sharpe de `1.88`, la moyenne vaut `-0.26`. Un Sharpe de $1{,}88$ paraît excellent ; c’est du hasard.
    en: The best has a Sharpe of `1.88`, the average is `-0.26`. A Sharpe of $1.88$ looks excellent; it is chance.
  verif: |-
    def rend(n, graine):
        s = graine
        out = []
        for _ in range(n):
            s = (1664525 * s + 1013904223) % 2 ** 32
            out.append((s / 2 ** 32 - 0.5) * 0.04)
        return out
    import math, statistics
    def sharpe(r):
        return statistics.mean(r) / statistics.stdev(r) * math.sqrt(252)
    sh = [sharpe(rend(250, g)) for g in range(1, 101)]
    print(round(max(sh), 2), round(sum(sh) / 100, 2))
  sortie: 1.88 -0.26
- id: c10
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `sharpe(r)`** : `moyenne / écart-type × √252`, avec `statistics.mean` et `statistics.stdev`. Renvoie `0.0` si l’écart-type est nul.'
  en: '**Write `sharpe(r)`**: `mean / standard deviation × √252`, with `statistics.mean` and `statistics.stdev`. Return `0.0` if the standard deviation is zero.'
  depart: |
    import math
    import statistics

    # écris ta fonction sharpe ici
  tests: |-
    assert abs(sharpe([0.01, 0.03]) - 22.449944) < 1e-4
    assert sharpe([0.01, 0.01, 0.01]) == 0.0
    assert sharpe([0.01, -0.01, 0.01, -0.01]) == 0.0
    assert sharpe([0.02, 0.0]) > 0
  solutionCode: |
    import math
    import statistics

    def sharpe(r):
        s = statistics.stdev(r)
        return 0.0 if s == 0 else statistics.mean(r) / s * math.sqrt(252)
  indice:
    fr: Calcule `s = statistics.stdev(r)`, puis divise `statistics.mean(r)` par `s`, et multiplie par `math.sqrt(252)`.
    en: Compute `s = statistics.stdev(r)`, then divide `statistics.mean(r)` by `s`, and multiply by `math.sqrt(252)`.
  explication:
    fr: 'Avec seulement deux jours, le Sharpe est énorme : peu de données, beaucoup de hasard.'
    en: 'With only two days, the Sharpe is huge: little data, much chance.'
- id: c11
  type: qcm
  note:
    kind: quiz
    poids: 1
  fr: Pour normaliser les rendements, on utilise la moyenne et l’écart-type de **toute** la période, puis on sépare entraînement et test. Quelle est la fuite ?
  en: To normalise returns, we use the mean and standard deviation of the **whole** period, then split training and test. What is the leak?
  choix:
  - fr: La moyenne et l’écart-type contiennent des informations de la période de test
    en: The mean and standard deviation contain information from the test period
    juste: true
  - fr: 'Il n’y a pas de fuite : une normalisation est neutre'
    en: 'There is no leak: normalisation is neutral'
  - fr: Le test est trop long
    en: The test is too long
  indice:
    fr: D’où viennent les données qui servent à calculer cette moyenne ?
    en: Where do the data used to compute this mean come from?
  explication:
    fr: La normalisation doit se calculer sur l’**entraînement seul**, puis s’appliquer au test. Sinon le futur influence le passé.
    en: The normalisation must be computed on the **training set alone**, then applied to the test. Otherwise the future influences the past.
- id: c12
  type: piege
  fr: 'Sur des séries temporelles, ne mélange jamais les jours au hasard avant de séparer entraînement et test. Un jour d’entraînement voisin d’un jour de test lui ressemble. Coupe **dans l’ordre du temps** : le passé pour apprendre, le futur pour tester.'
  en: 'On time series, never shuffle the days at random before splitting training and test. A training day next to a test day resembles it. Cut **in time order**: the past to learn, the future to test.'
