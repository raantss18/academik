# Niveau 23.4 — Enquêtes 4 : la fuite dans le backtest. Original academik ; données simulées par générateur congruentiel (aucune donnée de marché) ; notions vérifiées (Bailey et López de Prado 2014, MIT 18.642) ; tous les chiffres exécutés.
id: '23.4'
module: 23
