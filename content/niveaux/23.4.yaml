titre:
  fr: La fuite dans le backtest
  en: The leak in the backtest
ia:
  fr: Kintana démasque une performance qui vient d’une fuite d’information, de coûts oubliés ou d’un meilleur-de-cent.
  en: Kintana unmasks a performance that comes from an information leak, forgotten costs or a best-of-a-hundred.
