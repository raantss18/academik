  fr: Un backtest brut rapporte $8\,\%$ par an avec $500$ changements de position. Chaque changement coûte $0{,}1\,\%$. Que vaut le rendement net, en pourcentage ?
  en: A gross backtest returns $8\%$ per year with $500$ changes of position. Each change costs $0.1\%$. What is the net return, in percent?
  reponses:
