cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: Un backtest affiche $+133\,\%$ en un an avec la règle « être investi les jours où le rendement du jour est positif ». Qu’est-ce qui cloche ?
  en: A backtest shows $+133\%$ in one year with the rule “be invested on days when the day’s return is positive”. What is wrong?
  choix:
  - fr: La règle utilise le rendement du jour, qu’on ne connaît pas à l’avance
    en: The rule uses the day’s return, which is not known in advance
    juste: true
  - fr: Le rendement est trop faible pour être vrai
    en: The return is too low to be true
  - fr: Il faut investir tous les jours
    en: You must invest every day
  indice:
    fr: À quel moment de la journée sait-on si le rendement est positif ?
    en: At what moment of the day do we know whether the return is positive?
  explication:
    fr: 'Le signal « rendement du jour positif » n’est connu qu’**après** la journée. C’est une **fuite d’information** : le backtest triche.'
    en: 'The “day’s return positive” signal is only known **after** the day. This is an **information leak**: the backtest cheats.'
- id: c2
  type: idee
  fr: 'La règle d’or d’un backtest : à la date $t$, on n’utilise que ce qui est **connu à $t$**. Toute information venue du futur est une **fuite**. Elle se cache dans le signal, dans la normalisation, dans le découpage des données.'
  en: 'The golden rule of a backtest: at date $t$, we only use what is **known at $t$**. Any information from the future is a **leak**. It hides in the signal, in the normalisation, in the data split.'
  figure:
    kind: tableau
    entetes:
    - fr: Fuite
      en: Leak
    - fr: Où elle se cache
      en: Where it hides
    cellules:
    - - fr: signal futur
        en: future signal
      - fr: on lit `r[t]` pour décider de `t`
        en: we read `r[t]` to decide on `t`
    - - fr: normalisation globale
        en: global normalisation
      - fr: la moyenne de toute la période
        en: the mean of the whole period
    - - fr: découpage mélangé
        en: shuffled split
      - fr: des jours futurs dans l’entraînement
        en: future days in training
    - - fr: survivants
        en: survivors
      - fr: seules les actions encore cotées
        en: only stocks still listed
    legende:
      fr: Chaque ligne se teste en décalant les données d’un jour.
      en: Each row can be tested by shifting the data by one day.
- id: c3
  type: exemple
  titre:
    fr: Mesurer la fuite
    en: Measuring the leak
  lang: python
  etapes:
  - code: 'r = rend(250, 7)  # 250 rendements journaliers simulés, sans aucun effet réel'
    fr: 'Une année de rendements aléatoires : aucune stratégie ne peut y gagner durablement. La fonction `rend` est un générateur congruentiel linéaire.'
    en: 'A year of random returns: no strategy can durably win here. The function `rend` is a linear congruential generator.'
  - code: |-
      sig = [1 if x > 0 else 0 for x in r]
      print(round(sum(s * x for s, x in zip(sig, r)), 3))
    fr: 'Le signal lit le rendement du jour : le gain vaut `1.335`, soit $133\,\%$.'
    en: 'The signal reads the day’s return: the gain is `1.335`, that is $133\%$.'
  - code: |-
      ret = [0] + sig[:-1]  # signal décalé d’un jour
      print(round(sum(s * x for s, x in zip(ret, r)), 3))
    fr: 'Décalé d’un jour, il n’utilise que le passé : le gain devient `-0.02`. La « performance » venait de la fuite.'
    en: 'Shifted by one day, it only uses the past: the gain becomes `-0.02`. The “performance” came from the leak.'
  verif: |-
    def rend(n, graine):
        s = graine
        out = []
        for _ in range(n):
            s = (1664525 * s + 1013904223) % 2 ** 32
            out.append((s / 2 ** 32 - 0.5) * 0.04)
        return out
    r = rend(250, 7)
    sig = [1 if x > 0 else 0 for x in r]
    print(round(sum(s * x for s, x in zip(sig, r)), 3))
    ret = [0] + sig[:-1]
    print(round(sum(s * x for s, x in zip(ret, r)), 3))
  sortie: |-
    1.335
    -0.02
- id: c4
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `retarder(signaux)`** : décale la liste d’un jour. Le premier signal vaut `0` (pas de position) et on retire le dernier.'
  en: 'Your turn. **Write `retarder(signaux)`**: shift the list by one day. The first signal is `0` (no position) and the last is dropped.'
  depart: |
    # écris ta fonction retarder ici
  tests: |-
    assert retarder([1, 0, 1, 1]) == [0, 1, 0, 1]
    assert retarder([1]) == [0]
    assert retarder([]) == [0]
    assert len(retarder([1, 1, 1])) == 3
  solutionCode: |
    def retarder(signaux):
        return [0] + signaux[:-1]
  indice:
    fr: Construis `[0]` suivi de `signaux` sans son dernier élément (`signaux[:-1]`).
    en: Build `[0]` followed by `signaux` without its last element (`signaux[:-1]`).
  explication:
    fr: 'Le signal décidé à la fin du jour $t-1$ s’applique au rendement du jour $t$ : c’est ce décalage qui rend le test honnête.'
    en: 'The signal decided at the end of day $t-1$ applies to day $t$’s return: this shift makes the test honest.'
- id: c5
  type: idee
  fr: 'Deuxième enquête : les **coûts**. Chaque changement de position coûte des frais, même petits. Une stratégie qui change de position presque chaque jour paie beaucoup. Son gain brut peut devenir une perte nette.'
  en: 'Second investigation: **costs**. Each change of position costs fees, even small ones. A strategy that changes position almost every day pays a lot. Its gross gain can become a net loss.'
  exemple:
    fr: Avec $0{,}1\,\%$ par changement de position, $133$ changements coûtent $13{,}3\,\%$ sur l’année.
    en: With $0.1\%$ per change of position, $133$ changes cost $13.3\%$ over the year.
- id: c6
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `rendement_net(r, pos, cout)`** : somme des `pos[i] * r[i]`, moins `cout` à chaque changement de position (`abs(pos[i] - prec)`, avec `prec = 0` au départ).'
  en: '**Write `rendement_net(r, pos, cout)`**: the sum of `pos[i] * r[i]`, minus `cout` at each change of position (`abs(pos[i] - prev)`, with `prev = 0` at the start).'
  depart: |
    # écris ta fonction rendement_net ici
  tests: |-
    assert abs(rendement_net([0.01, 0.02, -0.01], [1, 1, 0], 0.001) - 0.028) < 1e-12
    assert rendement_net([0.01, 0.02], [0, 0], 0.5) == 0
    assert abs(rendement_net([0.1], [1], 0) - 0.1) < 1e-12
  solutionCode: |
    def rendement_net(r, pos, cout):
        total = 0.0
        prec = 0
        for x, p in zip(r, pos):
            total += p * x - cout * abs(p - prec)
            prec = p
        return total
  indice:
    fr: Parcours `zip(r, pos)` en gardant `prec` ; ajoute `p * x - cout * abs(p - prec)`.
    en: Loop over `zip(r, pos)` keeping `prec`; add `p * x - cout * abs(p - prec)`.
  explication:
    fr: 'Le premier jour compte aussi : passer de `0` à `1` est déjà un changement de position.'
    en: 'The first day counts too: going from `0` to `1` is already a change of position.'
- id: c7
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Combien de changements de position dans `pos = [0, 1, 1, 0, 1, 0]` (on part de `0`) ?
  en: How many changes of position in `pos = [0, 1, 1, 0, 1, 0]` (starting from `0`)?
  reponses:
