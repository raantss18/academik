- id: c16
  type: retenir
  fr: 'À la date $t$, n’utilise que ce qui est connu à $t$ : décale le signal d’un jour. Retire les coûts de chaque changement de position. Le meilleur de $N$ essais est gonflé. Normalise sur l’entraînement seul et coupe dans l’ordre du temps.'
  en: 'At date $t$, only use what is known at $t$: shift the signal by one day. Subtract the costs of each change of position. The best of $N$ trials is inflated. Normalise on the training set alone and cut in time order.'
