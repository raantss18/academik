    en: Count the days where the value differs from the previous day’s.
  explication:
    fr: 'La position change de $0$ à $1$, de $1$ à $0$, de $0$ à $1$, puis de $1$ à $0$ : $4$ changements.'
    en: 'The position goes from $0$ to $1$, $1$ to $0$, $0$ to $1$, then $1$ to $0$: $4$ changes.'
- id: c8
  type: idee
  fr: 'Troisième enquête : la **sélection**. Si tu essaies cent stratégies et que tu ne montres que la meilleure, tu montres le plus grand coup de chance. Le rapport de Sharpe de la gagnante est **gonflé**, même si aucune stratégie n’a d’effet réel.'
  en: 'Third investigation: **selection**. If you try a hundred strategies and only show the best, you show the biggest stroke of luck. The winner’s Sharpe ratio is **inflated**, even if no strategy has any real effect.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Le piège du meilleur de cent
        en: The best-of-a-hundred trap
      noeuds:
      - fr: 100 stratégies au hasard
