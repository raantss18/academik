# Niveau 22.5 — Recherche 5 : théorie de l’information. Original academik ; notions vérifiées dans Shannon 1948 (lien) et MacKay ITILA (lien). Tous les nombres calculés par exécution.
id: '22.5'
module: 22
duree_min: 20
titre:
  fr: Entropie croisée, KL et perplexité
  en: Cross-entropy, KL and perplexity
ia:
  fr: Kintana mesure à quel point son modèle est surpris par un vrai texte, avec la perte qu’elle minimise à l’entraînement.
  en: Kintana measures how surprised her model is by a real text, using the loss she minimises during training.
