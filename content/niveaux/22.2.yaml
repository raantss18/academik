# Niveau 22.2 — Recherche 2 : récurrence en Lean 4. Original academik ; notions vérifiées dans Theorem Proving in Lean 4 (Apache-2.0). Preuves et messages d’erreur obtenus avec Lean 4.35 ; calculs exécutés.
id: '22.2'
module: 22
duree_min: 19
titre:
  fr: La récurrence en Lean
  en: Induction in Lean
ia:
  fr: Kintana prouve en Lean qu’une formule vaut pour tous les entiers, et pas seulement pour ceux qu’elle a testés.
  en: Kintana proves in Lean that a formula holds for every integer, not only for those she tested.
