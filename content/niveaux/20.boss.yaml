    # écris ta fonction dossier ici
  tests: |-
    carte = {"usage": "cours", "donnees": "corpus", "limites": "erreurs", "licence": "Apache-2.0"}
    d = dossier(182, 200, {"fr": 0.92, "mg": 0.85}, carte, "ab12")
    assert d["decision"] == {"go": True, "raisons": []}
    assert d["exactitude"] == (0.862, 0.942)
    assert d["impact"] == 0.924
    d2 = dossier(18, 20, {"fr": 0.9, "mg": 0.9}, carte, "x")
    assert d2["decision"]["go"] is False and d2["impact"] == 1.0
  solutionCode: |
    import math

    def intervalle_wilson(k, n, z=1.96):
        p = k / n
        d = 1 + z * z / n
        centre = (p + z * z / (2 * n)) / d
        marge = z * math.sqrt(p * (1 - p) / n + z * z / (4 * n * n)) / d
        return centre - marge, centre + marge

    def ratio_impact(taux):
        return min(taux.values()) / max(taux.values())

    def champs_manquants(carte, requis):
        return [c for c in requis if not carte.get(c)]

    REQUIS = ["usage", "donnees", "limites", "licence"]
    SEUIL_EXACTITUDE = 0.80
    SEUIL_IMPACT = 0.80

    def decision_livraison(bons, total, taux_groupes, carte, empreinte):
        raisons = []
        bas, _ = intervalle_wilson(bons, total)
        if bas < SEUIL_EXACTITUDE:
            raisons.append("exactitude")
        if ratio_impact(taux_groupes) < SEUIL_IMPACT:
            raisons.append("equite")
        if champs_manquants(carte, REQUIS):
            raisons.append("fiche")
        if not empreinte:
            raisons.append("reproductibilite")
        return {"go": len(raisons) == 0, "raisons": raisons}

    def dossier(bons, total, taux_groupes, carte, empreinte):
        bas, haut = intervalle_wilson(bons, total)
        return {"decision": decision_livraison(bons, total, taux_groupes, carte, empreinte), "exactitude": (round(bas, 3), round(haut, 3)), "impact": round(ratio_impact(taux_groupes), 3)}
  indice:
    fr: 'Trois ingrédients : la décision, l’intervalle arrondi, le ratio d’impact arrondi, rangés dans un dictionnaire.'
    en: 'Three ingredients: the decision, the rounded interval, the rounded impact ratio, stored in a dictionary.'
  explication:
    fr: 'Tu as écrit la dernière brique : un assistant livré avec sa preuve, son incertitude et ses limites.'
    en: 'You have written the last brick: an assistant shipped with its proof, its uncertainty and its limits.'
