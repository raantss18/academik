  - id: c8
    type: retenir
    fr: 'Rétropropagation : pente 1 sur la sortie, puis on remonte le graphe ; chaque nœud passe à ses parents sa pente multipliée par la dérivée locale ; les pentes s’additionnent (`+=`). On vérifie par différence centrée.'
    en: 'Backpropagation: slope 1 on the output, then go back up the graph; each node passes to its parents its slope times the local derivative; slopes add up (`+=`). Check by central difference.'
