# Niveau 11.3 — Réseaux de neurones 3 : la rétropropagation. Original academik ; notions vérifiées dans Goodfellow, Bengio et Courville, Deep Learning (chap. 6.5, rétropropagation, lecture en ligne, texte non repris), dans la série « Zero to Hero » d'A. Karpathy (citée, code non repris) et dans les niveaux 5.7 et 11.2.
id: '11.3'
module: 11
duree_min: 16
titre: { fr: 'Rétropropagation', en: 'Backpropagation' }
ia: { fr: 'Kintana calcule d’un seul coup l’influence de chaque réglage sur l’erreur, en parcourant le graphe à l’envers.', en: 'Kintana computes in one go the influence of each setting on the error, by walking the graph backwards.' }
