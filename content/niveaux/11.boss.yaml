  - id: c3
    type: exemple
    titre: { fr: 'Le réseau avant l’entraînement', en: 'The network before training' }
    lang: python
    etapes:
      - { code: 'r = Reseau([2, 3, 1], 7)', fr: 'On crée un réseau à 13 réglages tirés avec une graine fixée : le résultat est reproductible.', en: 'We create a network with 13 settings drawn with a fixed seed: the result is reproducible.' }
      - { code: 'print(len(r.parametres()))', fr: 'On compte les réglages : 13, soit $(2+1)\times3+(3+1)\times1$.', en: 'We count the settings: 13, that is $(2+1)\times3+(3+1)\times1$.' }
      - { code: 'print(round(perte_quadratique(r, xs, ys).data, 3))', fr: 'La perte initiale est élevée : `6.406`. Le réseau n’a encore rien appris.', en: 'The initial loss is high: `6.406`. The network has learned nothing yet.' }
    verif: |-
      import math
      class Valeur:
          def __init__(self, data, enfants=()):
              self.data = data; self.grad = 0.0; self._enfants = enfants; self._retour = lambda: None
          def __add__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data + autre.data, (self, autre))
              def retour():
                  self.grad += s.grad; autre.grad += s.grad
              s._retour = retour; return s
          def __mul__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data * autre.data, (self, autre))
              def retour():
                  self.grad += autre.data * s.grad; autre.grad += self.data * s.grad
              s._retour = retour; return s
          def tanh(self):
              t = math.tanh(self.data); s = Valeur(t, (self,))
              def retour():
                  self.grad += (1 - t * t) * s.grad
              s._retour = retour; return s
          __radd__ = __add__; __rmul__ = __mul__
          def __neg__(self): return self * -1
          def __sub__(self, autre): return self + (-autre if isinstance(autre, Valeur) else -autre)
          def retropropager(self):
              ordre, vus = [], set()
              def visiter(v):
                  if id(v) in vus: return
                  vus.add(id(v))
                  for e in v._enfants: visiter(e)
                  ordre.append(v)
              visiter(self); self.grad = 1.0
              for v in reversed(ordre): v._retour()
      def init(n, graine):
          s = graine; out = []
          for _ in range(n):
              s = (s * 1103515245 + 12345) % 2147483648
              out.append((s / 2147483648) * 2 - 1)
          return out
      class Reseau:
          def __init__(self, tailles, graine=7):
              poids = iter(init(sum((a + 1) * b for a, b in zip(tailles, tailles[1:])), graine))
              self.couches = [[([Valeur(next(poids)) for _ in range(a)], Valeur(next(poids))) for _ in range(b)] for a, b in zip(tailles, tailles[1:])]
          def parametres(self): return [p for c in self.couches for w, b in c for p in w + [b]]
          def __call__(self, x):
              for c in self.couches:
                  x = [sum((wi * xi for wi, xi in zip(w, x)), b).tanh() for w, b in c]
              return x[0]
      xs = [[0, 0], [0, 1], [1, 0], [1, 1]]
      ys = [-1, 1, 1, -1]

      def perte_quadratique(reseau, xs, ys):
          total = Valeur(0.0)
          for x, y in zip(xs, ys):
              ecart = reseau(x) - y
              total = total + ecart * ecart
          return total

      def mettre_a_jour(parametres, eta):
          for p in parametres:
              p.data -= eta * p.grad
              p.grad = 0.0

      r = Reseau([2, 3, 1], 7)
      print(len(r.parametres()))
      print(round(perte_quadratique(r, xs, ys).data, 3))
    sortie: |-
      13
      6.406
  - id: d_precision
    type: idee
    fr: 'La perte dit à quel point le réseau se trompe, mais elle est abstraite. La **précision** est plus parlante : la part des exemples où le **signe** de la prédiction est celui de la cible.'
    en: 'The loss says how wrong the network is, but it is abstract. The **accuracy** is more telling: the share of examples where the **sign** of the prediction is that of the target.'
    exemple: { fr: 'Prédictions `0.8, -0.3, 0.6, 0.2` pour les cibles `1, 1, -1, 1` : seuls les signes des positions 1 et 4 sont corrects. On compte 2 sur 4, soit une précision de $0{,}5$.', en: 'Predictions `0.8, -0.3, 0.6, 0.2` for targets `1, 1, -1, 1`: only the signs at positions 1 and 4 are correct. That is 2 out of 4, an accuracy of $0.5$.' }
