  - id: d_bug
    type: idee
    fr: 'Un réseau qui n’apprend pas est presque toujours un bug de boucle, pas de maths. Les trois suspects : **pentes jamais remises à zéro**, **pas $\eta$ trop grand** (la perte monte), **mise à jour oubliée** (la perte ne bouge pas).'
    en: 'A network that does not learn is almost always a loop bug, not a maths bug. The three suspects: **slopes never reset**, **step $\eta$ too large** (the loss rises), **update forgotten** (the loss does not move).'
    figure:
      kind: tableau
      entetes: [{ fr: 'Symptôme', en: 'Symptom' }, { fr: 'Cause probable', en: 'Likely cause' }]
      cellules:
        - [{ fr: 'La perte explose', en: 'The loss explodes' }, { fr: '$\eta$ trop grand', en: '$\eta$ too large' }]
        - [{ fr: 'La perte ne bouge pas', en: 'The loss does not move' }, { fr: 'mise à jour oubliée', en: 'update forgotten' }]
        - [{ fr: 'La perte oscille', en: 'The loss oscillates' }, { fr: 'pentes non remises à zéro', en: 'slopes not reset' }]
      legende: { fr: 'Toujours tracer la perte à chaque époque : c’est ton thermomètre.', en: 'Always record the loss at each epoch: it is your thermometer.' }
  - id: c5
    type: qcm
    note: { kind: quiz, poids: 1 }
    fr: 'Ton réseau a une perte qui reste exactement à `6.406` à chaque époque. Quelle est la cause la plus probable ?'
    en: 'Your network has a loss that stays exactly at `6.406` at every epoch. What is the most likely cause?'
    choix:
      - { fr: 'La mise à jour des réglages n’est jamais appelée', en: 'The settings update is never called', juste: true }
      - { fr: 'Le pas $\eta$ est beaucoup trop grand', en: 'The step $\eta$ is far too large' }
      - { fr: 'Les pentes ne sont pas remises à zéro', en: 'The slopes are not reset' }
    indice: { fr: 'Si la perte ne change pas du tout, les réglages ne changent pas : qui les modifie ?', en: 'If the loss does not change at all, the settings do not change: who modifies them?' }
    explication: { fr: 'Un pas trop grand ferait diverger la perte, des pentes non remises à zéro la feraient osciller. Une perte **figée** signale des réglages jamais modifiés.', en: 'A step too large would make the loss diverge, slopes not reset would make it oscillate. A **frozen** loss signals settings never modified.' }
  - id: d_trace
    type: idee
    fr: 'Pour savoir si l’entraînement marche, garde la perte de chaque époque dans une liste. Une courbe qui descend régulièrement est bon signe ; une courbe plate ou qui remonte appelle un diagnostic.'
    en: 'To know whether training works, keep each epoch’s loss in a list. A curve that goes down steadily is a good sign; a flat or rising curve calls for a diagnosis.'
    exemple: { fr: 'Pour notre réseau, la perte part de `6.4` et passe sous `0.05` en 100 époques, avec un pas de `0.2`.', en: 'For our network, the loss starts at `6.4` and falls below `0.05` within 100 epochs, with a step of `0.2`.' }
  - id: d_p_graine
    type: piege
    fr: 'Ne conclus rien d’un seul entraînement. Une autre graine donne d’autres réglages de départ, donc une autre trajectoire. Un résultat solide se vérifie sur plusieurs graines, comme au module 7.'
    en: 'Conclude nothing from one single training. Another seed gives other starting settings, hence another trajectory. A solid result is checked over several seeds, as in module 7.'
