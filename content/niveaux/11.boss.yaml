                  vus.add(id(v))
                  for e in v._enfants: visiter(e)
                  ordre.append(v)
              visiter(self); self.grad = 1.0
              for v in reversed(ordre): v._retour()
      def init(n, graine):
          s = graine; out = []
          for _ in range(n):
              s = (s * 1103515245 + 12345) % 2147483648
              out.append((s / 2147483648) * 2 - 1)
          return out
      class Reseau:
          def __init__(self, tailles, graine=7):
              poids = iter(init(sum((a + 1) * b for a, b in zip(tailles, tailles[1:])), graine))
              self.couches = [[([Valeur(next(poids)) for _ in range(a)], Valeur(next(poids))) for _ in range(b)] for a, b in zip(tailles, tailles[1:])]
          def parametres(self): return [p for c in self.couches for w, b in c for p in w + [b]]
          def __call__(self, x):
              for c in self.couches:
                  x = [sum((wi * xi for wi, xi in zip(w, x)), b).tanh() for w, b in c]
              return x[0]
      xs = [[0, 0], [0, 1], [1, 0], [1, 1]]
      ys = [-1, 1, 1, -1]

      def perte_quadratique(reseau, xs, ys):
          total = Valeur(0.0)
          for x, y in zip(xs, ys):
              ecart = reseau(x) - y
              total = total + ecart * ecart
          return total

      def mettre_a_jour(parametres, eta):
          for p in parametres:
              p.data -= eta * p.grad
              p.grad = 0.0

      def precision(reseau, xs, ys):
          bons = 0
          for x, y in zip(xs, ys):
              if (reseau(x).data > 0) == (y > 0):
                  bons += 1
          return bons / len(xs)

      def entrainer_xor(graine, epoques, eta):
          reseau = Reseau([2, 3, 1], graine)
          for _ in range(epoques):
              perte = perte_quadratique(reseau, xs, ys)
              for p in reseau.parametres():
                  p.grad = 0.0
              perte.retropropager()
              mettre_a_jour(reseau.parametres(), eta)
          return perte_quadratique(reseau, xs, ys).data, precision(reseau, xs, ys)
    indice: { fr: 'Crée le réseau, répète la boucle de 11.4 `epoques` fois, puis renvoie `(perte_quadratique(...).data, precision(...))`.', en: 'Create the network, repeat the loop of 11.4 `epoques` times, then return `(perte_quadratique(...).data, precision(...))`.' }
    explication: { fr: 'Tu as écrit un micrograd complet : un réseau qui apprend XOR avec une précision de `1.0`. Les grands modèles font la même chose, en beaucoup plus grand.', en: 'You wrote a complete micrograd: a network that learns XOR with an accuracy of `1.0`. Large models do the same thing, only much bigger.' }
