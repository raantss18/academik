    fr: 'Pour entraîner un réseau, quel est l’ordre correct d’un pas d’apprentissage ?'
    en: 'To train a network, what is the correct order of a learning step?'
    choix:
      - { fr: 'Perte, pentes à zéro, rétropropagation, mise à jour', en: 'Loss, slopes to zero, backpropagation, update', juste: true }
      - { fr: 'Mise à jour, perte, rétropropagation, pentes à zéro', en: 'Update, loss, backpropagation, slopes to zero' }
      - { fr: 'Rétropropagation, perte, mise à jour, pentes à zéro', en: 'Backpropagation, loss, update, slopes to zero' }
