id: '0.4'
module: 0
duree_min: 12
titre: { fr: 'Tiroirs', en: 'The pigeonhole principle' }
ia: { fr: 'Kintana détecte quand une collision de codes est inévitable.', en: 'Kintana detects when a code collision is unavoidable.' }
sources:
  - titre: MIT — Mathematics for Computer Science, counting
    url: https://courses.csail.mit.edu/6.042/spring18/mcs.pdf
    licence: CC BY-SA 3.0 ; référence, rédaction originale
  - { titre: 'COMIMa — Principe des tiroirs, chapitre 3 (cours et recueil)', url: 'https://www.comima.mg', licence: 'Textes Antsa : autorisation du 2026-11-01 ; tiers exclus' }
  - { titre: 'MIT OCW — 18.200, Lecture 1: Pigeonhole Principle (2024)', url: 'https://ocw.mit.edu/courses/18-200-principles-of-discrete-applied-mathematics-spring-2024/resources/mit18_200_s24_lec01_pdf/', licence: 'CC BY-NC-SA 4.0 ; vérification en ligne, aucun extrait repris' }
cartes:
  - id: c1
    indice: { fr: 'Cherche la pire répartition : combien de messages par dossier si on les étale le plus possible ?', en: 'Look for the worst distribution: how many messages per folder if spread out as much as possible?' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana range $5$ messages dans $4$ dossiers, chacun dans un seul dossier. Quel est le plus grand nombre de messages qu’on peut garantir dans au moins un dossier ?'
    en: 'Kintana places $5$ messages in $4$ folders, each in exactly one folder. What is the largest number of messages guaranteed to occur in at least one folder?'
    choix:
      - { fr: '1', en: '1' }
      - { fr: '2', en: '2', juste: true }
      - { fr: '3', en: '3' }
    verif: "from itertools import product\nprint(min(max(a.count(i) for i in range(4)) for a in product(range(4), repeat=5)))"
    sortie: '2'
    explication: { fr: 'Au plus un message par dossier ne logerait que $4$ messages ; la répartition $2,1,1,1$ montre qu’on ne peut pas garantir $3$.', en: 'At most one message per folder would hold only $4$ messages; the distribution $2,1,1,1$ shows that $3$ cannot be guaranteed.' }
  - id: c2
    type: idee
    fr: '**Principe des tiroirs** : si l’on range plus d’objets qu’il n’y a de tiroirs, au moins un tiroir contient **deux** objets ou plus. On ne sait pas lequel, mais on est sûr qu’il existe.'
    en: '**Pigeonhole principle**: if you put more objects than there are drawers, at least one drawer holds **two** objects or more. We do not know which one, but we are sure it exists.'
    figure:
      kind: schema
      lignes:
        - titre: { fr: '$4$ chaussettes, $3$ tiroirs : on remplit au mieux', en: '$4$ socks, $3$ drawers: spread them out as much as possible' }
          noeuds: [{ fr: 'tiroir 1 : $1$', en: 'drawer 1: $1$' }, { fr: 'tiroir 2 : $1$', en: 'drawer 2: $1$' }, { fr: 'tiroir 3 : $1$', en: 'drawer 3: $1$' }, { fr: 'la 4e : doublon forcé', en: 'the 4th: forced double', ton: bad }]
      legende: { fr: 'Même en évitant les doublons le plus longtemps possible, la 4e chaussette tombe dans un tiroir déjà occupé.', en: 'Even avoiding doubles as long as possible, the 4th sock lands in an occupied drawer.' }
  - id: d_boxes
    type: idee
    fr: Un tiroir représente une catégorie, pas nécessairement un meuble. Chaque objet doit appartenir à une seule catégorie parmi celles comptées.
    en: A drawer represents a category, not necessarily furniture. Each object must belong to exactly one of the counted categories.
  - id: d_basic
    type: exemple
    titre:
      fr: Nommer les objets et les tiroirs
      en: Naming objects and drawers
    etapes:
      - fr: "Cinq résultats reçoivent chacun une couleur : bleu ou vert. Les résultats sont les objets, les deux couleurs sont les tiroirs."
        en: "Five results each receive a colour: blue or green. Results are objects; the two colours are drawers."
      - fr: Avec un seul résultat par couleur, on n’en placerait que deux. Une couleur est donc nécessairement répétée.
        en: With only one result per colour, we could place only two. A colour must therefore be repeated.
    verif: print(5>2)
    sortie: "True"
  - id: d_p_boxes
    type: piege
    fr: Compter les noms de fichiers comme tiroirs ne convient pas si le classement utilise les couleurs. Les catégories doivent correspondre au regroupement cherché.
    en: Counting filenames as drawers does not work if classification uses colours. Categories must match the grouping being sought.
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'On range 7 objets dans 3 tiroirs. Combien d’objets au moins dans un même tiroir ?'
    en: 'We put 7 objects in 3 drawers. At least how many objects in one same drawer?'
    choix:
      - { fr: '2', en: '2' }
      - { fr: '3', en: '3', juste: true }
      - { fr: '7', en: '7' }
    explication: { fr: 'Avec 2 objets par tiroir au plus, on en placerait 6 seulement : le septième impose 3 dans un tiroir.', en: 'With at most 2 objects per drawer, only 6 would fit: the seventh forces 3 into one drawer.' }
    indice: { fr: 'Combien d’objets rentrent si chaque tiroir en a au plus deux ?', en: 'How many objects fit if each drawer has at most two?' }
  - id: c2a
    type: idee
    fr: '**Version générale** : avec $m$ tiroirs, $qm+1$ objets imposent au moins $q+1$ objets dans un même tiroir. Sinon, chaque tiroir en aurait au plus $q$, soit au plus $qm$ objets en tout.'
    en: '**General version**: with $m$ drawers, $qm+1$ objects force at least $q+1$ objects into one drawer. Otherwise each drawer would hold at most $q$, so at most $qm$ objects in total.'
    exemple: { fr: '$m=3$ tiroirs et $q=2$ : avec $2\times3+1=7$ objets, un tiroir en contient au moins $3$. Avec $6$ objets, $2+2+2$ l’évite.', en: '$m=3$ drawers and $q=2$: with $2\times3+1=7$ objects, some drawer holds at least $3$. With $6$ objects, $2+2+2$ avoids it.' }
  - id: c3
    type: exemple
    titre: { fr: 'Dimensionner des étiquettes', en: 'Sizing a label system' }
    etapes:
      - { fr: 'Kintana attribue à chaque fichier une des $3$ étiquettes A, B, C ; les fichiers sont les objets, les étiquettes les tiroirs.', en: 'Kintana assigns each file one of $3$ labels A, B, C; files are the objects and labels are the boxes.' }
      - { fr: 'Avec au plus $2$ fichiers par étiquette, on peut étiqueter au plus $6$ fichiers.', en: 'With at most $2$ files per label, we can label at most $6$ files.' }
      - { fr: 'Un septième impose une étiquette utilisée au moins $3$ fois ; cela ne dit pas laquelle.', en: 'A seventh forces some label to be used at least $3$ times; it does not tell us which one.' }
  - id: d_capacity
    type: exemple
    titre:
      fr: Capacité et seuil
      en: Capacity and threshold
    etapes:
      - fr: Avec cinq boîtes, cherchons à forcer quatre objets dans une boîte. Évitons d’abord cette situation.
        en: With five boxes, aim to force four objects into one box. First avoid that situation.
      - fr: Trois objets par boîte donnent une capacité de $5\times3=15$. Le seizième force une boîte à en contenir quatre.
        en: Three objects per box give a capacity of $5\times3=15$. The sixteenth forces one box to hold four.
      - fr: La répartition $3,3,3,3,3$ montre que quinze ne suffisent pas à garantir quatre.
        en: The distribution $3,3,3,3,3$ shows that fifteen do not guarantee four.
    verif: print(sum([3]*5)+1)
    sortie: "16"
  - id: d_p_guarantee
    type: piege
    fr: Le principe ne choisit pas la boîte pleine. Une boîte précise peut rester vide alors qu’une autre dépasse le seuil.
    en: The principle does not choose the full box. A specific box may remain empty while another exceeds the threshold.
  - id: c4
    indice: { fr: 'Combien d’étiquettes différentes peut-on distribuer sans jamais en répéter une ? Ajoute un fichier de plus.', en: 'How many different labels can be handed out without ever repeating one? Add one more file.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Il existe $6$ étiquettes possibles. Quel nombre minimal de fichiers garantit une étiquette partagée ?'
    en: 'There are $6$ possible labels. What minimum number of files guarantees a shared label?'
    reponses: ['7']
    verif: 'capacity=6; print(capacity+1)'
    explication: { fr: '$6$ fichiers peuvent avoir chacun leur étiquette ; le septième impose une répétition.', en: '$6$ files can each have their own label; the seventh forces a repetition.' }
  - id: c5
    indice: { fr: 'Le principe garantit qu’un tiroir est bien rempli, mais pas lequel. Regarde les mots de chaque réponse.', en: 'The principle guarantees that some drawer is well filled, but not which one. Look at the words of each answer.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Parmi $7$ fichiers portant chacun une étiquette A, B ou C, que garantit le principe ?'
    en: 'Among $7$ files each labelled A, B or C, what does the principle guarantee?'
    choix:
      - { fr: 'A est utilisée au moins trois fois.', en: 'A is used at least three times.' }
      - { fr: 'Chaque étiquette est utilisée au moins trois fois.', en: 'Every label is used at least three times.' }
      - { fr: 'Une étiquette, pas nécessairement A, est utilisée au moins trois fois.', en: 'Some label, not necessarily A, is used at least three times.', juste: true }
    explication: { fr: 'Le principe garantit l’existence d’un tiroir assez rempli, pas son identité ni le remplissage des autres.', en: 'The principle guarantees the existence of a sufficiently full box, not its identity or the occupancy of the others.' }
  - id: c6
    indice: { fr: 'Calcule la capacité maximale sans dossier à 3 messages, puis ajoute un message.', en: 'Compute the maximum capacity without any folder holding 3 messages, then add one message.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Kintana dispose de $4$ dossiers. Combien de messages faut-il au minimum pour garantir qu’un dossier en contienne au moins $3$ ?'
    en: 'Kintana has $4$ folders. What minimum number of messages guarantees that a folder contains at least $3$?'
    reponses: ['9']
    verif: 'folders=4; limit_without_target=2; print(folders*limit_without_target+1)'
    explication: { fr: '$8$ messages peuvent se répartir $2,2,2,2$ ; le neuvième dépasse cette capacité.', en: '$8$ messages can be distributed as $2,2,2,2$; the ninth exceeds that capacity.' }
  - id: d_product
    type: idee
    fr: Pour compter des codes, on compte les choix à chaque position. Si chaque choix laisse les mêmes possibilités ensuite, on multiplie ces nombres.
    en: To count codes, count the choices at each position. If every choice leaves the same possibilities afterwards, multiply those numbers.
  - id: d_codes
    type: exemple
    titre:
      fr: Énumérer avant de multiplier
      en: Listing before multiplying
    etapes:
      - fr: "Première position : A ou B. Deuxième position : 0, 1 ou 2. Les deux positions ont des rôles distincts."
        en: "First position: A or B. Second position: 0, 1 or 2. The positions have distinct roles."
      - fr: "Après A : A0, A1, A2. Après B : B0, B1, B2. Il y a $2\\times3=6$ codes."
        en: "After A: A0, A1, A2. After B: B0, B1, B2. There are $2\\times3=6$ codes."
    verif: |-
      from itertools import product
      print(len(list(product("AB","012"))))
    sortie: "6"
  - id: d_p_codes
    type: piege
    fr: Additionner deux et trois compte les symboles disponibles, pas les codes à deux positions. Il faut compter les associations possibles.
    en: Adding two and three counts available symbols, not two-position codes. Count the possible combinations instead.
  - id: c7
    indice: { fr: 'Pour chaque position, combien de lettres sont possibles ? Multiplie les choix des deux positions.', en: 'For each position, how many letters are possible? Multiply the choices for the two positions.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Un code de deux symboles utilise seulement A ou B à chaque position, avec répétition permise. Combien de codes distincts existent ?'
    en: 'A two-symbol code uses only A or B at each position, with repetition allowed. How many distinct codes exist?'
    reponses: ['4']
    verif: "from itertools import product\nprint(len(list(product('AB',repeat=2))))"
    explication: { fr: 'Les codes sont AA, AB, BA et BB : deux choix à chacune des deux positions.', en: 'The codes are AA, AB, BA and BB: two choices at each of the two positions.' }
  - id: c8
    indice: { fr: 'Combien de codes y a-t-il ? Répartis les 10 messages le plus équitablement possible.', en: 'How many codes are there? Spread the 10 messages as evenly as possible.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Kintana attribue un de ces codes AA, AB, BA, BB à chacun de $10$ messages. Quel est le plus grand nombre de messages garanti pour au moins un code ?'
    en: 'Kintana assigns one of AA, AB, BA, BB to each of $10$ messages. What is the largest number of messages guaranteed to share some code?'
    reponses: ['3']
    verif: "from itertools import product\nprint(min(max(counts) for counts in product(range(11),repeat=4) if sum(counts)==10))"
    explication: { fr: 'Deux par code n’en logeraient que $8$ ; $3,3,2,2$ montre que $4$ ne sont pas garantis.', en: 'Two per code would hold only $8$; $3,3,2,2$ shows that $4$ are not guaranteed.' }
  - id: c9
    indice: { fr: 'Une collision est-elle forcée, ou seulement possible ? Imagine un fichier par étiquette.', en: 'Is a collision forced, or only possible? Imagine one file per label.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Si le nombre de fichiers égale le nombre d’étiquettes disponibles, une collision est-elle obligatoire ?'
    en: 'If the number of files equals the number of available labels, is a collision compulsory?'
    choix:
      - { fr: 'Oui, toujours.', en: 'Yes, always.' }
      - { fr: 'Non : une étiquette différente par fichier est possible.', en: 'No: a different label for each file is possible.', juste: true }
      - { fr: 'Non, et une collision est impossible.', en: 'No, and a collision is impossible.' }
    explication: { fr: 'Une collision reste possible si on réutilise une étiquette, mais elle n’est pas forcée.', en: 'A collision remains possible if a label is reused, but it is not forced.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Les codes ont trois symboles, chacun A ou B. Quel nombre minimal de messages garantit que trois messages partagent exactement le même code ?'
    en: 'Challenge. Codes have three symbols, each A or B. What minimum number of messages guarantees that three messages share exactly the same code?'
    reponses: ['17']
    verif: "from itertools import product\ncodes=list(product('AB',repeat=3))\nprint(2*len(codes)+1)"
    indice: { fr: 'Compte les codes, puis la capacité avec au plus deux messages par code.', en: 'Count the codes, then the capacity with at most two messages per code.' }
    explication: { fr: 'Il y a $2^3=8$ codes ; $16$ messages peuvent en utiliser chacun deux fois, mais $17$ imposent un troisième message pour un code.', en: 'There are $2^3=8$ codes; $16$ messages can use each twice, but $17$ force a third message for some code.' }
  - id: c11
    type: idee
    fr: 'Récap : nomme les objets et les tiroirs, calcule combien on peut en ranger **sans** le regroupement cherché, puis ajoute un objet.'
    en: 'Recap: name the objects and the drawers, count how many fit **without** the grouping you look for, then add one object.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Question', en: 'Question' }, { fr: 'Capacité sans regroupement', en: 'Capacity without grouping' }, { fr: 'Seuil', en: 'Threshold' }]
      cellules:
        - [{ fr: 'un doublon parmi $m$ tiroirs', en: 'a double among $m$ drawers' }, '$m$', { fr: '$m+1$', en: '$m+1$', ton: ok }]
        - [{ fr: '$q+1$ dans un même tiroir', en: '$q+1$ in one drawer' }, '$qm$', { fr: '$qm+1$', en: '$qm+1$', ton: ok }]
      legende: { fr: 'Pour montrer que le seuil est le plus petit possible, donne aussi une répartition juste en dessous qui évite le regroupement.', en: 'To show the threshold is the smallest possible, also give a distribution just below it that avoids the grouping.' }

  - id: d_lien
    type: idee
    fr: 'Le principe des tiroirs prouve qu’une collision existe. Il expliquera pourquoi une table de hachage (niveau 3.4) en a toujours, même bien conçue.'
    en: 'The pigeonhole principle proves a collision exists. It will explain why a hash table (level 3.4) always has some, even when well designed.'
  - id: d_retenir
    type: retenir
    fr: Kintana détecte quand une collision de codes est inévitable.
    en: Kintana detects when a code collision is unavoidable.
  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [MIT — Mathematics for Computer Science, counting](https://courses.csail.mit.edu/6.042/spring18/mcs.pdf) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [MIT — Mathematics for Computer Science, counting](https://courses.csail.mit.edu/6.042/spring18/mcs.pdf); this optional reading needs a connection.
