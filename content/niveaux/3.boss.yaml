id: '3.boss'
module: 3
duree_min: 14
titre: { fr: 'L’index inversé', en: 'The inverted index' }
ia: { fr: 'Kintana sait retrouver un document vite : index inversé, tri, recherche.', en: 'Kintana can find a document quickly: inverted indexing, sorting, and searching.' }
sources:
  - titre: Python — Data structures
    url: https://docs.python.org/3/tutorial/datastructures.html
    licence: PSF-2.0 ; exemples de la documentation également sous 0BSD
  - titre: Python — bisect
    url: https://docs.python.org/3/library/bisect.html
    licence: PSF-2.0 ; exemples de la documentation également sous 0BSD
  - titre: Pat Morin — Open Data Structures
    url: https://opendatastructures.org/ods-python/
    licence: CC BY 2.5 CA ; exercices originaux
  - titre: Manning, Raghavan, Schütze — Introduction to Information Retrieval, Inverted index
    url: https://nlp.stanford.edu/IR-book/html/htmledition/a-first-take-at-building-an-inverted-index-1.html
    licence: © Cambridge University Press ; consultation et lien uniquement ; exemples originaux non
      repris du livre
cartes:
  - id: c1
    indice: { fr: 'On part d’un mot pour retrouver des documents. Quelle structure associe un mot à des identifiants ?', en: 'We start from a word to find documents. Which structure associates a word with identifiers?' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana doit répondre souvent à « quels documents contiennent ce mot ? ». Quelle structure prépare directement cette recherche ?'
    en: 'Kintana must often answer “which documents contain this word?” Which structure directly prepares this lookup?'
    choix:
      - { fr: 'Un dictionnaire mot → ensemble d’identifiants de documents.', en: 'A dictionary mapping each word to a set of document IDs.', juste: true }
      - { fr: 'La seule longueur de chaque document.', en: 'Only the length of each document.' }
      - { fr: 'Une liste de mots sans identifiants.', en: 'A list of words without IDs.' }
    explication: { fr: 'Cet index inversé part du mot pour retrouver les documents qui le contiennent.', en: 'This inverted index starts from a word to retrieve the documents containing it.' }
  - id: c2
    type: idee
    fr: Un **index inversé** associe chaque mot aux identifiants des documents qui le contiennent. Un
      **ensemble** garde chaque identifiant une seule fois, même si le mot se répète.
    en: An **inverted index** maps each word to the IDs of documents containing it. A **set** keeps each
      ID only once, even when the word repeats.
  - id: c2b
    type: exemple
    titre:
      fr: Un corpus miniature pour préparer la mission
      en: A miniature corpus to prepare the mission
    etapes:
      - fr: "Prenons `7: pin lac pin`, `8: lac`, `9: pin`. Le corpus est cette collection de trois
          documents."
        en: "Take `7: pin lac pin`, `8: lac`, `9: pin`. The corpus is this collection of three documents."
      - fr: Pin apparaît dans les documents sept et neuf ; lac apparaît dans sept et huit.
        en: Pin occurs in documents seven and nine; lac occurs in seven and eight.
      - fr: Les trois occurrences de pin donnent seulement deux identifiants distincts.
        en: The three occurrences of pin give only two distinct IDs.
    verif: |-
      docs={7:"pin lac pin",8:"lac",9:"pin"}; index={}
      for doc,text in docs.items():
          for word in text.split(): index.setdefault(word,set()).add(doc)
      assert index["lac"]=={7,8}
      print(sorted(index["pin"]))
    sortie: "[7, 9]"
    figure:
      kind: tableau
      entetes:
        - fr: Mot
          en: Word
        - fr: Identifiants
          en: IDs
      cellules:
        - - pin
          - 7, 9
        - - lac
          - 7, 8
      legende:
        fr: L’index inverse le sens document → mots en mot → documents.
        en: The index reverses document → words into word → documents.
  - id: c2c
    type: piege
    fr: "Compter les occurrences de pin donnerait trois, mais compter ses documents donne deux : précise
      toujours ce que tu comptes."
    en: "Counting occurrences of pin gives three, but counting its documents gives two: always specify
      what you count."
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Que garde l’intersection de deux ensembles ?'
    en: 'What does the intersection of two sets keep?'
    choix:
      - { fr: 'Les éléments communs aux deux', en: 'The elements common to both', juste: true }
      - { fr: 'Tous les éléments des deux', en: 'All the elements of both' }
      - { fr: 'Les éléments d’un seul des deux', en: 'The elements of only one of them' }
    explication: { fr: 'L’intersection traduit « ET » : $A\cap B$ garde ce qui est dans $A$ et dans $B$.', en: 'The intersection translates “AND”: $A\cap B$ keeps what is in $A$ and in $B$.' }
    indice: { fr: 'L’intersection est le « ET » logique.', en: 'The intersection is the logical “AND”.' }
  - id: c2d
    type: idee
    fr: "L’**intersection** garde les éléments communs à deux ensembles. Elle traduit « ET » : $A\\cap
      B$ en mathématiques, `A & B` pour deux ensembles Python."
    en: "**Intersection** keeps elements shared by two sets. It expresses “AND”: $A\\cap B$ in
      mathematics, `A & B` for Python sets."
  - id: c2e
    type: exemple
    titre:
      fr: Deux mots exigés, un mot absent
      en: Two required words, one missing word
    etapes:
      - fr: Pour pin ET lac, on croise les ensembles `{7, 9}` et `{7, 8}` ; seul sept appartient aux deux.
        en: For pin AND lac, intersect sets `{7, 9}` and `{7, 8}`; only seven belongs to both.
      - fr: Le mot mer est absent ; `index.get("mer", set())` fournit un ensemble vide sans erreur.
        en: Word mer is absent; `index.get("mer", set())` supplies an empty set without an error.
      - fr: L’intersection avec cet ensemble vide ne contient aucun document.
        en: Intersection with that empty set contains no documents.
    verif: |-
      index={"pin":{7,9},"lac":{7,8}}
      assert index["pin"] & index["lac"]=={7}
      print(len(index.get("mer",set()) & index["pin"]))
    sortie: "0"
  - id: c2f
    type: piege
    fr: "L’union, écrite `A | B`, accepte l’un OU l’autre mot : elle ne remplace pas l’intersection pour
      une requête ET."
    en: "Union, written `A | B`, accepts either word: it cannot replace intersection for an AND query."
  - id: c2a
    type: idee
    fr: "Notre corpus : `1: 'riz eau riz'`, `2: 'eau sel'`, `3: 'riz sel'`, `4: 'eau riz sel'`. Les mots
      sont en minuscules, séparés par des espaces. Chaque occurrence est lue, même répétée."
    en: "Our corpus: `1: 'riz eau riz'`, `2: 'eau sel'`, `3: 'riz sel'`, `4: 'eau riz sel'`. Words are
      lowercase, separated by spaces. Every occurrence is read, including repetitions."
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Un index inversé associe chaque mot à quoi ?'
    en: 'An inverted index associates each word with what?'
    choix:
      - { fr: 'Aux identifiants des documents qui le contiennent', en: 'The identifiers of the documents that contain it', juste: true }
      - { fr: 'À sa longueur', en: 'Its length' }
      - { fr: 'À son numéro dans l’alphabet', en: 'Its number in the alphabet' }
    explication: { fr: 'On part du mot pour retrouver les documents, au lieu de parcourir tous les documents.', en: 'We start from the word to find the documents, instead of going through every document.' }
    indice: { fr: 'Pense à l’index à la fin d’un livre.', en: 'Think of the index at the back of a book.' }
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Construire puis interroger', en: 'Build, then query' }
    etapes:
      - { code: "docs = {1: 'riz eau riz', 2: 'eau sel', 3: 'riz sel', 4: 'eau riz sel'}\nindex = {}", fr: 'Les clés du corpus sont les identifiants des documents.', en: 'Corpus keys are document IDs.' }
      - code: "for doc, text in docs.items():\n    for word in text.split():\n        index.setdefault(word, set()).add(doc)"
        fr: '`setdefault` crée l’ensemble s’il manque ; `add` évite les identifiants répétés.'
        en: '`setdefault` creates the set if missing; `add` avoids repeated IDs.'
      - { code: "print(sorted(index['riz'] & index['eau']))", fr: 'Le résultat `[1, 4]` contient les documents ayant les deux mots.', en: 'The result `[1, 4]` contains documents with both words.' }
  - id: c3a
    type: idee
    fr: Construire l’index traite chaque occurrence de mot. Le coût moyen est $O(T)$ pour $T$
      occurrences, si hacher, comparer et ajouter coûtent un temps constant en moyenne.
    en: Building the index processes every word occurrence. Expected cost is $O(T)$ for $T$ occurrences
      if hashing, comparison, and insertion take constant expected time.
  - id: c3b
    type: exemple
    titre:
      fr: Compter avant de dédupliquer
      en: Counting before deduplicating
    etapes:
      - fr: Le corpus miniature contient trois mots dans le document sept, un dans huit et un dans neuf.
        en: The miniature corpus has three words in document seven, one in eight, and one in nine.
      - fr: La construction lit donc cinq occurrences ; les ensembles conservent quatre associations
          mot-document.
        en: Construction therefore reads five occurrences; the sets keep four word-document associations.
      - fr: Ce modèle suppose des mots de taille bornée ; des chaînes très longues ajoutent un coût de
          lecture et de hachage.
        en: This model assumes bounded word lengths; very long strings add reading and hashing costs.
    verif: |-
      docs={7:"pin lac pin",8:"lac",9:"pin"}
      assert sum(len(set(t.split())) for t in docs.values())==4
      print(sum(len(t.split()) for t in docs.values()))
    sortie: "5"
  - id: c4
    indice: { fr: 'Additionne le nombre de mots de chaque document, répétitions comprises.', en: 'Add the number of words of each document, repetitions included.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans ce corpus, combien d’occurrences de mots la construction parcourt-elle, répétitions incluses ?'
    en: 'In this corpus, how many word occurrences does construction scan, including repetitions?'
    reponses: ['10']
    verif: "docs = ['riz eau riz', 'eau sel', 'riz sel', 'eau riz sel']\nprint(sum(len(text.split()) for text in docs))"
    explication: { fr: 'Les longueurs sont $3,2,2,3$, soit $10$ occurrences ; l’ensemble retire les doublons seulement lors du stockage.', en: 'The lengths are $3,2,2,3$, giving $10$ occurrences; the set removes duplicates only when storing IDs.' }
  - id: c5
    indice: { fr: 'Cherche le mot `sel` dans chaque document du corpus et compte les documents.', en: 'Look for the word `sel` in each document of the corpus and count the documents.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Combien de documents distincts contient l’entrée `sel` de cet index ?'
    en: 'How many distinct documents does the `sel` entry in this index contain?'
    reponses: ['3']
    verif: "docs = {1: 'riz eau riz', 2: 'eau sel', 3: 'riz sel', 4: 'eau riz sel'}\nprint(len({i for i, text in docs.items() if 'sel' in text.split()}))"
    explication: { fr: '`sel` est présent dans les documents $2$, $3$ et $4$.', en: '`sel` occurs in documents $2$, $3$, and $4$.' }
  - id: c5a
    type: idee
    fr: Un ensemble ne garantit pas un affichage trié. `sorted` produit une liste ordonnée ; la
      dichotomie peut ensuite y rechercher une position d’insertion.
    en: A set does not guarantee sorted display. `sorted` produces an ordered list; binary search can
      then find an insertion position in it.
  - id: c5b
    type: exemple
    titre:
      fr: Trier, chercher, confirmer
      en: Sort, search, confirm
    etapes:
      - fr: Les identifiants `{12, 7, 10}` deviennent `[7, 10, 12]` avec `sorted`.
        en: IDs `{12, 7, 10}` become `[7, 10, 12]` with `sorted`.
      - fr: Pour onze, `bisect_left` renvoie deux ; la valeur à cette position est douze.
        en: For eleven, `bisect_left` returns two; the value at that position is twelve.
      - fr: "Onze est absent : vérifie la limite de l’indice, puis l’égalité, avant de conclure."
        en: "Eleven is absent: check the index bound, then equality, before concluding."
    verif: |-
      from bisect import bisect_left
      a=sorted({12,7,10}); i=bisect_left(a,11)
      assert a==[7,10,12] and i==2
      print(i<len(a) and a[i]==11)
    sortie: "False"
    figure:
      kind: tableau
      entetes:
        - fr: Indice
          en: Index
        - fr: Valeur triée
          en: Sorted value
      cellules:
        - - "0"
          - "7"
        - - "1"
          - "10"
        - - "2"
          - "12"
      legende:
        fr: La position d’insertion d’onze contient douze ; elle n’est pas une preuve de présence.
        en: Eleven’s insertion position holds twelve; it is not proof of membership.
  - id: c5c
    type: piege
    fr: Le tri ordonne les résultats ; il ne change pas quels documents satisfont la requête. Une
      position d’insertion peut désigner la fin de liste.
    en: Sorting orders results; it does not change which documents match the query. An insertion
      position may designate the end of the list.
  - id: c6
    indice: { fr: 'Où s’insérerait 3 dans `[1, 2, 4]` pour garder l’ordre ?', en: 'Where would 3 be inserted in `[1, 2, 4]` to keep the order?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'La liste triée des documents contenant `eau` est `[1, 2, 4]`. Quelle position donne `bisect_left` pour l’identifiant $3$ ?'
    en: 'The sorted list of documents containing `eau` is `[1, 2, 4]`. What position does `bisect_left` give for ID $3$?'
    reponses: ['2']
    verif: "from bisect import bisect_left\nprint(bisect_left([1, 2, 4], 3))"
    explication: { fr: 'La position $2$ contient $4$, pas $3$ : la position d’insertion ne prouve pas la présence.', en: 'Position $2$ contains $4$, not $3$: an insertion position does not prove membership.' }
  - id: c7
    indice: { fr: 'Quelle écriture évite l’erreur quand la clé est absente et donne un ensemble vide ?', en: 'Which writing avoids the error when the key is absent and gives an empty set?' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour une requête dont un mot est absent, quelle expression renvoie un résultat vide sans erreur ?'
    en: 'For a query with an absent word, which expression returns an empty result without an error?'
    choix:
      - { fr: '`index[''lune''] & index[''riz'']`', en: '`index[''lune''] & index[''riz'']`' }
      - { fr: '`index.get(''lune'', set()) & index.get(''riz'', set())`', en: '`index.get(''lune'', set()) & index.get(''riz'', set())`', juste: true }
      - { fr: '`index.get(''lune'', set()) | index[''riz'']`', en: '`index.get(''lune'', set()) | index[''riz'']`' }
    verif: "index = {'riz': {1, 3, 4}}\nresult = index.get('lune', set()) & index.get('riz', set())\nassert result == set()\nprint(len(result))"
    sortie: '0'
    explication: { fr: '`get` fournit un ensemble vide pour le mot absent ; l’intersection avec cet ensemble reste vide.', en: '`get` supplies an empty set for the missing word; intersecting with it stays empty.' }
  - id: c8
    indice: { fr: 'Trie les identifiants dans l’ordre croissant, puis lis le deuxième.', en: 'Sort the identifiers in increasing order, then read the second.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Tu affiches les résultats `{4, 1, 3}` en ordre croissant. Quel identifiant apparaît en deuxième ?'
    en: 'You display results `{4, 1, 3}` in ascending order. Which ID appears second?'
    reponses: ['3']
    verif: 'print(sorted({4, 1, 3})[1])'
    explication: { fr: 'Le tri produit `[1, 3, 4]` ; il rend l’ordre d’affichage explicite.', en: 'Sorting produces `[1, 3, 4]`; it makes display order explicit.' }
  - id: c8a
    type: idee
    fr: Le **BFS** explore les liens par distance croissante, avec une file « premier entré, premier
      sorti ». Marque un document dès sa découverte pour éviter les visites répétées.
    en: "**BFS** explores links in increasing distance order using a first-in, first-out queue. Mark a
      document when discovered to avoid repeated visits."
  - id: c8b
    type: exemple
    titre:
      fr: Filtrer par texte et proximité
      en: Filtering by text and proximity
    etapes:
      - fr: Les liens sont 7 → 8, 8 → 9 et 9 → 7 ; depuis sept, les distances sont zéro, un et deux.
        en: Links are 7 → 8, 8 → 9, and 9 → 7; from seven, distances are zero, one, and two.
      - fr: À distance au plus un, on garde sept et huit ; pin apparaît dans sept et neuf.
        en: Within distance one, keep seven and eight; pin appears in seven and nine.
      - fr: L’intersection conserve seulement sept ; la marque sur sept empêche le cycle de relancer le
          parcours.
        en: Intersection keeps only seven; marking seven prevents the cycle from restarting the traversal.
    verif: |-
      from collections import deque
      g={7:[8],8:[9],9:[7]}; d={7:0}; q=deque([7])
      while q:
          u=q.popleft()
          for v in g[u]:
              if v not in d: d[v]=d[u]+1; q.append(v)
      assert d=={7:0,8:1,9:2}
      print(sorted({7,9}&{v for v in d if d[v]<=1}))
    sortie: "[7]"
    figure:
      kind: tableau
      entetes:
        - fr: Filtre
          en: Filter
        - fr: Documents conservés
          en: Documents kept
      cellules:
        - - fr: Mot pin
            en: Word pin
          - 7, 9
        - - fr: Distance au plus un
            en: Distance at most one
          - 7, 8
        - - fr: Les deux critères
            en: Both criteria
          - "7"
      legende:
        fr: Le filtre textuel et le filtre de distance sont calculés séparément.
        en: Text and distance filters are computed separately.
  - id: c8c
    type: piege
    fr: "Un document proche ne contient pas forcément le mot demandé : la distance et le contenu sont
      deux conditions indépendantes à vérifier."
    en: "A nearby document does not necessarily contain the requested word: distance and content are
      separate conditions to check."
  - id: c9
    indice: { fr: 'Parcours en largeur : liste les sommets découverts à distance 1, puis à distance 2.', en: 'Breadth-first: list the vertices found at distance 1, then at distance 2.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Les liens orientés entre documents sont 1 → 2, 1 → 3, 2 → 4, 3 → 4 et 4 → 1. À quelle distance minimale de 1 se trouve 4 ?'
    en: 'Directed links between documents are 1 → 2, 1 → 3, 2 → 4, 3 → 4, and 4 → 1. What is the minimum distance from 1 to 4?'
    reponses: ['2']
    verif: "from collections import deque\ng = {1: [2, 3], 2: [4], 3: [4], 4: [1]}\nd = {1: 0}; q = deque([1])\nwhile q:\n    u = q.popleft()\n    for v in g[u]:\n        if v not in d:\n            d[v] = d[u]+1; q.append(v)\nprint(d[4])"
    explication: { fr: 'BFS découvre $2$ et $3$ à distance $1$, puis $4$ à distance $2$, une seule fois malgré les deux chemins.', en: 'BFS discovers $2$ and $3$ at distance $1$, then $4$ at distance $2$, just once despite the two paths.' }
  - id: c10
    type: piege
    fr: 'L’index accélère l’accès aux candidats, mais intersecter et afficher les résultats coûte encore du temps ; ces mots exacts ne constituent pas une recherche sémantique.'
    en: 'The index speeds up access to candidates, but intersecting and displaying results still takes time; exact words do not provide semantic search.'
  - id: c11
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Dans le corpus, garde les documents contenant `riz` ET `sel`. Garde ensuite ceux accessibles depuis 1 en au plus un lien (1 inclus), avec les liens de la carte précédente. Quel unique identifiant reste ?'
    en: 'Challenge. In the corpus, keep documents containing `riz` AND `sel`. Then keep those reachable from 1 in at most one link (including 1), using the previous card’s links. Which single ID remains?'
    reponses: ['3']
    verif: "from collections import deque\ndocs = {1: 'riz eau riz', 2: 'eau sel', 3: 'riz sel', 4: 'eau riz sel'}\nindex = {}\nfor doc, text in docs.items():\n    for word in text.split():\n        index.setdefault(word, set()).add(doc)\ng = {1: [2, 3], 2: [4], 3: [4], 4: [1]}\nd = {1: 0}; q = deque([1])\nwhile q:\n    u = q.popleft()\n    for v in g[u]:\n        if v not in d:\n            d[v] = d[u]+1; q.append(v)\nresult = sorted(index['riz'] & index['sel'] & {v for v in d if d[v] <= 1})\nassert len(result) == 1\nprint(result[0])"
    indice: { fr: 'Construis séparément l’ensemble des réponses textuelles et celui des documents proches, puis intersecte-les.', en: 'Build the set of text matches and the set of nearby documents separately, then intersect them.' }
    explication: { fr: 'Le texte donne $\{3,4\}$ ; la distance donne $\{1,2,3\}$ ; leur intersection est $\{3\}$.', en: 'The text gives $\{3,4\}$; distance gives $\{1,2,3\}$; their intersection is $\{3\}$.' }
  - id: d_lien
    type: idee
    fr: 'Tu as combiné hachage, tri, dichotomie et parcours de graphe. La boîte à outils s’enrichira avec la récursivité (niveau 3.6) et Dijkstra (niveau 3.8).'
    en: 'You combined hashing, sorting, binary search and graph traversal. The toolbox will grow with recursion (level 3.6) and Dijkstra (level 3.8).'
  - id: c12
    type: retenir
    fr: 'Kintana sait retrouver un document vite. Index inversé pour les mots, tri et dichotomie pour les listes, BFS pour les liens ; la complexité estime le coût.'
    en: 'Kintana can find a document quickly. An inverted index for words, sorting and binary search for lists, BFS for links; complexity estimates the cost.'
