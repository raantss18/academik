    type: plus
    fr: 'Pour approfondir, consulte [Forecasting: Principles and Practice — Stationnarité](https://otexts.com/fpp3/stationarity.html) ; cette lecture complémentaire demande une connexion.'
    en: 'For further study, see [Forecasting: Principles and Practice — Stationarity](https://otexts.com/fpp3/stationarity.html); this optional reading needs a connection.'
