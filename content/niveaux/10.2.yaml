# Niveau 10.2 — Séries temporelles 2 : stationnarité. Original academik ; notions vérifiées dans Hyndman et Athanasopoulos, Forecasting: Principles and Practice (lien, texte non repris) et la documentation officielle Python.
id: '10.2'
module: 10
duree_min: 19
titre: { fr: 'Stationnarité', en: 'Stationarity' }
ia: { fr: 'Kintana reconnaît une série dont le comportement reste stable, et sait différencier une série qui dérive.', en: 'Kintana recognises a series whose behaviour stays stable, and knows how to difference a series that drifts.' }
