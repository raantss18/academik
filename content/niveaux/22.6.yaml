  type: plus
  fr: Pour aller plus loin, lis [Mixtral of Experts](https://arxiv.org/abs/2401.04088) et [An Image is Worth 16x16 Words](https://arxiv.org/abs/2010.11929) ; ces articles demandent une connexion.
  en: To go further, read [Mixtral of Experts](https://arxiv.org/abs/2401.04088) and [An Image is Worth 16x16 Words](https://arxiv.org/abs/2010.11929); these papers need a connection.
