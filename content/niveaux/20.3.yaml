# Niveau 20.3 — Évaluer et produire 3 : observabilité, journaux structurés, percentiles, alertes. Original academik ; notions vérifiées dans le livre SRE de Google (lien) et la documentation OpenTelemetry (citée).
id: '20.3'
module: 20
duree_min: 20
titre:
  fr: Observer en production
  en: Observing in production
ia:
  fr: Kintana regarde son propre fonctionnement avec des journaux, des métriques et des percentiles.
  en: Kintana watches her own operation with logs, metrics and percentiles.
sources:
- titre: Google SRE Book — Monitoring Distributed Systems
  url: https://sre.google/sre-book/monitoring-distributed-systems/
  licence: CC BY-NC-ND (lecture en ligne) ; lien seulement
- titre: OpenTelemetry — Observability primer
  url: https://opentelemetry.io/docs/concepts/observability-primer/
