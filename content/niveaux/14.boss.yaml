        avgdl = sum(len(d) for d in docs.values()) / N
        q = tokeniser(question)
        notes = {}
        for i, d in docs.items():
            total = 0.0
            for t in set(q):
                tf = d.count(t)
                if tf == 0:
                    continue
                n = sum(1 for x in docs.values() if t in x)
                idf = math.log((N - n + 0.5) / (n + 0.5) + 1)
