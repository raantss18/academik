- id: c3
  type: exemple
  titre:
    fr: Interroger le corpus
    en: Querying the corpus
  lang: python
  etapes:
  - code: res = chercher("Que règle la température ?", PASSAGES)
    fr: On lance la recherche sur une question du jeu de test.
    en: We run the search on a question from the test set.
  - code: print(res[0][0], round(res[0][1], 2))
    fr: 'On affiche le meilleur passage et son score : `p4` et son score.'
    en: 'We display the best passage and its score: `p4` and its score.'
  - code: print([i for i, s in res])
    fr: On affiche le classement complet des quatre passages.
    en: We display the full ranking of the four passages.
  verif: |-
    import math
    import re

    PASSAGES = {
        "p1": "le cache kv grandit avec la longueur du contexte",
        "p2": "la quantification réduit la mémoire du modèle en utilisant moins de bits",
        "p3": "le masque causal empêche de lire les mots futurs",
        "p4": "la température règle le hasard lors du tirage du mot suivant",
    }
    QUESTIONS = {
        "Que fait la quantification ?": "p2",
        "Pourquoi un masque causal ?": "p3",
        "Que règle la température ?": "p4",
        "Comment grandit le cache kv ?": "p1",
    }

    def tokeniser(texte):
        return re.findall(r"[a-zàâçéèêëîïôûùüÿœ0-9]+", texte.lower())

    def chercher(question, passages):
        docs = {i: tokeniser(t) for i, t in passages.items()}
        N = len(docs)
        if N == 0:
            return []
        avgdl = sum(len(d) for d in docs.values()) / N
        q = tokeniser(question)
        notes = {}
        for i, d in docs.items():
            total = 0.0
            for t in set(q):
                tf = d.count(t)
                if tf == 0:
                    continue
                n = sum(1 for x in docs.values() if t in x)
                idf = math.log((N - n + 0.5) / (n + 0.5) + 1)
                total += idf * tf * 2.5 / (tf + 1.5 * (0.25 + 0.75 * len(d) / avgdl))
            notes[i] = total
        return sorted(notes.items(), key=lambda c: -c[1])
    res = chercher("Que règle la température ?", PASSAGES)
    print(res[0][0], round(res[0][1], 2))
    print([i for i, s in res])
  sortie: |-
    p4 2.68
    ['p4', 'p2', 'p1', 'p3']
- id: c4
  type: idee
  fr: Le **rappel à $k$** (recall@k) mesure la part des questions dont le bon passage figure parmi les $k$ premiers résultats. Un rappel à 3 de $0{,}9$ signifie que, pour 90 % des questions, le bon passage est dans les 3 premiers.
  en: '**Recall at $k$** (recall@k) measures the share of questions whose right passage is among the first $k$ results. A recall at 3 of $0.9$ means that for 90% of the questions, the right passage is in the top 3.'
  exemple:
    fr: Sur 4 questions, dont 3 avec le bon passage dans le premier résultat, le rappel à 1 vaut $3/4=0{,}75$.
    en: On 4 questions, 3 with the right passage in the first result, recall at 1 is $3/4=0.75$.
  figure:
    kind: tableau
    entetes:
    - fr: Question
      en: Question
    - fr: Bon passage
      en: Right passage
    - fr: Rang
      en: Rank
    cellules:
    - - Q1
      - p2
      - fr: '1'
        en: '1'
        ton: ok
    - - Q2
      - p3
      - fr: '1'
        en: '1'
        ton: ok
    - - Q3
      - p4
      - fr: '2'
        en: '2'
    legende:
      fr: 'Rappel à 1 : 2/3. Rappel à 2 : 3/3.'
      en: 'Recall at 1: 2/3. Recall at 2: 3/3.'
- id: c5
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `recall_at_k(resultats, attendus, k)`** : `resultats` associe chaque question à la liste ordonnée des identifiants renvoyés ; `attendus` associe chaque question à son bon identifiant. Renvoie la part des questions dont le bon identifiant est dans les `k` premiers.'
  en: 'Your turn. **Write `recall_at_k(resultats, attendus, k)`**: `resultats` maps each question to the ordered list of returned identifiers; `attendus` maps each question to its right identifier. Return the share of questions whose right identifier is in the first `k`.'
  depart: |
    # écris ta fonction recall_at_k ici
  tests: |-
    r = {"q1": ["a", "b", "c"], "q2": ["b", "a", "c"], "q3": ["c", "b", "a"]}
    at = {"q1": "a", "q2": "a", "q3": "a"}
    assert abs(recall_at_k(r, at, 1) - 1/3) < 1e-9
    assert abs(recall_at_k(r, at, 2) - 2/3) < 1e-9
    assert recall_at_k(r, at, 3) == 1.0
    assert recall_at_k({"q": []}, {"q": "a"}, 2) == 0.0
  solutionCode: |
    def recall_at_k(resultats, attendus, k):
        bons = 0
        for q, attendu in attendus.items():
            if attendu in resultats[q][:k]:
                bons += 1
        return bons / len(attendus)
  indice:
    fr: Compte avec `if attendu in resultats[q][:k]`, puis divise par `len(attendus)`.
    en: Count with `if attendu in resultats[q][:k]`, then divide by `len(attendus)`.
  explication:
    fr: 'Un rappel faible signifie que le problème est dans la **recherche** : le modèle n’a même pas reçu le bon passage.'
    en: 'A low recall means the problem is in the **search**: the model did not even receive the right passage.'
- id: c6
  type: saisie
  note:
