# Niveau 14.boss — Ton assistant de cours (mission : mesurer le rappel et décider de répondre ou de s’abstenir). Original academik ; notions des niveaux 14.1 à 14.5, vérifiées dans Lewis et al. 2020 (arXiv 2005.11401) et Manning, Raghavan, Schütze (cité).
id: 14.boss
module: 14
duree_min: 14
titre:
  fr: Ton assistant de cours
  en: Your course assistant
ia:
  fr: Kintana répond avec ses sources ou reconnaît qu’elle ne sait pas, et tu as mesuré sa recherche.
  en: Kintana answers with her sources or admits she does not know, and you measured her search.
sources:
- titre: Lewis et al. — Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
  url: https://arxiv.org/abs/2005.11401
  licence: Article en accès libre ; idée citée
- titre: Manning, Raghavan, Schütze — Introduction to Information Retrieval (chap. 8, évaluation)
  url: https://nlp.stanford.edu/IR-book/
  licence: Lecture en ligne ; texte non repris
cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: 'Tu as construit les briques : découpage, BM25, embeddings, fusion, citations, abstention. Comment sait-on qu’un assistant RAG est **bon** ?'
  en: 'You built the bricks: splitting, BM25, embeddings, fusion, citations, abstention. How do we know that a RAG assistant is **good**?'
  choix:
  - fr: En le testant sur des questions dont on connaît la bonne source
    en: By testing it on questions whose right source we know
    juste: true
  - fr: En le trouvant joli à l’écran
    en: By finding it pretty on screen
  - fr: En comptant ses mots
    en: By counting its words
  indice:
    fr: Pour mesurer, il faut des questions de test et leur bonne réponse connue à l’avance.
    en: To measure, we need test questions and their right answer known in advance.
  explication:
    fr: Un **jeu de test** de questions avec leur bon passage permet de mesurer, de comparer deux réglages, et de repérer une régression.
    en: A **test set** of questions with their right passage lets us measure, compare two settings, and spot a regression.
- id: c2
  type: idee
  fr: 'Mission : assembler ton assistant de cours sur un petit corpus de 4 passages. Tu écris la mesure du **rappel** de la recherche, puis la décision de répondre ou de s’abstenir. La recherche BM25 est fournie.'
  en: 'Mission: assemble your course assistant on a small corpus of 4 passages. You write the measure of the search **recall**, then the decision to answer or abstain. The BM25 search is provided.'
  exemple:
    fr: Le corpus reprend quatre notions du module 13 et du module 12.
