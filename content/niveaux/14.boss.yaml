  fr: Pour l’abstention, on règle le **seuil** de score en regardant deux populations. Il y a les questions **couvertes** par le corpus, et celles qui sont **hors sujet**. Un bon seuil se place entre les deux.
  en: 'For the abstention decision, the score **threshold** is set by looking at two populations: the scores of questions **covered** by the corpus, and those of **off-topic** questions. A good threshold sits between the two.'
  exemple:
    fr: Si les questions couvertes ont des scores de 1,2 à 2,5 et les hors-sujet de 0,1 à 0,4, un seuil à 0,8 les sépare.
    en: If the covered questions have scores from 1.2 to 2.5 and the off-topic ones from 0.1 to 0.4, a threshold of 0.8 separates them.
