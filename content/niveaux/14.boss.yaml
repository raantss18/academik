    en: 'Your assistant answers covered questions and abstains on off-topic ones: an honest RAG system, in miniature.'
- id: c10
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Un assistant reçoit 10 questions hors sujet et s’abstient sur 9 d’entre elles. Quelle part de ces questions reçoit une réponse inventée ? Donne le résultat en pourcentage, sans le signe.
  en: An assistant receives 10 off-topic questions and abstains on 9 of them. What share of these questions gets an invented answer? Give the result as a percentage, without the sign.
  reponses:
  - '10'
  verif: print(int((10 - 9) / 10 * 100))
  indice:
    fr: 'Une seule question a reçu une réponse : calcule sa part sur le total.'
    en: 'Only one question got an answer: compute its share among the 10.'
  explication:
    fr: $1/10=10\,\%$ de réponses qui auraient dû être des abstentions.
    en: $1/10=10\,\%$ of answers that should have been abstentions.
- id: c11
  type: idee
  fr: 'Pour ton vrai assistant, enchaîne les briques : passages (14.1), index BM25 et embeddings (14.2, 14.3), fusion (14.4), citations et abstention (14.5). Mesure ensuite le rappel sur ton jeu de test.'
  en: 'To move to your real assistant: split your courses into passages (14.1), build the BM25 index and the embeddings (14.2, 14.3), fuse (14.4), cite and abstain (14.5), measure recall on your test set. It all fits in a small program.'
  exemple:
    fr: 'C’est exactement ce que fait la fonction d’aide d’academik : retrouver, citer, ou dire qu’elle ne sait pas.'
    en: 'This is exactly what academik’s help feature does: retrieve, cite, or say it does not know.'
- id: c12
  type: idee
  fr: 'Le module 15 donne au modèle des **outils** : calculer, lire des fichiers, lancer du Python. Un assistant RAG est déjà un outil de recherche ; l’agent saura choisir quand l’utiliser, et les risques de sécurité apparaissent avec les données non fiables.'
  en: 'Module 15 gives the model **tools**: calculating, reading files, running Python. A RAG assistant is already a search tool; the agent will know when to use it, and security risks appear with untrusted data.'
  exemple:
    fr: Un agent peut décider seul de chercher dans tes cours, puis de faire un calcul avec le résultat.
    en: An agent can decide on its own to search your courses, then do a calculation with the result.
- id: c13
  type: retenir
  fr: 'Mesurer avant de croire : jeu de test, rappel à $k$ pour la recherche, fidélité pour la réponse. Régler le seuil d’abstention entre scores couverts et hors sujet. Tester sur des questions écrites par d’autres.'
  en: 'Measure before believing: test set, recall at $k$ for the search, faithfulness for the answer. Set the abstention threshold between covered and off-topic scores. Test on questions written by others.'
