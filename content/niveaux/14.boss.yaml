    en: 'The four questions contain a rare word from their passage: recall at 1 is `1.0`.'
- id: c7
  type: piege
  fr: Réussir sur un petit corpus que tu connais par cœur ne prouve pas grand-chose. Les questions réelles sont plus floues, le corpus plus grand, les passages plus proches les uns des autres. Mesure sur des questions écrites **par d’autres** et sur un corpus réaliste.
  en: Succeeding on a small corpus you know by heart proves little. Real questions are vaguer, the corpus larger, the passages closer to each other. Measure on questions written **by others** and on a realistic corpus.
- id: c8
