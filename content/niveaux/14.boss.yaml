  tests: |-
    assert assistant("Que règle la température ?", PASSAGES, 0.8) == "p4"
    assert assistant("Pourquoi un masque causal ?", PASSAGES, 0.8) == "p3"
    assert assistant("Quel temps fait-il demain ?", PASSAGES, 0.8) is None
    assert assistant("quantification", {}, 0.1) is None
  solutionCode: |
    import math
    import re

    PASSAGES = {
        "p1": "le cache kv grandit avec la longueur du contexte",
        "p2": "la quantification réduit la mémoire du modèle en utilisant moins de bits",
        "p3": "le masque causal empêche de lire les mots futurs",
        "p4": "la température règle le hasard lors du tirage du mot suivant",
    }
    QUESTIONS = {
        "Que fait la quantification ?": "p2",
        "Pourquoi un masque causal ?": "p3",
        "Que règle la température ?": "p4",
        "Comment grandit le cache kv ?": "p1",
    }

    def tokeniser(texte):
        return re.findall(r"[a-zàâçéèêëîïôûùüÿœ0-9]+", texte.lower())

    def chercher(question, passages):
        docs = {i: tokeniser(t) for i, t in passages.items()}
        N = len(docs)
        if N == 0:
            return []
        avgdl = sum(len(d) for d in docs.values()) / N
        q = tokeniser(question)
        notes = {}
        for i, d in docs.items():
            total = 0.0
            for t in set(q):
                tf = d.count(t)
                if tf == 0:
                    continue
                n = sum(1 for x in docs.values() if t in x)
                idf = math.log((N - n + 0.5) / (n + 0.5) + 1)
                total += idf * tf * 2.5 / (tf + 1.5 * (0.25 + 0.75 * len(d) / avgdl))
            notes[i] = total
        return sorted(notes.items(), key=lambda c: -c[1])

    def assistant(question, passages, seuil):
        res = chercher(question, passages)
        if not res or res[0][1] < seuil:
            return None
        return res[0][0]
