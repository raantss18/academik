  en: '**OWASP** publishes the **Top 10 for LLM applications** (2025). It lists: prompt injection, information disclosure, supply chain, poisoning, improper outputs, excessive agency, system prompt leakage, vectors, misinformation, unbounded consumption.'
  exemple:
