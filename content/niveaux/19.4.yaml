# Niveau 19.4 — Sécurité 4 : OWASP Top 10 LLM, triade létale, sorties et consommation. Original academik ; notions vérifiées dans le Top 10 OWASP LLM 2025 (lien) et l’article de Willison sur la triade (lien). Approche défensive.
