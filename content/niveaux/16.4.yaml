# Niveau 16.4 — Processus stochastiques 4 : espérance conditionnelle et martingales. Original academik ; notions vérifiées dans le cours 18.642 du MIT (lien) et Shreve (lien).
id: '16.4'
module: 16
duree_min: 16
titre:
  fr: Martingales
  en: Martingales
ia:
  fr: Kintana comprend pourquoi un jeu équitable ne se bat pas, et ce que vaut une prévision.
  en: Kintana understands why a fair game cannot be beaten, and what a prediction is worth.
