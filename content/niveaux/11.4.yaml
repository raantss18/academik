    explication: { fr: 'Comme le total reste une `Valeur`, le graphe va des entrées jusqu’à la perte : on pourra rétropropager.', en: 'As the total stays a `Valeur`, the graph goes from the inputs to the loss: we will be able to backpropagate.' }
  - id: d_boucle
