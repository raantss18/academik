      import math
      class Valeur:
          def __init__(self, data, enfants=()):
              self.data = data; self.grad = 0.0; self._enfants = enfants; self._retour = lambda: None
          def __add__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data + autre.data, (self, autre))
              def retour():
                  self.grad += s.grad; autre.grad += s.grad
              s._retour = retour; return s
          def __mul__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data * autre.data, (self, autre))
              def retour():
                  self.grad += autre.data * s.grad; autre.grad += self.data * s.grad
              s._retour = retour; return s
          def tanh(self):
              t = math.tanh(self.data); s = Valeur(t, (self,))
              def retour():
                  self.grad += (1 - t * t) * s.grad
              s._retour = retour; return s
          __radd__ = __add__; __rmul__ = __mul__
          def __neg__(self): return self * -1
          def __sub__(self, autre): return self + (-autre if isinstance(autre, Valeur) else -autre)
          def retropropager(self):
              ordre, vus = [], set()
              def visiter(v):
                  if id(v) in vus: return
                  vus.add(id(v))
                  for e in v._enfants: visiter(e)
                  ordre.append(v)
              visiter(self); self.grad = 1.0
              for v in reversed(ordre): v._retour()
      def init(n, graine):
          s = graine; out = []
          for _ in range(n):
              s = (s * 1103515245 + 12345) % 2147483648
              out.append((s / 2147483648) * 2 - 1)
          return out
      class Reseau:
          def __init__(self, tailles, graine=7):
              poids = iter(init(sum((a + 1) * b for a, b in zip(tailles, tailles[1:])), graine))
              self.couches = [[([Valeur(next(poids)) for _ in range(a)], Valeur(next(poids))) for _ in range(b)] for a, b in zip(tailles, tailles[1:])]
          def parametres(self): return [p for c in self.couches for w, b in c for p in w + [b]]
          def __call__(self, x):
              for c in self.couches:
                  x = [sum((wi * xi for wi, xi in zip(w, x)), b).tanh() for w, b in c]
              return x[0]
      xs = [[0, 0], [0, 1], [1, 0], [1, 1]]
      ys = [-1, 1, 1, -1]

      def perte_quadratique(reseau, xs, ys):
          total = Valeur(0.0)
          for x, y in zip(xs, ys):
              ecart = reseau(x) - y
              total = total + ecart * ecart
          return total
