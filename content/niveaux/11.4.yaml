  - id: c1
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'La règle « OU exclusif » (XOR) donne `1` quand **exactement une** des deux entrées vaut `1`. Pour les entrées `(1, 1)`, que vaut-elle ?'
    en: 'The “exclusive OR” rule (XOR) gives `1` when **exactly one** of the two inputs is `1`. For the inputs `(1, 1)`, what is it?'
    choix:
      - { fr: '`0`', en: '`0`', juste: true }
      - { fr: '`1`', en: '`1`' }
      - { fr: '`2`', en: '`2`' }
    indice: { fr: 'Combien d’entrées valent `1` pour `(1, 1)` ? Exactement une ?', en: 'How many inputs are `1` for `(1, 1)`? Exactly one?' }
    explication: { fr: 'Les deux valent `1` : ce n’est pas « exactement une ». La règle donne `0`.', en: 'Both are `1`: that is not “exactly one”. The rule gives `0`.' }
  - id: c2
    type: idee
    fr: 'XOR est le cas d’école : **aucune droite** ne sépare les cas `1` des cas `0`. Un seul neurone (niveau 11.1) trace une frontière droite et échoue. Deux couches, avec une activation, y arrivent : la première plie le plan, la seconde sépare.'
    en: 'XOR is the textbook case: **no straight line** separates the `1` cases from the `0` cases. A single neuron (level 11.1) draws a straight boundary and fails. Two layers, with an activation, succeed: the first folds the plane, the second separates.'
    figure:
      kind: tableau
      entetes: ['$x_1$', '$x_2$', { fr: 'XOR', en: 'XOR' }]
      cellules:
        - ['$0$', '$0$', '$0$']
        - ['$0$', '$1$', { fr: '$1$', en: '$1$', ton: ok }]
        - ['$1$', '$0$', { fr: '$1$', en: '$1$', ton: ok }]
        - ['$1$', '$1$', '$0$']
      legende: { fr: 'On codera les sorties par $-1$ et $1$ (au lieu de $0$ et $1$) pour utiliser $\tanh$.', en: 'We will encode outputs as $-1$ and $1$ (instead of $0$ and $1$) to use $\tanh$.' }
  - id: d_valeur
    type: idee
    fr: 'Pour ne pas écrire le graphe à la main, on utilise une petite classe **`Valeur`**, fournie. Elle garde un nombre (`data`), sa pente (`grad`) et retient comment elle a été fabriquée. Les opérations `+`, `*`, `-` et `tanh` construisent le graphe toutes seules.'
    en: 'To avoid writing the graph by hand, we use a small **`Valeur`** class, provided. It keeps a number (`data`), its slope (`grad`) and remembers how it was made. The operations `+`, `*`, `-` and `tanh` build the graph by themselves.'
    exemple: { fr: 'Avec `a = Valeur(2)`, `b = Valeur(3)` et `e = a * b + 4`, l’appel `e.retropropager()` remplit `a.grad` (`3`) et `b.grad` (`2`), exactement comme le niveau 11.3.', en: 'With `a = Valeur(2)`, `b = Valeur(3)` and `e = a * b + 4`, the call `e.retropropager()` fills `a.grad` (`3`) and `b.grad` (`2`), exactly as in level 11.3.' }
  - id: c3
    type: exemple
    titre: { fr: 'La classe Valeur en action', en: 'The Valeur class in action' }
    lang: python
    etapes:
      - { code: "a, b = Valeur(2), Valeur(3)\ne = a * b + 4", fr: 'On écrit la formule normalement : `Valeur` construit le graphe.', en: 'We write the formula normally: `Valeur` builds the graph.' }
      - { code: 'e.retropropager()', fr: 'Un seul appel parcourt le graphe à l’envers et remplit les pentes.', en: 'A single call walks the graph backwards and fills in the slopes.' }
      - { code: 'print(e.data, a.grad, b.grad)', fr: 'On affiche `10 3.0 2.0` : la valeur, puis les deux pentes.', en: 'We display `10 3.0 2.0`: the value, then the two slopes.' }
    verif: |-
      import math
      class Valeur:
          def __init__(self, data, enfants=()):
              self.data = data; self.grad = 0.0; self._enfants = enfants; self._retour = lambda: None
          def __add__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data + autre.data, (self, autre))
              def retour():
                  self.grad += s.grad; autre.grad += s.grad
              s._retour = retour; return s
          def __mul__(self, autre):
              autre = autre if isinstance(autre, Valeur) else Valeur(autre)
              s = Valeur(self.data * autre.data, (self, autre))
              def retour():
                  self.grad += autre.data * s.grad; autre.grad += self.data * s.grad
              s._retour = retour; return s
          def tanh(self):
              t = math.tanh(self.data); s = Valeur(t, (self,))
              def retour():
                  self.grad += (1 - t * t) * s.grad
              s._retour = retour; return s
          __radd__ = __add__; __rmul__ = __mul__
          def __neg__(self): return self * -1
          def __sub__(self, autre): return self + (-autre if isinstance(autre, Valeur) else -autre)
          def retropropager(self):
              ordre, vus = [], set()
              def visiter(v):
                  if id(v) in vus: return
                  vus.add(id(v))
                  for e in v._enfants: visiter(e)
                  ordre.append(v)
              visiter(self); self.grad = 1.0
              for v in reversed(ordre): v._retour()
      def init(n, graine):
          s = graine; out = []
          for _ in range(n):
              s = (s * 1103515245 + 12345) % 2147483648
              out.append((s / 2147483648) * 2 - 1)
          return out
      class Reseau:
          def __init__(self, tailles, graine=7):
              poids = iter(init(sum((a + 1) * b for a, b in zip(tailles, tailles[1:])), graine))
              self.couches = [[([Valeur(next(poids)) for _ in range(a)], Valeur(next(poids))) for _ in range(b)] for a, b in zip(tailles, tailles[1:])]
          def parametres(self): return [p for c in self.couches for w, b in c for p in w + [b]]
          def __call__(self, x):
              for c in self.couches:
                  x = [sum((wi * xi for wi, xi in zip(w, x)), b).tanh() for w, b in c]
              return x[0]
      a, b = Valeur(2), Valeur(3)
      e = a * b + 4
      e.retropropager()
      print(e.data, a.grad, b.grad)
    sortie: '10 3.0 2.0'
  - id: d_perte
    type: idee
    fr: 'Pour apprendre, il faut une **perte** : un nombre qui dit à quel point le réseau se trompe (niveau 9.1). On prend la somme, sur tous les exemples, du carré de l’écart entre la prédiction et la cible. Plus elle est petite, mieux le réseau a appris.'
    en: 'To learn, we need a **loss**: a number telling how wrong the network is (level 9.1). We take the sum, over all examples, of the square of the gap between prediction and target. The smaller it is, the better the network has learned.'
    exemple: { fr: 'Prédictions `0.5` et `-0.5` pour les cibles `1` et `-1` : écarts $-0{,}5$ et $0{,}5$, perte $0{,}25+0{,}25=0{,}5$.', en: 'Predictions `0.5` and `-0.5` for targets `1` and `-1`: gaps $-0.5$ and $0.5$, loss $0.25+0.25=0.5$.' }
