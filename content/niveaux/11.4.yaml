    fr: 'Un pas d’apprentissage a quatre temps : calculer la perte, remettre les pentes à zéro, rétropropager, puis déplacer chaque réglage contre sa pente : $p\leftarrow p-\eta\,\text{pente}$ (niveau 5.5).'
    en: 'A learning step has four beats: compute the loss, reset the slopes to zero, backpropagate, then move each setting against its slope: $p\leftarrow p-\eta\,\text{slope}$ (level 5.5).'
