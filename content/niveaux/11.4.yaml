  - id: d_p_zero
    type: piege
    fr: 'Oublier de remettre les pentes à zéro est le piège classique : la rétropropagation **additionne** (`+=`), donc les pentes de tous les pas s’accumulent. Le réseau fait des bonds de plus en plus grands et diverge.'
    en: 'Forgetting to reset the slopes is the classic trap: backpropagation **adds** (`+=`), so the slopes of all steps accumulate. The network makes ever larger leaps and diverges.'
