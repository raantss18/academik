    type: plus
    fr: Pour approfondir, consulte [MIT 18.01 — Calcul à une variable](https://ocw.mit.edu/courses/18-01-single-variable-calculus-fall-2006/) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [MIT 18.01 — Single variable calculus](https://ocw.mit.edu/courses/18-01-single-variable-calculus-fall-2006/); this optional reading needs a connection.
