titre: { fr: 'Classer', en: 'Classifying' }
ia: { fr: 'Kintana apprend à répondre par une catégorie, avec une probabilité, grâce à la régression logistique.', en: 'Kintana learns to answer with a category, with a probability, thanks to logistic regression.' }
