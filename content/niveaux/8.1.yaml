cartes:
  - id: c1
    indice: { fr: '`split(",")` coupe à chaque virgule ; compte à partir de 0 pour l’indice.', en: '`split(",")` cuts at each comma; count from 0 for the index.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: |
      Que **affiche** ce programme ?

      ```python
      ligne = "ana,15,12.5"
      print(ligne.split(",")[1])
