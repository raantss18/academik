# Niveau 21.boss — Boss final : recherche de bout en bout (exploration, confirmation, rapport qui rejette). Original academik ; notions des modules 7, 10, 17 et 20, vérifiées dans Bailey et López de Prado 2014, Harvey, Liu, Zhu 2016 et le NIST e-Handbook (liens). Données synthétiques, cadre strictement pédagogique.
id: 21.boss
module: 21
duree_min: 21
titre:
  fr: Kintana, chercheuse honnête
  en: Kintana, honest researcher
ia:
  fr: Kintana mène une recherche de bout en bout et rejette la fausse découverte, même quand elle paraît significative.
  en: Kintana carries out research end to end and rejects the false discovery, even when it looks significant.
sources:
- titre: Bailey, López de Prado — The Deflated Sharpe Ratio (2014)
  url: https://doi.org/10.3905/jpm.2014.40.5.094
  licence: Lien seulement ; texte non repris
- titre: Harvey, Liu, Zhu — … and the Cross-Section of Expected Returns (2016)
  url: https://doi.org/10.1093/rfs/hhv059
  licence: Lien seulement ; texte non repris
- titre: NIST/SEMATECH e-Handbook — Bonferroni’s method
  url: https://www.itl.nist.gov/div898/handbook/prc/section4/prc473.htm
