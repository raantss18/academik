      en: The confirmation data are used only once.
- id: c3
  type: idee
  fr: Les rendements sont des données quotidiennes numérotées $0,1,2,\dots$ ; le jour de la semaine est le reste de la division par 5. Pour un jour $j$, on garde les rendements d’indice $i$ tels que $i \bmod 5 = j$. On teste ensuite si leur moyenne est nulle, avec la statistique $t$ du niveau 17.boss.
  en: The returns are daily data numbered $0,1,2,\dots$; the weekday is the remainder of division by 5. For a day $j$, we keep the returns of index $i$ such that $i \bmod 5 = j$. We then test whether their mean is zero, with the $t$ statistic of level 17.boss.
  exemple:
    fr: Sur 750 jours, chaque jour de la semaine compte 150 rendements.
    en: Over 750 days, each weekday has 150 returns.
