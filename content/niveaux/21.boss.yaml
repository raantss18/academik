- id: c6
  type: idee
  fr: 'L’**exploration** essaie les cinq jours et retient celui de plus petite p-valeur. C’est utile pour trouver une piste, mais le meilleur de cinq essais paraît bon par construction (niveau 17.5). La p-valeur d’exploration est donc **optimiste** : elle ne sert pas de preuve.'
  en: '**Exploration** tries the five days and keeps the one with the smallest p-value. It is useful for finding a lead, but the best of five trials looks good by construction (level 17.5). The exploration p-value is therefore **optimistic**: it does not serve as proof.'
  exemple:
    fr: Même avec cinq jours sans aucun effet, le plus petit des cinq p-valeurs passe souvent sous 0,05.
    en: Even with five days without any effect, the smallest of the five p-values often falls below 0.05.
  figure:
    kind: tableau
    entetes:
