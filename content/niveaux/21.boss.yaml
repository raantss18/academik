  tests: |-
    a = rapport(serie(1250, 28), 0.05)
    assert a["hypothese"] == "jour 4" and a["verdict"] == "rejetée" and a["p_exploration"] < 0.001 < 0.5 < a["p_test"]
    assert a["essais_exploration"] == 5 and a["sources"] == ["7.5", "10.boss", "17.5"]
    b = rapport(serie(1250, 3, effet=0.004), 0.05)
