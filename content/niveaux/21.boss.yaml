    legende:
      fr: Deux rôles, deux jeux de données.
      en: Two roles, two datasets.
- id: c7
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `explorer(r)`** : calcule pour chaque jour `j` de `0` à `4` la p-valeur `p_valeur(t_stat(rendements_jour(r, j)))`, et renvoie le couple `(jour, p)` du jour de plus petite p-valeur. Les fonctions sont fournies.'
  en: '**Write `explorer(r)`**: compute for each day `j` from `0` to `4` the p-value `p_valeur(t_stat(rendements_jour(r, j)))`, and return the pair `(jour, p)` of the day with the smallest p-value. The functions are provided.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def serie(n, graine, effet=0.0):
        u = generateur(graine)
        return [0.0003 + 0.01 * gauss(u) + (effet if t % 5 == 0 else 0.0) for t in range(n)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))

    def rendements_jour(r, jour):
        return [x for i, x in enumerate(r) if i % 5 == jour]

    # écris ta fonction explorer ici
  tests: |-
    r = serie(1250, 28)
    j, p = explorer(r[:750])
    assert j == 4 and p < 0.001
    j2, p2 = explorer(serie(1250, 3, effet=0.004)[:750])
    assert j2 == 0 and p2 < 1e-6
  solutionCode: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def serie(n, graine, effet=0.0):
        u = generateur(graine)
        return [0.0003 + 0.01 * gauss(u) + (effet if t % 5 == 0 else 0.0) for t in range(n)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))

    def rendements_jour(r, jour):
        return [x for i, x in enumerate(r) if i % 5 == jour]

    def explorer(r):
        ps = [p_valeur(t_stat(rendements_jour(r, j))) for j in range(5)]
        meilleur = min(range(5), key=lambda j: ps[j])
        return meilleur, ps[meilleur]
  indice:
    fr: 'Fabrique la liste `ps` des cinq p-valeurs, puis `min(range(5), key=lambda j: ps[j])`.'
    en: 'Build the list `ps` of the five p-values, then `min(range(5), key=lambda j: ps[j])`.'
  explication:
    fr: 'Sur la série de graine 28, sans aucun effet, l’exploration trouve un jour à $p<0{,}001$ : un faux positif impressionnant.'
    en: 'On the seed-28 series, without any effect, exploration finds a day at $p<0.001$: an impressive false positive.'
