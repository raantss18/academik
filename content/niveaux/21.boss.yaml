  fr: 'Défi final. **Écris `rapport(r, alpha)`** : coupe `r` à `len(r) * 3 // 5` (exploration avant, test après). Explore, puis confirme le jour retenu sur le test. Renvoie le dictionnaire `{"hypothese": "jour " + str(jour), "essais_exploration": 5, "p_exploration": ..., "p_test": ..., "verdict": "retenue" ou "rejetée", "sources": ["7.5", "10.boss", "17.5"]}`.'
