  fr: Sur la graine 28 (sans effet), l’exploration donne une p-valeur d’environ 0,0004 pour le meilleur des 5 jours. Même avec la correction de Bonferroni sur 5 essais (seuil $0{,}05/5$), cette p-valeur passe-t-elle le seuil ? Réponds `oui` ou `non`.
  en: On seed 28 (no effect), exploration gives a p-value of about 0.0004 for the best of 5 days. Even with the Bonferroni correction over 5 trials (threshold $0.05/5$), does this p-value pass? Answer `oui` or `non`.
