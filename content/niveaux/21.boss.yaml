- id: c9
  type: idee
  fr: 'La **confirmation** teste **une seule** hypothèse, choisie avant de voir les données de test. Il n’y a qu’un essai : le seuil reste $\alpha$ sans correction. Si l’effet est réel, il réapparaît ; s’il venait du hasard, il disparaît, comme ici pour la graine 28.'
  en: '**Confirmation** tests **a single** hypothesis, chosen before seeing the test data. There is only one trial: the threshold stays $\alpha$ without correction. If the effect is real, it reappears; if it came from chance, it disappears, as here for seed 28.'
  exemple:
    fr: 'Graine 28 : $p=0{,}0004$ en exploration, puis $p\approx0{,}81$ sur les données de test. L’effet s’évanouit.'
    en: 'Seed 28: $p=0.0004$ in exploration, then $p\approx0.81$ on the test data. The effect vanishes.'
