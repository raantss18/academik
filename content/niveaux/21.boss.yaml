  fr: 'À toi. **Écris `rendements_jour(r, jour)`** : la liste des rendements `r[i]` dont l’indice vérifie `i % 5 == jour`.'
  en: 'Your turn. **Write `rendements_jour(r, jour)`**: the list of returns `r[i]` whose index satisfies `i % 5 == jour`.'
  depart: |
    # écris ta fonction rendements_jour ici
  tests: |-
    r = list(range(12))
    assert rendements_jour(r, 0) == [0, 5, 10]
    assert rendements_jour(r, 4) == [4, 9]
    assert rendements_jour([], 2) == []
    assert sum(len(rendements_jour(r, j)) for j in range(5)) == 12
  solutionCode: |
    def rendements_jour(r, jour):
        return [x for i, x in enumerate(r) if i % 5 == jour]
