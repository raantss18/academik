  solutionCode: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def serie(n, graine, effet=0.0):
        u = generateur(graine)
        return [0.0003 + 0.01 * gauss(u) + (effet if t % 5 == 0 else 0.0) for t in range(n)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))

    def rendements_jour(r, jour):
        return [x for i, x in enumerate(r) if i % 5 == jour]

    def explorer(r):
        ps = [p_valeur(t_stat(rendements_jour(r, j))) for j in range(5)]
        meilleur = min(range(5), key=lambda j: ps[j])
        return meilleur, ps[meilleur]

    def confirmer(r, jour, alpha):
        p = p_valeur(t_stat(rendements_jour(r, jour)))
        return p, p < alpha

    def rapport(r, alpha):
        coupe = len(r) * 3 // 5
        apprentissage, test = r[:coupe], r[coupe:]
        jour, p_expl = explorer(apprentissage)
        p_test, ok = confirmer(test, jour, alpha)
        return {"hypothese": "jour " + str(jour), "essais_exploration": 5, "p_exploration": p_expl, "p_test": p_test,
                "verdict": "retenue" if ok else "rejetée", "sources": ["7.5", "10.boss", "17.5"]}
  indice:
    fr: 'Trois étapes : couper, `explorer` sur la première partie, `confirmer` sur la seconde ; puis le dictionnaire.'
    en: 'Three steps: cut, `explorer` on the first part, `confirmer` on the second; then the dictionary.'
  explication:
    fr: Ton rapport rejette la fausse découverte de la graine 28 et retient le vrai effet de la graine 3. C’est exactement ce qu’on attend d’une recherche honnête.
    en: Your report rejects the false discovery of seed 28 and retains the real effect of seed 3. This is exactly what is expected of honest research.
