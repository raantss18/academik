- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: 'Kintana entend une rumeur : « le marché monte davantage un certain jour de la semaine ». Avant tout calcul, que doit-elle faire pour que son étude reste honnête ?'
  en: 'Kintana hears a rumour: “the market rises more on a certain day of the week”. Before any computation, what should she do so that her study stays honest?'
  choix:
  - fr: 'Fixer son protocole : données d’exploration, données de test séparées, et seuil de décision'
    en: 'Fix her protocol: exploration data, separate test data, and a decision threshold'
    juste: true
  - fr: Chercher dans toutes les données le jour qui marche le mieux, puis l’annoncer
    en: Search all the data for the day that works best, then announce it
  - fr: Croire la rumeur sans vérifier
    en: Believe the rumour without checking
  indice:
    fr: Un résultat trouvé et vérifié sur les mêmes données est-il une preuve (niveau 17.5) ?
    en: Is a result found and checked on the same data a proof (level 17.5)?
  explication:
    fr: 'On écrit le protocole **avant** de regarder : une partie des données pour explorer, une autre, jamais vue, pour confirmer **une seule** hypothèse.'
    en: 'We write the protocol **before** looking: one part of the data to explore, another, never seen, to confirm **a single** hypothesis.'
- id: c2
  type: idee
  fr: 'Mission finale : Kintana, ton agent local, mène une petite recherche de bout en bout. Elle explore cinq hypothèses (un jour chacune), retient la plus prometteuse, puis la soumet à des données **jamais vues**. Elle rend un rapport sourcé qui dit « retenue » ou « rejetée ».'
  en: 'Final mission: Kintana, your local agent, carries out a small piece of research end to end. She explores five hypotheses (one day each), keeps the most promising, then submits it to **never-seen** data. She returns a sourced report saying “retained” or “rejected”.'
  exemple:
    fr: 'Les données sont synthétiques : on sait donc à l’avance s’il existe un vrai effet, ce qui permet de juger la méthode.'
    en: 'The data are synthetic: so we know in advance whether a real effect exists, which lets us judge the method.'
