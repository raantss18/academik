  en: 'You built Kintana brick by brick, from logic to evaluation. Networks, RAG, agents and security are part of it. The last reflex is the most important: **doubt your own results**.'
  exemple:
    fr: Le module bonus « Recherche » (le Rova) prolongera ce travail vers la preuve formelle de propriétés du code.
    en: The bonus “Research” module (the Rova) will extend this work towards formal proof of code properties.
- id: c16
  type: retenir
  fr: 'Recherche honnête : protocole écrit avant, exploration et confirmation sur des données séparées, une seule confirmation, rapport sourcé qui rejette ce qui ne tient pas. Le meilleur de plusieurs essais trompe, même corrigé.'
  en: 'Honest research: protocol written beforehand, exploration and confirmation on separate data, a single confirmation, a sourced report that rejects what does not hold. The best of several trials misleads, even corrected.'
- id: c17
  type: plus
  fr: Pour aller plus loin, consulte [la méthode de Bonferroni du NIST](https://www.itl.nist.gov/div898/handbook/prc/section4/prc473.htm) ; cette page demande une connexion.
  en: To go further, see [NIST’s Bonferroni method](https://www.itl.nist.gov/div898/handbook/prc/section4/prc473.htm); this page needs a connection.
