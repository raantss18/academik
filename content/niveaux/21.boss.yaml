- id: c11
  type: piege
  fr: 'Le piège final : regarder les données de test, constater l’échec, puis « explorer encore un peu » et retester. Les données de test deviennent alors des données d’exploration, et la confirmation ne vaut plus rien. Une confirmation ratée se publie telle quelle.'
  en: 'The final trap: looking at the test data, seeing the failure, then “exploring a bit more” and retesting. The test data then become exploration data, and confirmation is worth nothing. A failed confirmation is published as is.'
