id: '3.5'
module: 3
duree_min: 13
titre: { fr: 'Graphes : parcours en largeur', en: 'Graphs: breadth-first search' }
ia: { fr: 'Kintana explore les liens entre documents par distance croissante.', en: 'Kintana explores links between documents in increasing distance order.' }
objectifs:
  - { fr: 'lire un graphe orienté', en: 'read a directed graph' }
  - { fr: 'explorer en largeur avec une file', en: 'explore breadth-first with a queue' }
  - { fr: 'éviter de tourner dans un cycle', en: 'avoid going round a cycle' }
sources:
  - { titre: 'Pat Morin — Open Data Structures, Graph Traversal', url: 'https://opendatastructures.org/ods-python/12_3_Graph_Traversal.html', licence: 'CC BY 2.5 CA ; exemples originaux' }
  - { titre: 'Python — collections.deque', url: 'https://docs.python.org/3/library/collections.html#collections.deque', licence: 'PSF-2.0 ; exemples de la documentation également sous 0BSD' }
cartes:
  - id: c1
    indice: { fr: 'Suis les liens orientés depuis A et compte les liens du plus court chemin vers D.', en: 'Follow the directed links from A and count the links of the shortest path to D.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Des liens orientés vont de A vers B, de A vers C et de B vers D. Quelle distance minimale, en nombre de liens, sépare A de D ?'
    en: 'Directed links go from A to B, from A to C, and from B to D. What is the minimum distance, in links, from A to D?'
    choix:
      - { fr: '1', en: '1' }
      - { fr: '2', en: '2', juste: true }
      - { fr: '3', en: '3' }
    verif: "from collections import deque\ng = {'A': ['B', 'C'], 'B': ['D'], 'C': [], 'D': []}\nd = {'A': 0}; q = deque(['A'])\nwhile q:\n    u = q.popleft()\n    for v in g[u]:\n        if v not in d:\n            d[v] = d[u]+1; q.append(v)\nprint(d['D'])"
    sortie: '2'
    explication: { fr: 'Le chemin A → B → D utilise deux liens ; aucun lien direct A → D n’existe.', en: 'Path A → B → D uses two links; there is no direct A → D link.' }
  - id: c1a
    type: idee
    fr: Un **graphe** représente des objets, appelés sommets, reliés par des liens, appelés arêtes. Un
      lien **orienté** ne se suit que dans le sens de sa flèche.
    en: A **graph** represents objects, called vertices, connected by links, called edges. A
      **directed** link can only be followed in its arrow’s direction.
  - id: c1b
    type: exemple
    titre:
      fr: Lire des liens orientés
      en: Reading directed links
    etapes:
      - fr: Les sommets sont P, Q, R et S ; les liens sont P → Q et Q → R.
        en: Vertices are P, Q, R, and S; links are P → Q and Q → R.
      - fr: Depuis P, on atteint R en deux liens ; aucun lien ne permet de revenir de R vers P.
        en: From P, R is reached in two links; no link allows a return from R to P.
      - fr: "S est isolé : aucun lien n’y mène et aucun lien n’en part."
        en: "S is isolated: no link enters or leaves it."
    verif: |-
      g={"P":["Q"],"Q":["R"],"R":[],"S":[]}
      assert g["P"]==["Q"] and g["Q"]==["R"]
      assert not g["R"] and not g["S"]
      print(sum(map(len,g.values())))
    sortie: "2"
    figure:
      kind: tableau
      entetes:
        - fr: Sommet
          en: Vertex
        - fr: Voisins accessibles directement
          en: Direct outgoing neighbours
      cellules:
        - - P
          - Q
        - - Q
          - R
        - - R
          - fr: aucun
            en: none
        - - S
          - fr: aucun
            en: none
      legende:
        fr: Une liste de voisins décrit les liens qui partent de chaque sommet.
        en: A neighbour list describes links leaving each vertex.
  - id: c1c
    type: piege
    fr: "P → Q n’autorise pas Q → P : un chemin doit respecter chaque flèche. Un sommet isolé existe
      même sans lien."
    en: "P → Q does not allow Q → P: a path must respect every arrow. An isolated vertex exists even
      without links."
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Dans un parcours en largeur, quel sommet est traité en premier ?'
    en: 'In a breadth-first search, which vertex is processed first?'
    choix:
      - { fr: 'Le plus ancien arrivé dans la file', en: 'The oldest one to have joined the queue', juste: true }
      - { fr: 'Le plus récent arrivé dans la file', en: 'The most recent one to have joined the queue' }
      - { fr: 'Un sommet tiré au hasard', en: 'A randomly drawn vertex' }
    explication: { fr: 'La file est « premier entré, premier sorti » : on explore par distance croissante.', en: 'The queue is “first in, first out”: we explore by increasing distance.' }
    indice: { fr: 'Une file sert le premier arrivé.', en: 'A queue serves the first to arrive.' }
  - id: c2
    type: idee
    fr: La **distance** est ici le plus petit nombre de liens d’un chemin depuis le départ. Le
      **parcours en largeur**, abrégé BFS, découvre les sommets par distance croissante.
    en: Here, **distance** is the smallest number of links along a path from the start. **Breadth-first
      search**, abbreviated BFS, discovers vertices in increasing distance order.
    figure:
      kind: tableau
      entetes:
        - fr: Distance depuis Accueil
          en: Distance from Home
        - fr: Sommets
          en: Vertices
      cellules:
        - - $0$
          - fr: Accueil
            en: Home
        - - $1$
          - fr: Cours, Quiz
            en: Course, Quiz
        - - $2$
          - fr: Exercice
            en: Exercise
        - - $3$
          - fr: Corrigé
            en: Solution
            ton: ok
      legende:
        fr: "Liens : Accueil → Cours, Accueil → Quiz, Cours → Exercice, Quiz → Exercice, Exercice →
          Corrigé."
        en: "Links: Home → Course, Home → Quiz, Course → Exercise, Quiz → Exercise, Exercise → Solution."
  - id: c2a
    type: idee
    fr: "Une **file** traite le premier élément arrivé avant les suivants : c’est l’ordre FIFO, «
      premier entré, premier sorti ». En Python, `deque` ajoute à droite avec `append` et retire à
      gauche avec `popleft`."
    en: "A **queue** processes the first item to arrive before later items: this is FIFO, “first in,
      first out”. Python’s `deque` appends on the right with `append` and removes on the left with
      `popleft`."
    exemple:
      fr: Une file contenant P puis Q sort P d’abord ; ajouter R laisse Q avant R.
      en: A queue holding P then Q removes P first; adding R leaves Q before R.
  - id: c2b
    type: exemple
    titre:
      fr: Faire avancer une file
      en: Advancing a queue
    etapes:
      - fr: La file contient `[P, Q, R]` ; P attend depuis le plus longtemps.
        en: The queue holds `[P, Q, R]`; P has been waiting longest.
      - fr: "Retire P à gauche, puis ajoute S à droite : la file devient `[Q, R, S]`."
        en: "Remove P on the left, then add S on the right: the queue becomes `[Q, R, S]`."
      - fr: Q sera traité avant R et S ; retirer à droite casserait cet ordre.
        en: Q will be processed before R and S; removing on the right would break this order.
    verif: |-
      from collections import deque
      q=deque("PQR"); assert q.popleft()=="P"
      q.append("S")
      print(" ".join(q))
    sortie: Q R S
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pourquoi marque-t-on un sommet dès qu’on l’ajoute à la file ?'
    en: 'Why do we mark a vertex as soon as we add it to the queue?'
    choix:
      - { fr: 'Pour ne pas l’ajouter plusieurs fois', en: 'So as not to add it several times', juste: true }
      - { fr: 'Pour le supprimer du graphe', en: 'To delete it from the graph' }
      - { fr: 'Pour le trier', en: 'To sort it' }
    explication: { fr: 'Sans marque, un cycle ferait tourner la boucle sans fin et on traiterait le même sommet plusieurs fois.', en: 'Without a mark, a cycle would make the loop run forever and we would process the same vertex several times.' }
    indice: { fr: 'Imagine un cycle : que se passerait-il sans marque ?', en: 'Imagine a cycle: what would happen without a mark?' }
  - id: c2c
    type: idee
    fr: "**Marquer** un sommet signifie mémoriser qu’il est découvert. BFS le marque dès son ajout à la
      file ; plusieurs liens vers ce sommet ne créent pas plusieurs ajouts."
    en: "**Marking** a vertex means remembering it has been discovered. BFS marks it when enqueuing it;
      several links to that vertex do not cause multiple enqueues."
  - id: c2d
    type: piege
    fr: Marquer seulement en sortant de la file permet des ajouts répétés avant cette sortie. Marque dès
      la découverte, y compris le sommet de départ.
    en: Marking only when dequeuing allows repeated enqueues before removal. Mark at discovery,
      including the starting vertex.
  - id: c3
    type: exemple
    lang: python
    titre: { fr: 'Explorer deux branches', en: 'Exploring two branches' }
    etapes:
      - code: "from collections import deque\ng = {'A': ['B', 'C'], 'B': ['D'], 'C': ['D'], 'D': []}"
        fr: 'Les deux branches rejoignent D ; suis l’ordre des voisins donné.'
        en: 'Both branches reach D; follow the given neighbour order.'
      - { code: "q = deque(['A']); distance = {'A': 0}", fr: 'A est découvert à distance zéro.', en: 'A is discovered at distance zero.' }
      - code: "while q:\n    u = q.popleft()\n    for v in g[u]:\n        if v not in distance:\n            distance[v] = distance[u] + 1\n            q.append(v)"
        fr: 'Après A, la file contient B puis C ; après B, C puis D ; C ne rajoute pas D.'
        en: 'After A, the queue holds B then C; after B, C then D; C does not enqueue D again.'
      - { code: "print(distance['D'])", fr: 'D est à distance $2$ ; ses deux chemins ne créent pas deux visites.', en: 'D is at distance $2$; its two paths do not create two visits.' }
  - id: c4
    indice: { fr: 'Retire le premier de la file, ajoute à la fin, puis compte ce qui reste.', en: 'Remove the first from the queue, add at the end, then count what remains.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'La file contient `[B, C]`. Tu retires B puis ajoutes D à droite. Combien de sommets attendent maintenant ?'
    en: 'The queue contains `[B, C]`. You remove B and then append D on the right. How many vertices are waiting now?'
    reponses: ['2']
    verif: "from collections import deque\nq = deque(['B', 'C']); q.popleft(); q.append('D')\nprint(len(q))"
    explication: { fr: 'La file est `[C, D]` : deux sommets, avec C traité avant D.', en: 'The queue is `[C, D]`: two vertices, with C processed before D.' }
  - id: c5
    indice: { fr: 'Une file sert le premier arrivé. Qui était dans la file avant D ?', en: 'A queue serves the first to arrive. Who was in the queue before D?' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Dans l’exemple, dans quel ordre les sommets sortent-ils de la file ?'
    en: 'In the example, in what order do vertices leave the queue?'
    choix:
      - { fr: 'A B D C', en: 'A B D C' }
      - { fr: 'A D B C', en: 'A D B C' }
      - { fr: 'A B C D', en: 'A B C D', juste: true }
    verif: "from collections import deque\ng = {'A': ['B', 'C'], 'B': ['D'], 'C': ['D'], 'D': []}\nq = deque(['A']); seen = {'A'}; order = []\nwhile q:\n    u = q.popleft(); order.append(u)\n    for v in g[u]:\n        if v not in seen:\n            seen.add(v); q.append(v)\nprint(' '.join(order))"
    sortie: 'A B C D'
    explication: { fr: 'B et C étaient dans la file avant D ; les sommets de distance $1$ passent avant ceux de distance $2$.', en: 'B and C entered the queue before D; vertices at distance $1$ precede those at distance $2$.' }
  - id: c5a
    type: exemple
    titre:
      fr: Un cycle sans boucle infinie
      en: A cycle without an infinite loop
    etapes:
      - fr: Les liens P → Q et Q → P forment un cycle ; marque P au départ.
        en: Links P → Q and Q → P form a cycle; mark P at the start.
      - fr: Depuis P, découvre Q à distance un et marque-le avant de le mettre dans la file.
        en: From P, discover Q at distance one and mark it before putting it in the queue.
      - fr: "Depuis Q, P est déjà marqué : aucun nouvel ajout ; la file se vide après deux sorties."
        en: "From Q, P is already marked: no new enqueue; the queue empties after two removals."
    verif: |-
      from collections import deque
      g={"P":["Q"],"Q":["P"]}; d={"P":0}; q=deque(["P"]); count=0
      while q:
          u=q.popleft(); count+=1
          for v in g[u]:
              if v not in d: d[v]=d[u]+1; q.append(v)
      assert d=={"P":0,"Q":1}
      print(count)
    sortie: "2"
  - id: c6
    indice: { fr: 'Chaque sommet entre une seule fois dans la file grâce au marquage. Compte les sommets du cycle.', en: 'Each vertex enters the queue once thanks to marking. Count the vertices of the cycle.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans le cycle orienté A → B → C → A, combien de sommets distincts le BFS depuis A ajoute-t-il à la file, A inclus ?'
    en: 'In directed cycle A → B → C → A, how many distinct vertices does BFS from A enqueue, including A?'
    reponses: ['3']
    verif: "from collections import deque\ng = {'A': ['B'], 'B': ['C'], 'C': ['A']}\nq = deque(['A']); seen = {'A'}\nwhile q:\n    for v in g[q.popleft()]:\n        if v not in seen:\n            seen.add(v); q.append(v)\nprint(len(seen))"
    explication: { fr: 'Le marquage empêche de réinsérer A ; chaque sommet entre une seule fois.', en: 'Marking prevents A from being enqueued again; each vertex enters once.' }
  - id: c6a
    type: idee
    fr: Un sommet est **inaccessible** si aucun chemin ne le relie au départ dans le bon sens. BFS ne
      lui attribue aucune distance ; ce n’est pas une distance zéro.
    en: A vertex is **unreachable** if no correctly directed path connects the start to it. BFS assigns
      it no distance; this is not distance zero.
  - id: c6b
    type: piege
    fr: Avec P → Q et S isolé, seule la distance de P vaut zéro au départ ; donner zéro à S le
      confondrait avec P.
    en: With P → Q and isolated S, only P has distance zero at the start; assigning zero to S would
      confuse it with P.
  - id: c7
    indice: { fr: 'Un sommet est inaccessible si aucun chemin orienté ne mène à lui depuis A. Lesquels ?', en: 'A vertex is unreachable if no directed path leads to it from A. Which ones?' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans le graphe orienté A → B, B → C et D isolé, combien de sommets restent inaccessibles depuis A ?'
    en: 'In the directed graph A → B, B → C with isolated D, how many vertices remain unreachable from A?'
    reponses: ['1']
    verif: "from collections import deque\ng = {'A': ['B'], 'B': ['C'], 'C': [], 'D': []}\nseen = {'A'}; q = deque(['A'])\nwhile q:\n    for v in g[q.popleft()]:\n        if v not in seen:\n            seen.add(v); q.append(v)\nprint(len(set(g)-seen))"
    explication: { fr: 'D n’a aucun chemin depuis A ; il ne reçoit pas de distance dans ce parcours.', en: 'D has no path from A; it receives no distance in this traversal.' }
  - id: c7a
    type: idee
    fr: Avec des listes de voisins, chaque sommet découvert sort une fois de la file ; ses liens
      sortants sont examinés une fois. Le coût est $O(V+E)$, pour $V$ sommets et $E$ arêtes.
    en: With neighbour lists, each discovered vertex leaves the queue once; its outgoing links are
      examined once. The cost is $O(V+E)$, for $V$ vertices and $E$ edges.
  - id: c7b
    type: exemple
    titre:
      fr: Compter sommets et liens séparément
      en: Counting vertices and links separately
    etapes:
      - fr: Dans le cycle P → Q → P, il y a deux sommets et deux liens orientés.
        en: In cycle P → Q → P, there are two vertices and two directed links.
      - fr: Le parcours sort deux sommets de la file et examine deux liens, dont le retour vers P déjà
          marqué.
        en: The traversal removes two vertices from the queue and examines two links, including the return
          to already marked P.
      - fr: La borne additionne ces deux tailles ; elle ne signifie pas un nombre exact d’instructions
          Python.
        en: The bound adds these two sizes; it does not mean an exact count of Python instructions.
    verif: |-
      g={"P":["Q"],"Q":["P"]}
      print(len(g)+sum(map(len,g.values())))
    sortie: "4"
  - id: c8
    type: piege
    fr: 'BFS minimise le nombre de liens, pas un coût variable : une arête coûteuse peut être plus chère que plusieurs arêtes bon marché.'
    en: 'BFS minimizes the number of links, not a varying cost: one expensive edge may cost more than several cheap edges.'
  - id: c8a
    type: exemple
    titre:
      fr: Nombre de liens et coût ne coïncident pas
      en: Link count and cost can differ
    etapes:
      - fr: Un lien P → R coûte huit ; P → Q et Q → R coûtent chacun trois.
        en: Link P → R costs eight; P → Q and Q → R each cost three.
      - fr: "BFS préfère le lien direct : un seul lien, mais un coût de huit."
        en: "BFS prefers the direct link: only one link, but a cost of eight."
      - fr: "Le détour coûte six avec deux liens : minimiser les liens ne minimise donc pas toujours le
          coût."
        en: "The detour costs six with two links: minimizing links therefore does not always minimize cost."
    verif: |-
      paths=[(1,8),(2,3+3)]
      assert min(p[1] for p in paths)==6
      print(min(paths,key=lambda p:p[0])[1])
    sortie: "8"
    figure:
      kind: tableau
      entetes:
        - fr: Chemin
          en: Path
        - fr: Liens
          en: Links
        - fr: Coût
          en: Cost
      cellules:
        - - P → R
          - "1"
          - "8"
        - - P → Q → R
          - "2"
          - "6"
      legende:
        fr: BFS optimise la colonne des liens, pas celle des coûts variables.
        en: BFS optimizes the link column, not the varying-cost column.
  - id: c9
    indice: { fr: 'BFS minimise le nombre de liens, pas le coût. Quel chemin a le moins de liens ?', en: 'BFS minimises the number of links, not the cost. Which path has the fewest links?' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Les liens coûtent : A → D $9$, A → B $1$, B → D $1$. BFS choisit le chemin avec le moins de liens. Quel est son coût total ?'
    en: 'Links cost: A → D $9$, A → B $1$, B → D $1$. BFS picks the path with the fewest links. What is its total cost?'
    choix:
      - { fr: '2', en: '2' }
      - { fr: '9', en: '9', juste: true }
      - { fr: '11', en: '11' }
    verif: "paths = [(1, 9), (2, 1+1)]\nprint(min(paths, key=lambda p: p[0])[1])"
    sortie: '9'
    explication: { fr: 'BFS choisit le lien direct, coût $9$ ; le chemin à deux liens coûte $2$, mais nécessite un autre critère.', en: 'BFS chooses the direct link, costing $9$; the two-link path costs $2$, but requires a different criterion.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Les liens orientés sont A → B, A → C, B → D, C → E, E → D, D → F et F → B. Quelle est la distance minimale de A à F ?'
    en: 'Challenge. Directed links are A → B, A → C, B → D, C → E, E → D, D → F, and F → B. What is the minimum distance from A to F?'
    reponses: ['3']
    verif: "from collections import deque\ng = {'A': ['B', 'C'], 'B': ['D'], 'C': ['E'], 'D': ['F'], 'E': ['D'], 'F': ['B']}\nd = {'A': 0}; q = deque(['A'])\nwhile q:\n    u = q.popleft()\n    for v in g[u]:\n        if v not in d:\n            d[v] = d[u]+1; q.append(v)\nprint(d['F'])"
    indice: { fr: 'Groupe les sommets par distance depuis A et marque-les dès leur découverte.', en: 'Group vertices by distance from A and mark them as soon as they are discovered.' }
    explication: { fr: 'Les couches sont A ; B,C ; D,E ; F : A → B → D → F a trois liens, et le cycle ne change rien.', en: 'The layers are A; B,C; D,E; F: A → B → D → F has three links, and the cycle changes nothing.' }
  - id: c11
    type: retenir
    fr: 'File FIFO, marquage à la découverte, distances par couches : Kintana explore les documents accessibles sans tourner dans les cycles.'
    en: 'FIFO queue, marking on discovery, layered distances: Kintana explores reachable documents without looping around cycles.'
