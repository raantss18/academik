    type: plus
    fr: Pour approfondir, consulte [MIT 18.06 — Algèbre linéaire](https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [MIT 18.06 — Linear algebra](https://ocw.mit.edu/courses/18-06-linear-algebra-spring-2010/); this optional reading needs a connection.
