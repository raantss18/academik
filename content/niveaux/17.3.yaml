  type: plus
  fr: Pour approfondir, consulte [l’article de Fama et French sur les rendements](https://doi.org/10.1111/j.1540-6261.1992.tb04398.x) ; cet article demande une connexion.
  en: For further study, see [Fama and French’s paper on returns](https://doi.org/10.1111/j.1540-6261.1992.tb04398.x); this paper needs a connection.
