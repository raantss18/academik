# Niveau 17.3 — Recherche quantitative 3 : bêta, alpha, CAPM et facteurs. Original academik ; notions vérifiées dans le cours 15.401 du MIT (lien) et Fama et French 1992 (lien). Cadre strictement pédagogique.
id: '17.3'
module: 17
duree_min: 20
titre:
  fr: Facteurs et bêta
  en: Factors and beta
ia:
  fr: Kintana sépare ce qui vient du marché de ce qui est propre à l’actif.
  en: Kintana separates what comes from the market from what is specific to the asset.
objectifs:
  - { fr: 'calculer un bêta', en: 'compute a beta' }
  - { fr: 'lire un alpha', en: 'read an alpha' }
  - { fr: 'appliquer le CAPM', en: 'apply the CAPM' }
