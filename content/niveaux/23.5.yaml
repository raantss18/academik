# Niveau 23.5 — Enquêtes 5 : la faille dans l’agent. Original academik ; cybersécurité défensive : traces simulées, aucun outil offensif ; titre de la triade vérifié dans l’article de Willison (2025) ; tout le code exécuté.
id: '23.5'
module: 23
duree_min: 20
titre:
  fr: La faille dans l’agent
  en: The flaw in the agent
ia:
  fr: 'Kintana audite la trace d’un agent : outils hors liste, boucles et triade mortelle.'
  en: 'Kintana audits an agent’s trace: off-list tools, loops and the lethal trifecta.'
objectifs:
  - { fr: 'lire une trace d''agent', en: 'read an agent trace' }
  - { fr: 'auditer outils, boucles et triade', en: 'audit tools, loops and trifecta' }
  - { fr: 'retirer une jambe de la triade', en: 'remove one leg of the trifecta' }
sources:
- titre: 'Willison — The lethal trifecta for AI agents: private data, untrusted content, and external communication (2025)'
  url: https://simonwillison.net/2025/Jun/16/the-lethal-trifecta/
  licence: Lien seulement ; texte non repris
