  type: plus
  fr: Pour approfondir, consulte [la page sur la complexité des opérations Python](https://wiki.python.org/moin/TimeComplexity) ; cette page demande une connexion.
  en: For further study, see [the page on the complexity of Python operations](https://wiki.python.org/moin/TimeComplexity); this page needs a connection.
