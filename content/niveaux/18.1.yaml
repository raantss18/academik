# Niveau 18.1 — Performance 1 : compter les opérations, dichotomie, boucles imbriquées. Original academik ; notions vérifiées dans la documentation Python (complexité) et Cormen et al. (lien).
id: '18.1'
module: 18
duree_min: 20
titre:
  fr: Compter les opérations
  en: Counting operations
ia:
  fr: 'Kintana ne se fie pas au chronomètre : elle compte ce que son programme fait vraiment.'
  en: 'Kintana does not trust the stopwatch: she counts what her program really does.'
objectifs:
  - { fr: 'compter les opérations au lieu du temps', en: 'count operations instead of time' }
  - { fr: 'comparer recherche linéaire et dichotomie', en: 'compare linear search and binary search' }
  - { fr: 'estimer un ordre de grandeur', en: 'estimate an order of magnitude' }
