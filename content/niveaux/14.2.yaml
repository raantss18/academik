  type: plus
  fr: Pour approfondir, consulte [le cadre BM25 de Robertson et Zaragoza](https://doi.org/10.1561/1500000019) ; cet article demande une connexion.
  en: For further study, see [Robertson and Zaragoza’s BM25 framework](https://doi.org/10.1561/1500000019); this paper needs a connection.
