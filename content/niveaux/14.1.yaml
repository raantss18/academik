- id: c9
  type: idee
  fr: 'Mieux vaut couper aux **frontières naturelles** : titres, paragraphes, phrases. Un passage qui commence au milieu d’une phrase est plus difficile à comprendre, pour le moteur de recherche comme pour le modèle.'
  en: 'It is better to cut at **natural boundaries**: titles, paragraphs, sentences. A passage that starts mid-sentence is harder to understand, for the search engine as well as for the model.'
  exemple:
    fr: Un cours en Markdown se découpe naturellement par titre `##`, puis par paragraphe si la section est trop longue.
    en: A Markdown course splits naturally by `##` title, then by paragraph if the section is too long.
- id: c10
  type: piege
  fr: 'Des passages trop petits perdent leur contexte (« il » ne renvoie plus à rien). Des passages trop grands noient l’information utile : la recherche devient imprécise et le contexte du modèle se remplit vite. Il n’y a pas de taille parfaite : on **mesure** (niveau 14.boss).'
  en: 'Passages that are too small lose their context (“it” no longer refers to anything). Passages that are too large drown the useful information: search becomes imprecise and the model’s context fills quickly. There is no perfect size: we **measure** (level 14.boss).'
- id: c11
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `decouper_phrases(texte, max_mots)`** : sépare `texte` aux points (`.`), puis regroupe les phrases dans l’ordre en passages d’au plus `max_mots` mots, **sans couper une phrase**. Chaque passage est une chaîne de phrases séparées par `". "` et terminée par `"."`. Une phrase plus longue que `max_mots` forme seule un passage.'
  en: 'Challenge. **Write `decouper_phrases(texte, max_mots)`**: split `texte` at periods (`.`), then group the sentences in order into passages of at most `max_mots` words, **without cutting a sentence**. Each passage is a string of sentences separated by `". "` and ending with `"."`. A sentence longer than `max_mots` forms a passage alone.'
  depart: |
    # écris ta fonction decouper_phrases ici
  tests: |-
    t = "Un deux trois. Quatre cinq. Six sept huit neuf."
    assert decouper_phrases(t, 5) == ["Un deux trois. Quatre cinq.", "Six sept huit neuf."]
    assert decouper_phrases(t, 100) == ["Un deux trois. Quatre cinq. Six sept huit neuf."]
    assert decouper_phrases(t, 1) == ["Un deux trois.", "Quatre cinq.", "Six sept huit neuf."]
    assert decouper_phrases("", 5) == []
  solutionCode: |
    def decouper_phrases(texte, max_mots):
        phrases = [p.strip() for p in texte.split(".") if p.strip()]
        groupes, courant = [], []
        for p in phrases:
            n = len(p.split())
            if courant and sum(len(x.split()) for x in courant) + n > max_mots:
                groupes.append(". ".join(courant) + ".")
                courant = []
            courant.append(p)
        if courant:
            groupes.append(". ".join(courant) + ".")
        return groupes
  indice:
    fr: Garde un groupe `courant` de phrases ; avant d’ajouter une phrase, si le total dépasserait `max_mots` et que `courant` n’est pas vide, ferme le groupe.
    en: Keep a `courant` group of sentences; before adding a sentence, if the total would exceed `max_mots` and `courant` is not empty, close the group.
  explication:
    fr: 'Ce découpage par phrases est celui qu’on préfère pour un cours : chaque passage se lit seul.'
    en: 'This sentence-based split is the one preferred for a course: each passage can be read alone.'
- id: c12
  type: idee
  fr: 'Le niveau suivant apprend à **chercher** dans ces passages : d’abord avec les mots exacts (BM25, niveau 14.2), puis avec le sens (embeddings, niveau 14.3). Les deux se combinent ensuite (14.4).'
  en: 'The next level teaches how to **search** these passages: first with exact words (BM25, level 14.2), then with meaning (embeddings, level 14.3). The two are then combined (14.4).'
  exemple:
    fr: Les passages que tu viens de découper sont la matière première de toute cette recherche.
    en: The passages you just split are the raw material for this whole search.
- id: c13
  type: retenir
  fr: 'RAG : chercher des passages, puis répondre à partir d’eux. Passages de 100 à 300 mots, avec chevauchement, coupés aux frontières naturelles. Chaque passage garde un identifiant pour pouvoir être cité.'
  en: 'RAG: search for passages, then answer from them. Passages of 100 to 300 words, with overlap, cut at natural boundaries. Each passage keeps an identifier so it can be cited.'
