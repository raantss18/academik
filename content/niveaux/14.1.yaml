# Niveau 14.1 — RAG 1 : découper en passages. Original academik ; notions vérifiées dans Lewis et al. 2020 (arXiv 2005.11401) et le cours LLM de Hugging Face (cité).
id: '14.1'
module: 14
duree_min: 16
titre:
  fr: Découper en passages
  en: Splitting into passages
ia:
  fr: Kintana découpe tes cours en passages qu’elle pourra retrouver et citer.
  en: Kintana splits your courses into passages she can retrieve and cite.
sources:
- titre: Lewis et al. — Retrieval-Augmented Generation for Knowledge-Intensive NLP Tasks
  url: https://arxiv.org/abs/2005.11401
  licence: Article en accès libre ; idée citée
