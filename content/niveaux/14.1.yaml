- id: c7
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `passages(doc_id, texte, taille, chevauchement)`** : découpe `texte.split()` avec `decouper`, puis renvoie une liste de dictionnaires `{"id": doc_id + "#" + str(k), "texte": " ".join(m), "debut": k * pas}` où `pas = taille - chevauchement`. `decouper` est fournie.'
  en: '**Write `passages(doc_id, texte, taille, chevauchement)`**: split `texte.split()` with `decouper`, then return a list of dictionaries `{"id": doc_id + "#" + str(k), "texte": " ".join(m), "debut": k * pas}` where `pas = taille - chevauchement`. `decouper` is provided.'
  depart: |
    def decouper(mots, taille, chevauchement):
        pas = taille - chevauchement
        morceaux, i = [], 0
        while i < len(mots):
            morceaux.append(mots[i:i + taille])
            if i + taille >= len(mots):
                break
            i += pas
        return morceaux

    # écris ta fonction passages ici
  tests: |-
    p = passages("c", "a b c d e f g h i j", 4, 1)
    assert [x["id"] for x in p] == ["c#0", "c#1", "c#2"]
    assert p[1]["texte"] == "d e f g" and p[1]["debut"] == 3
    assert p[2]["debut"] == 6
    assert passages("c", "", 4, 1) == []
  solutionCode: |
    def decouper(mots, taille, chevauchement):
        pas = taille - chevauchement
        morceaux, i = [], 0
        while i < len(mots):
            morceaux.append(mots[i:i + taille])
            if i + taille >= len(mots):
                break
            i += pas
        return morceaux

    def passages(doc_id, texte, taille, chevauchement):
        mots = texte.split()
        sortie, debut = [], 0
        pas = taille - chevauchement
        for k, m in enumerate(decouper(mots, taille, chevauchement)):
            sortie.append({"id": doc_id + "#" + str(k), "texte": " ".join(m), "debut": k * pas})
        return sortie
  indice:
    fr: Utilise `enumerate(decouper(...))` pour avoir l’indice `k` et le passage `m` en même temps.
    en: Use `enumerate(decouper(...))` to get the index `k` and the passage `m` together.
  explication:
    fr: '`debut` est la position du premier mot du passage dans le document : utile pour retrouver l’extrait exact.'
    en: '`debut` is the position of the passage’s first word in the document: useful to find the exact excerpt.'
