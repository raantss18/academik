# Niveau 12.5 — Transformers 5 : température, top-k et tirage. Original academik ; notions vérifiées dans Holtzman et al. 2020 (arXiv 1904.09751) et la série « Zero to Hero » d’A. Karpathy (citée).
id: '12.5'
module: 12
duree_min: 19
titre:
  fr: Échantillonner
  en: Sampling
ia:
  fr: 'Kintana choisit le mot suivant : sûr ou audacieux, selon un réglage de température.'
  en: 'Kintana chooses the next word: safe or bold, depending on a temperature setting.'
objectifs:
  - { fr: 'régler la température', en: 'set the temperature' }
  - { fr: 'filtrer avec le top-k', en: 'filter with top-k' }
  - { fr: 'tirer un token au hasard', en: 'draw a token at random' }
sources:
- titre: Holtzman et al. — The Curious Case of Neural Text Degeneration (top-p)
  url: https://arxiv.org/abs/1904.09751
  licence: Article en accès libre ; idées citées
