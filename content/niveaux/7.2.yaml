id: "7.2"
module: 7
duree_min: 10
titre:
  fr: Intervalles de confiance
  en: Confidence intervals
ia:
  fr: "Kintana encadre son estimation par un intervalle de confiance honnête."
  en: "Kintana brackets her estimate with an honest confidence interval."
sources:
  - titre: MIT OCW — Philippe Rigollet, 18.650, Statistics for Applications (2016)
    url: https://ocw.mit.edu/courses/18-650-statistics-for-applications-fall-2016/pages/lecture-slides/
    licence: CC BY-NC-SA 4.0 ; éléments tiers exclus ; exercices originaux
  - titre: NIST — Confidence Limits for the Mean
    url: https://www.itl.nist.gov/div898/handbook/eda/section3/eda352.htm
    licence: "Conditions NIST : information publique réutilisable sauf mention de copyright ; référence en lien, aucun extrait repris"
cartes:
  - type: tentative
    note:
      kind: quiz
      poids: 1
    fr: "Avant de commencer : une estimation vaut $10$ avec une marge de $2$. Quelle est la borne inférieure de l’intervalle ?"
    en: "Before you start: an estimate is $10$ with a margin of $2$. What is the lower endpoint of the interval?"
    verif: |-
      centre,marge=10,2
      print(centre-marge)
    explication:
      fr: "La borne inférieure est le centre moins la marge : $10-2=8$."
      en: "The lower endpoint is the center minus the margin: $10-2=8$."
    choix:
      - fr: "8"
        en: "8"
        juste: true
      - fr: "12"
        en: "12"
      - fr: "2"
        en: "2"
    sortie: "8"
    indice: { fr: 'La borne inférieure est le centre moins la marge.', en: 'The lower bound is the centre minus the margin.' }
    id: c1
  - type: idee
    fr: Un intervalle de confiance encadre une estimation avec une marge. Une méthode à $95\%$ couvre le paramètre fixe dans environ $95\%$ des répétitions, sous ses hypothèses.
    en: A confidence interval surrounds an estimate with a margin. A $95\%$ method covers the fixed parameter in about $95\%$ of repetitions, under its assumptions. Hypothetical
    id: c2
    exemple:
      fr: une estimation de $20$ avec une marge de $3$ donne les bornes $17$ et $23$.
      en: an estimate of $20$ with margin $3$ gives endpoints $17$ and $23$.
  - id: d_marge
    type: idee
    fr: "Un intervalle se construit en trois temps : une estimation au centre, une marge, puis les deux bornes « estimation moins marge » et « estimation plus marge »."
    en: "An interval is built in three moves: an estimate at the center, a margin, then the two bounds “estimate minus margin” and “estimate plus margin”."
    figure:
      kind: schema
      lignes:
        - titre:
            fr: Construction
            en: Construction
          noeuds:
            - fr: estimation $12$
              en: estimate $12$
            - fr: marge $1{,}5$
              en: margin $1.5$
            - fr: bornes $10{,}5$ et $13{,}5$
              en: bounds $10.5$ and $13.5$
              ton: ok
      legende:
        fr: $12-1{,}5=10{,}5$ et $12+1{,}5=13{,}5$.
        en: $12-1.5=10.5$ and $12+1.5=13.5$.
  - id: d_erreur
    type: idee
    fr: "L’**erreur standard** de la moyenne vaut $\\sigma/\\sqrt n$ : plus l’échantillon est grand, plus la moyenne est précise. La marge est un multiple de cette erreur."
    en: "The **standard error** of the mean is $\\sigma/\\sqrt n$: the larger the sample, the more precise the mean. The margin is a multiple of this error."
    figure:
      kind: tableau
      entetes:
        - fr: Taille $n$
          en: Size $n$
        - fr: $\sigma/\sqrt n$ avec $\sigma=6$
          en: $\sigma/\sqrt n$ with $\sigma=6$
        - fr: Erreur standard
          en: Standard error
      cellules:
        - - $9$
          - $6/3$
          - $2$
        - - $25$
          - $6/5$
          - $1{,}2$
        - - $100$
          - $6/10$
          - fr: $0{,}6$
            en: $0.6$
            ton: ok
      legende:
        fr: "La racine carrée grandit lentement : pour une précision bien meilleure, il faut beaucoup plus de données."
        en: "The square root grows slowly: much better precision requires much more data."
  - type: exemple
    lang: python
    titre:
      fr: Une marge, deux bornes
      en: One margin, two endpoints
    etapes:
      - code: from math import sqrt
        fr: Suppose des observations normales indépendantes de même loi, avec un écart-type de population connu.
        en: Assume independent, identically distributed normal observations, with a known population standard deviation.
      - code: moyenne, sigma, n = 10, 2, 16
        fr: La moyenne est $10$, l’écart-type connu $2$, la taille $16$.
        en: The mean is $10$, the known standard deviation $2$, the size $16$.
      - code: marge = 1.96 * sigma / sqrt(n)
        fr: "Divise l’écart-type connu par la racine de la taille : c’est l’erreur standard. Multiplie par le facteur arrondi $1{,}96$ pour environ $95\\%$ de confiance."
        en: "Divide the known standard deviation by the square root of sample size: this is the standard error. Multiply by rounded factor $1.96$ for approximately $95\\%$ confidence."
      - code: print(round(moyenne-marge, 2), round(moyenne+marge, 2))
        fr: Les bornes sont $9{,}02$ et $10{,}98$.
        en: The endpoints are $9.02$ and $10.98$.
    verif: |-
      from math import sqrt
      moyenne, sigma, n = 10, 2, 16
      marge = 1.96 * sigma / sqrt(n)
      print(round(moyenne-marge, 2), round(moyenne+marge, 2))
    sortie: 9.02 10.98
    id: c3
  - id: d_exint
    type: exemple
    titre:
      fr: Un intervalle de bout en bout
      en: An interval from start to finish
    etapes:
      - fr: "Moyenne observée $50$, écart-type connu $10$, taille $25$ : l’erreur standard vaut $\\frac{10}{5}=2$."
        en: "Observed mean $50$, known standard deviation $10$, size $25$: the standard error is $\\frac{10}{5}=2$."
      - fr: Pour environ $95\,\%$, la marge vaut $1{,}96\times2=3{,}92$.
        en: For about $95\,\%$, the margin is $1.96\times2=3.92$.
      - fr: L’intervalle est $[46{,}08\ ;\ 53{,}92]$. On l’interprète par la méthode répétée, pas comme une probabilité sur le paramètre.
        en: The interval is $[46.08\ ;\ 53.92]$. Interpret it through the repeated method, not as a probability on the parameter.
  - type: saisie
    note:
      kind: exercise
      poids: 1
    fr: Note $\sigma$ l’écart-type connu de la population et $n$ le nombre d’observations indépendantes. Avec $\sigma=2$ et $n=16$, calcule l’erreur standard $\sigma/\sqrt n$.
    en: Write $\sigma$ for the known population standard deviation and $n$ for the number of independent observations. With $\sigma=2$ and $n=16$, compute the standard error $\sigma/\sqrt n$.
    reponses:
      - "0.5"
      - 0,5
    verif: |-
      from math import sqrt
      print(2/sqrt(16))
    explication:
      fr: "L’erreur standard décrit la variabilité de la moyenne : $2/4=0{,}5$, pas celle d’une observation."
      en: "The standard error describes variability of the mean: $2/4=0.5$, not variability of an observation."
    indice: { fr: 'Calcule $\sqrt{16}$ puis divise $\sigma$ par ce résultat.', en: 'Compute $\sqrt{16}$ then divide $\sigma$ by that result.' }
    id: c4
  - type: saisie
    note:
      kind: exercise
      poids: 1
    fr: Avec une erreur standard de $0{,}5$, calcule la marge en utilisant exactement le facteur arrondi $1{,}96$.
    en: With a standard error of $0.5$, compute the margin using exactly the rounded factor $1.96$.
    reponses:
      - "0.98"
      - 0,98
      - "0.980"
      - 0,980
    verif: |-
      from decimal import Decimal
      print(Decimal("1.96")*Decimal("0.5"))
    explication:
      fr: La marge vaut $1{,}96$ erreurs standards, donc $0{,}98$.
      en: The margin is $1.96$ standard errors, hence $0.98$.
    indice: { fr: 'Marge = facteur × erreur standard.', en: 'Margin = factor × standard error.' }
    id: c5
  - type: saisie
    note:
      kind: exercise
      poids: 1
    fr: Garde le même écart-type connu et le même niveau de confiance. Par quel facteur faut-il multiplier $n$ pour diviser la marge par $2$ ?
    en: Keep the same known standard deviation and confidence level. By what factor must you multiply $n$ to halve the margin?
    reponses:
      - "4"
    verif: |-
      from math import sqrt
      print(next(k for k in range(1,17) if 1/sqrt(k)==.5))
    explication:
      fr: "La marge varie comme $1/\\sqrt n$ : il faut quatre fois plus d’observations indépendantes."
      en: "The margin scales as $1/\\sqrt n$: you need four times as many independent observations."
    indice: { fr: 'La marge varie comme $1/\sqrt n$ : que faut-il faire à $n$ pour diviser $\sqrt n$ par 2 ?', en: 'The margin varies as $1/\sqrt n$: what must be done to $n$ to divide $\sqrt n$ by 2?' }
    id: c6
  - type: piege
    fr: Après observation, l’intervalle contient le paramètre fixe ou ne le contient pas. « 95 % » qualifie la méthode répétée, pas une probabilité attribuée au paramètre.
    en: After observation, the interval either contains the fixed parameter or does not. “95%” describes the repeated procedure, not a probability assigned to the parameter.
    id: c7
  - id: d_niveaux
    type: idee
    fr: "Plus on veut de confiance, plus l’intervalle s’élargit : le facteur multiplicateur grandit. C’est le prix d’une méthode qui se trompe moins souvent."
    en: "The more confidence you want, the wider the interval: the multiplying factor grows. This is the price of a method that errs less often."
    figure:
      kind: tableau
      entetes:
        - fr: Confiance
          en: Confidence
        - fr: Facteur normal
          en: Normal factor
        - fr: Marge si erreur $=1$
          en: Margin if error $=1$
      cellules:
        - - $90\,\%$
          - $1{,}645$
          - $1{,}645$
        - - $95\,\%$
          - $1{,}96$
          - $1{,}96$
        - - $99\,\%$
          - $2{,}576$
          - fr: $2{,}576$
            en: $2.576$
            ton: bad
      legende:
        fr: Facteurs de la loi normale centrée réduite, arrondis.
        en: Factors of the standard normal law, rounded.
  - type: saisie
    note:
      kind: exercise
      poids: 1
    fr: Dans une simulation où la vraie moyenne est $10$, on obtient les intervalles $[9,11]$, $[8,9]$, $[10,12]$, $[11,13]$. Combien couvrent la moyenne (bornes incluses) ?
    en: In a simulation with true mean $10$, the intervals are $[9,11]$, $[8,9]$, $[10,12]$, $[11,13]$. How many cover the mean (endpoints included)?
    reponses:
      - "2"
    verif: |-
      intervals=[(9,11),(8,9),(10,12),(11,13)]
      print(sum(a<=10<=b for a,b in intervals))
    explication:
      fr: Le premier et le troisième contiennent $10$. Quatre répétitions ne suffisent pas pour mesurer précisément la couverture.
      en: The first and third contain $10$. Four repetitions are too few to estimate coverage precisely.
    indice: { fr: 'Pour chaque intervalle, regarde si $10$ est entre les bornes (incluses).', en: 'For each interval, check whether $10$ is between the bounds (included).' }
    id: c8
  - type: saisie
    note:
      kind: exercise
      poids: 1
    fr: À erreur standard $0{,}5$, on remplace le facteur $1{,}96$ par $2{,}58$ pour viser environ $99\%$. Quelle est la nouvelle marge ?
    en: At standard error $0.5$, replace factor $1.96$ with $2.58$ to target approximately $99\%$. What is the new margin?
    reponses:
      - "1.29"
      - 1,29
      - "1.290"
      - 1,290
    verif: |-
      from decimal import Decimal
      print(Decimal("2.58")*Decimal("0.5"))
    explication:
      fr: Une confiance plus élevée élargit l’intervalle, à données identiques.
      en: Higher confidence widens the interval for the same data.
    indice: { fr: 'Marge = nouveau facteur × erreur standard.', en: 'Margin = new factor × standard error.' }
    id: c9
  - type: plus
    fr: "Pour aller plus loin : si l’écart-type de population est inconnu, on l’estime avec les observations. Pour des observations normales indépendantes, on utilise alors un facteur de Student, dépendant de la taille (NIST, sources)."
    en: "Further exploration: if the population standard deviation is unknown, estimate it from observations. For independent normal observations, then use a Student factor that depends on sample size (NIST, sources)."
    id: c10
  - type: saisie
    note:
      kind: quiz
      poids: 1
    fr: "Défi : moyenne $3$, écart-type connu $4$, observations normales indépendantes. Quelle taille minimale donne une marge au plus $0{,}98$, avec le facteur $1{,}96$ ?"
    en: "Challenge: mean $3$, known standard deviation $4$, independent normal observations. What minimum sample size gives a margin at most $0.98$, using factor $1.96$?"
    reponses:
      - "64"
    verif: |-
      from fractions import Fraction
      from math import ceil
      ratio=Fraction(196,100)*4/Fraction(98,100)
      print(ceil(ratio**2))
    explication:
      fr: Il faut $\sqrt n\ge1{,}96\times4/0{,}98=8$, donc $n\ge64$. La moyenne ne change pas la marge.
      en: We need $\sqrt n\ge1.96\times4/0.98=8$, so $n\ge64$. The mean does not change the margin.
    defi: true
    indice: { fr: 'Résous « facteur × $\sigma/\sqrt n\leq0{,}98$ » pour $\sqrt n$, puis élève au carré.', en: 'Solve “factor × $\sigma/\sqrt n\leq0.98$” for $\sqrt n$, then square.' }
    id: c11
  - type: retenir
    fr: "À retenir : Kintana accompagne une estimation d’une marge et de ses hypothèses. La couverture est une propriété de répétition de la méthode."
    en: "Remember: Kintana accompanies an estimate with a margin and its assumptions. Coverage is a repeated-sampling property of the method."
    id: c12
