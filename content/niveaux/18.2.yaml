# Niveau 18.2 — Performance 2 : hiérarchie mémoire, cache LRU, localité. Original academik ; notions vérifiées dans Drepper (lien) et Nystrom, Game Programming Patterns (cité).
id: '18.2'
module: 18
duree_min: 13
titre:
  fr: Mémoire, cache et localité
  en: Memory, cache and locality
ia:
  fr: Kintana lit la mémoire dans le bon ordre pour que le cache l’aide.
  en: Kintana reads memory in the right order so that the cache helps her.
sources:
- titre: Drepper — What Every Programmer Should Know About Memory
  url: https://people.freebsd.org/~lstewart/articles/cpumemory.pdf
  licence: Lien seulement ; texte non repris
- titre: 'Nystrom — Game Programming Patterns : Data Locality'
