cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: Un processeur lit les données bien plus vite dans une petite mémoire proche (le **cache**) que dans la grande mémoire principale (RAM). Que faut-il faire pour que le programme soit rapide ?
  en: A processor reads data much faster in a small nearby memory (the **cache**) than in the large main memory (RAM). What should be done for the program to be fast?
  choix:
  - fr: Réutiliser des données proches ou récentes pour qu’elles restent dans le cache
    en: Reuse nearby or recent data so that they stay in the cache
    juste: true
  - fr: Lire les données au hasard
    en: Read data at random
  - fr: Ne jamais réutiliser une donnée
    en: Never reuse a piece of data
  indice:
    fr: Le cache garde ce qu’on vient de lire et ses voisins. Que doit-on lire ensuite pour en profiter ?
    en: The cache keeps what we just read and its neighbours. What should we read next to take advantage of it?
  explication:
    fr: 'C’est le **principe de localité** : lire des données voisines (localité spatiale) ou déjà lues récemment (localité temporelle) est bien plus rapide.'
    en: 'This is the **locality principle**: reading neighbouring data (spatial locality) or recently read data (temporal locality) is much faster.'
- id: c2
  type: idee
  fr: 'La mémoire est une **hiérarchie** : registres, cache (petit, très rapide), RAM (grande, lente), disque (énorme, très lent). Un accès au cache coûte quelques cycles ; un accès à la RAM en coûte des centaines. Quand une donnée manque au cache, c’est un **défaut de cache** (cache miss).'
  en: 'Memory is a **hierarchy**: registers, cache (small, very fast), RAM (large, slow), disk (huge, very slow). A cache access costs a few cycles; a RAM access costs hundreds. When a piece of data is missing from the cache, it is a **cache miss**.'
  exemple:
    fr: 'Lire un nombre dans le cache : environ 4 cycles. Dans la RAM : environ 200 cycles, soit 50 fois plus.'
    en: 'Reading a number in the cache: about 4 cycles. In RAM: about 200 cycles, 50 times more.'
  figure:
    kind: tableau
    entetes:
    - fr: Niveau
      en: Level
    - fr: Taille typique
      en: Typical size
    - fr: Coût d’accès
      en: Access cost
    cellules:
    - - fr: cache
        en: cache
      - 32 Ko – 32 Mo
      - fr: ~4 cycles
        en: ~4 cycles
        ton: ok
    - - RAM
      - 8 – 64 Go
      - fr: ~200 cycles
        en: ~200 cycles
        ton: bad
    - - fr: disque
        en: disk
      - 500 Go +
      - fr: très lent
        en: very slow
        ton: bad
    legende:
      fr: Plus c’est grand, plus c’est lent.
      en: The bigger, the slower.
- id: c3
  type: idee
  fr: 'Le cache charge la mémoire par **lignes** : en lisant une case, il en ramène aussi les voisines (par exemple 8 nombres d’affilée). Parcourir un tableau dans l’ordre de sa disposition en mémoire profite de ces voisins. Sauter d’une case à une case très éloignée les gaspille.'
  en: 'The cache loads memory in **lines**: reading one cell also brings its neighbours (for example 8 consecutive numbers). Traversing an array in the order of its memory layout takes advantage of those neighbours. Jumping from one cell to a far-away cell wastes them.'
  exemple:
    fr: 'Une matrice stockée ligne par ligne : lire `m[i][0]`, `m[i][1]`, `m[i][2]` est un parcours voisin ; lire `m[0][j]`, `m[1][j]`, `m[2][j]` saute d’une ligne entière.'
    en: 'A matrix stored row by row: reading `m[i][0]`, `m[i][1]`, `m[i][2]` is a neighbouring traversal; reading `m[0][j]`, `m[1][j]`, `m[2][j]` jumps a whole row.'
- id: c3b
  type: idee
  fr: 'Deux niveaux de localité. La **localité spatiale** : si on lit une case, on lira sans doute ses voisines (parcours de tableau). La **localité temporelle** : si on lit une case, on la relira sans doute bientôt (variable de boucle). Un bon programme a les deux.'
  en: 'Two kinds of locality. **Spatial locality**: if we read a cell, we will probably read its neighbours (array traversal). **Temporal locality**: if we read a cell, we will probably reread it soon (loop variable). A good program has both.'
  exemple:
    fr: Une boucle qui additionne un tableau a une forte localité spatiale ; le total qu’elle met à jour a une forte localité temporelle.
    en: A loop summing an array has strong spatial locality; the total it updates has strong temporal locality.
- id: c4
  type: exemple
  titre:
    fr: Simuler un petit cache
    en: Simulating a small cache
  lang: python
  etapes:
  - code: |-
      cache, defauts = [], 0
      acces = [1, 2, 1, 3, 4, 1]
    fr: Une suite d’adresses ; un cache de 2 places.
    en: A sequence of addresses; a 2-slot cache.
  - code: |-
      for a in acces:
          if a in cache:
              cache.remove(a)
          else:
              defauts += 1
              if len(cache) == 2:
                  cache.pop(0)
          cache.append(a)
    fr: Un accès présent « rafraîchit » la donnée ; un accès absent est un défaut et évince la plus ancienne.
    en: A present access “refreshes” the data; a missing one is a miss and evicts the oldest.
  - code: print(defauts)
    fr: 'On affiche `5` : seul le deuxième accès à `1` était dans le cache.'
    en: 'We display `5`: only the second access to `1` was in the cache.'
  verif: |-
    cache, defauts = [], 0
    acces = [1, 2, 1, 3, 4, 1]
    for a in acces:
        if a in cache:
            cache.remove(a)
        else:
            defauts += 1
            if len(cache) == 2:
                cache.pop(0)
        cache.append(a)
    print(defauts)
  sortie: '5'
- id: c5
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `defauts_cache(acces, taille)`** : un cache `LRU` (le moins récemment utilisé est évincé) de `taille` places. Pour chaque accès `a` : s’il est dans le cache, retire-le puis remets-le à la fin ; sinon compte un défaut, ajoute-le à la fin et, si le cache dépasse `taille`, retire le premier. Renvoie le nombre de défauts.'
  en: 'Your turn. **Write `defauts_cache(acces, taille)`**: an `LRU` cache (least recently used is evicted) of `taille` slots. For each access `a`: if it is in the cache, remove it then put it back at the end; otherwise count a miss, append it and, if the cache exceeds `taille`, remove the first. Return the number of misses.'
  depart: |
    # écris ta fonction defauts_cache ici
  tests: |-
    assert defauts_cache([1, 2, 1, 3, 4, 1], 2) == 5
    assert defauts_cache([1, 1, 1, 1], 1) == 1
    assert defauts_cache([1, 2, 3, 1, 2, 3], 3) == 3
    assert defauts_cache([1, 2, 3, 1, 2, 3], 2) == 6
    assert defauts_cache([], 4) == 0
  solutionCode: |
    def defauts_cache(acces, taille):
        cache = []
        defauts = 0
        for a in acces:
            if a in cache:
                cache.remove(a)
                cache.append(a)
            else:
                defauts += 1
                cache.append(a)
                if len(cache) > taille:
                    cache.pop(0)
        return defauts
  indice:
    fr: Une liste `cache` ordonnée du plus ancien au plus récent ; `in`, `remove`, `append` et `pop(0)` suffisent.
    en: A `cache` list ordered from oldest to most recent; `in`, `remove`, `append` and `pop(0)` suffice.
  explication:
    fr: 'Quand le cache est plus petit que l’ensemble des données utilisées en boucle, chaque accès est un défaut : l’effondrement des performances.'
    en: 'When the cache is smaller than the set of data used in a loop, every access is a miss: the performance collapse.'
- id: c6
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: 'Avec un cache de 3 places, on accède aux adresses `1, 2, 3, 4, 1`. Combien de défauts de cache ? (LRU : l’adresse 1 a été évincée quand on a lu 4.)'
  en: 'With a 3-slot cache, we access addresses `1, 2, 3, 4, 1`. How many cache misses? (LRU: address 1 was evicted when 4 was read.)'
  reponses:
  - '5'
  verif: print(5)
  indice:
    fr: 'Aucune adresse n’est lue deux fois avant d’être évincée : que vaut le nombre de défauts ?'
    en: 'No address is read twice before being evicted: what is the number of misses?'
  explication:
    fr: 'Les cinq accès sont des défauts : 1, 2, 3, 4 sont nouveaux, et 1 a déjà été évincé.'
    en: 'All five accesses are misses: 1, 2, 3, 4 are new, and 1 has already been evicted.'
- id: c7
  type: idee
  fr: 'Appliquons-le à une matrice $n\times n$ stockée **ligne par ligne**. Le parcours **par lignes** ($i$ puis $j$) lit des cases voisines : une ligne de cache en sert plusieurs. Le parcours **par colonnes** ($j$ puis $i$) saute à chaque fois de $n$ cases : chaque lecture ramène une nouvelle ligne de cache.'
  en: 'Let us apply it to an $n\times n$ matrix stored **row by row**. The **row** traversal ($i$ then $j$) reads neighbouring cells: one cache line serves several. The **column** traversal ($j$ then $i$) jumps $n$ cells each time: every read brings in a new cache line.'
  exemple:
    fr: 'Pour $n=64$ et des lignes de 8 cases : parcours par lignes, 1 défaut pour 8 accès ; par colonnes, presque 1 défaut par accès.'
    en: 'For $n=64$ and lines of 8 cells: row traversal, 1 miss per 8 accesses; column traversal, almost 1 miss per access.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Lignes ou colonnes
        en: Rows or columns
      noeuds:
      - fr: matrice rangée par lignes
        en: matrix stored by rows
      - fr: parcours par lignes
        en: row traversal
      - fr: parcours par colonnes
        en: column traversal
      - fr: même résultat, coûts différents
        en: same result, different costs
        ton: ok
    legende:
      fr: L’ordre des boucles n’a aucun effet sur le résultat, mais un grand effet sur la vitesse.
      en: The order of the loops has no effect on the result, but a big effect on speed.
- id: c8
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `defauts_parcours(ordre, n, taille_ligne, taille_cache)`** : `ordre` est la liste des cases `(i, j)` dans l’ordre de lecture. La case `(i, j)` appartient à la ligne de cache numéro `(i * n + j) // taille_ligne`. Renvoie le nombre de défauts de `defauts_cache` sur cette suite de numéros de lignes. `defauts_cache` et `ligne_de` sont fournies.'
  en: 'Challenge. **Write `defauts_parcours(ordre, n, taille_ligne, taille_cache)`**: `ordre` is the list of cells `(i, j)` in reading order. Cell `(i, j)` belongs to cache line number `(i * n + j) // taille_ligne`. Return the number of misses of `defauts_cache` on this sequence of line numbers. `defauts_cache` and `ligne_de` are provided.'
  depart: |
    def defauts_cache(acces, taille):
        cache = []
        defauts = 0
        for a in acces:
            if a in cache:
                cache.remove(a)
                cache.append(a)
            else:
                defauts += 1
                cache.append(a)
                if len(cache) > taille:
                    cache.pop(0)
        return defauts

    def ligne_de(i, j, n, taille_ligne):
        return (i * n + j) // taille_ligne

    def acces_lignes(n):
        return [(i, j) for i in range(n) for j in range(n)]

    def acces_colonnes(n):
        return [(i, j) for j in range(n) for i in range(n)]

    # écris ta fonction defauts_parcours ici
  tests: |-
    n = 32
    l = defauts_parcours(acces_lignes(n), n, 8, 4)
    c = defauts_parcours(acces_colonnes(n), n, 8, 4)
    assert l == 32 * 32 // 8
    assert c > 5 * l
    assert defauts_parcours([], 4, 8, 4) == 0
    assert defauts_parcours([(0, 0), (0, 1)], 4, 8, 1) == 1
  solutionCode: |
    def defauts_cache(acces, taille):
        cache = []
        defauts = 0
        for a in acces:
            if a in cache:
                cache.remove(a)
                cache.append(a)
            else:
                defauts += 1
                cache.append(a)
                if len(cache) > taille:
                    cache.pop(0)
        return defauts

    def acces_lignes(n):
        return [(i, j) for i in range(n) for j in range(n)]

    def acces_colonnes(n):
        return [(i, j) for j in range(n) for i in range(n)]

    def ligne_de(i, j, n, taille_ligne):
        return (i * n + j) // taille_ligne

    def defauts_parcours(ordre, n, taille_ligne, taille_cache):
        return defauts_cache([ligne_de(i, j, n, taille_ligne) for i, j in ordre], taille_cache)
  indice:
    fr: Fabrique la liste `[ligne_de(i, j, n, taille_ligne) for i, j in ordre]` et passe-la à `defauts_cache` avec `taille_cache`.
    en: Build the list `[ligne_de(i, j, n, taille_ligne) for i, j in ordre]` and pass it to `defauts_cache` with `taille_cache`.
  explication:
    fr: 'Le parcours par lignes fait 4 fois moins de défauts… ici bien plus : c’est la raison pour laquelle on parcourt les tableaux dans l’ordre de leur rangement.'
    en: 'The row traversal makes many times fewer misses: this is why we traverse arrays in the order of their storage.'
- id: c9
  type: piege
  fr: 'En Python pur, l’effet du cache est masqué : une liste de listes stocke des **références** dispersées, et l’interpréteur ajoute son propre coût. C’est avec des tableaux contigus (NumPy, C, C++) que la localité compte le plus. Ne conclus donc pas d’un chronomètre Python sur la matrice, mais de ce modèle du cache.'
  en: 'In pure Python, the cache effect is hidden: a list of lists stores scattered **references**, and the interpreter adds its own cost. It is with contiguous arrays (NumPy, C, C++) that locality matters most. So do not conclude from a Python stopwatch on the matrix, but from this cache model.'
- id: c10
  type: idee
  fr: Les tableaux de **structures** ou d’objets dispersés sont lents à parcourir ; un tableau de nombres contigus est rapide. C’est pourquoi les bibliothèques numériques stockent leurs données en blocs contigus, et pourquoi les GPU et le machine learning aiment les grands tableaux réguliers.
  en: Arrays of **structures** or scattered objects are slow to traverse; an array of contiguous numbers is fast. This is why numerical libraries store their data in contiguous blocks, and why GPUs and machine learning like large regular arrays.
  exemple:
    fr: 'Les poids du réseau du module 11 sont de grandes matrices contiguës : lire une ligne entière profite à plein du cache.'
    en: 'The network weights of module 11 are large contiguous matrices: reading a whole row takes full advantage of the cache.'
- id: c11
  type: retenir
  fr: 'Hiérarchie : registres, cache, RAM, disque. Défaut de cache = accès lent. Localité spatiale et temporelle. Parcourir dans l’ordre du rangement. Modèle LRU. Le cache compte surtout avec des tableaux contigus.'
  en: 'Hierarchy: registers, cache, RAM, disk. Cache miss = slow access. Spatial and temporal locality. Traverse in storage order. LRU model. The cache matters most with contiguous arrays.'
