- id: c13
  type: retenir
  fr: 'Monte-Carlo : simuler, moyenner, donner l’intervalle $\bar x\pm1{,}96\,s/\sqrt N$. Une probabilité est une fréquence. Erreur en $1/\sqrt N$. L’intervalle ne mesure pas l’erreur du modèle.'
  en: 'Monte Carlo: simulate, average, give the interval $\bar x\pm1.96\,s/\sqrt N$. A probability is a frequency. Error in $1/\sqrt N$. The interval does not measure model error.'
