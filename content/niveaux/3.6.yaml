# Niveau 3.6 — Algorithmes 6 : récursivité. Original academik ; notions vérifiées dans la documentation officielle Python (définition de fonctions, limite de récursion, functools.cache) et dans Mon_livre_d_algo (récursivité, notions reprises et réécrites).
id: '3.6'
module: 3
duree_min: 18
titre: { fr: 'Récursivité', en: 'Recursion' }
ia: { fr: 'Kintana résout un problème en le ramenant à un problème plus petit de même forme.', en: 'Kintana solves a problem by reducing it to a smaller problem of the same shape.' }
sources:
  - { titre: 'Python — Tutoriel, définir des fonctions', url: 'https://docs.python.org/3/tutorial/controlflow.html#defining-functions', licence: 'PSF License (documentation officielle, citée)' }
  - { titre: 'Python — sys.getrecursionlimit', url: 'https://docs.python.org/3/library/sys.html#sys.getrecursionlimit', licence: 'PSF License (documentation officielle, citée)' }
