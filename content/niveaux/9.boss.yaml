  - id: d_vocab
    type: idee
    fr: 'Le **vocabulaire** est la liste des mots connus, établie sur l’**entraînement seul** (leçon du niveau 8.boss). Un mot absent du vocabulaire est **ignoré** : il ne change aucun comptage.'
    en: 'The **vocabulary** is the list of known words, established on **training alone** (lesson of level 8.boss). A word absent from the vocabulary is **ignored**: it changes no count.'
