  - id: c3
    type: code
    note: { kind: exercise, poids: 1 }
    fr: 'À toi. **Écris `vectoriser(texte, vocab)`** : la liste des comptages de chaque mot de `vocab` dans `texte` (mots séparés par des espaces, en minuscules).'
    en: 'Your turn. **Write `vectoriser(texte, vocab)`**: the list of counts of each word of `vocab` in `texte` (words separated by spaces, lowercase).'
    depart: |
      # écris ta fonction vectoriser ici
    tests: |
      vocab = ["bonjour", "salut", "heure", "aide"]
      assert vectoriser("salut salut bonjour", vocab) == [1, 2, 0, 0]
      assert vectoriser("xyz", vocab) == [0, 0, 0, 0]
      assert vectoriser("", vocab) == [0, 0, 0, 0]
      assert vectoriser("Aide aide", vocab) == [0, 0, 0, 2]
    solutionCode: |
      def vectoriser(texte, vocab):
          mots = texte.lower().split()
          return [mots.count(m) for m in vocab]
    indice: { fr: 'Découpe `texte.lower().split()`, puis pour chaque mot du vocabulaire, `mots.count(m)`.', en: 'Split `texte.lower().split()`, then for each vocabulary word, `mots.count(m)`.' }
    explication: { fr: 'On passe en minuscules d’abord : « Aide » et « aide » comptent pour le même mot (niveau 2.boss).', en: 'We lowercase first: “Aide” and “aide” count as the same word (level 2.boss).' }
  - id: d_centroide
    type: idee
    fr: 'Pour chaque intention, on calcule son **profil** : la **moyenne** des vecteurs de ses exemples d’entraînement (le **centroïde**). Une demande reçoit l’intention dont le profil a le **cosinus le plus grand** avec son vecteur.'
    en: 'For each intent, we compute its **profile**: the **mean** of the vectors of its training examples (the **centroid**). A request receives the intent whose profile has the **largest cosine** with its vector.'
    figure:
