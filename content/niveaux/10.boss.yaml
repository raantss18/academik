# Niveau 10.boss — Prévoir sans tricher (mission : détecter une fuite temporelle). Original academik ; notions vérifiées dans la documentation scikit-learn (TimeSeriesSplit, Common pitfalls) et Hyndman et Athanasopoulos (lien, texte non repris).
id: '10.boss'
module: 10
duree_min: 19
titre: { fr: 'Prévoir sans tricher', en: 'Forecasting without cheating' }
ia: { fr: 'Kintana évalue ses prévisions comme dans la vraie vie : au fil du temps, sans jamais regarder le futur.', en: 'Kintana evaluates her forecasts as in real life: as time goes by, never looking at the future.' }
objectifs:
  - { fr: 'évaluer par walk-forward', en: 'evaluate with walk-forward' }
  - { fr: 'réestimer à chaque tour avec le passé seul', en: 're-estimate each round with the past only' }
  - { fr: 'battre une référence naïve, ou l''avouer', en: 'beat a naive baseline, or admit it' }
sources:
  - { titre: 'scikit-learn — TimeSeriesSplit (validation de séries temporelles)', url: 'https://scikit-learn.org/stable/modules/cross_validation.html#time-series-split', licence: 'BSD-3-Clause (documentation officielle, citée)' }
