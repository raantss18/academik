cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: Tu tapes l’adresse d’un site dans ton navigateur. Avant que la moindre page s’affiche, le navigateur doit transformer le nom en adresse numérique. Quel service fait cela ?
  en: You type a website address in your browser. Before any page appears, the browser must turn the name into a numeric address. Which service does this?
  choix:
  - fr: Le DNS (système de noms de domaine)
    en: DNS (domain name system)
    juste: true
  - fr: Le TLS
    en: TLS
  - fr: Le pare-feu
    en: The firewall
  indice:
    fr: 'C’est l’annuaire d’Internet : il associe un nom comme `exemple.org` à une adresse IP.'
    en: 'It is the internet’s phone book: it maps a name like `exemple.org` to an IP address.'
  explication:
    fr: Le **DNS** traduit un nom en **adresse IP**. Ensuite, le navigateur ouvre une connexion vers cette adresse et un **port**.
    en: '**DNS** translates a name into an **IP address**. Then, the browser opens a connection to that address and a **port**.'
- id: c2
  type: idee
  fr: Un échange sur Internet empile des couches. Une **adresse IP** identifie une machine, un **port** un service (443 pour HTTPS). **TCP** transmet sans perte, **HTTP** décrit les requêtes, **TLS** chiffre.
  en: An internet exchange stacks layers. An **IP address** identifies a machine, a **port** a service (443 for HTTPS). **TCP** transmits without loss, **HTTP** describes requests, **TLS** encrypts.
  exemple:
    fr: '`https://exemple.org/cours` : schéma `https`, hôte `exemple.org`, port 443 par défaut, chemin `/cours`.'
    en: '`https://exemple.org/cours`: scheme `https`, host `exemple.org`, default port 443, path `/cours`.'
  figure:
    kind: tableau
    entetes:
    - fr: Couche
      en: Layer
    - fr: Rôle
      en: Role
    cellules:
    - - IP
      - fr: trouver la machine
        en: find the machine
    - - TCP
      - fr: transmettre sans perte
        en: transmit without loss
    - - fr: TLS
        en: TLS
        ton: ok
      - fr: chiffrer et authentifier
        en: encrypt and authenticate
        ton: ok
    legende:
      fr: HTTPS = HTTP dans un tunnel TLS.
      en: HTTPS = HTTP inside a TLS tunnel.
- id: c3
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `analyser_url(url)`** avec `urllib.parse.urlparse`. Renvoie un dictionnaire : `"schema"`, `"hote"` (`hostname`), `"port"` (443 pour `https`, 80 pour `http` s’il est absent) et `"chemin"` (`"/"` s’il est vide).'
  en: 'Your turn. **Write `analyser_url(url)`** with `urllib.parse.urlparse`. Return a dictionary: `"schema"`, `"hote"` (`hostname`), `"port"` (443 for `https`, 80 for `http` if absent) and `"chemin"` (`"/"` if empty).'
  depart: |
    import urllib.parse

    # écris ta fonction analyser_url ici
  tests: |-
    a = analyser_url("https://exemple.org/cours/1?x=2")
    assert a == {"schema": "https", "hote": "exemple.org", "port": 443, "chemin": "/cours/1"}
    assert analyser_url("http://exemple.org")["port"] == 80
    assert analyser_url("http://exemple.org:8080/a")["port"] == 8080
    assert analyser_url("https://exemple.org")["chemin"] == "/"
  solutionCode: |
    import urllib.parse

    def analyser_url(url):
        p = urllib.parse.urlparse(url)
        return {"schema": p.scheme, "hote": p.hostname, "port": p.port or (443 if p.scheme == "https" else 80 if p.scheme == "http" else None), "chemin": p.path or "/"}
  indice:
    fr: '`p = urllib.parse.urlparse(url)` donne `scheme`, `hostname`, `port` et `path` ; complète les valeurs par défaut avec `or`.'
    en: '`p = urllib.parse.urlparse(url)` gives `scheme`, `hostname`, `port` and `path`; fill in the defaults with `or`.'
  explication:
    fr: Analyser une adresse avec une bibliothèque évite les pièges des expressions régulières maison.
    en: Parsing an address with a library avoids the traps of homemade regular expressions.
- id: c3b
  type: exemple
  titre:
    fr: Lire une adresse
    en: Reading an address
  lang: python
  etapes:
  - code: |-
      import urllib.parse
      u = urllib.parse.urlparse("https://exemple.org:8443/cours/1?x=2")
    fr: On analyse une adresse complète.
    en: We parse a full address.
  - code: hote, port, chemin = u.hostname, u.port, u.path
    fr: On extrait l’hôte, le port et le chemin.
    en: We extract the host, the port and the path.
  - code: print(u.scheme, hote, port, chemin)
    fr: On affiche `https exemple.org 8443 /cours/1`.
    en: We display `https exemple.org 8443 /cours/1`.
  verif: |-
    import urllib.parse
    u = urllib.parse.urlparse("https://exemple.org:8443/cours/1?x=2")
    hote, port, chemin = u.hostname, u.port, u.path
    print(u.scheme, hote, port, chemin)
  sortie: https exemple.org 8443 /cours/1
- id: c4
  type: idee
  fr: '**TLS** protège un échange de trois façons. **Confidentialité** : personne ne lit. **Intégrité** : personne ne modifie sans être détecté. **Authentification** : le **certificat** du serveur, signé par une autorité, prouve à qui on parle.'
  en: '**TLS** protects an exchange in three ways. **Confidentiality**: nobody reads. **Integrity**: nobody modifies without detection. **Authentication**: the server’s **certificate**, signed by an authority, proves who we talk to.'
  exemple:
    fr: 'Le cadenas du navigateur signifie : connexion chiffrée **et** certificat valide pour ce nom de domaine.'
    en: 'The browser padlock means: encrypted connection **and** valid certificate for that domain name.'
- id: c4b
  type: idee
  fr: 'Un **certificat** lie un nom de domaine à une clé publique, et il est signé par une autorité de certification. Le navigateur vérifie la signature, la date de validité et le nom. Un certificat expiré ou pour un autre nom provoque un avertissement : il ne faut pas le contourner.'
  en: 'A **certificate** binds a domain name to a public key, and is signed by a certificate authority. The browser checks the signature, the validity date and the name. An expired certificate or one for another name triggers a warning: it must not be bypassed.'
  exemple:
    fr: Un certificat pour `exemple.org` n’est pas valable pour `exemple.org.evil.example`.
    en: A certificate for `exemple.org` is not valid for `exemple.org.evil.example`.
- id: c5
  type: idee
  fr: 'Poignée de main TLS 1.3 : client et serveur échangent des clés éphémères et le serveur envoie son certificat. Les deux calculent la **même clé secrète** sans l’envoyer (échange de clés qu’on verra au niveau 19.2), puis chiffrent avec elle.'
  en: 'TLS 1.3 handshake: client and server exchange ephemeral keys and the server sends its certificate. Both compute the **same secret key** without sending it (key exchange to be seen in level 19.2), then encrypt with it.'
  exemple:
    fr: 'C’est l’échange de clés de Diffie-Hellman (niveau 19.2) : deux inconnus se mettent d’accord sur un secret en public.'
    en: 'It is the Diffie-Hellman key exchange (level 19.2): two strangers agree on a secret in public.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Poignée de main TLS 1.3
        en: TLS 1.3 handshake
      noeuds:
      - fr: 'client : clé éphémère'
        en: 'client: ephemeral key'
      - fr: 'serveur : clé + certificat'
        en: 'server: key + certificate'
      - fr: clé secrète commune
        en: shared secret key
      - fr: échange chiffré
        en: encrypted exchange
        ton: ok
    legende:
      fr: 'Le secret n’est jamais envoyé : il est calculé des deux côtés.'
      en: 'The secret is never sent: it is computed on both sides.'
- id: c6
  type: code
  note:
    kind: exercise
    poids: 1
  fr: '**Écris `dans_reseau(ip, cidr)`** avec le module `ipaddress` : `True` si l’adresse `ip` appartient au réseau `cidr` (par exemple `"192.168.0.0/16"`). Puis **`est_privee(ip)`** : `True` si l’adresse est privée (`is_private`).'
  en: '**Write `dans_reseau(ip, cidr)`** with the `ipaddress` module: `True` if the address `ip` belongs to the network `cidr` (for example `"192.168.0.0/16"`). Then **`est_privee(ip)`**: `True` if the address is private (`is_private`).'
  depart: |
    import ipaddress

    # écris tes fonctions dans_reseau et est_privee ici
  tests: |-
    assert dans_reseau("192.168.1.10", "192.168.0.0/16") is True
    assert dans_reseau("10.1.2.3", "192.168.0.0/16") is False
    assert dans_reseau("10.1.2.3", "10.0.0.0/8") is True
    assert est_privee("10.0.0.5") is True
    assert est_privee("192.168.1.1") is True
    assert est_privee("8.8.8.8") is False
  solutionCode: |
    import ipaddress

    def dans_reseau(ip, cidr):
        return ipaddress.ip_address(ip) in ipaddress.ip_network(cidr)

    def est_privee(ip):
        return ipaddress.ip_address(ip).is_private
  indice:
    fr: '`ipaddress.ip_address(ip) in ipaddress.ip_network(cidr)` et `ipaddress.ip_address(ip).is_private`.'
    en: '`ipaddress.ip_address(ip) in ipaddress.ip_network(cidr)` and `ipaddress.ip_address(ip).is_private`.'
  explication:
    fr: 'Les adresses privées (10.x, 172.16–31.x, 192.168.x) ne sont pas joignables depuis l’extérieur : un agent ne doit pas non plus s’y connecter sans raison.'
    en: 'Private addresses (10.x, 172.16–31.x, 192.168.x) are not reachable from outside: an agent must not connect to them without reason either.'
- id: c7
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Le réseau `192.168.1.0/24` fixe les 24 premiers bits. Combien d’adresses contient-il en tout ? (Calcule $2^{32-24}$.)
  en: The network `192.168.1.0/24` fixes the first 24 bits. How many addresses does it contain in total? (Compute $2^{32-24}$.)
  reponses:
  - '256'
  verif: print(2 ** (32 - 24))
  indice:
    fr: Il reste $32-24=8$ bits libres pour les adresses.
    en: $32-24=8$ free bits remain for the addresses.
  explication:
    fr: $2^8=256$ adresses (dont 2 réservées en pratique).
    en: $2^8=256$ addresses (2 of which are reserved in practice).
- id: c8
  type: idee
  fr: 'Une application qui va chercher une adresse donnée par un utilisateur s’expose à une attaque **SSRF**. On lui fait demander une adresse interne (`http://192.168.1.1/admin`). Défense : liste blanche d’hôtes, HTTPS, pas d’adresses privées.'
  en: 'An application that fetches an address given by a user is exposed to an **SSRF** attack. It is made to request an internal address (`http://192.168.1.1/admin`). Defence: allowlist of hosts, HTTPS, no private addresses.'
  exemple:
    fr: Une page web demandant « va lire http://169.254.169.254/ » vise les métadonnées d’un serveur cloud.
    en: A web page asking “go read http://169.254.169.254/” targets a cloud server’s metadata.
- id: c9
  type: code
  defi: true
  note:
    kind: quiz
    poids: 1
  fr: 'Défi. **Écris `url_sure(url, hotes_autorises)`** : `True` seulement si le schéma est `"https"` **et** que l’hôte (`hostname`) est dans la liste `hotes_autorises`. Utilise `urllib.parse.urlparse`.'
  en: 'Challenge. **Write `url_sure(url, hotes_autorises)`**: `True` only if the scheme is `"https"` **and** the host (`hostname`) is in the `hotes_autorises` list. Use `urllib.parse.urlparse`.'
  depart: |
    import urllib.parse

    # écris ta fonction url_sure ici
  tests: |-
    ok = ["exemple.org"]
    assert url_sure("https://exemple.org/a", ok) is True
    assert url_sure("http://exemple.org/a", ok) is False
    assert url_sure("https://evil.example/a", ok) is False
    assert url_sure("https://exemple.org.evil.example/a", ok) is False
    assert url_sure("https://exemple.org@evil.example/a", ok) is False
    assert url_sure("https://localhost/a", ok) is False
  solutionCode: |
    import urllib.parse

    def url_sure(url, hotes_autorises):
        p = urllib.parse.urlparse(url)
        return p.scheme == "https" and p.hostname in hotes_autorises
  indice:
    fr: Compare `p.scheme == "https"` et `p.hostname in hotes_autorises` ; ne teste pas le texte de l’URL avec `startswith`.
    en: Compare `p.scheme == "https"` and `p.hostname in hotes_autorises`; do not test the URL text with `startswith`.
  explication:
    fr: Comparer l’**hôte analysé** et non le texte brut déjoue les ruses comme `exemple.org@evil.example` ou `exemple.org.evil.example`.
    en: Comparing the **parsed host** and not the raw text defeats tricks like `exemple.org@evil.example` or `exemple.org.evil.example`.
- id: c10
  type: piege
  fr: 'Chiffrer ne veut pas dire « sûr ». HTTPS protège le **trajet** : il ne dit rien de la fiabilité du site ni de son contenu. Un site de phishing peut avoir un cadenas. Et une connexion HTTPS vers l’imposteur est tout aussi chiffrée : l’authentification du bon nom de domaine compte autant que le chiffrement.'
  en: 'Encrypting does not mean “safe”. HTTPS protects the **journey**: it says nothing about the site’s trustworthiness or content. A phishing site can have a padlock. And an HTTPS connection to the impostor is just as encrypted: authenticating the right domain name matters as much as encryption.'
- id: c11
  type: idee
  fr: 'Le niveau suivant détaille les briques de la cryptographie moderne. Règle d’or : on **utilise des bibliothèques reconnues** et des protocoles standard, on n’invente jamais les siens. La cryptographie est l’un des domaines où une petite erreur, invisible aux tests, détruit toute la sécurité.'
  en: 'The next level details the building blocks of modern cryptography. Golden rule: we **use recognised libraries** and standard protocols, we never invent our own. Cryptography is one of the domains where a small error, invisible to tests, destroys all the security.'
  exemple:
    fr: 'Même des experts se trompent en implémentant : c’est pourquoi on réutilise des bibliothèques relues par des centaines de spécialistes.'
    en: 'Even experts make mistakes when implementing: this is why we reuse libraries reviewed by hundreds of specialists.'
- id: c12
  type: retenir
  fr: 'Nom → IP (DNS) → port → TCP → TLS → HTTP. TLS : confidentialité, intégrité, authentification (certificat). Clé commune calculée, jamais envoyée. SSRF : liste blanche, HTTPS, pas d’adresses privées. Analyser les URL avec une bibliothèque.'
  en: 'Name → IP (DNS) → port → TCP → TLS → HTTP. TLS: confidentiality, integrity, authentication (certificate). Shared key computed, never sent. SSRF: allowlist, HTTPS, no private addresses. Parse URLs with a library.'
