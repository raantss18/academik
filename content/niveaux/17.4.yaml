# Niveau 17.4 — Recherche quantitative 4 : options, parité, modèle binomial et Black-Scholes. Original academik ; notions vérifiées dans le cours 15.401 du MIT (lien) et Black et Scholes 1973 (lien). Cadre strictement pédagogique.
