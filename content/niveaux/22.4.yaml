# Niveau 22.4 — Recherche 4 : Hessienne et convexité. Original academik ; notions vérifiées dans Boyd et Vandenberghe, Convex Optimization (lien) et Goodfellow et al., Deep Learning ch. 4 (lien). Calculs exécutés.
