  fr: Hessienne et convexité
  en: Hessian and convexity
ia:
  fr: Kintana lit la courbure de sa perte et choisit un pas de descente qui ne diverge pas.
  en: Kintana reads the curvature of her loss and picks a descent step that does not diverge.
