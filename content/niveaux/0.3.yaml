id: '0.3'
module: 0
duree_min: 11
titre: { fr: 'Récurrence', en: 'Mathematical induction' }
ia: { fr: 'Kintana justifie une règle qui reste vraie à chaque étape de traitement.', en: 'Kintana justifies a rule that remains true at every processing step.' }
sources:
  - { titre: 'COMIMa — Récurrence, chapitre 1 (cours et recueil)', url: 'https://www.comima.mg', licence: 'Textes Antsa : autorisation du 2026-11-01 ; tiers exclus' }
  - { titre: 'Oscar Levin — Induction', url: 'https://discrete.openmathbooks.org/dmoi3/sec_seq-induction.html', licence: 'CC BY-SA 4.0' }
cartes:
  - id: c1
    indice: { fr: 'Une chaîne d’implications a besoin d’un point de départ. Lequel ?', en: 'A chain of implications needs a starting point. Which one?' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana sait que chaque étape réussie entraîne la réussite de la suivante. Que manque-t-il pour garantir toutes les étapes à partir de la première ?'
    en: 'Kintana knows that each successful step implies success at the next. What is missing to guarantee all steps starting with the first?'
    choix:
      - { fr: 'La réussite de la première étape.', en: 'Success at the first step.', juste: true }
      - { fr: 'Le numéro de la dernière étape seulement.', en: 'Only the number of the last step.' }
      - { fr: 'Rien : le passage suffit.', en: 'Nothing: the transition is enough.' }
    explication: { fr: 'Sans départ vrai, la chaîne d’implications peut ne jamais établir une seule réussite.', en: 'Without a true starting point, the chain of implications may never establish a single success.' }
  - id: d_sequence
    type: idee
    fr: Une suite est une liste de valeurs repérées par un entier appelé indice. $u_n$ se lit « u indice n ». Le premier indice peut être zéro.
    en: A sequence is a list of values labelled by an integer called an index. $u_n$ reads “u subscript n”. The first index may be zero.
  - id: c2
    type: idee
    fr: 'On note $P(n)$ une **propriété** qui dépend d’un entier $n$ : pour chaque $n$, elle est vraie ou fausse. La **récurrence** prouve $P(n)$ pour tous les entiers à partir d’un premier, $n_0$, comme une file de dominos.'
    en: 'We write $P(n)$ for a **property** that depends on an integer $n$: for each $n$, it is true or false. **Induction** proves $P(n)$ for all integers from a first one, $n_0$, like a row of dominoes.'
    exemple: { fr: '$P(n)$ : « $u_n=2+3n$ ». $P(0)$ dit $u_0=2$ ; $P(1)$ dit $u_1=5$.', en: '$P(n)$: “$u_n=2+3n$”. $P(0)$ says $u_0=2$; $P(1)$ says $u_1=5$.' }
  - id: c2a
    type: idee
    fr: 'Deux étapes suffisent. **Initialisation** : vérifier $P(n_0)$, le premier domino tombe. **Hérédité** : pour un $k\geq n_0$ quelconque, supposer $P(k)$ et en déduire $P(k+1)$, chaque domino fait tomber le suivant.'
    en: 'Two steps are enough. **Base case**: check $P(n_0)$, the first domino falls. **Inductive step**: for any $k\geq n_0$, assume $P(k)$ and deduce $P(k+1)$, each domino knocks over the next.'
    figure:
      kind: schema
      lignes:
        - titre: { fr: 'Initialisation', en: 'Base case' }
          noeuds: [{ fr: 'on vérifie $P(n_0)$', en: 'check $P(n_0)$' }, { fr: 'le 1er domino tombe', en: 'the 1st domino falls', ton: ok }]
        - titre: { fr: 'Hérédité', en: 'Inductive step' }
          noeuds: [{ fr: 'on suppose $P(k)$', en: 'assume $P(k)$' }, { fr: 'on montre $P(k+1)$', en: 'show $P(k+1)$' }, { fr: 'chaque domino pousse le suivant', en: 'each domino pushes the next', ton: ok }]
        - titre: { fr: 'Conclusion', en: 'Conclusion' }
          noeuds: ['$P(n_0)$', '$P(n_0+1)$', '$P(n_0+2)$', { fr: '… tous tombent', en: '… all fall', ton: ok }]
      legende: { fr: 'Sans initialisation, rien ne tombe ; sans hérédité, la chaîne s’arrête.', en: 'Without a base case, nothing falls; without the inductive step, the chain stops.' }
  - id: c3
    type: exemple
    titre: { fr: 'Un compteur de messages', en: 'A message counter' }
    etapes:
      - { fr: 'Le compteur commence à $u_0=2$ et suit $u_{n+1}=u_n+3$ ; on veut prouver $u_n=2+3n$.', en: 'The counter starts at $u_0=2$ and follows $u_{n+1}=u_n+3$; we want to prove $u_n=2+3n$.' }
      - { fr: 'Initialisation : $u_0=2=2+3\times0$.', en: 'Base case: $u_0=2=2+3\times0$.' }
      - { fr: 'Si $u_k=2+3k$, alors $u_{k+1}=u_k+3=2+3(k+1)$ ; donc la formule vaut pour tout entier $n\geq0$.', en: 'If $u_k=2+3k$, then $u_{k+1}=u_k+3=2+3(k+1)$; hence the formula holds for every integer $n\geq0$.' }
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Par quoi commence une preuve par récurrence ?'
    en: 'What does a proof by induction start with?'
    choix:
      - { fr: 'Par vérifier le premier cas (l’initialisation)', en: 'By checking the first case (initialisation)', juste: true }
      - { fr: 'Par supposer que tout est vrai', en: 'By assuming everything is true' }
      - { fr: 'Par tester dix valeurs au hasard', en: 'By testing ten random values' }
    explication: { fr: 'On vérifie d’abord le premier domino, puis on prouve que chaque domino fait tomber le suivant.', en: 'We first check the first domino, then prove that each domino knocks over the next.' }
    indice: { fr: 'Pense au premier domino.', en: 'Think of the first domino.' }
  - id: d_start
    type: exemple
    titre:
      fr: Démarrer au bon indice
      en: Starting at the right index
    etapes:
      - fr: Une réserve commence avec $5$ unités à l’indice zéro. Chaque étape ajoute $4$ unités.
        en: A reserve starts with $5$ units at index zero. Each step adds $4$ units.
      - fr: "Les premières valeurs sont $5$, $9$, $13$ : deux étapes donnent trois valeurs en comptant le départ."
        en: "The first values are $5$, $9$, $13$: two steps give three values when the starting value is included."
      - fr: La formule candidate est $5+4n$. Au départ, $5+4\times0=5$.
        en: The candidate formula is $5+4n$. At the start, $5+4\times0=5$.
    verif: print([5+4*n for n in range(3)])
    sortie: "[5, 9, 13]"
  - id: d_p_start
    type: piege
    fr: Vérifier plusieurs valeurs ne remplace pas l’hérédité. Une formule peut marcher au début puis échouer plus loin.
    en: Checking several values does not replace the inductive step. A formula may work initially and fail later.
  - id: c4
    indice: { fr: 'Applique la règle trois fois à partir de $u_0$ : on ajoute $3$ à chaque pas.', en: 'Apply the rule three times from $u_0$: add $3$ at each step.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Avec $u_0=2$ et $u_{n+1}=u_n+3$, calcule $u_3$.'
    en: 'With $u_0=2$ and $u_{n+1}=u_n+3$, compute $u_3$.'
    reponses: ['11']
    verif: "u=2\nfor _ in range(3): u+=3\nprint(u)"
    explication: { fr: 'Les valeurs successives sont $2$, $5$, $8$, $11$ ; l’indice commence à zéro.', en: 'The successive values are $2$, $5$, $8$, $11$; the index starts at zero.' }
  - id: c5
    indice: { fr: 'L’initialisation porte sur le **premier** entier concerné par la propriété.', en: 'Initialisation concerns the **first** integer covered by the property.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Dans une récurrence visant tous les entiers $n\geq3$, quel cas doit-on initialiser ?'
    en: 'In an induction intended to cover every integer $n\geq3$, which case must be established first?'
    choix:
      - { fr: '$P(0)$ seulement', en: '$P(0)$ only' }
      - { fr: '$P(3)$', en: '$P(3)$', juste: true }
      - { fr: '$P(4)$ seulement', en: '$P(4)$ only' }
    explication: { fr: 'Le point de départ demandé est $3$ ; un départ à $4$ laisserait le cas $3$ sans preuve.', en: 'The requested starting point is $3$; starting at $4$ would leave case $3$ unproved.' }
  - id: d_sum
    type: idee
    fr: Les points de suspension dans une somme indiquent que l’on continue avec les termes intermédiaires. $S_n$ désigne ici la somme jusqu’au rang $n$.
    en: Dots in a sum mean that we continue with the intermediate terms. Here, $S_n$ denotes the sum up to index $n$.
  - id: d_sum_step
    type: exemple
    titre:
      fr: Ajouter le terme suivant
      en: Adding the next term
    etapes:
      - fr: Pour les nombres impairs, posons $S_n=1+3+\cdots+(2n-1)$. La formule à prouver est $S_n=n^2$.
        en: For odd numbers, set $S_n=1+3+\cdots+(2n-1)$. The formula to prove is $S_n=n^2$.
      - fr: "Départ : $S_1=1=1^2$. Si $S_k=k^2$, ajoutons le prochain impair, $2k+1$."
        en: "Base case: $S_1=1=1^2$. If $S_k=k^2$, add the next odd number, $2k+1$."
      - fr: "$S_{k+1}=k^2+2k+1=(k+1)^2$ : le passage est établi."
        en: "$S_{k+1}=k^2+2k+1=(k+1)^2$: the step is established."
      - fr: Par exemple, $1+3+5=9$, puis $9+7=16$.
        en: For example, $1+3+5=9$, then $9+7=16$.
    verif: |-
      assert all(sum(range(1,2*n,2))==n*n for n in range(1,50))
      print(sum([1,3,5]),sum([1,3,5,7]))
    sortie: 9 16
  - id: d_p_step
    type: piege
    fr: L’hypothèse au rang courant sert à démontrer le suivant. Supposer directement la formule au rang suivant serait tourner en rond.
    en: The hypothesis at the current index helps prove the next. Assuming the formula directly at the next index would be circular.
  - id: c6
    indice: { fr: 'Dans l’hérédité, on suppose le rang $k$ pour en déduire le rang $k+1$, jamais l’inverse.', en: 'In the inductive step, we assume rank $k$ to deduce rank $k+1$, never the opposite.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour prouver $1+\cdots+n=n(n+1)/2$ pour $n\geq1$, quelle hypothèse peut-on utiliser à l’étape $k\to k+1$ ?'
    en: 'To prove $1+\cdots+n=n(n+1)/2$ for $n\geq1$, which hypothesis may be used in the step $k\to k+1$?'
    choix:
      - { fr: 'La formule est déjà vraie pour tous les entiers.', en: 'The formula already holds for all integers.' }
      - { fr: 'La formule au rang $k+1$, qui est à démontrer.', en: 'The formula at index $k+1$, which is what we must prove.' }
      - { fr: '$1+\cdots+k=k(k+1)/2$ pour un $k\geq1$ fixé quelconque.', en: '$1+\cdots+k=k(k+1)/2$ for a fixed arbitrary $k\geq1$.', juste: true }
    explication: { fr: 'On suppose le rang $k$ uniquement pour établir le passage ; supposer le résultat visé serait circulaire.', en: 'We assume case $k$ only to establish the transition; assuming the target result would be circular.' }
  - id: c7
    indice: { fr: 'Ajoute $k+1$ à $k(k+1)/2$, puis factorise $k+1$.', en: 'Add $k+1$ to $k(k+1)/2$, then factor out $k+1$.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'À partir de $S_k=k(k+1)/2$, on ajoute $k+1$. Quelle expression obtient-on pour $S_{k+1}$ ?'
    en: 'Starting from $S_k=k(k+1)/2$, add $k+1$. Which expression do we obtain for $S_{k+1}$?'
    choix:
      - { fr: '$(k+1)(k+2)/2$', en: '$(k+1)(k+2)/2$', juste: true }
      - { fr: '$k(k+2)/2$', en: '$k(k+2)/2$' }
      - { fr: '$(k+1)^2/2$', en: '$(k+1)^2/2$' }
    explication: { fr: 'On factorise $k+1$ : $(k+1)(k/2+1)=(k+1)(k+2)/2$ ; avec $S_1=1$, la récurrence est complète.', en: 'Factor out $k+1$: $(k+1)(k/2+1)=(k+1)(k+2)/2$; together with $S_1=1$, this completes the induction.' }
  - id: c8
    indice: { fr: 'Applique la formule de la somme des $n$ premiers entiers avec $n=8$.', en: 'Apply the formula for the sum of the first $n$ integers with $n=8$.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Kintana traite $1$ lettre, puis $2$, puis $3$, jusqu’à $8$ lettres au huitième tour. Combien de lettres a-t-il traitées en tout ?'
    en: 'Kintana processes $1$ letter, then $2$, then $3$, up to $8$ letters on round eight. How many letters has it processed in total?'
    reponses: ['36']
    verif: 'print(sum(range(1,9)))'
    explication: { fr: 'La somme vaut $8\times9/2=36$. Le programme la recalcule par addition.', en: 'The sum is $8\times9/2=36$. The program recomputes it by addition.' }
  - id: d_p_jump
    type: piege
    fr: Un passage qui saute un indice ne couvre pas automatiquement tous les entiers. Il faut un départ pour chaque chaîne indépendante.
    en: A step that skips an index does not automatically cover all integers. Each independent chain needs its own starting point.
  - id: c9
    indice: { fr: 'Écris les indices atteints en partant de $0$ et en ajoutant $2$ à chaque fois.', en: 'Write the indices reached starting from $0$ and adding $2$ each time.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'On vérifie $P(0)$ et on prouve seulement $P(k)\Rightarrow P(k+2)$ pour tout $k\geq0$. Quels indices sont garantis ?'
    en: 'We verify $P(0)$ and prove only $P(k)\Rightarrow P(k+2)$ for every $k\geq0$. Which indices are guaranteed?'
    choix:
      - { fr: 'Tous les indices.', en: 'All indices.' }
      - { fr: 'Les indices pairs seulement.', en: 'Only the even indices.', juste: true }
      - { fr: 'Les indices impairs seulement.', en: 'Only the odd indices.' }
    explication: { fr: 'On atteint $0,2,4,\ldots$ ; il faudrait aussi initialiser $P(1)$ pour démarrer la chaîne impaire.', en: 'We reach $0,2,4,\ldots$; we would also need the base case $P(1)$ to start the odd chain.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Un compteur suit $v_0=1$ et $v_{n+1}=2v_n+1$. La formule conjecturée est $v_n=2^{n+1}-1$ : calcule $v_5$.'
    en: 'Challenge. A counter follows $v_0=1$ and $v_{n+1}=2v_n+1$. The conjectured formula is $v_n=2^{n+1}-1$: compute $v_5$.'
    reponses: ['63']
    verif: "v=1\nfor _ in range(5): v=2*v+1\nprint(v)"
    indice: { fr: 'Effectue cinq transitions, ou applique la formule au rang $5$.', en: 'Perform five transitions, or apply the formula at index $5$.' }
    explication: { fr: '$v_5=63$ ; pour prouver la formule, le départ vaut $2^1-1=1$ et le passage donne $2(2^{k+1}-1)+1=2^{k+2}-1$.', en: '$v_5=63$; to prove the formula, the base case gives $2^1-1=1$ and the transition gives $2(2^{k+1}-1)+1=2^{k+2}-1$.' }
  - id: c11
    type: idee
    fr: 'Récap : calculer quelques termes aide Kintana à **deviner** une formule ; la récurrence la **prouve** pour tous les entiers.'
    en: 'Recap: computing a few terms helps Kintana **guess** a formula; induction **proves** it for all integers.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Étape', en: 'Step' }, { fr: 'Ce qu’on écrit', en: 'What we write' }]
      cellules:
        - [{ fr: 'Initialisation', en: 'Base case' }, { fr: '$P(n_0)$ est vraie (calcul direct)', en: '$P(n_0)$ is true (direct computation)' }]
        - [{ fr: 'Hérédité', en: 'Inductive step' }, { fr: 'soit $k\geq n_0$ ; si $P(k)$, alors $P(k+1)$', en: 'let $k\geq n_0$; if $P(k)$, then $P(k+1)$' }]
        - [{ fr: 'Conclusion', en: 'Conclusion' }, { fr: '$P(n)$ vraie pour tout $n\geq n_0$', en: '$P(n)$ true for every $n\geq n_0$', ton: ok }]
      legende: { fr: 'Les trois lignes sont obligatoires dans une rédaction.', en: 'All three rows are required in a written proof.' }

  - id: d_lien
    type: idee
    fr: 'La récurrence répète un même pas à l’infini. Tu retrouveras cette idée dans les boucles (niveau 2.3) puis dans la récursivité (niveau 3.6).'
    en: 'Induction repeats the same step forever. You will find this idea again in loops (level 2.3) then in recursion (level 3.6).'
  - id: d_retenir
    type: retenir
    fr: Kintana justifie une règle qui reste vraie à chaque étape de traitement.
    en: Kintana justifies a rule that remains true at every processing step.
  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [Oscar Levin — Induction](https://discrete.openmathbooks.org/dmoi3/sec_seq-induction.html) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [Oscar Levin — Induction](https://discrete.openmathbooks.org/dmoi3/sec_seq-induction.html); this optional reading needs a connection.
