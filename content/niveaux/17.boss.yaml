cartes:
- id: c1
  type: tentative
  note:
    kind: quiz
    poids: 1
  fr: 'Un collègue te montre sa meilleure stratégie parmi 200 testées : « p-valeur de 0,003, c’est significatif ! ». Que lui réponds-tu ?'
  en: 'A colleague shows you their best strategy among 200 tested: “p-value of 0.003, it’s significant!”. What do you answer?'
  choix:
  - fr: 'Avec 200 essais, une p-valeur de 0,003 est attendue par hasard : il faut corriger pour les essais multiples'
    en: 'With 200 trials, a p-value of 0.003 is expected by chance: we must correct for multiple trials'
    juste: true
  - fr: Bravo, c’est très significatif
    en: Congratulations, it is very significant
  - fr: Il faut juste essayer plus de stratégies
    en: He should just try more strategies
  indice:
    fr: Sur 200 essais sans aucun avantage, combien auront une p-valeur sous 0,05 ? Et sous 0,003 ?
    en: Out of 200 trials with no edge at all, how many will have a p-value below 0.05? And below 0.003?
  explication:
    fr: 'Sans avantage, environ $200\times0{,}003=0{,}6$ essai passe sous $0{,}003$ : tout à fait courant. Le seuil doit devenir $0{,}05/200=0{,}00025$.'
    en: 'Without any edge, about $200\times0.003=0.6$ trial falls below $0.003$: quite common. The threshold must become $0.05/200=0.00025$.'
- id: c2
  type: idee
  fr: 'Mission finale : écrire le **verdict** d’un rapport de recherche. Pour chacune des $N$ stratégies, tu calcules la statistique $t$ puis la p-valeur. Tu prends la meilleure et la compares au seuil **corrigé** $\alpha/N$. Le rapport **rejette** ce qui ne tient pas.'
  en: 'Final mission of the module: write the **verdict** of a research report. You are given $N$ strategies. For each, you compute the $t$ statistic of the mean of its returns, then the p-value; you take the best; and compare it with the **corrected** threshold $\alpha/N$. The report must **reject** what does not hold.'
  figure:
    kind: schema
    lignes:
    - titre:
        fr: Du bruit au verdict
        en: From noise to verdict
      noeuds:
      - fr: $N$ stratégies
        en: $N$ strategies
      - fr: $t$ et p-valeur
        en: $t$ and p-value
      - fr: meilleure vs seuil $\alpha/N$
        en: best vs threshold $\alpha/N$
      - fr: retenir ou rejeter
        en: retain or reject
        ton: ok
    legende:
      fr: Le rejet est un résultat valable, pas un échec.
      en: Rejection is a valid result, not a failure.
- id: c3
  type: idee
  fr: 'La statistique $t$ de la moyenne : $t=\bar r\big/(s/\sqrt n)$, où $\bar r$ est la moyenne des $n$ rendements et $s$ leur écart type. Plus $|t|$ est grand, moins la moyenne observée est compatible avec une moyenne vraie nulle. La p-valeur bilatérale (loi normale) est $\text{erfc}(|t|/\sqrt2)$.'
  en: 'The $t$ statistic of the mean: $t=\bar r\big/(s/\sqrt n)$, where $\bar r$ is the mean of the $n$ returns and $s$ their standard deviation. The larger $|t|$, the less compatible the observed mean is with a true mean of zero. The two-sided p-value (normal law) is $\text{erfc}(|t|/\sqrt2)$.'
  exemple:
    fr: Pour $|t|=1{,}96$, la p-valeur vaut $0{,}05$ ; pour $|t|=3$, $0{,}0027$ ; pour $|t|=4{,}5$, $0{,}000007$.
    en: For $|t|=1.96$, the p-value is $0.05$; for $|t|=3$, $0.0027$; for $|t|=4.5$, $0.000007$.
  figure:
    kind: tableau
    entetes:
    - $|t|$
    - fr: p-valeur bilatérale
      en: Two-sided p-value
    cellules:
    - - 1,96
      - 0,05
    - - '3'
      - 0,0027
    - - fr: 4,5
        en: '4.5'
        ton: ok
      - fr: 0,000007
        en: '0.000007'
        ton: ok
    legende:
      fr: Plus $|t|$ monte, plus la p-valeur s’effondre.
      en: As $|t|$ grows, the p-value collapses.
- id: c3b
  type: idee
  fr: 'Pourquoi la loi normale pour la p-valeur ? Avec beaucoup de rendements indépendants, la moyenne est presque normale (théorème central limite, niveau 6.4). Pour de petits échantillons ou des queues épaisses, la p-valeur normale est trop optimiste : on reste prudent.'
  en: 'Why the normal law for the p-value? With many independent returns, the mean is nearly normal (central limit theorem, level 6.4). For small samples or fat tails, the normal p-value is too optimistic: we stay cautious.'
  exemple:
    fr: Avec 250 rendements quotidiens, l’approximation normale est correcte ; avec 12 rendements mensuels, elle l’est beaucoup moins.
    en: With 250 daily returns, the normal approximation is fine; with 12 monthly returns, much less so.
- id: c4
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `t_stat(r)`** : `n = len(r)`, la moyenne `m`, l’écart type `s` (division par `n - 1`), et renvoie `m / (s / math.sqrt(n))`. Puis **`p_valeur(t)`** : `math.erfc(abs(t) / math.sqrt(2))`.'
  en: 'Your turn. **Write `t_stat(r)`**: `n = len(r)`, the mean `m`, the standard deviation `s` (division by `n - 1`), and return `m / (s / math.sqrt(n))`. Then **`p_valeur(t)`**: `math.erfc(abs(t) / math.sqrt(2))`.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def strategies_bruit(N, n, graine):
        u = generateur(graine)
        return [[0.01 * gauss(u) for _ in range(n)] for _ in range(N)]

    # écris tes fonctions t_stat et p_valeur ici
  tests: |-
    assert abs(p_valeur(1.96) - 0.05) < 1e-3
    assert abs(p_valeur(-1.96) - p_valeur(1.96)) < 1e-12
    assert p_valeur(0) == 1.0
    r = [0.01, 0.03, 0.02, 0.0, 0.04]
    assert abs(t_stat(r) - 0.02 / ((0.0158113883 ** 1) / 5 ** 0.5)) < 1e-6
    assert t_stat([-x for x in r]) == -t_stat(r)
  solutionCode: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def strategies_bruit(N, n, graine):
        u = generateur(graine)
        return [[0.01 * gauss(u) for _ in range(n)] for _ in range(N)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))
  indice:
    fr: '`t_stat` : même calcul que `volatilite` plus une division. `p_valeur` : une ligne avec `math.erfc`.'
    en: '`t_stat`: same computation as `volatilite` plus a division. `p_valeur`: one line with `math.erfc`.'
  explication:
    fr: 'Un $t$ proche de $0$ donne une p-valeur proche de $1$ : aucun indice contre l’hypothèse « avantage nul ».'
    en: 'A $t$ near $0$ gives a p-value near $1$: no evidence against the “no edge” hypothesis.'
