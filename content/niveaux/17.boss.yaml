# Niveau 17.boss — Le rapport qui rejette (mission : verdict corrigé pour les essais multiples). Original academik ; notions des niveaux 17.1 à 17.5, vérifiées dans Bailey et López de Prado 2014 (lien) et le cours 18.642 du MIT (lien). Cadre strictement pédagogique.
id: 17.boss
module: 17
