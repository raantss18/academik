  fr: Avec $N=200$ stratégies et $\alpha=0{,}05$, quel est le seuil corrigé de Bonferroni pour la p-valeur de la meilleure ?
  en: With $N=200$ strategies and $\alpha=0.05$, what is the Bonferroni-corrected threshold for the best one’s p-value?
