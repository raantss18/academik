- id: c7
  type: piege
  fr: 'Un rapport qui ne dit pas combien d’idées ont été essayées est trompeur, même si chaque chiffre est exact. Rapporte toujours : le nombre d’essais, le seuil corrigé, le nombre de résultats « significatifs » avant correction, et ce que devient la meilleure après correction.'
  en: 'A report that does not say how many ideas were tried is misleading, even if every figure is exact. Always report: the number of trials, the corrected threshold, the number of “significant” results before correction, and what the best becomes after correction.'
- id: c8
  type: code
  defi: true
  note:
    kind: quiz
    poids: 2
  fr: 'Défi final. **Écris `verdict(strategies, alpha)`** : avec `N = len(strategies)`, calcule le `t_stat` de chaque stratégie. Retiens la **meilleure** (plus grand `abs(t)`), sa p-valeur `p`, le seuil `alpha / N` et le nombre `brut` de p-valeurs `< alpha` **sans correction**. Renvoie `{"meilleure": indice, "t": t, "p": p, "seuil": seuil, "brut": brut, "retient": p < seuil}`. `t_stat` et `p_valeur` sont fournies.'
  en: 'Final challenge. **Write `verdict(strategies, alpha)`**: with `N = len(strategies)`, compute each strategy’s `t_stat`, keep the **best** (largest `abs(t)`), its p-value `p`, the threshold `alpha / N`, the number `brut` of strategies whose p-value is `< alpha` **without correction**, and return the dictionary `{"meilleure": index, "t": t, "p": p, "seuil": seuil, "brut": brut, "retient": p < seuil}`. `t_stat` and `p_valeur` are provided.'
  depart: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def strategies_bruit(N, n, graine):
        u = generateur(graine)
        return [[0.01 * gauss(u) for _ in range(n)] for _ in range(N)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))

    # écris ta fonction verdict ici
  tests: |-
    S = strategies_bruit(200, 250, 1)
    v = verdict(S, 0.05)
    assert v["retient"] is False and v["brut"] >= 5 and abs(v["seuil"] - 0.00025) < 1e-12
    assert v["p"] > v["seuil"] and 0 <= v["meilleure"] < 200
    u = generateur(11)
    reel = [0.002 + 0.01 * gauss(u) for _ in range(250)]
    u2 = generateur(3)
    bruit = [[0.01 * gauss(u2) for _ in range(250)] for _ in range(199)]
    v2 = verdict(bruit + [reel], 0.05)
    assert v2["retient"] is True and v2["meilleure"] == 199 and v2["p"] < v2["seuil"]
    v3 = verdict(bruit, 0.05)
    assert v3["retient"] is False
  solutionCode: |
    import math

    def generateur(graine):
        etat = [graine]
        def u():
            etat[0] = (etat[0] * 1103515245 + 12345) % 2147483648
            return (etat[0] + 0.5) / 2147483648
        return u

    def gauss(u):
        return math.sqrt(-2 * math.log(u())) * math.cos(2 * math.pi * u())

    def strategies_bruit(N, n, graine):
        u = generateur(graine)
        return [[0.01 * gauss(u) for _ in range(n)] for _ in range(N)]

    def t_stat(r):
        n = len(r)
        m = sum(r) / n
        s = math.sqrt(sum((x - m) ** 2 for x in r) / (n - 1))
        return m / (s / math.sqrt(n))

    def p_valeur(t):
        return math.erfc(abs(t) / math.sqrt(2))

    def verdict(strategies, alpha):
        N = len(strategies)
        ts = [t_stat(r) for r in strategies]
        meilleure = max(range(N), key=lambda i: abs(ts[i]))
        p = p_valeur(ts[meilleure])
        seuil = alpha / N
        brut = sum(1 for t in ts if p_valeur(t) < alpha)
        return {"meilleure": meilleure, "t": ts[meilleure], "p": p, "seuil": seuil, "brut": brut, "retient": p < seuil}
  indice:
    fr: 'Liste des `t`, `meilleure = max(range(N), key=lambda i: abs(ts[i]))`, puis `p`, `seuil`, `brut` et le dictionnaire.'
    en: 'List of `t`, `meilleure = max(range(N), key=lambda i: abs(ts[i]))`, then `p`, `seuil`, `brut` and the dictionary.'
  explication:
    fr: 'Sur du bruit, le verdict est « rejeté » malgré une p-valeur brute impressionnante : ton rapport a protégé le lecteur d’une fausse découverte.'
    en: 'On noise, the verdict is “rejected” despite an impressive raw p-value: your report protected the reader from a false discovery.'
- id: c9
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Sur 200 stratégies de pur bruit, environ 5 % ont une p-valeur sous $0{,}05$ sans correction. À peu près combien de stratégies « significatives » trouve-t-on alors ?
  en: Among 200 strategies of pure noise, about 5% have a p-value below $0.05$ without correction. Roughly how many “significant” strategies do we find then?
  reponses:
  - '10'
  verif: print(int(200 * 0.05))
  indice:
    fr: Multiplie le nombre de stratégies par la proportion attendue.
    en: Multiply the number of strategies by the expected proportion.
  explication:
    fr: $200\times0{,}05=10$ stratégies « significatives » par pur hasard.
    en: $200\times0.05=10$ “significant” strategies by pure chance.
- id: c10
  type: idee
  fr: 'Tu sais ce qui distingue un résultat solide d’un mirage : hypothèse écrite avant, information passée seulement, coûts et essais comptés, correction appliquée. Le **boss final** du cursus réunira tout cela, avec un agent local qui rend un rapport sourcé.'
  en: 'You now know what distinguishes a solid result from a mirage: hypothesis written beforehand, past information only, costs counted, trials counted, correction applied. The curriculum’s **final boss** will bring all this together, with a local agent testing a hypothesis offline and returning a sourced report.'
  exemple:
    fr: 'Ce cadre reste strictement pédagogique : aucune recommandation d’investissement personnalisée.'
    en: 'This framework remains strictly educational: no personalised investment recommendation.'
- id: c11
  type: idee
  fr: 'Dernière habitude : **publier ses rejets**. Un chercheur qui ne publie que ses succès fausse la littérature. Garde un journal : idées testées, résultats, décision. Un résultat rejeté est une information utile.'
  en: 'One last habit: **publish your rejections**. A researcher who publishes only successes distorts the literature. Keep a log: ideas tested, results, decision. When a result is rejected, it is information: the lead was bad, which is useful to know.'
  exemple:
    fr: Dans ton rapport, une ligne « 200 essais, 10 significatifs avant correction, 0 après » est un résultat honnête.
    en: In your report, a line “200 trials, 10 significant before correction, 0 after” is an honest result.
- id: c12
  type: retenir
  fr: '$t=\bar r/(s/\sqrt n)$, p-valeur $=\text{erfc}(|t|/\sqrt2)$. Meilleur de $N$ : seuil $\alpha/N$. Rapporter les essais, le brut, le corrigé. Le rejet est un résultat. Cadre strictement pédagogique.'
  en: '$t=\bar r/(s/\sqrt n)$, p-value $=\text{erfc}(|t|/\sqrt2)$. Best of $N$: threshold $\alpha/N$. Report the trials, the raw, the corrected. Rejection is a result. Strictly educational framework.'
