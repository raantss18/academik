id: '0.1'
module: 0
duree_min: 12
titre: { fr: 'Vrai ou faux ?', en: 'True or false?' }
ia: { fr: 'Kintana distingue une règle générale, un témoin et un contre-exemple.', en: 'Kintana distinguishes a general rule, a witness and a counterexample.' }
sources:
  - { titre: 'COMIMa — Exemples et contre-exemples, chapitre 0', url: 'https://www.comima.mg', licence: 'Textes Antsa : autorisation du 2026-11-01 ; tiers exclus' }
  - { titre: 'Oscar Levin — Mathematical Statements', url: 'https://discrete.openmathbooks.org/dmoi3/sec_intro-statements.html', licence: 'CC BY-SA 4.0' }
cartes:
  - id: c1
    indice: { fr: 'Cherche le nombre de la liste qui n’est pas pair.', en: 'Look for the number in the list that is not even.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Kintana affirme : « Tous les nombres de la liste $[2,4,7]$ sont pairs. » Quel nombre réfute cette affirmation ?'
    en: 'Kintana claims: “All numbers in the list $[2,4,7]$ are even.” Which number refutes this claim?'
    choix:
      - { fr: '2', en: '2' }
      - { fr: '7', en: '7', juste: true }
      - { fr: '4', en: '4' }
    verif: 'print(next(n for n in [2,4,7] if n % 2))'
    sortie: '7'
    explication: { fr: '$7$ est impair : un seul échec suffit à réfuter « tous ».', en: '$7$ is odd: one failure is enough to refute “all”.' }
  - id: c2
    type: idee
    fr: 'Une **proposition** est une phrase qui est soit vraie, soit fausse. Une question ou un ordre n’en est pas une : on ne peut pas dire s’ils sont vrais.'
    en: 'A **proposition** is a sentence that is either true or false. A question or a command is not one: we cannot say whether it is true.'
    exemple: { fr: '« $7$ est pair » est une proposition (fausse). « $7$ est-il pair ? » n’en est pas une.', en: '“$7$ is even” is a proposition (false). “Is $7$ even?” is not one.' }
  - id: d_proposition
    type: exemple
    titre:
      fr: Affirmation ou question ?
      en: Statement or question?
    etapes:
      - fr: « Douze est divisible par trois » affirme quelque chose de vrai ou faux.
        en: “Twelve is divisible by three” asserts something true or false.
      - fr: "$12=3\\times4$ : cette proposition est vraie. Une proposition fausse reste une proposition."
        en: "$12=3\\times4$: this statement is true. A false statement is still a statement."
      - fr: « Divise douze par trois ! » est un ordre, sans valeur de vérité.
        en: “Divide twelve by three!” is a command, with no truth value.
    verif: print(12 // 3)
    sortie: "4"
  - id: d_p_prop
    type: piege
    fr: "Une proposition n’est pas forcément vraie : « douze est impair » est une proposition fausse."
    en: "A statement need not be true: “twelve is odd” is a false statement."
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Laquelle de ces phrases est une proposition ?'
    en: 'Which of these sentences is a proposition?'
    choix:
      - { fr: '« Ferme la porte ! »', en: '“Close the door!”' }
      - { fr: '« Sept est un nombre pair »', en: '“Seven is an even number”', juste: true }
      - { fr: '« Quelle heure est-il ? »', en: '“What time is it?”' }
    explication: { fr: 'Une proposition est vraie ou fausse. « Sept est pair » est fausse, mais c’est bien une proposition.', en: 'A proposition is true or false. “Seven is even” is false, but it is a proposition.' }
    indice: { fr: 'Cherche la phrase dont on peut dire « vrai » ou « faux ».', en: 'Look for the sentence you can call “true” or “false”.' }
  - id: c2a
    type: idee
    fr: 'Deux symboles reviennent partout. Ils parlent toujours d’un **ensemble précisé** : la liste des objets dont on parle.'
    en: 'Two symbols come up everywhere. They always talk about a **specified set**: the list of objects we are talking about.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Symbole', en: 'Symbol' }, { fr: 'Se lit', en: 'Read as' }, { fr: 'Exemple sur $E=\{2,4,7\}$', en: 'Example on $E=\{2,4,7\}$' }]
      cellules:
        - ['$\forall$', { fr: '« pour tout »', en: '“for every”' }, { fr: '« $\forall x\in E$, $x$ est pair » : **faux**, à cause de $7$', en: '“$\forall x\in E$, $x$ is even”: **false**, because of $7$', ton: bad }]
        - ['$\exists$', { fr: '« il existe au moins un »', en: '“there is at least one”' }, { fr: '« $\exists x\in E$, $x$ est pair » : **vrai**, $2$ suffit', en: '“$\exists x\in E$, $x$ is even”: **true**, $2$ is enough', ton: ok }]
      legende: { fr: 'Le nombre qui rend vrai un « il existe » s’appelle un **témoin** ; celui qui rend faux un « pour tout », un **contre-exemple**.', en: 'The number that makes a “there is” true is called a **witness**; the one that makes a “for every” false, a **counterexample**.' }
  - id: d_ensemble
    type: idee
    fr: Un ensemble rassemble des objets. Ici, $x\in E$ se lit « $x$ appartient à l’ensemble $E$ ». La lettre $x$ désigne un objet choisi dans cet ensemble.
    en: A set collects objects. Here, $x\in E$ reads “$x$ belongs to set $E$”. The letter $x$ denotes an object chosen from that set.
  - id: d_quant
    type: exemple
    titre:
      fr: Tous ou au moins un ?
      en: All or at least one?
    etapes:
      - fr: Considérons les nombres $10$, $12$ et $15$. « Au moins un est pair » demande un témoin.
        en: Consider the numbers $10$, $12$ and $15$. “At least one is even” requires a witness.
      - fr: "$10$ est pair : cela suffit. Mais « tous sont pairs » échoue sur $15$."
        en: "$10$ is even: that is enough. But “all are even” fails at $15$."
      - fr: La négation de « tous sont pairs » est donc vraie, sans que tous soient impairs.
        en: The negation of “all are even” is therefore true, without all numbers being odd.
    verif: print([n for n in [10,12,15] if n%2])
    sortie: "[15]"
  - id: d_p_quant
    type: piege
    fr: Trouver un témoin ne signifie pas qu’il est unique. Dans cette liste, dix et douze sont deux témoins de parité.
    en: Finding a witness does not mean it is unique. In this list, ten and twelve are two witnesses of evenness.
  - id: v2
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Quelle est la négation de « tous les nombres de la liste sont pairs » ?'
    en: 'What is the negation of “all numbers in the list are even”?'
    choix:
      - { fr: 'Aucun nombre de la liste n’est pair', en: 'No number in the list is even' }
      - { fr: 'Au moins un nombre de la liste n’est pas pair', en: 'At least one number in the list is not even', juste: true }
      - { fr: 'Tous les nombres de la liste sont impairs', en: 'All numbers in the list are odd' }
    explication: { fr: 'Le contraire de « tous » est « au moins un ne… pas », pas « aucun ».', en: 'The opposite of “all” is “at least one not…”, not “none”.' }
    indice: { fr: 'Relis la carte sur la négation : le contraire de « tous » n’est pas « aucun ».', en: 'Reread the negation card: the opposite of “all” is not “none”.' }
  - id: c2b
    type: idee
    fr: '**Nier** une phrase, c’est dire le contraire exact. Le contraire de « tous » n’est pas « aucun » : c’est « au moins un ne… pas ».'
    en: 'To **negate** a sentence is to say its exact opposite. The opposite of “all” is not “none”: it is “at least one does not”.'
    figure:
      kind: schema
      lignes:
        - noeuds: [{ fr: 'tous vérifient $P$', en: 'all satisfy $P$' }, { fr: 'au moins un ne vérifie pas $P$', en: 'at least one does not satisfy $P$', ton: ok }]
        - noeuds: [{ fr: 'au moins un vérifie $P$', en: 'at least one satisfies $P$' }, { fr: 'aucun ne vérifie $P$', en: 'none satisfies $P$', ton: ok }]
      legende: { fr: 'À gauche une phrase, à droite sa négation : « pour tout » devient « il existe », et inversement.', en: 'On the left a sentence, on the right its negation: “for every” becomes “there is”, and vice versa.' }
  - id: c3
    type: exemple
    titre: { fr: 'Auditer une liste', en: 'Audit a list' }
    etapes:
      - { fr: 'Sur $E=\{1,3,6\}$, examinons « chaque élément est inférieur à $5$ ».', en: 'On $E=\{1,3,6\}$, examine “every element is less than $5$”.' }
      - { fr: '$6$ ne vérifie pas la règle : la proposition universelle est fausse.', en: '$6$ fails the rule: the universal statement is false.' }
      - { fr: 'Sa négation est « il existe un élément supérieur ou égal à $5$ » ; $6$ en est un témoin.', en: 'Its negation is “there is an element greater than or equal to $5$”; $6$ is a witness.' }
  - id: c4
    indice: { fr: 'Une proposition est vraie ou fausse. Une question ou un ordre ne l’est pas.', en: 'A proposition is true or false. A question or an order is not.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Laquelle est une proposition dont on peut décider la vérité ?'
    en: 'Which is a proposition whose truth can be determined?'
    choix:
      - { fr: 'Quel fichier ouvrir ?', en: 'Which file should we open?' }
      - { fr: 'Ouvre ce fichier !', en: 'Open this file!' }
      - { fr: '$8$ est pair.', en: '$8$ is even.', juste: true }
    explication: { fr: 'L’affirmation sur $8$ est vraie ; une question et un ordre n’affirment rien de vrai ou faux.', en: 'The claim about $8$ is true; a question and a command assert nothing true or false.' }
  - id: c5
    indice: { fr: 'Le contraire de « tous » n’est pas « aucun » : relis la carte sur la négation.', en: 'The opposite of “all” is not “none”: reread the negation card.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Quelle est la négation de « tous les messages sont lisibles » ?'
    en: 'What is the negation of “all messages are readable”?'
    choix:
      - { fr: 'Aucun message n’est lisible.', en: 'No message is readable.' }
      - { fr: 'Au moins un message n’est pas lisible.', en: 'At least one message is not readable.', juste: true }
      - { fr: 'Au moins un message est lisible.', en: 'At least one message is readable.' }
    explication: { fr: '« Pas tous » exige un échec, sans imposer que tous échouent.', en: '“Not all” requires one failure, without requiring every message to fail.' }
  - id: c6
    indice: { fr: 'Teste chaque élément de l’ensemble l’un après l’autre : calcule son carré et compare à 8.', en: 'Test each element of the set in turn: compute its square and compare with 8.' }
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Dans $E=\{1,2,3,4\}$, combien de témoins vérifient $x^2>8$ ?'
    en: 'In $E=\{1,2,3,4\}$, how many witnesses satisfy $x^2>8$?'
    reponses: ['2']
    verif: 'print(sum(x*x > 8 for x in [1,2,3,4]))'
    explication: { fr: '$3$ et $4$ conviennent, car leurs carrés sont $9$ et $16$.', en: '$3$ and $4$ work, since their squares are $9$ and $16$.' }
  - id: c7
    indice: { fr: 'Pour nier « il existe », il faut que le cas soit exclu pour chaque fichier.', en: 'To negate “there exists”, the case must be excluded for every file.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Quelle est la négation de « il existe un fichier vide » ?'
    en: 'What is the negation of “there exists an empty file”?'
    choix:
      - { fr: 'Tous les fichiers sont vides.', en: 'All files are empty.' }
      - { fr: 'Il existe un fichier non vide.', en: 'There exists a nonempty file.' }
      - { fr: 'Aucun fichier n’est vide.', en: 'No file is empty.', juste: true }
    explication: { fr: 'Pour nier l’existence, on doit exclure chaque témoin possible.', en: 'To negate existence, every possible witness must be ruled out.' }
  - id: c7b
    type: idee
    fr: 'Une règle « si $P$, alors $Q$ » est une **promesse** : chaque fois que $P$ est vrai, $Q$ doit l’être aussi. Elle n’est fausse que si la promesse est rompue.'
    en: 'A rule “if $P$, then $Q$” is a **promise**: whenever $P$ is true, $Q$ must be true too. It is false only if the promise is broken.'
    figure:
      kind: tableau
      entetes: [{ fr: '« S’il pleut », $P$', en: '“If it rains”, $P$' }, { fr: '« je prends un parapluie », $Q$', en: '“I take an umbrella”, $Q$' }, { fr: 'La promesse', en: 'The promise' }]
      cellules:
        - [{ fr: 'il pleut', en: 'it rains' }, { fr: 'parapluie', en: 'umbrella' }, { fr: 'tenue', en: 'kept', ton: ok }]
        - [{ fr: 'il pleut', en: 'it rains' }, { fr: 'pas de parapluie', en: 'no umbrella' }, { fr: '**rompue**', en: '**broken**', ton: bad }]
        - [{ fr: 'il ne pleut pas', en: 'no rain' }, { fr: 'peu importe', en: 'either way' }, { fr: 'pas concernée : pas rompue', en: 'not concerned: not broken', ton: ok }]
      legende: { fr: 'Une seule ligne rend la règle fausse : hypothèse vraie, conclusion fausse.', en: 'Only one row makes the rule false: true hypothesis, false conclusion.' }
  - id: d_implication
    type: exemple
    titre:
      fr: Tester une promesse
      en: Testing a promise
    etapes:
      - fr: "Règle : si un nombre est multiple de quatre, alors il est pair."
        en: "Rule: if a number is a multiple of four, then it is even."
      - fr: "$12=4\\times3$ et $12=2\\times6$ : hypothèse et conclusion sont vraies."
        en: "$12=4\\times3$ and $12=2\\times6$: hypothesis and conclusion are true."
      - fr: "$6$ est pair sans être multiple de quatre : cela ne rompt pas la promesse initiale."
        en: "$6$ is even without being a multiple of four: this does not break the original promise."
    verif: print(12%4,12%2,6%4,6%2)
    sortie: 0 0 2 0
  - id: d_p_imp
    type: piege
    fr: La réciproque échange les deux parties d’une implication. « Pair implique multiple de quatre » est faux, même si la règle initiale est vraie.
    en: The converse swaps the two parts of an implication. “Even implies multiple of four” is false, even though the original rule is true.
  - id: c8
    indice: { fr: 'Une promesse n’est fausse que dans un seul cas : quand la condition est remplie et la suite non.', en: 'A promise is false in only one case: when the condition holds and the result does not.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pour une règle « si $P$, alors $Q$ », quel cas la rend fausse ?'
    en: 'For a rule “if $P$, then $Q$”, which case makes it false?'
    choix:
      - { fr: '$P$ vrai, $Q$ faux', en: '$P$ true, $Q$ false', juste: true }
      - { fr: '$P$ faux, $Q$ vrai', en: '$P$ false, $Q$ true' }
      - { fr: '$P$ vrai, $Q$ vrai', en: '$P$ true, $Q$ true' }
    explication: { fr: 'La règle promet $Q$ lorsque $P$ est vrai ; seule une promesse non tenue la réfute.', en: 'The rule promises $Q$ when $P$ is true; only a broken promise refutes it.' }
  - id: c9
    indice: { fr: 'Qu’en est-il des entiers que personne n’a testés ? Un test partiel n’est pas une preuve.', en: 'What about the integers nobody tested? A partial test is not a proof.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: '« Tous les entiers positifs vérifient cette règle. » Kintana teste seulement les $100$ premiers avec succès : que peut-il conclure ?'
    en: '“All positive integers satisfy this rule.” Kintana successfully tests only the first $100$: what can it conclude?'
    choix:
      - { fr: 'La règle est démontrée pour tous.', en: 'The rule is proved for all.' }
      - { fr: 'La règle est vérifiée pour les entiers testés seulement.', en: 'The rule is verified only for the tested integers.', juste: true }
      - { fr: 'La règle est nécessairement fausse.', en: 'The rule must be false.' }
    explication: { fr: 'Les entiers non testés restent à traiter par un raisonnement général.', en: 'Untested integers still require a general argument.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Sur $E=\{0,1,2,3,4\}$, combien de valeurs rendent fausse la règle « si $x$ est pair, alors $x<4$ » ?'
    en: 'Challenge. On $E=\{0,1,2,3,4\}$, how many values make “if $x$ is even, then $x<4$” false?'
    reponses: ['1']
    verif: 'print(sum(x % 2 == 0 and not x < 4 for x in range(5)))'
    indice: { fr: 'Cherche une hypothèse vraie et une conclusion fausse.', en: 'Look for a true hypothesis and a false conclusion.' }
    explication: { fr: 'Seul $4$ est pair sans être strictement inférieur à $4$.', en: 'Only $4$ is even without being strictly less than $4$.' }
  - id: c11
    type: idee
    fr: 'Récap : précise l’ensemble, distingue « tous » et « au moins un », puis cherche ce qui réfuterait la règle.'
    en: 'Recap: specify the set, distinguish “all” from “at least one”, then look for what would refute the rule.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Pour montrer que…', en: 'To show that…' }, { fr: 'il suffit de…', en: 'it is enough to…' }]
      cellules:
        - [{ fr: '« il existe » est vrai', en: '“there is” is true' }, { fr: 'trouver **un** témoin', en: 'find **one** witness', ton: ok }]
        - [{ fr: '« pour tout » est faux', en: '“for every” is false' }, { fr: 'trouver **un** contre-exemple', en: 'find **one** counterexample', ton: ok }]
        - [{ fr: '« pour tout » est vrai', en: '“for every” is true' }, { fr: 'vérifier **chaque** cas (ensemble fini) ou faire une preuve', en: 'check **every** case (finite set) or write a proof', ton: bad }]
      legende: { fr: 'Kintana peut tout tester sur un ensemble fini ; sur tous les entiers, quelques tests ne prouvent rien.', en: 'Kintana can test everything on a finite set; on all integers, a few tests prove nothing.' }

  - id: d_lien
    type: idee
    fr: 'La **preuve par contre-exemple** que tu viens d’utiliser a un contraire : au niveau 0.2, tu verras comment démontrer qu’une règle vaut pour tous les cas.'
    en: 'The **proof by counterexample** you just used has an opposite: in level 0.2, you will see how to prove that a rule holds in every case.'
  - id: d_retenir
    type: retenir
    fr: Kintana distingue une règle générale, un témoin et un contre-exemple.
    en: Kintana distinguishes a general rule, a witness and a counterexample.
  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [Oscar Levin — Mathematical Statements](https://discrete.openmathbooks.org/dmoi3/sec_intro-statements.html) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [Oscar Levin — Mathematical Statements](https://discrete.openmathbooks.org/dmoi3/sec_intro-statements.html); this optional reading needs a connection.
