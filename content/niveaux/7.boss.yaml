id: 7.boss
module: 7
duree_min: 11
titre:
  fr: Le faux signal
  en: The false signal
ia:
  fr: "Kintana sait séparer un vrai signal du hasard, et refuse les faux positifs."
  en: "Kintana can tell a real signal from chance, and rejects false positives."
sources:
