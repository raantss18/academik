# Niveau 2.2 — Python 2 : décider. Original academik ; notions vérifiées dans le tutoriel officiel Python (instructions if) et la référence (comparaisons).
id: '2.2'
module: 2
duree_min: 18
titre: { fr: 'Décider', en: 'Deciding' }
ia: { fr: 'Kintana sait choisir entre plusieurs réponses selon une condition.', en: 'Kintana can choose between several answers depending on a condition.' }
sources:
  - titre: Python — Introduction, opérateur reste
    url: https://docs.python.org/3/tutorial/introduction.html
    licence: PSF
  - { titre: 'Python — Tutoriel, instructions if', url: 'https://docs.python.org/3/tutorial/controlflow.html#if-statements', licence: 'PSF License (documentation officielle, citée)' }
  - { titre: 'Python — Référence, comparaisons', url: 'https://docs.python.org/3/reference/expressions.html#comparisons', licence: 'PSF License (documentation officielle, citée)' }
cartes:
  - id: c1
    indice: { fr: 'Teste la condition avec la valeur de `age` : est-elle vraie ou fausse ? Choisis alors la branche.', en: 'Test the condition with the value of `age`: is it true or false? Then pick the branch.' }
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: |
      Que **affiche** ce programme ?

      ```python
      age = 15
      if age >= 18:
          print("majeur")
      else:
          print("mineur")
      ```
    en: |
      What does this program **display**?

      ```python
      age = 15
      if age >= 18:
          print("majeur")
      else:
          print("mineur")
      ```
    choix:
      - { fr: 'Il affiche `majeur`.', en: 'It displays `majeur`.' }
      - { fr: 'Il affiche `mineur`.', en: 'It displays `mineur`.', juste: true }
      - { fr: 'Il n’affiche rien.', en: 'It displays nothing.' }
    explication: { fr: '$15\geq18$ est faux : Python exécute la branche `else`.', en: '$15\geq18$ is false: Python runs the `else` branch.' }
  - id: c2
    type: idee
    fr: 'Une **condition** est une question dont la réponse est `True` (vrai) ou `False` (faux). L’instruction `if` n’exécute ses lignes que si la condition est vraie ; `else` prend la suite sinon.'
    en: 'A **condition** is a question whose answer is `True` or `False`. The `if` statement runs its lines only if the condition is true; `else` takes over otherwise.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Condition', en: 'Condition' }, { fr: 'Se lit', en: 'Read as' }, { fr: 'Si `age = 15`', en: 'If `age = 15`' }]
      cellules:
        - ['`age >= 18`', { fr: 'âge supérieur ou égal à 18', en: 'age greater than or equal to 18' }, { fr: '`False`', en: '`False`', ton: bad }]
        - ['`age < 18`', { fr: 'âge strictement inférieur à 18', en: 'age strictly less than 18' }, { fr: '`True`', en: '`True`', ton: ok }]
        - ['`age == 15`', { fr: 'âge égal à 15', en: 'age equal to 15' }, { fr: '`True`', en: '`True`', ton: ok }]
      legende: { fr: 'Autres comparaisons : `<=` (inférieur ou égal), `>` (strictement supérieur), `!=` (différent).', en: 'Other comparisons: `<=` (less or equal), `>` (strictly greater), `!=` (different).' }
  - id: d_bool
    type: idee
    fr: "Un booléen est une valeur vraie ou fausse : `True` ou `False`. Une comparaison produit cette valeur avant que `if` choisisse une branche."
    en: "A boolean is a true or false value: `True` or `False`. A comparison produces this value before `if` selects a branch."
  - id: d_compare
    type: exemple
    titre:
      fr: Vérifier une limite
      en: Checking a boundary
    etapes:
      - fr: La réserve contient sept unités.
        en: The reserve contains seven units.
        code: reserve = 7
      - fr: "`>=` accepte l’égalité : le premier affichage est `True`."
        en: "`>=` accepts equality: the first output is `True`."
        code: print(reserve >= 7)
      - fr: "`>` exige davantage : le deuxième affichage est `False`."
        en: "`>` requires more: the second output is `False`."
        code: print(reserve > 7)
    verif: |-
      reserve=7
      print(reserve>=7)
      print(reserve>7)
    sortie: |-
      True
      False
  - id: d_p_compare
    type: piege
    fr: Changer `>=` en `>` exclut la valeur limite. Teste toujours cette valeur quand une consigne dit « au moins ».
    en: Changing `>=` to `>` excludes the boundary value. Always test that value when a requirement says “at least”.
  - id: c3
    type: exemple
    titre: { fr: 'Un programme qui décide', en: 'A program that decides' }
    lang: python
    etapes:
      - { code: 'note = 12', fr: 'On range la note `12` dans la variable `note`.', en: 'We store the mark `12` in the variable `note`.' }
      - { code: 'if note >= 10:', fr: 'La condition `note >= 10` est vraie. Les deux-points `:` ouvrent le bloc.', en: 'The condition `note >= 10` is true. The colon `:` opens the block.' }
      - { code: '    print("admis")', fr: 'Ce décalage de quatre espaces, l’**indentation**, dit que la ligne appartient au `if`. Elle s’exécute.', en: 'This four-space shift, the **indentation**, says the line belongs to the `if`. It runs.' }
      - { code: 'else:', fr: 'Le `else` ne s’exécute que si la condition était fausse : ici, on le saute.', en: 'The `else` only runs if the condition was false: here, it is skipped.' }
      - { code: '    print("refusé")', fr: 'Cette ligne est sautée. Le programme affiche donc seulement `admis`.', en: 'This line is skipped. The program therefore displays only `admis`.' }
  - id: v1
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Que vaut la condition `7 >= 7` ?'
    en: 'What is the value of the condition `7 >= 7`?'
    choix:
      - { fr: '`True`', en: '`True`', juste: true }
      - { fr: '`False`', en: '`False`' }
      - { fr: '`7`', en: '`7`' }
    explication: { fr: '`>=` accepte l’égalité : sept est bien supérieur ou égal à sept.', en: '`>=` accepts equality: seven is indeed greater than or equal to seven.' }
    indice: { fr: '`>=` signifie « supérieur ou égal ».', en: '`>=` means “greater than or equal to”.' }
  - id: d_indent
    type: idee
    fr: Un bloc regroupe les instructions d’une branche. L’indentation marque cette appartenance ; revenir à gauche signifie sortir du bloc.
    en: A block groups the instructions of a branch. Indentation marks membership; moving back to the left means leaving the block.
  - id: d_indent_example
    type: exemple
    titre:
      fr: Ce qui s’exécute après la branche
      en: What runs after the branch
    etapes:
      - fr: La valeur deux ne dépasse pas cinq.
        en: Value two does not exceed five.
        code: stock = 2
      - fr: Cette condition est fausse.
        en: This condition is false.
        code: "if stock > 5:"
      - fr: L’instruction indentée est sautée.
        en: The indented instruction is skipped.
        code: '    print("plein")'
      - fr: "Cette ligne est hors du bloc : `fin` s’affiche quand même."
        en: "This line is outside the block: `fin` is still displayed."
        code: print("fin")
    verif: |-
      stock=2
      if stock>5:
          print("plein")
      print("fin")
    sortie: fin
  - id: d_p_indent
    type: piege
    fr: Décaler une ligne change son appartenance au bloc. Ce n’est pas seulement une question de présentation.
    en: Indenting a line changes its block membership. It is not only a matter of appearance.
  - id: c4
    type: code
    note: { kind: exercise, poids: 1 }
    fr: 'À toi. La variable `age` est déjà écrite. **Affiche `majeur` si `age` vaut au moins 18, sinon `mineur`.** Ne change pas la ligne `age = …` : le jeu essaie plusieurs âges.'
    en: 'Your turn. The variable `age` is already written. **Display `majeur` if `age` is at least 18, otherwise `mineur`.** Do not change the `age = …` line: the game tries several ages.'
    depart: |
      age = 15

      # écris ton if / else ici
    tests: |
      for a, attendu in [(15, "mineur"), (18, "majeur"), (40, "majeur"), (0, "mineur")]:
          assert _essai(age=a) == attendu
    solutionCode: |
      age = 15
      if age >= 18:
          print("majeur")
      else:
          print("mineur")
    indice: { fr: 'Compare `age` à `18` avec `>=`. Après `if …:` et `else:`, décale la ligne `print` de quatre espaces.', en: 'Compare `age` with `18` using `>=`. After `if …:` and `else:`, shift the `print` line by four spaces.' }
    explication: { fr: 'Le programme choisit la branche selon `age >= 18`, pour tous les âges essayés.', en: 'The program picks the branch according to `age >= 18`, for every age tried.' }
  - id: c5
    type: idee
    fr: 'Pour plus de deux réponses, ajoute des `elif` (« sinon si »). Python teste les conditions **dans l’ordre** et exécute la **première** qui est vraie, puis saute le reste.'
    en: 'For more than two answers, add `elif` (“else if”). Python tests the conditions **in order** and runs the **first** true one, then skips the rest.'
    exemple:
      fr: |
        ```python
        if note >= 16: print("très bien")
        elif note >= 12: print("bien")
        else: print("à revoir")
        ```
        Avec `note = 14` : le premier test est faux, le deuxième est vrai, on affiche `bien`.
      en: |
        ```python
        if note >= 16: print("très bien")
        elif note >= 12: print("bien")
        else: print("à revoir")
        ```
        With `note = 14`: the first test is false, the second is true, so `bien` is displayed.
  - id: d_order
    type: exemple
    titre:
      fr: Lire les tests dans l’ordre
      en: Reading tests in order
    etapes:
      - fr: Classons une réserve de vingt unités.
        en: Classify a reserve of twenty units.
        code: reserve = 20
      - fr: Le premier test est vrai.
        en: The first test is true.
        code: "if reserve >= 15:"
      - fr: Le programme affiche `haute`.
        en: The program displays `haute`.
        code: '    print("haute")'
      - fr: Ce deuxième test n’est pas évalué.
        en: This second test is not evaluated.
        code: "elif reserve >= 5:"
      - fr: Son affichage est sauté, même si vingt dépasse aussi cinq.
        en: Its output is skipped, even though twenty also exceeds five.
        code: '    print("moyenne")'
    verif: |-
      reserve=20
      if reserve>=15:
          print("haute")
      elif reserve>=5:
          print("moyenne")
    sortie: haute
    figure:
      kind: tableau
      entetes: [{fr: Test, en: Test}, {fr: Évaluation, en: Evaluation}, {fr: Action, en: Action}]
      cellules:
        - ['`reserve >= 15`', '`True`', '`print("haute")`']
        - ['`reserve >= 5`', {fr: non évalué, en: not evaluated}, {fr: aucune, en: none}]
      legende: {fr: Une seule branche est exécutée dans cette chaîne., en: Only one branch runs in this chain.}
  - id: d_p_order
    type: piege
    fr: Tester d’abord « au moins cinq » absorberait aussi vingt. Dans cette classification, commence par le seuil le plus élevé.
    en: Testing “at least five” first would also capture twenty. In this classification, start with the highest threshold.
  - id: c6
    indice: { fr: 'Lis les conditions dans l’ordre : la première vraie est la seule exécutée.', en: 'Read the conditions in order: the first true one is the only one run.' }
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: |
      Que **affiche** ce programme ?

      ```python
      note = 14
      if note >= 16:
          print("très bien")
      elif note >= 12:
          print("bien")
      elif note >= 10:
          print("passable")
      else:
          print("insuffisant")
      ```
    en: |
      What does this program **display**?

      ```python
      note = 14
      if note >= 16:
          print("très bien")
      elif note >= 12:
          print("bien")
      elif note >= 10:
          print("passable")
      else:
          print("insuffisant")
      ```
    choix:
      - { fr: 'Il affiche `bien`.', en: 'It displays `bien`.', juste: true }
      - { fr: 'Il affiche `bien` puis `passable`.', en: 'It displays `bien` then `passable`.' }
      - { fr: 'Il affiche `passable`.', en: 'It displays `passable`.' }
    explication: { fr: '`14 >= 12` est la première condition vraie : Python n’examine plus les suivantes.', en: '`14 >= 12` is the first true condition: Python no longer looks at the next ones.' }
  - id: c7
    type: code
    note: { kind: exercise, poids: 1 }
    fr: 'La variable `note` est déjà écrite. **Affiche `insuffisant` si `note < 10`, `passable` si `note < 14`, sinon `bien`.**'
    en: 'The variable `note` is already written. **Display `insuffisant` if `note < 10`, `passable` if `note < 14`, otherwise `bien`.**'
    depart: |
      note = 12

      # écris ton if / elif / else ici
    tests: |
      for n, attendu in [(0, "insuffisant"), (9, "insuffisant"), (10, "passable"), (13, "passable"), (14, "bien"), (20, "bien")]:
          assert _essai(note=n) == attendu
    solutionCode: |
      note = 12
      if note < 10:
          print("insuffisant")
      elif note < 14:
          print("passable")
      else:
          print("bien")
    indice: { fr: 'Commence par le cas le plus petit. Un `elif` n’est testé que si les conditions d’avant étaient fausses.', en: 'Start with the smallest case. An `elif` is only tested if the conditions before were false.' }
    explication: { fr: 'L’ordre des tests fait le travail : on arrive à `elif note < 14` seulement si `note >= 10`.', en: 'The order of the tests does the work: we only reach `elif note < 14` if `note >= 10`.' }
  - id: c8
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Qu’affiche `print(10 == 10.0)` ? Écris exactement ce qui s’affiche.'
    en: 'What does `print(10 == 10.0)` display? Write exactly what is shown.'
    reponses: ['True']
    verif: 'print(10 == 10.0)'
    indice: { fr: '`==` compare des valeurs, pas des écritures. Dix entier et dix décimal sont-ils le même nombre ?', en: '`==` compares values, not spellings. Are integer ten and decimal ten the same number?' }
    explication: { fr: '`10 == 10.0` est vrai : même valeur. Python affiche `True`, avec une majuscule.', en: '`10 == 10.0` is true: same value. Python displays `True`, with a capital letter.' }
  - id: c9
    type: piege
    fr: 'Un seul `=` **range** une valeur (`age = 15`). Deux `==` **comparent** (`age == 15`). Écrire `if age = 15:` est une erreur.'
    en: 'A single `=` **stores** a value (`age = 15`). Two `==` **compare** (`age == 15`). Writing `if age = 15:` is an error.'
  - id: d_remainder
    type: idee
    fr: L’opérateur `%` calcule le reste d’une division entière. Un reste nul signifie que le nombre est divisible par le diviseur.
    en: The `%` operator computes the remainder of integer division. A zero remainder means that the number is divisible by the divisor.
  - id: d_multiple
    type: exemple
    titre:
      fr: Tester des groupes complets
      en: Testing complete groups
    etapes:
      - fr: "Pour répartir vingt-huit objets par groupes de sept, le reste vaut zéro : aucun objet ne reste seul."
        en: "To divide twenty-eight objects into groups of seven, the remainder is zero: no object is left over."
        code: print(28 % 7 == 0)
      - fr: "Avec vingt-neuf objets, le reste vaut un : la comparaison affiche `False`."
        en: "With twenty-nine objects, the remainder is one: the comparison displays `False`."
        code: print(29 % 7 == 0)
    verif: |-
      print(28%7==0)
      print(29%7==0)
    sortie: |-
      True
      False
  - id: d_p_multiple
    type: piege
    fr: Pour une règle avec exceptions, traite le cas particulier avant le cas général. Sinon, une branche précédente peut empêcher de considérer l’exception.
    en: For a rule with exceptions, handle the special case before the general one. Otherwise, an earlier branch may prevent considering the exception.
  - id: c10
    type: code
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi. Une année est **bissextile** si elle est divisible par 4. Exception : un multiple de 100 ne l’est que s’il est aussi multiple de 400. **Affiche `bissextile` ou `normale`** pour la variable `annee`.'
    en: 'Challenge. A year is a **leap year** if it is divisible by 4. Exception: a multiple of 100 is leap only if it is also a multiple of 400. **Display `bissextile` or `normale`** for the variable `annee`.'
    depart: |
      annee = 2024

      # indice : n % 4 == 0 teste « n est divisible par 4 »
    tests: |
      for a, attendu in [(2024, "bissextile"), (2023, "normale"), (1900, "normale"), (2000, "bissextile"), (2100, "normale"), (2400, "bissextile"), (1, "normale")]:
          assert _essai(annee=a) == attendu
    solutionCode: |
      annee = 2024
      if annee % 400 == 0:
          print("bissextile")
      elif annee % 100 == 0:
          print("normale")
      elif annee % 4 == 0:
          print("bissextile")
      else:
          print("normale")
    indice: { fr: 'Teste d’abord la règle la plus rare : la divisibilité par 400. Puis 100, puis 4. Le reste de la division se calcule avec `%`.', en: 'Test the rarest rule first: divisibility by 400. Then 100, then 4. The remainder of a division is computed with `%`.' }
    explication: { fr: 'Du plus rare au plus courant : 400, puis 100, puis 4. La première condition vraie décide.', en: 'From rarest to most common: 400, then 100, then 4. The first true condition decides.' }
  - id: c10b
    type: code
    defi: 2
    note:
      kind: quiz
      poids: 1
    fr: Défi. Les variables `annee` et `mois` sont écrites. **Affiche le nombre de jours** de ce mois. Avril, juin, septembre et novembre ont 30 jours ; février en a 29 les années bissextiles, 28 sinon ; les autres mois en ont 31.
    en: Challenge. The variables `annee` and `mois` are written. **Print the number of days** of this month. April, June, September and November have 30 days; February has 29 in leap years, 28 otherwise; the other months have 31.
    depart: |
      annee = 2024
      mois = 2

      # écris tes conditions ici
    tests: |
      for a, m, attendu in [(2024, 2, "29"), (2023, 2, "28"), (1900, 2, "28"), (2000, 2, "29"), (2023, 4, "30"), (2023, 11, "30"), (2023, 1, "31"), (2023, 12, "31"), (2023, 7, "31")]:
          assert _essai(annee=a, mois=m) == attendu
    solutionCode: |
      annee = 2024
      mois = 2
      if mois == 2:
          if annee % 400 == 0 or (annee % 4 == 0 and annee % 100 != 0):
              print(29)
          else:
              print(28)
      elif mois == 4 or mois == 6 or mois == 9 or mois == 11:
          print(30)
      else:
          print(31)
    indice:
      fr: Traite février à part, avec la règle du défi précédent. Pour les mois de 30 jours, relie les quatre tests par `or`.
      en: Handle February separately, with the rule of the previous challenge. For the 30-day months, join the four tests with `or`.
    explication:
      fr: 'Une condition dans une condition : on décide d’abord le mois, puis, seulement pour février, l’année.'
      en: 'A condition inside a condition: first decide the month, then, only for February, the year.'
  - id: d_lien
    type: idee
    fr: 'Les conditions servent partout. Tu les mettras dans des boucles au niveau 2.3, et dans la validation d’entrées du boss 2.boss.'
    en: 'Conditions are used everywhere. You will put them in loops in level 2.3, and in the input validation of boss 2.boss.'
  - id: c11
    type: retenir
    fr: '`if` teste une condition, `elif` en essaie une autre, `else` prend le reste ; l’indentation dit ce qui appartient à chaque bloc.'
    en: '`if` tests a condition, `elif` tries another, `else` takes the rest; indentation says what belongs to each block.'

  - id: d_plus
    type: plus
    fr: Pour approfondir, consulte [Python — Introduction, opérateur reste](https://docs.python.org/3/tutorial/introduction.html) ; cette lecture complémentaire demande une connexion.
    en: For further study, see [Python — Introduction, opérateur reste](https://docs.python.org/3/tutorial/introduction.html); this optional reading needs a connection.
