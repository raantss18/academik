- id: c4
  type: idee
  fr: 'Le garde suit toujours le même ordre : **outil** permis, **chemin** dans la zone, **confirmation** si besoin. Enfin seulement, on **exécute**. Chaque refus devient une observation claire pour le modèle.'
  en: The guard always follows the same order. First, is the **tool** allowed? Then does the **path** stay in the zone? Then is a **confirmation** needed? Only finally, we **execute**. Each refusal becomes a clear observation for the model.
  exemple:
    fr: 'Pour `lire ../etc/secret` : outil permis, mais chemin hors zone, donc refus avant toute lecture.'
    en: 'For `lire ../etc/secret`: tool allowed, but path outside the zone, so refusal before any reading.'
  figure:
    kind: tableau
    entetes:
    - fr: Contrôle
      en: Check
    - fr: Si échec
      en: If it fails
    cellules:
    - - fr: outil permis ?
        en: tool allowed?
      - fr: refuser
        en: refuse
        ton: bad
    - - fr: chemin dans la zone ?
        en: path in the zone?
      - fr: refuser
        en: refuse
        ton: bad
    - - fr: confirmation ?
        en: confirmation?
      - fr: refus utilisateur
        en: user refusal
    legende:
      fr: L’exécution n’a lieu que si tous les contrôles passent.
      en: Execution happens only if all checks pass.
- id: c5
  type: code
  note:
    kind: exercise
    poids: 1
  fr: 'À toi. **Écris `executer_surveille(action, registre, permissions, racine, confirmer)`** : calcule `d = decision(nom, args, permissions, racine)`. Si `d` vaut `"refuser"`, renvoie `{"ok": False, "erreur": "refusé"}`. Si `d` vaut `"confirmer"` et que `confirmer(action)` est faux, renvoie `{"ok": False, "erreur": "refusé par l''utilisateur"}`. Sinon renvoie `executer(action, registre)`. `decision` et `executer` sont fournies.'
  en: 'Your turn. **Write `executer_surveille(action, registre, permissions, racine, confirmer)`**: compute `d = decision(nom, args, permissions, racine)`. If `d` is `"refuser"`, return `{"ok": False, "erreur": "refusé"}`. If `d` is `"confirmer"` and `confirmer(action)` is false, return `{"ok": False, "erreur": "refusé par l''utilisateur"}`. Otherwise return `executer(action, registre)`. `decision` and `executer` are provided.'
  depart: |
    import posixpath

    RACINE = "/data"
    FICHIERS = {
        "/data/notes.txt": "Le cache KV grandit avec le contexte.",
        "/etc/secret": "mot de passe: 1234",
    }

    def lire(chemin):
        return FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))]

    def ecrire(chemin, texte):
        FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))] = texte
        return "ok"

    REGISTRE = {"lire": lire, "ecrire": ecrire}
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def executer(appel, registre):
        nom = appel.get("outil")
        if nom not in registre:
            return {"ok": False, "erreur": "outil inconnu"}
        try:
            return {"ok": True, "resultat": registre[nom](**appel.get("args", {}))}
        except Exception as e:
            return {"ok": False, "erreur": str(e)}

    def modele_script(actions):
        suite = iter(actions)
        def modele(historique):
            return next(suite)
        return modele

    # écris ta fonction executer_surveille ici
  tests: |-
    def oui(a): return True
    def non(a): return False
    r = executer_surveille({"outil": "lire", "args": {"chemin": "notes.txt"}}, REGISTRE, PERMISSIONS, RACINE, non)
    assert r == {"ok": True, "resultat": "Le cache KV grandit avec le contexte."}
    r = executer_surveille({"outil": "lire", "args": {"chemin": "../etc/secret"}}, REGISTRE, PERMISSIONS, RACINE, oui)
    assert r == {"ok": False, "erreur": "refusé"}
    r = executer_surveille({"outil": "ecrire", "args": {"chemin": "n.txt", "texte": "x"}}, REGISTRE, PERMISSIONS, RACINE, non)
    assert r["erreur"] == "refusé par l'utilisateur" and "/data/n.txt" not in FICHIERS
    r = executer_surveille({"outil": "ecrire", "args": {"chemin": "n.txt", "texte": "x"}}, REGISTRE, PERMISSIONS, RACINE, oui)
    assert r["ok"] is True and FICHIERS["/data/n.txt"] == "x"
    assert executer_surveille({"outil": "format", "args": {}}, REGISTRE, PERMISSIONS, RACINE, oui)["erreur"] == "refusé"
  solutionCode: |
    import posixpath

    RACINE = "/data"
    FICHIERS = {
        "/data/notes.txt": "Le cache KV grandit avec le contexte.",
        "/etc/secret": "mot de passe: 1234",
    }

    def lire(chemin):
        return FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))]

    def ecrire(chemin, texte):
        FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))] = texte
        return "ok"

    REGISTRE = {"lire": lire, "ecrire": ecrire}
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def executer(appel, registre):
        nom = appel.get("outil")
        if nom not in registre:
            return {"ok": False, "erreur": "outil inconnu"}
        try:
            return {"ok": True, "resultat": registre[nom](**appel.get("args", {}))}
        except Exception as e:
            return {"ok": False, "erreur": str(e)}

    def modele_script(actions):
        suite = iter(actions)
        def modele(historique):
            return next(suite)
        return modele

    def executer_surveille(action, registre, permissions, racine, confirmer):
        d = decision(action.get("outil"), action.get("args", {}), permissions, racine)
        if d == "refuser":
            return {"ok": False, "erreur": "refusé"}
        if d == "confirmer" and not confirmer(action):
            return {"ok": False, "erreur": "refusé par l'utilisateur"}
        return executer(action, registre)
  indice:
    fr: 'Pas de lecture ni d’écriture avant le garde : d’abord `decision`, puis deux `if` de refus, et `executer` en dernier.'
    en: 'No reading or writing before the guard: first `decision`, then two refusal `if`s, and `executer` last.'
  explication:
    fr: 'Le fichier secret n’est jamais ouvert : le refus survient avant que la fonction `lire` ne soit appelée.'
    en: 'The secret file is never opened: the refusal happens before the `lire` function is called.'
- id: c6
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: Un agent exécute 6 actions. Le garde en refuse 2. Combien d’actions sont réellement exécutées ?
  en: An agent attempts 6 actions. The guard refuses 2. How many actions are actually executed?
  reponses:
  - '4'
  verif: print(6 - 2)
  indice:
    fr: Retire les actions refusées du total.
    en: Subtract the refused actions from the total.
  explication:
    fr: $6-2=4$ actions exécutées ; les 2 autres sont devenues des observations de refus.
    en: $6-2=4$ actions executed; the other 2 became refusal observations.
- id: c7
  type: piege
  fr: 'Trop de demandes de confirmation fatiguent l’utilisateur, qui finit par cliquer « oui » sans lire. La confirmation doit rester **rare et précise** : seulement pour les actions qui modifient ou envoient quelque chose, avec le détail exact de l’action affichée.'
  en: 'Too many confirmation requests tire the user, who ends up clicking “yes” without reading. Confirmation must stay **rare and precise**: only for actions that modify or send something, with the exact detail of the action displayed.'
- id: c8
  type: idee
  fr: 'Garde une **trace** de chaque action demandée, de la décision du garde et du résultat : un journal. En cas de problème, tu sauras ce que l’agent a tenté, et tu pourras corriger les règles. Ne consigne jamais les secrets eux-mêmes.'
  en: 'Keep a **trace** of each requested action, the guard’s decision and the result: a log. If something goes wrong, you will know what the agent tried, and you can fix the rules. Never log the secrets themselves.'
  exemple:
    fr: 'Une ligne de journal : `refusé | lire | ../etc/secret | hors zone`. Le contenu du fichier n’y figure pas.'
    en: 'A log line: `refused | read | ../etc/secret | outside zone`. The file’s content does not appear in it.'
- id: c9
  type: idee
  fr: 'Teste ton agent avec des **attaques prévues** : un chemin avec `..`, un outil absent de la liste, une écriture refusée, une boucle sans fin. Un script de modèle te permet de rejouer chacune. Un agent non testé contre l’attaque n’est pas sûr, même s’il marche en usage normal.'
  en: 'Test your agent with **planned attacks**: a path with `..`, a tool missing from the list, a refused write, an endless loop. A model script lets you replay each one. An agent not tested against attack is not safe, even if it works in normal use.'
  exemple:
    fr: 'Chaque faille corrigée devient un test : elle ne reviendra pas sans que les tests ne le signalent.'
    en: 'Each fixed hole becomes a test: it will not return without the tests flagging it.'
