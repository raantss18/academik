  en: 'Final challenge. **Write `agent(question, modele, registre, permissions, racine, confirmer, max_etapes)`**: like the loop of level 15.4, but each action goes through `executer_surveille`. Count the `refus` (observations whose error starts with `"refusé"`). Return `{"statut": "ok", "reponse": ..., "etapes": n, "refus": r}` at the answer, or `{"statut": "limite", "reponse": None, "etapes": max_etapes, "refus": r}`. `executer_surveille` is provided.'
