  tests: |-
    def oui(a): return True
    def non(a): return False
    m = modele_script([{"outil": "lire", "args": {"chemin": "notes.txt"}}, {"reponse": "Il grandit avec le contexte."}])
    r = agent("?", m, REGISTRE, PERMISSIONS, RACINE, non, 5)
    assert r == {"statut": "ok", "reponse": "Il grandit avec le contexte.", "etapes": 2, "refus": 0}
    m = modele_script([{"outil": "lire", "args": {"chemin": "../etc/secret"}}, {"reponse": "Je n'ai pas pu lire ce fichier."}])
    r = agent("?", m, REGISTRE, PERMISSIONS, RACINE, oui, 5)
    assert r["refus"] == 1 and r["statut"] == "ok"
    vus = []
    def espion(h):
        vus.append(h[-1]["contenu"] if len(h) > 1 else None)
        return {"outil": "lire", "args": {"chemin": "../etc/secret"}} if len(h) < 2 else {"reponse": "fin"}
    agent("?", espion, REGISTRE, PERMISSIONS, RACINE, oui, 5)
    assert "1234" not in str(vus)
    m = modele_script([{"outil": "lire", "args": {"chemin": "notes.txt"}}] * 9)
    r = agent("?", m, REGISTRE, PERMISSIONS, RACINE, non, 3)
    assert r == {"statut": "limite", "reponse": None, "etapes": 3, "refus": 0}
  solutionCode: |
    import posixpath

    RACINE = "/data"
    FICHIERS = {
        "/data/notes.txt": "Le cache KV grandit avec le contexte.",
        "/etc/secret": "mot de passe: 1234",
    }

    def lire(chemin):
        return FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))]

    def ecrire(chemin, texte):
        FICHIERS[posixpath.normpath(posixpath.join(RACINE, chemin))] = texte
        return "ok"

    REGISTRE = {"lire": lire, "ecrire": ecrire}
    PERMISSIONS = {"lire": "auto", "ecrire": "confirmer"}

    def chemin_autorise(racine, chemin):
        complet = posixpath.normpath(posixpath.join(racine, chemin))
        base = racine.rstrip("/")
        return complet == base or complet.startswith(base + "/")

    def decision(nom, args, permissions, racine):
        niveau = permissions.get(nom, "refuser")
        if niveau == "refuser":
            return "refuser"
        if "chemin" in args and not chemin_autorise(racine, args["chemin"]):
            return "refuser"
        return niveau

    def executer(appel, registre):
        nom = appel.get("outil")
        if nom not in registre:
            return {"ok": False, "erreur": "outil inconnu"}
        try:
            return {"ok": True, "resultat": registre[nom](**appel.get("args", {}))}
        except Exception as e:
            return {"ok": False, "erreur": str(e)}

    def modele_script(actions):
        suite = iter(actions)
        def modele(historique):
            return next(suite)
        return modele

    def executer_surveille(action, registre, permissions, racine, confirmer):
        d = decision(action.get("outil"), action.get("args", {}), permissions, racine)
        if d == "refuser":
            return {"ok": False, "erreur": "refusé"}
        if d == "confirmer" and not confirmer(action):
            return {"ok": False, "erreur": "refusé par l'utilisateur"}
        return executer(action, registre)

    def agent(question, modele, registre, permissions, racine, confirmer, max_etapes):
        historique = [{"role": "user", "contenu": question}]
        refus = 0
        for etape in range(max_etapes):
            action = modele(historique)
            if "reponse" in action:
                return {"statut": "ok", "reponse": action["reponse"], "etapes": etape + 1, "refus": refus}
            obs = executer_surveille(action, registre, permissions, racine, confirmer)
            if not obs["ok"] and obs["erreur"].startswith("refusé"):
                refus += 1
            historique.append({"role": "assistant", "contenu": action})
            historique.append({"role": "outil", "contenu": obs})
        return {"statut": "limite", "reponse": None, "etapes": max_etapes, "refus": refus}
  indice:
    fr: Reprends la boucle du niveau 15.4 ; remplace `executer` par `executer_surveille`, et incrémente `refus` quand `not obs["ok"]` et que l’erreur commence par `"refusé"`.
    en: Reuse the loop of level 15.4; replace `executer` with `executer_surveille`, and increment `refus` when `not obs["ok"]` and the error starts with `"refusé"`.
  explication:
    fr: 'Tu as écrit un agent local complet : boucle bornée, validation, permissions, cloisonnement, confirmation. Le module 19 ira plus loin sur la sécurité.'
    en: 'You wrote a complete local agent: bounded loop, validation, permissions, confinement, confirmation. Module 19 will go further on security.'
- id: c11
  type: saisie
  note:
    kind: exercise
    poids: 1
  fr: 'Dans le test du secret, le contenu de `/etc/secret` contient « mot de passe: 1234 ». Combien de fois ce texte apparaît-il dans l’historique donné au modèle quand le garde fonctionne ?'
  en: 'In the secret test, the content of `/etc/secret` contains “mot de passe: 1234”. How many times does this text appear in the history given to the model when the guard works?'
  reponses:
  - '0'
  verif: print(0)
  indice:
    fr: Le garde refuse avant de lire. Le fichier a-t-il été ouvert ?
    en: The guard refuses before reading. Was the file opened?
  explication:
    fr: 'Zéro : le fichier n’a jamais été lu, donc son contenu ne peut pas fuiter.'
    en: 'Zero: the file was never read, so its content cannot leak.'
- id: c12
  type: idee
  fr: Ton agent peut s’appuyer sur ton assistant de cours (module 14), sur un modèle local (module 13) et sur MCP. Les modules suivants passent à la **recherche quantitative**, où ces outils testeront des hypothèses honnêtement.
  en: Your agent can now rely on your course assistant (module 14) as a tool, on a local model (module 13) and on a standard protocol (MCP). The following modules leave AI to move to **quantitative research**, where these tools will serve to test hypotheses honestly.
  exemple:
    fr: Le boss final du cursus fera tourner un agent local sur une hypothèse de marché, avec un rapport sourcé.
    en: The curriculum’s final boss will run a local agent on a market hypothesis, with a sourced report.
