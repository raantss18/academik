# Niveau 17.2 — Recherche quantitative 2 : portefeuilles, diversification, Sharpe. Original academik ; notions vérifiées dans le cours 15.401 du MIT (lien) et Markowitz 1952 (lien). Cadre strictement pédagogique.
id: '17.2'
module: 17
duree_min: 16
titre:
  fr: Portefeuilles et Markowitz
  en: Portfolios and Markowitz
ia:
  fr: Kintana combine plusieurs actifs et mesure ce que la diversification apporte.
  en: Kintana combines several assets and measures what diversification brings.
objectifs:
  - { fr: 'calculer le rendement d''un portefeuille', en: 'compute the return of a portfolio' }
  - { fr: 'calculer son risque avec les covariances', en: 'compute its risk with covariances' }
  - { fr: 'trouver la variance minimale à deux actifs', en: 'find the minimum variance with two assets' }
