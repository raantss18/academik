id: '5.4'
module: 5
duree_min: 14
titre: { fr: 'Convexité', en: 'Convexity' }
ia: { fr: 'Kintana reconnaît les erreurs convexes, pour lesquelles un point stationnaire est un minimum global.', en: 'Kintana recognizes convex losses, for which a stationary point is a global minimum.' }
sources:
  - { titre: 'Boyd et Vandenberghe — Convex Optimization, chapitre 3 (référence uniquement)', url: 'https://web.stanford.edu/~boyd/cvxbook/', licence: 'Copyright Cambridge University Press ; accès gratuit, aucune licence libre ; lien seulement' }
  - { titre: 'Boyd, Vandenberghe et Nobel — diapositives révisées en 2023 (référence uniquement)', url: 'https://web.stanford.edu/~boyd/cvxbook/bv_cvxslides.pdf', licence: 'Aucune licence libre indiquée ; lien seulement, aucun extrait repris' }
cartes:
  - id: c1
    type: tentative
    note: { kind: quiz, poids: 1 }
    fr: 'Pour $f(x)=x^2$, compare $f(2)$ à la moyenne de $f(0)$ et $f(4)$. Où se trouve la valeur au milieu ?'
    en: 'For $f(x)=x^2$, compare $f(2)$ with the average of $f(0)$ and $f(4)$. Where is the midpoint value?'
    choix:
      - { fr: 'En dessous : $4<8$.', en: 'Below: $4<8$.', juste: true }
      - { fr: 'Au-dessus : $4>8$.', en: 'Above: $4>8$.' }
      - { fr: 'Au même niveau.', en: 'At the same height.' }
    verif: 'print(2**2 < (0**2+4**2)/2)'
    sortie: 'True'
    explication: { fr: 'La moyenne des hauteurs aux extrémités vaut $8$ ; la parabole est en dessous de la corde au milieu.', en: 'The average endpoint height is $8$; the parabola is below the chord at the midpoint.' }
  - id: c2
    type: idee
    fr: 'Une fonction est **convexe** si son graphe reste **sous ses cordes** : entre deux points de la courbe, le segment qui les relie est au-dessus. Le graphe a la forme d’un bol.'
    en: 'A function is **convex** if its graph stays **below its chords**: between two points of the curve, the segment joining them lies above. The graph is bowl-shaped.'
    figure:
      kind: tableau
      entetes: [{ fr: 'Fonction', en: 'Function' }, { fr: 'Milieu $f(2)$ et corde entre $1$ et $3$', en: 'Middle $f(2)$ and chord between $1$ and $3$' }, { fr: 'Convexe ?', en: 'Convex?' }]
      cellules:
        - ['$x^2$', '$4\leq\frac{1+9}{2}=5$', { fr: 'oui', en: 'yes', ton: ok }]
        - ['$-x^2$', '$-4>\frac{-1-9}{2}=-5$', { fr: 'non', en: 'no', ton: bad }]
      legende: { fr: 'La définition exacte : $f((1-t)x+ty)\leq(1-t)f(x)+tf(y)$ pour tous $x$, $y$ et tout $t\in[0,1]$.', en: 'The exact definition: $f((1-t)x+ty)\leq(1-t)f(x)+tf(y)$ for all $x$, $y$ and every $t\in[0,1]$.' }
  - id: c2a
    type: idee
    fr: 'Deux outils pratiques. Si $f''''\geq0$ sur un intervalle ouvert, $f$ y est convexe. Et pour une fonction convexe dérivable, une pente nulle donne un **minimum global**, pas forcément unique.'
    en: 'Two practical tools. If $f''''\geq0$ on an open interval, $f$ is convex there. And for a differentiable convex function, a zero slope gives a **global minimum**, not necessarily unique.'
    exemple: { fr: '$L(w)=(w-2)^2+1$ : $L''''=2\geq0$ et $L''(2)=0$. Le minimum global est en $w=2$, où $L=1$.', en: '$L(w)=(w-2)^2+1$: $L''''=2\geq0$ and $L''(2)=0$. The global minimum is at $w=2$, where $L=1$.' }
  - id: c3
    type: exemple
    titre: { fr: 'Certifier le meilleur réglage', en: 'Certifying the best setting' }
    etapes:
      - { fr: 'Pour $L(w)=(w-3)^2+2$, on a $L''(w)=2(w-3)$.', en: 'For $L(w)=(w-3)^2+2$, we have $L''(w)=2(w-3)$.' }
      - { fr: '$L''''(w)=2>0$ partout : la fonction est strictement convexe.', en: '$L''''(w)=2>0$ everywhere: the function is strictly convex.' }
      - { fr: '$L''(3)=0$ et $L(w)\geq2=L(3)$, avec égalité seulement en $3$ : le minimum est unique.', en: '$L''(3)=0$ and $L(w)\geq2=L(3)$, with equality only at $3$: the minimum is unique.' }
  - id: c4
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Pour $q(x)=3x^2-4x+7$, calcule la dérivée seconde $q''''(x)$.'
    en: 'For $q(x)=3x^2-4x+7$, compute the second derivative $q''''(x)$.'
    reponses: ['6']
    verif: |
      # La différence seconde est exacte pour une fonction quadratique.
      q = lambda x: 3*x*x-4*x+7
      print(q(1)-2*q(0)+q(-1))
    explication: { fr: '$q''(x)=6x-4$, puis $q''''(x)=6>0$ ; $q$ est strictement convexe sur les réels.', en: '$q''(x)=6x-4$, then $q''''(x)=6>0$; $q$ is strictly convex on the real line.' }
  - id: c5
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Quel réel $w$ minimise $L(w)=(w-5)^2+4$ ? Donne le paramètre, pas la perte.'
    en: 'Which real $w$ minimizes $L(w)=(w-5)^2+4$? Give the parameter, not the loss.'
    reponses: ['5']
    verif: |
      from fractions import Fraction
      # Sommet de aw²+bw+c, avec a>0.
      a, b = 1, -10
      print(Fraction(-b,2*a))
    explication: { fr: 'Le carré est minimal et nul en $w=5$ ; la perte minimale vaut alors $4$.', en: 'The square is minimized at zero when $w=5$; the minimum loss is then $4$.' }
  - id: c6
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'La fonction constante $f(x)=7$ sur les réels est convexe. Son minimum est-il unique ?'
    en: 'The constant function $f(x)=7$ on the real line is convex. Is its minimum unique?'
    choix:
      - { fr: 'Oui : la convexité impose un seul minimiseur.', en: 'Yes: convexity forces a single minimizer.' }
      - { fr: 'Non : chaque réel est un minimiseur.', en: 'No: every real number is a minimizer.', juste: true }
      - { fr: 'Elle ne possède aucun minimum.', en: 'It has no minimum.' }
    explication: { fr: 'Toutes les valeurs sont égales ; la convexité seule ne donne pas l’unicité, contrairement à la stricte convexité lorsqu’un minimum existe.', en: 'All values are equal; convexity alone does not ensure uniqueness, unlike strict convexity when a minimum exists.' }
  - id: c7
    type: saisie
    note: { kind: exercise, poids: 1 }
    fr: 'Pour $f(x)=x^2$, $x=1$, $y=5$ et $t=1/4$, calcule la borne $(1-t)f(x)+tf(y)$ dans l’inégalité de convexité.'
    en: 'For $f(x)=x^2$, $x=1$, $y=5$ and $t=1/4$, compute the bound $(1-t)f(x)+tf(y)$ in the convexity inequality.'
    reponses: ['7']
    verif: |
      from fractions import Fraction
      t = Fraction(1,4)
      print((1-t)*1**2+t*5**2)
    explication: { fr: 'La borne vaut $3/4+25/4=7$ ; au point mélangé $2$, la fonction vaut $4\leq7$.', en: 'The bound is $3/4+25/4=7$; at the mixed point $2$, the function is $4\leq7$.' }
  - id: c8
    type: piege
    fr: 'Convexe ne veut pas dire que tout pas de descente réussit, ni qu’un minimum existe. Exemple : $f(x)=x$ est convexe sur les réels, mais descend sans fin.'
    en: 'Convex does not mean every descent step succeeds, nor that a minimum exists. Example: $f(x)=x$ is convex on the real line, but decreases without end.'
  - id: c9
    type: qcm
    note: { kind: exercise, poids: 1 }
    fr: 'Pourquoi $f(x)=-x^2$ n’est-elle pas convexe sur les réels ?'
    en: 'Why is $f(x)=-x^2$ not convex on the real line?'
    choix:
      - { fr: 'Elle prend des valeurs négatives.', en: 'It takes negative values.' }
      - { fr: 'Elle est dérivable.', en: 'It is differentiable.' }
      - { fr: 'Sa dérivée seconde est strictement négative partout.', en: 'Its second derivative is strictly negative everywhere.', juste: true }
    explication: { fr: 'Sa courbure est tournée vers le bas ; le signe des valeurs de la fonction ne détermine pas sa convexité.', en: 'It curves downward; the sign of the function values does not determine convexity.' }
  - id: c10
    type: saisie
    defi: true
    note: { kind: quiz, poids: 1 }
    fr: 'Défi : minimise $J(w)=(w-1)^2+(w-5)^2$ sur les réels. Quel est le paramètre optimal ?'
    en: 'Challenge: minimize $J(w)=(w-1)^2+(w-5)^2$ over the real line. What is the optimal parameter?'
    reponses: ['3']
    verif: |
      from fractions import Fraction
      targets = [1,5]
      print(Fraction(sum(targets),len(targets)))
    indice: { fr: 'Additionne les dérivées et cherche leur zéro.', en: 'Add the derivatives and find their zero.' }
    explication: { fr: '$J''(w)=4w-12$ s’annule en $3$ ; $J''''=4>0$, donc c’est l’unique minimiseur.', en: '$J''(w)=4w-12$ vanishes at $3$; $J''''=4>0$, so this is the unique minimizer.' }
  - id: c11
    type: retenir
    fr: 'À retenir : la convexité transforme un minimum local en minimum global ; Kintana peut certifier un réglage stationnaire pour une erreur convexe différentiable sans contrainte.'
    en: 'Remember: convexity makes a local minimum global; Kintana can certify a stationary setting for an unconstrained differentiable convex loss.'
