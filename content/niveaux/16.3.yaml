# Niveau 16.3 — Processus stochastiques 3 : chaînes de Markov. Original academik ; notions vérifiées dans le cours 18.642 du MIT (lien) et Grinstead et Snell (cité).
id: '16.3'
module: 16
duree_min: 16
titre:
  fr: Chaînes de Markov
  en: Markov chains
ia:
  fr: Kintana suit un système sans mémoire et prévoit où il passera son temps à long terme.
  en: Kintana follows a memoryless system and predicts where it will spend its time in the long run.
