# Niveau 23.2 — Enquêtes 2 : trouver le bogue. Original academik ; comportements vérifiés dans la documentation Python officielle (PSF) et par exécution. Toutes les sorties exécutées.
id: '23.2'
module: 23
duree_min: 23
titre:
  fr: Trouve le bogue
  en: Find the bug
ia:
  fr: 'Kintana enquête sur un bogue : elle le reproduit, le réduit, formule une hypothèse et la teste.'
  en: 'Kintana investigates a bug: she reproduces it, reduces it, forms a hypothesis and tests it.'
objectifs:
  - { fr: 'reproduire et réduire un bogue', en: 'reproduce and reduce a bug' }
  - { fr: 'formuler une hypothèse et la tester', en: 'form a hypothesis and test it' }
  - { fr: 'reconnaître des pièges classiques de Python', en: 'recognise classic Python traps' }
sources:
- titre: 'Python — documentation : définition de fonction (valeurs par défaut)'
  url: https://docs.python.org/3/reference/compound_stmts.html
  licence: PSF License (documentation officielle, citée)
